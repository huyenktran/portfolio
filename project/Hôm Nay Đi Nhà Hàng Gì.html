var TERMS={
vi:{title:'Điều khoản sử dụng và miễn trừ trách nhiệm',upd:'Cập nhật 18/11/2026, phiên bản 1.0',intro:'Vui lòng đọc kỹ trước khi dùng trang “Hôm nay đi nhà hàng gì”. Bằng việc sử dụng trang, bạn đồng ý với các điều khoản dưới đây.',
s:[['1. Mục đích','Trang là công cụ gợi ý và giải trí giúp bạn chọn nơi ăn ở TP.HCM. Trang không phải là hướng dẫn ẩm thực chính thức, không phải dịch vụ đặt bàn và không phải quảng cáo.'],
['2. Độ chính xác của thông tin','Tên quán, khu vực, mức giá, món gợi ý và mô tả được tổng hợp từ kiến thức chung và có thể đã lỗi thời. Quán có thể đổi địa chỉ, giờ mở cửa, thực đơn, giá hoặc đã đóng cửa. Hãy kiểm tra lại trên bản đồ, trang chính thức hoặc gọi điện trước khi đến.'],
['3. Khu vực','Các khu vực như “Quận 1” được dùng theo cách gọi quen thuộc. Đơn vị hành chính tại TP.HCM đã có thay đổi, nên tên khu vực chỉ mang tính tham khảo.'],
['4. Mức giá','Mức giá là ước tính cho một người ăn, không gồm đồ uống và phụ phí, và có thể thay đổi. Trang không đảm bảo mức giá thực tế.'],
['5. Không quảng cáo, không đánh giá','Việc nhắc tên một nhà hàng không phải là lời chứng thực, xếp hạng hay quảng cáo, và trang không có quan hệ thương mại hay liên kết với các nhà hàng được nêu, trừ khi ghi rõ. Tên và thương hiệu thuộc về chủ sở hữu tương ứng. Nếu bạn là chủ quán và muốn sửa hoặc gỡ thông tin, vui lòng liên hệ qua trang Liên hệ.'],
['6. Thực phẩm, dị ứng và sức khỏe','Trang không cung cấp tư vấn dinh dưỡng hay y tế. Nếu bạn dị ứng, ăn kiêng, mang thai hoặc có bệnh nền, hãy hỏi nhà hàng về thành phần trước khi gọi món và hỏi bác sĩ khi cần. Chúng tôi không chịu trách nhiệm về an toàn thực phẩm của bất kỳ nhà hàng nào.'],
['7. Liên kết bản đồ','Các nút “Mở Google Maps” chỉ là kết quả tìm kiếm trên Google Maps, do bên thứ ba vận hành. Chúng tôi không kiểm soát và không chịu trách nhiệm về nội dung, kết quả hay chính sách của họ.'],
['8. Gợi ý ngẫu nhiên','Vòng quay, đua vịt, lật bài và các trò chơi chỉ chọn ngẫu nhiên trong danh sách đang hiển thị. Kết quả không phản ánh chất lượng hay sự đề xuất.'],
['9. Dữ liệu cá nhân','Trang lưu danh sách yêu thích và ngôn ngữ ngay trong trình duyệt của bạn (localStorage), không gửi về máy chủ nào. Xóa dữ liệu trình duyệt sẽ xóa các mục này. Đừng ghi thông tin nhạy cảm vào ô ghi chú.'],

  if(e.target.closest('#qback')){qs.step--;renderQuiz();return;}
  if(e.target.closest('#qrs')||e.target.closest('#qagain')){qs={step:0,ans:[]};qIdx=0;delete SHOWN.quiz;renderQuiz();return;}
  if(e.target.closest('#qnext')){qIdx=(qIdx+1)%Math.max(1,qRank.length);drawQuiz();return;}
  var v=e.target.closest('[data-qpick]');if(v){qIdx=+v.dataset.qpick;drawQuiz();}});
function finishQuiz(){var pp=2,vv='',cu={};qs.ans.forEach(function(a){if(a.p)pp=a.p;if(a.v)vv=a.v;if(a.cu)cu=a.cu;});
  var sc=R.map(function(r){var s=Math.random()*1.2-Math.abs(r.p-pp)*2.2+(vv&&r.v.indexOf(vv)>=0?3:0)+(cu[r.c]||0);return{r:r,s:s};}).sort(function(a,b){return b.s-a.s;});
  qRank=sc.slice(0,4).map(function(x){return x.r;});qIdx=0;drawQuiz();}
function drawQuiz(){var pr='';for(var k=0;k<Q.length;k++)pr+='<i class="on"></i>';
  $('#quiz').innerHTML='<div class="prog">'+pr+'</div><div id="res-quiz"></div><div class="row" style="margin-top:22px"><button class="btn" type="button" id="qnext">'+t('another')+'</button><button class="btn ghost" type="button" id="qagain">'+t('restart')+'</button></div>';
  var altsFn=function(){var o='';qRank.forEach(function(a,i){if(i!==qIdx)o+='<div class="alt"><span>'+CU[a.c].e+' '+esc(a.n)+'</span><span><button class="btn sm ghost" type="button" data-qpick="'+i+'">'+t('view')+'</button></span></div>';});return '<div class="alts"><p class="lbl">'+t('alsoTry')+'</p>'+o+'</div>';};
  showRes('quiz',qRank[qIdx],'whyQ','today',altsFn);}

/* wheel */
var WC=[['#7A1F2E','#FFF1CF'],['#FBF1DF','#15100B'],['#C9A24B','#15100B'],['#1A1511','#FFE2A8'],['#E8D3B0','#15100B'],['#A8404F','#FFF1CF']];
var wheel={items:[],theta:0,spinning:false},wcv=$('#wheel'),wx=wcv.getContext('2d');
function trunc(ctx,s,w){if(ctx.measureText(s).width<=w)return s;while(s.length>2&&ctx.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…';}
function drawWheel(){var n=wheel.items.length,W2=wcv.width,c=W2/2,R2=c-6;wx.clearRect(0,0,W2,W2);if(!n)return;var a=2*Math.PI/n;
  wheel.items.forEach(function(m,i){var s=wheel.theta+i*a,col=WC[i%WC.length];wx.beginPath();wx.moveTo(c,c);wx.arc(c,c,R2,s,s+a);wx.closePath();wx.fillStyle=col[0];wx.fill();wx.strokeStyle='rgba(21,16,11,.7)';wx.lineWidth=3;wx.stroke();
    wx.save();wx.translate(c,c);wx.rotate(s+a/2);wx.fillStyle=col[1];wx.textAlign='right';wx.textBaseline='middle';wx.font='700 28px "Be Vietnam Pro",system-ui,sans-serif';wx.fillText(trunc(wx,label(m),R2*.72),R2-24,0);wx.restore();});
  var g=wx.createRadialGradient(c,c,4,c,c,70);g.addColorStop(0,'#FFE2A8');g.addColorStop(1,'#B97A1E');wx.beginPath();wx.arc(c,c,56,0,7);wx.fillStyle=g;wx.fill();wx.lineWidth=6;wx.strokeStyle='#15100B';wx.stroke();
  wx.fillStyle='#15100B';wx.font='700 40px "Fraunces",serif';wx.textAlign='center';wx.textBaseline='middle';wx.fillText('🍴',c,c+2);}
function newWheel(){wheel.items=pool(8);wheel.theta=rnd(628)/100;drawWheel();delete SHOWN.wheel;var ok=wheel.items.length>=2;$('#res-wheel').innerHTML=ok?'':empty();$('#spin').disabled=!ok;}
function spinWheel(){if(wheel.spinning||wheel.items.length<2)return;wheel.spinning=true;$('#spin').disabled=true;$('#spin').textContent=t('spinning');
  var n=wheel.items.length,a=2*Math.PI/n,win=rnd(n),target=1.5*Math.PI-(win+.5)*a+(rnd(100)/100-.5)*a*.7,start=wheel.theta%(2*Math.PI),end=target-Math.floor(target/(2*Math.PI))*2*Math.PI+2*Math.PI*(5+rnd(3));if(end<start)end+=2*Math.PI;
  var d=reduce?1:4400,t0=performance.now();
  (function f(now){var k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);wheel.theta=start+(end-start)*e;drawWheel();if(k<1)requestAnimationFrame(f);else{wheel.spinning=false;$('#spin').disabled=false;$('#spin').textContent=t('spin');showRes('wheel',wheel.items[win],'whyR','today');}})(t0);}
$('#spin').onclick=spinWheel;$('#reshuffle').onclick=function(){if(!wheel.spinning)newWheel();};

/* duck */
var duck={list:[],racing:false,pos:[]};
function newDucks(){duck.list=pool(5);duck.pos=duck.list.map(function(){return 0;});delete SHOWN.duck;var ok=duck.list.length>=2;$('#res-duck').innerHTML=ok?'':empty();
  $('#lanes').innerHTML=duck.list.map(function(m){return '<div class="lane"><span class="dn">'+esc(label(m))+'</span><span class="duck">🦆</span><i class="fin"></i></div>';}).join('');$('#go').disabled=!ok;}
function raceFrame(){var lanes=$$('#lanes .lane'),win=-1;duck.list.forEach(function(m,i){if(win<0){duck.pos[i]=Math.min(1,duck.pos[i]+0.0026+Math.random()*0.0042*(Math.random()<.08?2.2:1));if(duck.pos[i]>=1)win=i;}var ln=lanes[i],w=ln.clientWidth-46-12;ln.querySelector('.duck').style.transform='translateX('+(duck.pos[i]*w)+'px) scaleX(-1)';});return win;}
function startRace(){if(duck.racing||duck.list.length<2)return;duck.racing=true;duck.pos=duck.list.map(function(){return 0;});$('#res-duck').innerHTML='';$$('#lanes .lane').forEach(function(l){l.classList.remove('win');});$('#go').disabled=true;$('#go').textContent=t('racing');
  (function f(){var w=raceFrame();if(w<0){requestAnimationFrame(f);return;}duck.racing=false;$('#go').disabled=false;$('#go').textContent=t('go');$$('#lanes .lane')[w].classList.add('win');showRes('duck',duck.list[w],'whyR','today');})();}
$('#go').onclick=startRace;$('#newduck').onclick=function(){if(!duck.racing)newDucks();};

/* cards */
var deckList=[];
function dealHtml(){$('#deck').innerHTML=deckList.map(function(m,i){return '<button type="button" class="pc" data-c="'+i+'" aria-label="Card '+(i+1)+'"><div class="in2"><div class="b"><span>🍴</span></div><div class="f"><span style="font-size:28px">'+CU[m.c].e+'</span><b>'+esc(label(m))+'</b><i>'+esc(cname(m.c))+'</i></div></div></button>';}).join('');}
function dealCards(){deckList=pool(5);delete SHOWN.cards;$('#res-cards').innerHTML=deckList.length?'':empty();dealHtml();}
$('#deck').addEventListener('click',function(e){var b=e.target.closest('.pc');if(!b||$('#deck .pc.open'))return;b.classList.add('open');$$('#deck .pc').forEach(function(x){if(x!==b)x.classList.add('dim');});setTimeout(function(){showRes('cards',deckList[+b.dataset.c],'whyR','today');},reduce?0:650);});
$('#deal').onclick=dealCards;

/* quick */
var coin={a:null,b:null,rot:0,busy:false};
function coinNew(){var p=pool(2);coin.a=p[0]||null;coin.b=p[1]||p[0]||null;coin.rot=0;var c=$('#coin');c.style.transition='none';c.style.transform='rotateY(0deg)';$('#cA').innerHTML=coin.a?'<b>A</b>'+esc(label(coin.a)):'';$('#cB').innerHTML=coin.b?'<b>B</b>'+esc(label(coin.b)):'';$('#flip').disabled=!coin.a;delete SHOWN.quick;$('#res-quick').innerHTML=coin.a?'':empty();}
$('#flip').onclick=function(){if(coin.busy||!coin.a)return;coin.busy=true;var heads=Math.random()<.5;coin.rot=Math.ceil(coin.rot/360)*360+1800+(heads?0:180);var c=$('#coin');c.style.transition=reduce?'none':'transform 1.4s cubic-bezier(.2,.7,.2,1)';c.style.transform='rotateY('+coin.rot+'deg)';setTimeout(function(){coin.busy=false;showRes('quick',heads?coin.a:coin.b,'whyR','coinW');},reduce?0:1450);};
$('#coinNew').onclick=coinNew;
var PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]},dice={items:[],busy:false};
function drawDie(n){var h='';for(var i=0;i<9;i++)h+='<i class="'+(PIPS[n].indexOf(i)>=0?'on':'')+'"></i>';$('#die').innerHTML=h;}
function drawDList(w){$('#dlist').innerHTML=dice.items.map(function(m,i){return '<li class="'+(w===i?'win':'')+'"><b>'+(i+1)+'</b><span>'+esc(label(m))+'</span></li>';}).join('');}
function diceNew(){dice.items=pool(6);drawDie(6);drawDList(-1);$('#roll').disabled=dice.items.length<1;}
$('#roll').onclick=function(){if(dice.busy||!dice.items.length)return;dice.busy=true;var die=$('#die'),ticks=0,n=dice.items.length;die.classList.add('roll');drawDList(-1);var iv=setInterval(function(){drawDie(1+rnd(6));ticks++;if(ticks>(reduce?1:9)){clearInterval(iv);die.classList.remove('roll');var i=rnd(n);drawDie(i+1);drawDList(i);dice.busy=false;showRes('quick',dice.items[i],'whyR','diceW');}},90);};
$('#diceNew').onclick=diceNew;
var slotBusy=false;
$('#pull').onclick=function(){var f=filtered();if(slotBusy||!f.length)return;slotBusy=true;$('#pull').disabled=true;var d=40,ticks=0,max=reduce?1:20,win=pick(f);(function step(){ticks++;$('#slotwin').textContent=label(ticks>=max?win:pick(f));if(ticks<max){d*=1.12;setTimeout(step,d);}else{slotBusy=false;$('#pull').disabled=false;showRes('quick',win,'whyR','today');}})();};

/* favourites tab */
function renderFav(){
  $('#flist').innerHTML=fav.length?fav.map(function(x,i){var r=R.filter(function(y){return y.n===x.n;})[0];if(!r)return '';return '<li><div><b>'+CU[r.c].e+' '+esc(r.n)+'</b><br><small>'+esc(cname(r.c))+(r.a?' · '+esc(areaName(r.a)):'')+' · '+new Array(r.p+1).join('₫')+'</small><textarea class="in" data-note="'+i+'" placeholder="'+esc(t('notePh'))+'" maxlength="500">'+esc(x.note||'')+'</textarea><div class="row" style="margin-top:8px"><a class="btn sm mapb" target="_blank" rel="noopener" href="'+esc(mapUrl(r))+'">📍 '+t('map')+'</a></div></div><button class="ib" type="button" data-fdel="'+i+'" aria-label="'+esc(t('del'))+'">✕</button></li>';}).join(''):'<div class="empty">'+t('favEmpty')+'</div>';
  $('#favclear').hidden=!fav.length;}
$('#flist').addEventListener('click',function(e){var d=e.target.closest('[data-fdel]');if(!d)return;fav.splice(+d.dataset.fdel,1);saveFav();renderFav();});
$('#flist').addEventListener('change',function(e){var n=e.target.closest('[data-note]');if(!n)return;var i=+n.dataset.note;if(fav[i]){fav[i].note=n.value.slice(0,500);saveFav();}});
var fcf=false;$('#favclear').onclick=function(){var bt=$('#favclear');if(!fcf){fcf=true;bt.textContent=t('favConfirm');setTimeout(function(){fcf=false;bt.textContent=t('favClear');},3000);return;}fcf=false;fav=[];saveFav();renderFav();bt.textContent=t('favClear');};

/* list */
function renderList(){var q=fold($('#q').value.trim()),f=filtered().filter(function(r){return !q||fold(r.n+' '+r.dish.vi+' '+r.dish.en+' '+cname(r.c)).indexOf(q)>=0;});
  $('#lbody').innerHTML=f.length?f.map(function(r){var id=rid(r);return '<div class="card"><h3>'+CU[r.c].e+' '+esc(r.n)+'</h3><div class="row" style="margin:6px 0"><span class="tag">'+esc(cname(r.c))+'</span><span class="price">'+priceStr(r.p)+'</span>'+(r.a?'<span class="tag">'+esc(areaName(r.a))+'</span>':'')+'</div><p><b>'+t('f_d')+':</b> '+esc(V(r.dish))+'</p><p>'+esc(V(r.note))+'</p><div class="row" style="margin-top:10px"><a class="btn sm mapb" target="_blank" rel="noopener" href="'+esc(mapUrl(r))+'">📍 '+t('map')+'</a><button class="btn sm ghost" type="button" data-save="'+id+'">'+(isFav(r)?t('saved'):t('saveB'))+'</button></div></div>';}).join(''):'<div class="empty" style="grid-column:1/-1">'+t('noRes')+'</div>';}
$('#q').addEventListener('input',renderList);

/* terms */
function renderTerms(){var d=Tm[L];$('#termsh').textContent=d.title;$('#tbody').innerHTML='<p><em>'+esc(d.upd)+'</em></p><p style="margin-top:8px">'+esc(d.intro)+'</p>'+d.s.map(function(s){return '<h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p>';}).join('');$('#tclose').setAttribute('aria-label',d.close);}
var lastF=null;function openTerms(){lastF=document.activeElement;renderTerms();$('#terms').hidden=false;$('#tclose').focus();}
function closeTerms(){$('#terms').hidden=true;if(lastF&&lastF.focus)try{lastF.focus();}catch(e){}}
$('#bannerlink').onclick=openTerms;$('#footterms').onclick=openTerms;$('#tclose').onclick=closeTerms;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#terms').hidden)closeTerms();});
$('#terms').addEventListener('click',function(e){if(e.target===$('#terms'))closeTerms();});

/* art: table setting */
function artSvg(){return '<svg viewBox="0 0 440 290" role="img" aria-label=""><ellipse cx="220" cy="150" rx="200" ry="120" fill="#FFFBF3" stroke="#7A1F2E" stroke-width="5"/><ellipse cx="220" cy="150" rx="150" ry="88" fill="none" stroke="#C9A24B" stroke-width="3"/><circle cx="220" cy="150" r="64" fill="#F4EADA" stroke="#15100B" stroke-width="3"/><path d="M190 140 q30-30 60 0 q-30 22-60 0z" fill="#7A1F2E"/><rect x="42" y="96" width="8" height="110" rx="4" fill="#15100B"/><path d="M32 96 v36 M42 96 v36 M52 96 v36 M62 96 v36" stroke="#15100B" stroke-width="3"/><rect x="390" y="96" width="9" height="110" rx="4" fill="#15100B"/><path d="M380 96 q-6 40 20 40 q26 0 20 -40" fill="none" stroke="#15100B" stroke-width="3" transform="translate(-20 0)"/></svg>';}

/* language */
function applyStatic(){$$('[data-i]').forEach(function(el){el.textContent=t(el.dataset.i);});
  $('#h1').innerHTML=L==='vi'?'Hôm nay đi <em>nhà hàng</em> gì?':'Which <em>restaurant</em> today?';
  $('#spin').textContent=wheel.spinning?t('spinning'):t('spin');$('#reshuffle').textContent=t('reshuffle');$('#go').textContent=duck.racing?t('racing'):t('go');$('#newduck').textContent=t('newduck');$('#deal').textContent=t('deal');
  $('#flip').textContent=t('flip');$('#coinNew').textContent=t('coinNew');$('#roll').textContent=t('roll');$('#diceNew').textContent=t('diceNew');$('#pull').textContent=t('pull');
  $('#genall').textContent='🎲 '+t('genall');$('#favclear').textContent=t('favClear');$('#q').placeholder=t('search');
  $('#bannertxt').textContent=Tm[L].banner;$('#bannerlink').textContent=Tm[L].bannerL;$('#footterms').textContent=Tm[L].footT;$('#srcnote').textContent=t('srcnote');$('#yr').textContent=new Date().getFullYear();
  $$('.lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.l===L));});document.documentElement.lang=L;}
function setLang(l,fromHash){if(l!=='vi'&&l!=='en')return;L=l;lsSet('homNayNhaHang.lang',l);if(!fromHash){try{history.replaceState(null,'','#'+l);}catch(e){location.hash=l;}}
  applyStatic();renderTabs();renderFilters();if(qs.step>=Q.length&&qRank.length)drawQuiz();else renderQuiz();rerenderRes();
  if(tab==='gen')renderGen();if(tab==='fav')renderFav();if(tab==='list')renderList();if(tab==='wheel')drawWheel();
  if(tab==='cards'&&deckList.length&&!$('#deck .pc.open'))dealHtml();
  if(tab==='quick'){$('#cA').innerHTML=coin.a?'<b>A</b>'+esc(label(coin.a)):'';$('#cB').innerHTML=coin.b?'<b>B</b>'+esc(label(coin.b)):'';drawDList(-1);}
  if(!$('#terms').hidden)renderTerms();}
$$('.lang button').forEach(function(x){x.onclick=function(){setLang(x.dataset.l);};});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if((h==='vi'||h==='en')&&h!==L)setLang(h,true);});
(function(){var h=location.hash.slice(1),l='vi';if(h==='en'||h==='vi')l=h;else{var s=lsGet('homNayNhaHang.lang');if(s==='en'||s==='vi')l=s;else if((navigator.language||'').toLowerCase().indexOf('vi')!==0)l='en';}
  L=l;$('#art').innerHTML=artSvg();applyStatic();renderTabs();renderFilters();renderQuiz();$$('section[role=tabpanel]').forEach(function(s){s.hidden=s.id!=='p-gen';});renderGen();})();
})();
