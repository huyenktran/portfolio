{id:'contrast',n:b('Verse and Chorus Contrast','Tương phản giữa verse và chorus'),x:b('Điệp khúc thường cao hơn, rõ hơn và dễ nhớ hơn so với đoạn lời. Sự thay đổi về cao độ, nhịp điệu hoặc mật độ lời giúp người nghe nhận ra chỗ bài hát “mở ra”.','The chorus is usually higher, clearer and easier to remember than the verse. A change in pitch, rhythm or lyric density tells the listener the song is “opening up”.'),s:{vi:['Hát đoạn lời ở âm vực thấp hoặc trung','Nâng điệp khúc lên cao hơn vài nốt','Rút gọn lời điệp khúc và lặp tên bài hát','Thử đổi hợp âm mở đầu điệp khúc'],en:['Sing the verse in a low or middle range','Lift the chorus a few notes higher','Shorten the chorus lyric and repeat the title','Try changing the first chord of the chorus']},r:['Pat Pattison, Writing Better Lyrics','Jimmy Webb, Tunesmith: Inside the Art of Songwriting']},
{id:'hook',n:b('The Hook','Hook (câu bắt tai)'),x:b('Hook là một ý tưởng ngắn, dễ nhớ, có thể là giai điệu, lời hoặc nhịp điệu. Nó thường gắn với tiêu đề và lặp lại để người nghe nhớ.','A hook is a short, memorable idea, in melody, lyric or rhythm. It is often tied to the title and repeated so listeners remember it.'),s:{vi:['Tìm một cụm 4 đến 6 chữ có nhịp','Hát thử nhiều cách khác nhau','Đặt hook ở chỗ nổi bật (đầu hoặc cuối điệp khúc)','Kiểm tra: có nhớ được sau một ngày không?'],en:['Find a rhythmic phrase of 4 to 6 words','Try singing it several ways','Place it somewhere prominent (start or end of the chorus)','Test it: can you remember it a day later?']},r:['Rikky Rooksby, The Songwriting Sourcebook','Jimmy Webb, Tunesmith: Inside the Art of Songwriting']},
{id:'rhyme',n:b('Rhyme Schemes','Sơ đồ vần'),x:b('Cách sắp xếp vần ở cuối câu tạo cảm giác khác nhau. AABB nghe chắc và vui, ABAB nghe cân bằng, ABCB (chỉ vần câu 2 và 4) tự nhiên hơn.','How you arrange end rhymes changes the feel. AABB sounds firm and playful, ABAB balanced, and ABCB (rhyming lines 2 and 4 only) more natural.'),s:{vi:['Viết 4 câu không cần vần','Đánh dấu chữ cuối mỗi câu','Thử đổi từ để đạt sơ đồ AABB, ABAB, ABCB','Chọn sơ đồ cho cảm xúc bạn muốn'],en:['Write 4 lines without worrying about rhyme','Mark the last word of each line','Swap words to try AABB, ABAB and ABCB','Pick the scheme that serves the emotion']},r:['Pat Pattison, Writing Better Lyrics','Pat Pattison, Songwriting: Essential Guide to Lyric Form and Structure']},
{id:'show',n:b('Show, Do Not Tell','Tả, đừng kể'),x:b('Thay vì nói “mình buồn”, hãy cho người nghe thấy chi tiết cụ thể như tách cà phê nguội hay chiếc ô để quên. Hình ảnh giác quan khiến cảm xúc thật hơn.','Instead of saying “I am sad”, show concrete details such as a cold cup of coffee or a forgotten umbrella. Sensory images make emotion feel real.'),s:{vi:['Viết câu cảm xúc thẳng (“mình nhớ bạn”)','Tìm một đồ vật, nơi chốn hoặc hành động chứa cảm xúc đó','Viết lại câu bằng hình ảnh','Giữ lại bản có chi tiết bất ngờ'],en:['Write the plain emotion line (“I miss you”)','Find an object, place or action that holds that feeling','Rewrite the line using an image','Keep the version with a surprising detail']},r:['Pat Pattison, Songwriting: Essential Guide to Lyric Form and Structure']},
{id:'object',n:b('Object Writing','Viết theo đồ vật'),x:b('Bài tập viết nhanh về một vật thật trong khoảng 10 phút, dùng đủ giác quan: nhìn, nghe, ngửi, nếm, chạm. Thói quen này giúp kho hình ảnh phong phú.','A quick exercise of writing about a real object for about 10 minutes using every sense: sight, sound, smell, taste, touch. The habit builds a rich store of imagery.'),s:{vi:['Chọn một đồ vật quanh bạn','Hẹn giờ 10 phút, không dừng bút','Viết cả năm giác quan','Gạch chân 3 câu hay nhất cho bài sau'],en:['Pick an object around you','Set a timer for 10 minutes and keep writing','Include all five senses','Underline your 3 best lines for a later song']},r:['Pat Pattison, Writing Better Lyrics']},
{id:'prosody',n:b('Prosody','Hài hòa giữa lời và nhạc'),x:b('Prosody là sự ăn khớp giữa ý nghĩa của lời và cảm giác của nhạc. Chữ quan trọng nên rơi vào phách mạnh, câu hỏi hợp giai điệu đi lên, sự kết thúc hợp hợp âm giải quyết.','Prosody is how well the meaning of the words matches the feel of the music. Important words should land on strong beats, questions suit a rising melody and endings suit a resolving chord.'),s:{vi:['Đọc lời thành tiếng theo nhịp','Đánh dấu chữ cần nhấn','Đặt chữ đó vào phách mạnh hoặc nốt cao','Kiểm tra cảm xúc của hợp âm có hợp lời không'],en:['Speak the lyric aloud in rhythm','Mark the words to stress','Put those on strong beats or higher notes','Check that the chord mood fits the words']},r:['Pat Pattison, Writing Better Lyrics']},
{id:'contour',n:b('Melodic Contour','Đường nét giai điệu'),x:b('Hình dáng giai điệu, như một vòng cung lên rồi xuống, tạo cảm giác tự nhiên. Bước nhỏ liền kề dễ hát, các bước nhảy lớn nên dùng có chủ đích để gây chú ý.','The shape of a melody, such as an arch that rises and falls, feels natural. Small steps are easy to sing, while big leaps should be used deliberately for emphasis.'),s:{vi:['Hát giai điệu và vẽ đường đi của nó','Đảm bảo có một điểm cao nhất rõ ràng','Dùng bước nhảy lớn tối đa một lần mỗi cụm','Thử lặp lại một mẫu với nốt khác'],en:['Sing the melody and draw its path','Make sure there is one clear highest point','Use a big leap at most once per phrase','Try repeating a pattern on different notes']},r:['Jimmy Webb, Tunesmith: Inside the Art of Songwriting','Rikky Rooksby, The Songwriting Sourcebook']},
{id:'penta',n:b('Pentatonic Starter','Điểm xuất phát ngũ cung'),x:b('Thang năm nốt dễ hát và khó “lạc tông”. Với thang trưởng, thử các nốt 1, 2, 3, 5, 6; với thang thứ, các nốt 1, b3, 4, 5, b7.','A five-note scale that is easy to sing and hard to clash with. For major, try degrees 1, 2, 3, 5, 6; for minor, 1, b3, 4, 5, b7.'),s:{vi:['Chọn tông và tìm năm nốt','Hát ngẫu hứng trên vòng hợp âm','Lưu lại đoạn bạn thích bằng điện thoại','Thêm nốt thứ sáu hoặc bảy khi cần'],en:['Pick a key and find the five notes','Improvise over the chord loop','Record the part you like on your phone','Add a sixth or seventh note when needed']},r:['Rikky Rooksby, How to Write Songs on Guitar']},
{id:'repeat',n:b('Repetition and Variation','Lặp lại và biến tấu'),x:b('Người nghe nhớ điều được lặp lại, nhưng cần chút thay đổi để không nhàm. Lặp motif rồi đổi nốt cuối hoặc nhịp là cách thông dụng.','Listeners remember what repeats, but small changes keep it fresh. Repeating a motif and altering its last note or rhythm is a common method.'),s:{vi:['Chọn một motif ngắn 2 đến 4 nốt','Lặp lại hai lần','Đổi nốt cuối ở lần thứ ba','Dùng cách này cho lời và giai điệu'],en:['Choose a short 2 to 4 note motif','Repeat it twice','Change the last note the third time','Apply the idea to lyrics and melody']},r:['Jimmy Webb, Tunesmith: Inside the Art of Songwriting']},
{id:'prechorus',n:b('The Pre-Chorus Lift','Tiền điệp khúc dẫn lên'),x:b('Tiền điệp khúc làm tăng căng thẳng trước điệp khúc, thường bằng cách rút ngắn cụm câu, tăng dần cao độ hoặc dừng ở hợp âm V.','A pre-chorus builds tension before the chorus, often by shortening phrases, rising in pitch or landing on the V chord.'),s:{vi:['Viết 2 đến 4 câu ngắn hơn đoạn lời','Cho giai điệu đi lên từng bậc','Kết ở hợp âm chưa giải quyết','Để điệp khúc đến như sự giải tỏa'],en:['Write 2 to 4 lines shorter than the verse','Let the melody climb step by step','End on an unresolved chord','Let the chorus arrive as the release']},r:['Rikky Rooksby, The Songwriting Sourcebook']},
{id:'cowrite',n:b('Co-writing and Feedback','Viết chung và nhận phản hồi'),x:b('Chia sẻ bản nháp với bạn đồng sáng tác hoặc người nghe tin cậy giúp thấy điểm mù. Hỏi cụ thể, như “đoạn nào bạn nhớ nhất?”, sẽ nhận phản hồi hữu ích hơn.','Sharing drafts with a co-writer or trusted listener reveals blind spots. Specific questions, such as “which part do you remember?”, bring more useful feedback.'),s:{vi:['Thu một bản demo ngắn','Hỏi một câu hỏi cụ thể','Ghi lại phản hồi mà không phản bác','Quyết định thay đổi nào đáng thử'],en:['Record a short demo','Ask one specific question','Note the feedback without arguing','Decide which changes are worth trying']},r:['Paul Zollo, Songwriters on Songwriting']},
{id:'memo',n:b('Voice Memo Habit','Thói quen ghi âm nhanh'),x:b('Ý tưởng giai điệu thường đến bất chợt. Ghi âm nhanh, dù thô, giúp giữ lại; sau đó nghe lại và chọn lọc.','Melody ideas often arrive unexpectedly. A quick recording, however rough, saves them; later you can review and select.'),s:{vi:['Mở ứng dụng ghi âm sẵn trên điện thoại','Ghi ngay khi có ý tưởng, kể cả ngân nga','Đặt tên theo ngày và từ khóa','Mỗi tuần nghe lại và chọn 1 ý để phát triển'],en:['Keep a voice recorder app handy','Record the moment an idea appears, even a hum','Name files by date and keyword','Once a week, review and pick one idea to develop']},r:['Rick Rubin, The Creative Act: A Way of Being','Julia Cameron, The Artist\'s Way']}
];

var TERMS={
vi:{title:'Miễn trừ trách nhiệm và Điều khoản sử dụng',upd:'Cập nhật lần cuối: 17/11/2026. Phiên bản 1.0.',
intro:'Trang “Hôm nay sáng tác bài gì” (“Trang”) là công cụ gợi ý sáng tạo và học nhạc của Alessandra Tran (“Chúng tôi”). Khi sử dụng Trang, bạn đồng ý với các điều khoản dưới đây.',
s:[
['1. Mục đích','Mọi gợi ý (thể loại, giọng, tiết tấu, hợp âm, chủ đề, từ khóa, ràng buộc, hook) được tạo ngẫu nhiên hoặc theo quy tắc đơn giản, chỉ nhằm khơi gợi ý tưởng và giải trí. Đây không phải khóa học âm nhạc hay tư vấn chuyên môn.'],
['2. Bản quyền và tính nguyên bản','Các tiến trình hợp âm là khuôn mẫu chung được dùng rộng rãi. Tuy vậy, Chúng tôi không bảo đảm tác phẩm bạn viết là nguyên bản hoặc không xâm phạm quyền của bên thứ ba. Bạn tự chịu trách nhiệm kiểm tra và tránh sao chép giai điệu, lời hoặc bản ghi âm có bản quyền. Nội dung của Trang không phải là tư vấn pháp lý.'],
['3. Độ chính xác','Nội dung lý thuyết âm nhạc, thể loại và kỹ thuật là tóm lược chung, có thể giản lược, thiếu sót hoặc khác nhau tùy trường phái. Thông số như nhịp độ (BPM) chỉ mang tính tham khảo. Không bảo đảm nội dung đầy đủ hoặc phù hợp cho mục đích cụ thể.'],
['4. Sách và nguồn tham khảo','Danh mục sách chỉ để đọc thêm. Việc nhắc đến tác giả hay tác phẩm không có nghĩa là có quan hệ hợp tác hay được họ chứng thực. Tên sách và nhãn hiệu thuộc về chủ sở hữu. Năm xuất bản và chi tiết có thể khác theo ấn bản.'],
['5. Không cổ xúy tư tưởng hay niềm tin','Các chủ đề gợi ý chỉ là chất liệu sáng tạo, không thể hiện quan điểm hay cổ xúy bất kỳ tư tưởng, tôn giáo, chính trị hay niềm tin nào. Bạn tự chịu trách nhiệm về nội dung bài hát của mình.'],
['6. Chủ đề cảm xúc','Một số gợi ý liên quan đến buồn, mất mát hay nỗi sợ. Trang không phải hỗ trợ sức khỏe tinh thần. Nếu bạn đang gặp khó khăn tâm lý, hãy liên hệ người thân hoặc chuyên gia, và với tình huống khẩn cấp hãy gọi dịch vụ khẩn cấp tại nơi bạn sống (ở Việt Nam: 115 hoặc 112).'],
['7. Âm thanh và thính giác','Trang có thể phát âm thanh thử (hợp âm, nhịp). Hãy để âm lượng vừa phải, tránh nghe lớn và lâu, đặc biệt khi dùng tai nghe, vì có thể gây hại thính giác. Một số thiết bị có thể không phát được âm thanh.'],
['8. Bộ ngẫu nhiên và hẹn giờ','Kết quả của vòng quay, đua vịt, lật bài, tung xu, xúc xắc và máy xèng là ngẫu nhiên, không phải dự đoán hay lời khuyên. Bộ hẹn giờ có thể sai lệch nhỏ và không nên dùng cho mục đích đòi hỏi độ chính xác cao.'],
['9. Liên kết bên ngoài','Trang có thể liên kết đến YouTube, Google hoặc trang khác. Chúng tôi không kiểm soát và không chịu trách nhiệm về nội dung của họ. Liên kết video là kết quả tìm kiếm, không phải video cụ thể.'],
['10. Dữ liệu cá nhân','Sổ nhạc, ghi chú, ngôn ngữ của bạn được lưu trên trình duyệt (localStorage) và không gửi đến máy chủ của Chúng tôi. Xóa dữ liệu trình duyệt sẽ làm mất chúng. Đừng ghi thông tin nhạy cảm. Trang có thể tải phông chữ từ Google Fonts.'],
['11. Không bảo đảm và giới hạn trách nhiệm','Trang được cung cấp “như hiện có”, không kèm bảo đảm nào. Trong phạm vi pháp luật cho phép, Chúng tôi không chịu trách nhiệm đối với thiệt hại trực tiếp, gián tiếp hoặc hệ quả nào, gồm tranh chấp bản quyền, mất dữ liệu hay tổn thất thính giác, phát sinh từ việc dùng Trang.'],
['12. Sở hữu trí tuệ','Mã nguồn, giao diện và nội dung do Chúng tôi biên soạn thuộc quyền của Chúng tôi. Bài hát và nội dung bạn tạo ra thuộc về bạn.'],
['13. Luật áp dụng, liên hệ','Điều khoản này theo pháp luật Việt Nam, không loại trừ các quyền mà pháp luật bảo vệ người tiêu dùng không cho phép loại trừ. Nếu thấy nội dung sai, xin liên hệ qua trang Liên hệ của alessandratran.com.']
],close:'Đóng',banner:'Công cụ gợi ý sáng tạo và giải trí. Không bảo đảm tính nguyên bản hay bản quyền cho tác phẩm của bạn. Giữ âm lượng vừa phải.',bannerL:'Xem điều khoản',footT:'Miễn trừ trách nhiệm và Điều khoản',safeH:'Lưu ý',safeG:'Gợi ý chỉ để khơi ý tưởng. Hãy tự kiểm tra bản quyền và giữ âm lượng vừa phải.'},

var Tm=TERMS,L='vi';
function t(k,o){var s=T[L][k];if(s==null)s=T.vi[k];if(s==null)s='';if(o&&typeof s==='string')for(var x in o)s=s.split('{'+x+'}').join(o[x]);return s;}
function V(o){return o[L];}
function gname(g){var G=GEN[g];return '<span>'+esc(G.en)+'</span>'+(L==='vi'&&G.vi!==G.en?' <span class="vt">('+esc(G.vi)+')</span>':'');}
function gshort(g){return L==='vi'?GEN[g].vi:GEN[g].en;}

/* ---------- brief model ---------- */
var ALL=['g','key','bpm','pr','mo','th','st','ins','w','cs','hk'];
function randBpm(G){return G.bpm[0]+rnd(G.bpm[1]-G.bpm[0]+1);}
function distinct3(){return sample(WORDS.map(function(_,i){return i;}),3);}
function regen(b,locked,opts){
  opts=opts||{};var n={};for(var k in b)n[k]=b[k];
  var gpool=gf==='all'?GK:[gf];
  if(!locked.g||n.g==null)n.g=pick(gpool);
  var G=GEN[n.g];
  if(!locked.pr||n.pr==null){var ps=G.prog.filter(function(p){return PRG[p].lv<=(opts.lv||3);});n.pr=pick(ps.length?ps:G.prog);}
  if(!locked.key||n.root==null)n.root=rnd(12);
  if(!locked.bpm||n.bpm==null)n.bpm=randBpm(G);
  if(!locked.mo||n.mo==null)n.mo=opts.mo!=null?opts.mo:rnd(MOOD.length);
  if(!locked.th||n.th==null)n.th=rnd(THEME.length);
  if(!locked.st||n.st==null)n.st=(opts.short&&G.st.indexOf('short')>=0)?'short':pick(G.st);
  if(!locked.ins||n.ins==null)n.ins=(opts.ins&&G.ins.indexOf(opts.ins)>=0)?opts.ins:pick(G.ins);
  if(!locked.w||!n.w)n.w=distinct3();
  if(!locked.cs||n.cs==null)n.cs=rnd(CONS.length);
  if(!locked.hk||n.hk==null)n.hk=rnd(HOOK.length);
  return n;
}
function newBrief(opts){return regen({},{},opts);}
function keyName(b){return NAMES[b.root]+' '+(PRG[b.pr].m==='min'?t('minor'):t('major'));}
function chordList(b){var P=PRG[b.pr];return P.c.map(function(c){return NAMES[(b.root+c[0])%12]+QS[c[1]].s;});}
function rnText(p){var P=PRG[p];return L==='en'&&P.rnE?P.rnE:P.rn;}
function label(b){return gshort(b.g)+' · '+V(THEME[b.th]);}
function briefText(b){
  return [gshort(b.g)+' · '+keyName(b)+' · '+b.bpm+' BPM',t('f_pr')+': '+chordList(b).join(' - ')+' ('+rnText(b.pr)+')',t('f_mo')+': '+V(MOOD[b.mo]),t('f_th')+': '+V(THEME[b.th]),t('f_st')+': '+STR[b.st].seq.map(function(s){return V(SEC[s]);}).join(' > '),t('f_ins')+': '+V(INS[b.ins]),t('f_w')+': '+b.w.map(function(i){return V(WORDS[i]);}).join(', '),t('f_cs')+': '+V(CONS[b.cs]),t('f_hk')+': '+V(HOOK[b.hk])].join('\n');
}

/* ---------- audio ---------- */
var AC=null,PL={nodes:[],tm:0,id:null};
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function note(a,t0,dur,midi,gain,type,nodes){var o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(gain,t0+.03);g.gain.exponentialRampToValueAtTime(0.0008,t0+dur*.96);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur);nodes.push(o);}
function stopPlay(){PL.nodes.forEach(function(o){try{o.stop();}catch(e){}});PL.nodes=[];clearTimeout(PL.tm);PL.id=null;updPlay();}
function updPlay(){$$('[data-play]').forEach(function(b){b.textContent=(PL.id===b.dataset.play?'■ '+t('stopP'):'▶ '+t('play'));});}
function playProg(b,id){
  if(PL.id===id){stopPlay();return;}stopPlay();
  var a;try{a=ac();}catch(e){return;}
  var P=PRG[b.pr],dur=(P.beats||4)*60/b.bpm,t0=a.currentTime+.08,cyc=2,nodes=[];
  for(var c=0;c<cyc;c++)P.c.forEach(function(ch,i){var ts=t0+(c*P.c.length+i)*dur,r=(b.root+ch[0])%12,base=48+r;
    note(a,ts,dur,base-12,.16,'sine',nodes);
    QS[ch[1]].iv.forEach(function(iv){note(a,ts,dur,base+12+iv,.07,'triangle',nodes);});});
  PL.nodes=nodes;PL.id=id;PL.tm=setTimeout(stopPlay,(cyc*P.c.length*dur+.3)*1000);updPlay();
}
function click(f,ms,g){try{var a=ac(),o=a.createOscillator(),gn=a.createGain();o.type='square';o.frequency.value=f;gn.gain.setValueAtTime(g,a.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+ms/1000);o.connect(gn);gn.connect(a.destination);o.start();o.stop(a.currentTime+ms/1000);}catch(e){}}

/* ---------- registry + sheet ---------- */
var REG=[];
function reg(b){var i=REG.indexOf(b);if(i<0){REG.push(b);i=REG.length-1;}return i;}
function sheet(b,edit){
  var id=reg(b),G=GEN[b.g];
  var v={
   g:gname(b.g),key:esc(keyName(b)),bpm:b.bpm+' '+t('bpmU'),
   pr:chordList(b).map(function(c){return '<span class="chord">'+esc(c)+'</span>';}).join('→ ')+'<br><small>'+esc(rnText(b.pr))+'</small>',
   mo:esc(V(MOOD[b.mo])),th:esc(V(THEME[b.th])),
   st:'<div class="seq">'+STR[b.st].seq.map(function(s){return '<span>'+esc(V(SEC[s]))+'</span>';}).join('')+'</div>',
   ins:esc(V(INS[b.ins])),w:b.w.map(function(i){return '<span class="tag">'+esc(V(WORDS[i]))+'</span>';}).join(' '),cs:esc(V(CONS[b.cs])),hk:esc(V(HOOK[b.hk]))};
  var rows=ALL.map(function(k){
    var ctl=edit?'<span class="ct"><label><input type="checkbox" data-lock="'+k+'"'+(gen.locks[k]?' checked':'')+'><span>'+t('lock')+'</span></label><button class="ib" type="button" data-rr="'+k+'" aria-label="'+esc(t('reroll'))+'" title="'+esc(t('reroll'))+'">↻</button></span>':'<span></span>';
    return '<div class="sr"><span class="k">'+t('f_'+k)+'</span><span class="v">'+v[k]+'</span>'+ctl+'</div>';}).join('');
  return '<div class="sheet"><div class="sh"><div><small>'+t('sheet')+'</small><h3>'+EM[b.g]+' '+esc(label(b))+'</h3></div></div>'+rows+
   '<div class="sb"><button class="btn sm" type="button" data-play="b'+id+'" data-b="'+id+'">▶ '+t('play')+'</button><button class="btn sm ghost" type="button" data-sprint="'+id+'">⏱ '+t('sprint')+'</button><button class="btn sm ghost" type="button" data-save="'+id+'">'+t('saveB')+'</button><button class="btn sm ghost" type="button" data-copy="'+id+'">'+t('copy')+'</button><a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+enc(G.en+' songwriting tutorial '+PRG[b.pr].rn)+'">'+t('learn')+'</a></div></div>';
}
document.addEventListener('click',function(e){var x;
  if(x=e.target.closest('[data-play]')){var b=REG[+x.dataset.b];if(b)playProg(b,x.dataset.play);return;}
  if(x=e.target.closest('[data-lp]')){var p=x.dataset.lp.split(':');playProg({pr:p[0],root:+p[1],bpm:90},x.dataset.play||x.dataset.lp);return;}
  if(x=e.target.closest('[data-sprint]')){var b2=REG[+x.dataset.sprint];if(b2)startTimer(presetPhases('s25'),label(b2));return;}
  if(x=e.target.closest('[data-save]')){var b3=REG[+x.dataset.save];if(!b3)return;book.unshift({ts:new Date().toISOString(),b:JSON.parse(JSON.stringify(b3)),note:''});book=book.slice(0,100);saveBook();var o=x.textContent;x.textContent=t('saved');setTimeout(function(){x.textContent=t('saveB');},1600);if(tab==='book')renderBook();return;}
  if(x=e.target.closest('[data-copy]')){var b4=REG[+x.dataset.copy];if(!b4)return;var txt=briefText(b4);try{navigator.clipboard.writeText(txt).then(function(){x.textContent=t('copied');setTimeout(function(){x.textContent=t('copy');},1600);},function(){x.textContent=t('copyFail');});}catch(er){x.textContent=t('copyFail');}return;}
});

$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab);});
function showTab(k){stopPlay();tab=k;TABS.forEach(function(x){$('#p-'+x).hidden=x!==k;});
  $$('#tabs .tab').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===k));});renderChips();
  if(k==='gen')renderGen();if(k==='wheel'){if(!wheel.items.length)newWheel();else drawWheel();}
  if(k==='duck'&&!duck.list.length)newDucks();if(k==='cards'&&!$('#deck').children.length)dealCards();
  if(k==='quick'&&!coin.a)(coinNew(),diceNew());if(k==='book')renderBook();if(k==='lib')renderLib();}

  var h='';

    return '<div class="card"><h3>'+esc(rnText(k))+'</h3><div class="row" style="margin:6px 0"><span class="tag">'+(P.m==='min'?t('minor'):t('major'))+'</span></div><p style="font-weight:700;margin-top:0">'+ch.map(esc).join(' → ')+'</p><p>'+esc(V(P.d))+'</p><div class="row" style="margin-top:10px"><button class="btn sm" type="button" data-lp="'+k+':'+lroot+'" data-play="lp-'+k+'">▶ '+t('play')+'</button></div></div>';}).join('')+'</div>';}
  else if(ls==='tech'){h=TIPS.map(function(x){return '<details class="fx"><summary><span>'+esc(x.n.vi===undefined?'':'')+(L==='vi'?esc(x.n.en)+' <span class="vt">('+esc(x.n.vi)+')</span>':esc(x.n.en))+'</span></summary><div><p>'+esc(V(x.x))+'</p><p class="lbl" style="margin-top:12px">'+t('how')+'</p><ol class="st">'+x.s[L].map(function(s){return '<li><span>'+esc(s)+'</span></li>';}).join('')+'</ol><p class="lbl" style="margin-top:12px">'+t('refs')+'</p><ul class="refs">'+x.r.map(function(r){return '<li><a target="_blank" rel="noopener" href="https://www.google.com/search?q='+enc(r)+'">'+esc(r)+'</a></li>';}).join('')+'</ul></div></details>';}).join('');}
  else if(ls==='genre'){h='<div class="grid">'+GK.map(function(g){var G=GEN[g];return '<div class="card"><h3>'+EM[g]+' '+gname(g)+'</h3><div class="row" style="margin:6px 0"><span class="tag">'+G.bpm[0]+'–'+G.bpm[1]+' BPM</span></div><p>'+esc(V(G.d))+'</p><p><b>'+t('f_pr')+':</b> '+G.prog.slice(0,3).map(function(p){return esc(rnText(p));}).join(' · ')+'</p></div>';}).join('')+'</div>';}
  else{h='<ul class="ml">'+BOOKS.map(function(k){return '<li><div><b><a target="_blank" rel="noopener" href="https://www.google.com/search?q='+enc(k.n)+'">'+esc(k.n)+'</a></b><br><small>'+esc(V(k.d))+'</small></div></li>';}).join('')+'</ul>';}
  $('#libbody').innerHTML=h;updPlay();}
$('#libchips').addEventListener('click',function(e){var b=e.target.closest('[data-ls]');if(b){stopPlay();ls=b.dataset.ls;renderLib();}});
$('#libbody').addEventListener('change',function(e){if(e.target.id==='lkey'){stopPlay();lroot=+e.target.value;renderLib();}});

/* ---------- terms ---------- */
function renderTerms(){var d=Tm[L];$('#termsh').textContent=d.title;$('#tbody').innerHTML='<p><em>'+esc(d.upd)+'</em></p><p style="margin-top:8px">'+esc(d.intro)+'</p>'+d.s.map(function(s){return '<h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p>';}).join('');$('#tclose').setAttribute('aria-label',d.close);}
var lastF=null;function openTerms(){lastF=document.activeElement;renderTerms();$('#terms').hidden=false;$('#tclose').focus();}
function closeTerms(){$('#terms').hidden=true;if(lastF&&lastF.focus)try{lastF.focus();}catch(e){}}
$('#bannerlink').onclick=openTerms;$('#footterms').onclick=openTerms;$('#tclose').onclick=closeTerms;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#terms').hidden)closeTerms();});
$('#terms').addEventListener('click',function(e){if(e.target===$('#terms'))closeTerms();});

/* ---------- art ---------- */
function consoleSvg(){var o='<rect x="10" y="40" width="420" height="230" rx="18" fill="#1A1511" stroke="#0A0705" stroke-width="3"/><rect x="10" y="30" width="420" height="30" rx="14" fill="#A35A27"/><rect x="26" y="46" width="388" height="16" rx="6" fill="#2A2018"/>';
  for(var i=0;i<12;i++){var x=40+i*32,y=110+((i*37)%70);o+='<rect x="'+(x-2)+'" y="100" width="4" height="120" rx="2" fill="#050302"/><rect x="'+(x-9)+'" y="'+y+'" width="18" height="26" rx="4" fill="#E8DFD0" stroke="#050302"/><rect x="'+(x-6)+'" y="'+(y+11)+'" width="12" height="3" fill="#15100B"/>';
    o+='<circle cx="'+x+'" cy="82" r="8" fill="#3A2C20" stroke="#050302"/><rect x="'+(x-1)+'" y="75" width="2" height="7" fill="#F2B253"/>';
    for(var j=0;j<5;j++)o+='<rect class="led" style="animation-delay:'+((i*j*93)%900)+'ms" x="'+(x-4)+'" y="'+(232-j*8)+'" width="8" height="5" rx="1" fill="'+(j>3?'#E0392B':j>2?'#F2B253':'#6DBE5A')+'"/>';}
  return '<svg viewBox="0 0 440 290" role="img" aria-label="">'+o+'</svg>';}

/* ---------- language ---------- */
function applyStatic(){$$('[data-i]').forEach(function(el){el.textContent=t(el.dataset.i);});
  $('#h1').innerHTML=L==='vi'?'Hôm nay <em>sáng tác</em> bài gì?':'What song will you <em>write</em> today?';
  $('#spin').textContent=wheel.spinning?t('spinning'):t('spin');$('#reshuffle').textContent=t('reshuffle');$('#go').textContent=duck.racing?t('racing'):t('go');$('#newduck').textContent=t('newduck');$('#deal').textContent=t('deal');
  $('#flip').textContent=t('flip');$('#coinNew').textContent=t('coinNew');$('#roll').textContent=t('roll');$('#diceNew').textContent=t('diceNew');$('#pull').textContent=t('pull');
  $('#genall').textContent='🎲 '+t('genall');$('#bkclear').textContent=t('bkClear');$('#fgo').textContent='▶ '+t('fgo');$('#mgo').textContent=(MET.on?'■ '+t('mstop'):'▶ '+t('mgo'));$('#mtap').textContent=t('mtap');
  $('#bannertxt').textContent=Tm[L].banner;$('#bannerlink').textContent=Tm[L].bannerL;$('#footterms').textContent=Tm[L].footT;$('#srcnote').textContent=t('srcnote');$('#yr').textContent=new Date().getFullYear();
  $$('.lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.l===L));});document.documentElement.lang=L;renderPresets();}
function setLang(l,fromHash){if(l!=='vi'&&l!=='en')return;L=l;lsSet('homNayNhac.lang',l);if(!fromHash){try{history.replaceState(null,'','#'+l);}catch(e){location.hash=l;}}
  stopPlay();applyStatic();renderTabs();renderChips();if(qs.step>=Q.length&&qRank.length)drawQuiz();else renderQuiz();rerenderRes();
  if(tab==='gen')renderGen();if(tab==='book')renderBook();if(tab==='lib')renderLib();if(tab==='wheel')drawWheel();
  if(tab==='duck'){$$('#lanes .dn').forEach(function(el,i){if(duck.list[i])el.textContent=label(duck.list[i]);});}
  if(tab==='cards'&&deckList.length&&!$('#deck .pc.open')){var keep=deckList;dealCardsKeep(keep);}
  if(tab==='quick'){$('#cA').innerHTML='<b>A</b>'+esc(label(coin.a));$('#cB').innerHTML='<b>B</b>'+esc(label(coin.b));drawDList(-1);}
  if(!$('#terms').hidden)renderTerms();if(TM.ph.length&&!$('#dock').hidden)drawDock();}
function dealCardsKeep(list){deckList=list;$('#deck').innerHTML=deckList.map(function(m,i){return '<button type="button" class="pc" data-c="'+i+'" aria-label="Card '+(i+1)+'"><div class="in2"><div class="b"><span>♪</span></div><div class="f"><span style="font-size:28px">'+EM[m.g]+'</span><b>'+esc(label(m))+'</b><i>'+esc(keyName(m))+' · '+m.bpm+'</i></div></div></button>';}).join('');}
$$('.lang button').forEach(function(x){x.onclick=function(){setLang(x.dataset.l);};});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if((h==='vi'||h==='en')&&h!==L)setLang(h,true);});
(function(){var h=location.hash.slice(1),l='vi';if(h==='en'||h==='vi')l=h;else{var s=lsGet('homNayNhac.lang');if(s==='en'||s==='vi')l=s;else if((navigator.language||'').toLowerCase().indexOf('vi')!==0)l='en';}
  L=l;$('#art').innerHTML=consoleSvg();applyStatic();renderTabs();renderChips();renderQuiz();$$('section[role=tabpanel]').forEach(function(s){s.hidden=s.id!=='p-gen';});renderGen();})();
})();
</script>

</body></html>
