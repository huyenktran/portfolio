/* ---- cognitive biases ---- */
I('confirm','bias',1,8,'Confirmation Bias','Thiên kiến xác nhận',
"Hãy chọn một niềm tin bạn đang giữ chắc. Bằng chứng nào, nếu xuất hiện, sẽ khiến bạn đổi ý, và bạn đã thật sự đi tìm nó chưa?",
"Pick a belief you hold firmly. What evidence, if it appeared, would change your mind, and have you actually looked for it?",
"Thiên kiến xác nhận là xu hướng tìm, diễn giải và ghi nhớ thông tin theo hướng củng cố điều ta đã tin, đồng thời xem nhẹ thông tin trái chiều. Nó biến việc suy nghĩ thành thu thập “đạn dược” thay vì tìm sự thật.",
"Confirmation bias is the tendency to seek, interpret and remember information in ways that support what we already believe while discounting what contradicts it. It turns thinking into ammunition-gathering instead of truth-seeking.",
"Viết niềm tin thành một câu rõ ràng|Liệt kê bằng chứng ủng hộ, rồi cố tình tìm 3 bằng chứng chống lại|Tự hỏi: nếu ai đó đưa bằng chứng này cho niềm tin ngược lại, mình có chấp nhận không?|Ghi mức tin chắc (0 đến 100%) trước và sau khi tìm",
"Write the belief as one clear sentence|List supporting evidence, then deliberately look for 3 pieces against it|Ask: if someone offered this evidence for the opposite belief, would I accept it?|Rate your confidence (0 to 100%) before and after searching",
"Bạn tin một loại thực phẩm là “siêu thực phẩm” và chỉ đọc các bài khen nó. Hãy thử tìm đúng cụm “tác dụng phụ” hoặc “nghiên cứu phản bác”.",
"You believe a food is a “superfood” and only read pieces that praise it. Try searching specifically for its drawbacks or for studies that challenge it.",
['Daniel Kahneman, Thinking, Fast and Slow (2011)','Raymond Nickerson, “Confirmation Bias: A Ubiquitous Phenomenon in Many Guises”, Review of General Psychology (1998)']);
I('anchor','bias',1,6,'Anchoring Effect','Hiệu ứng mỏ neo',
"Lần gần nhất bạn đàm phán hoặc mua sắm, con số nào được nói ra đầu tiên, và nó đã kéo phán đoán của bạn đi đâu?",
"In your last negotiation or purchase, which number was mentioned first, and where did it pull your judgment?",
"Khi phải ước lượng, ta thường bám vào con số đầu tiên nhận được (mỏ neo), dù nó ngẫu nhiên hay không liên quan, rồi chỉ điều chỉnh không đủ xa. Nhà bán lẻ và người đàm phán hay tận dụng điều này.",
"When estimating, we tend to latch onto the first number we receive (the anchor), even if it is random or irrelevant, and then adjust too little. Retailers and negotiators often use this.",
"Nhận diện con số đầu tiên bạn nghe thấy|Tự đưa ra ước lượng độc lập trước khi xem giá hoặc con số của người khác|Tìm 2 đến 3 điểm so sánh khác nhau (mỏ neo thay thế)|Quyết định dựa trên giá trị bạn tự tính",
"Identify the first number you heard|Make your own independent estimate before seeing the other party's number|Find 2 or 3 different reference points (alternative anchors)|Decide using the value you calculated yourself",
"Một chiếc áo ghi “giá gốc 2 triệu, nay 900 nghìn” khiến 900 nghìn có vẻ rẻ, dù giá trị thật của áo có thể chỉ 500 nghìn.",
"A coat tagged “was 2,000, now 900” makes 900 feel cheap even if the coat is really worth 500.",
['Amos Tversky and Daniel Kahneman, “Judgment under Uncertainty: Heuristics and Biases”, Science (1974)','Daniel Kahneman, Thinking, Fast and Slow (2011)']);
I('avail','bias',1,6,'Availability Heuristic','Phỏng đoán sẵn có',
"Điều bạn lo sợ nhất gần đây có thật sự xảy ra thường xuyên, hay chỉ vì bạn nhìn thấy nó nhiều trên tin tức và mạng xã hội?",
"Is the thing you have worried about most lately really that common, or have you just seen it a lot in the news and on social media?",
"Ta đánh giá khả năng xảy ra của một việc dựa trên việc dễ nhớ ra ví dụ đến mức nào. Sự kiện gây sốc hoặc mới xem gần đây dễ bị đánh giá quá cao so với tần suất thật.",
"We judge how likely something is by how easily examples come to mind. Shocking or recently seen events tend to be overestimated relative to their real frequency.",
"Gọi tên nỗi lo của bạn|Tìm số liệu tần suất thật từ nguồn đáng tin|So sánh con số thật với cảm giác ban đầu|Điều chỉnh mức lo lắng cho phù hợp",
"Name your worry|Look up real frequency data from a reliable source|Compare the real figure with your gut feeling|Adjust your level of concern accordingly",
"Sau khi xem nhiều tin về tai nạn máy bay, bạn thấy đi máy bay nguy hiểm hơn đi xe máy, trong khi số liệu thường cho thấy ngược lại.",
"After watching many news reports about plane crashes, flying feels more dangerous than driving, while statistics usually show the opposite.",
['Amos Tversky and Daniel Kahneman, “Availability: A Heuristic for Judging Frequency and Probability”, Cognitive Psychology (1973)','Daniel Kahneman, Thinking, Fast and Slow (2011)']);
I('sunk','bias',2,8,'Sunk Cost Fallacy','Ngụy biện chi phí chìm',
"Có điều gì bạn đang tiếp tục chỉ vì đã bỏ quá nhiều thời gian, tiền bạc hay công sức vào đó? Nếu bắt đầu lại từ số 0 hôm nay, bạn có chọn nó không?",
"Is there something you keep doing only because you have already invested so much time, money or effort? If you were starting fresh today, would you choose it?",
"Chi phí chìm là chi phí đã bỏ ra và không thể lấy lại. Về lý thuyết, quyết định tốt chỉ nên dựa vào chi phí và lợi ích trong tương lai. Trên thực tế ta thường tiếp tục vì tiếc những gì đã bỏ ra.",
"Sunk costs are costs already spent and unrecoverable. In theory a good decision should weigh only future costs and benefits. In practice we often continue out of reluctance to “waste” what we have put in.",
"Liệt kê những gì đã bỏ ra (và gạch chúng đi về mặt quyết định)|Viết chi phí và lợi ích CÒN LẠI nếu tiếp tục|Hỏi: nếu bắt đầu từ đầu hôm nay, mình có chọn điều này không?|Chọn theo câu trả lời, và ghi nhận bài học",
"List what you have already spent (and cross it out for decision purposes)|Write the REMAINING costs and benefits of continuing|Ask: starting from scratch today, would I choose this?|Decide by that answer, and note the lesson",
"Bạn trả tiền vé phim rồi mới thấy phim dở nhưng vẫn ngồi đến hết. Tiền vé đã mất dù bạn ở lại hay ra về, nên câu hỏi đúng là phần thời gian còn lại dùng thế nào tốt hơn.",
"You paid for a movie ticket, then find the film dull yet stay to the end. The ticket money is gone either way, so the real question is how best to spend the remaining time.",
['Hal Arkes and Catherine Blumer, “The Psychology of Sunk Cost”, Organizational Behavior and Human Decision Processes (1985)','Annie Duke, Quit: The Power of Knowing When to Walk Away (2022)']);
I('dk','bias',2,8,'Dunning-Kruger Effect','Hiệu ứng Dunning-Kruger',
"Ở lĩnh vực nào bạn thấy mình rất giỏi chỉ vì biết chưa nhiều? Ai là người có thể cho bạn phản hồi thẳng thắn ở đó?",
"In which area do you feel very competent only because you do not yet know much? Who could give you candid feedback there?",
"Nghiên cứu của Kruger và Dunning gợi ý rằng người có kỹ năng thấp có thể đánh giá quá cao năng lực của mình vì thiếu chính kỹ năng để nhận ra sai sót. Cách giải thích chính xác của hiệu ứng này vẫn còn được tranh luận trong giới nghiên cứu.",
"Kruger and Dunning's research suggests that people with low skill may overrate themselves because they lack the very skill needed to spot their mistakes. The exact explanation of this effect is still debated among researchers.",
"Chọn một kỹ năng bạn tự tin|Tự chấm điểm, rồi nhờ một người có chuyên môn chấm|Liệt kê 3 điều bạn chưa biết về lĩnh vực đó|Đặt kế hoạch học hoặc hỏi thêm",
"Pick a skill you feel confident in|Rate yourself, then ask someone with expertise to rate you|List 3 things you do not yet know about the field|Make a plan to learn or ask more",
"Mới xem vài video về đầu tư và thấy mình đã hiểu thị trường, cho đến khi đọc sách nền tảng và nhận ra mình chưa biết những câu hỏi cơ bản.",
"After a few videos about investing you feel you understand the market, until a foundational book shows you do not yet know the basic questions.",
['Justin Kruger and David Dunning, “Unskilled and Unaware of It”, Journal of Personality and Social Psychology (1999)','Gignac and Zajenkowski, “The Dunning-Kruger effect is (mostly) a statistical artefact”, Intelligence (2020)']);
/* ---- fallacies ---- */
I('adhom','fallacy',1,5,'Ad Hominem','Công kích cá nhân',
"Lần gần nhất bạn bác bỏ một ý kiến vì người nói chứ không vì nội dung, là khi nào?",
"When did you last dismiss an idea because of who said it rather than what was said?",
"Ngụy biện công kích cá nhân tấn công người nói (tính cách, xuất thân, động cơ) thay vì lập luận của họ. Động cơ hay tiền sử của người nói có thể đáng chú ý, nhưng không tự nó chứng minh lập luận sai.",
"The ad hominem fallacy attacks the speaker (character, background, motives) instead of the argument. A speaker's motives or record may be worth noting, but they do not by themselves prove the argument wrong.",
"Tách riêng lập luận khỏi người nói|Viết lập luận thành các tiền đề và kết luận|Đánh giá từng tiền đề độc lập|Nếu động cơ người nói đáng ngờ, hãy kiểm chứng thêm thay vì bác bỏ ngay",
"Separate the argument from the speaker|Write the argument as premises and a conclusion|Assess each premise on its own|If the speaker's motives are doubtful, verify further instead of dismissing outright",
"“Bạn ấy chưa từng làm quản lý nên đề xuất quy trình này chắc chắn sai.” Hãy kiểm tra quy trình, không kiểm tra lý lịch.",
"“She has never been a manager, so her process proposal must be wrong.” Check the process, not the résumé.",
['Irving Copi and Carl Cohen, Introduction to Logic (various editions)','Douglas Walton, Informal Logic: A Pragmatic Approach (2008)']);
I('straw','fallacy',1,5,'Straw Man','Người rơm',
"Hãy diễn đạt lại quan điểm của người bạn bất đồng sao cho họ sẽ nói “đúng, đó chính là điều tôi nghĩ”. Bạn làm được không?",
"Restate the view of someone you disagree with so well that they would say “yes, that is exactly what I think”. Can you?",
"Người rơm là việc bóp méo hoặc cực đoan hóa lập luận của đối phương để dễ bác bỏ, rồi tấn công phiên bản bị bóp méo đó thay vì lập luận thật.",
"A straw man distorts or exaggerates an opponent's argument so it is easier to knock down, then attacks that distorted version instead of the real one.",
"Tóm tắt lập luận của đối phương bằng lời của họ|Hỏi họ xác nhận bạn hiểu đúng chưa|Chỉ phản biện sau khi họ xác nhận|Nêu điểm bạn đồng ý trước điểm bạn không đồng ý",
"Summarize their argument in their own terms|Ask them to confirm you got it right|Only then respond with your critique|Name the points you agree with before those you do not",
"A: “Nên giảm giờ làm thêm.” B: “Vậy là bạn muốn cả công ty không ai làm gì!” B đã thay đề xuất giảm bằng đề xuất bỏ hẳn.",
"A: “We should reduce overtime.” B: “So you want the whole company to do nothing!” B swapped a proposal to reduce for a proposal to abolish.",
['Daniel Dennett, Intuition Pumps and Other Tools for Thinking (2013)','Ali Almossawi, An Illustrated Book of Bad Arguments (2013)']);
I('dilemma','fallacy',1,5,'False Dilemma','Lưỡng nan giả',
"Có tình huống nào bạn đang nghĩ chỉ có hai lựa chọn? Hãy thử tìm lựa chọn thứ ba, thứ tư.",
"Is there a situation where you think there are only two options? Try to find a third and a fourth.",
"Lưỡng nan giả trình bày vấn đề như chỉ có hai khả năng trong khi thực tế còn nhiều lựa chọn khác, hoặc có thể kết hợp cả hai. Nó thường xuất hiện trong tranh luận và quảng cáo.",
"A false dilemma presents an issue as having only two possibilities when others exist, or when both could be combined. It often appears in debates and advertising.",
"Viết hai lựa chọn đang được đưa ra|Hỏi: còn lựa chọn nào ở giữa, kết hợp, hoặc hoàn toàn khác?|Hỏi: có thể trì hoãn, thử nhỏ hoặc làm từng phần không?|Chọn từ danh sách đầy đủ hơn",
"Write down the two options on offer|Ask: is there a middle, a hybrid or a completely different option?|Ask: could I delay, run a small trial or do it in stages?|Choose from the fuller list",
"“Hoặc bạn ủng hộ tôi hoàn toàn, hoặc bạn là đối thủ của tôi.” Còn nhiều vị trí khác, như ủng hộ một phần hoặc trung lập.",
"“Either you support me completely or you are my enemy.” There are many other positions, such as partial support or neutrality.",
['Irving Copi and Carl Cohen, Introduction to Logic (various editions)','Ali Almossawi, An Illustrated Book of Bad Arguments (2013)']);
I('slope','fallacy',2,6,'Slippery Slope','Dốc trượt',
"Khi bạn nghĩ “nếu cho phép việc này thì rồi sẽ…”, mỗi bước trượt xuống có thật sự chắc chắn xảy ra không?",
"When you think “if we allow this, then eventually…”, is each step down the slope actually likely?",
"Ngụy biện dốc trượt khẳng định một bước nhỏ chắc chắn dẫn đến chuỗi hệ quả cực đoan mà không chứng minh từng mắt xích. Không phải mọi chuỗi hệ quả đều ngụy biện: nó chỉ là ngụy biện khi các mắt xích thiếu căn cứ.",
"The slippery slope fallacy claims a small step will inevitably lead to a chain of extreme consequences without justifying each link. Not every chain of consequences is fallacious: it is only a fallacy when the links lack support.",
"Viết ra từng mắt xích trong chuỗi hệ quả|Ước lượng khả năng xảy ra của mỗi mắt xích|Nhân xác suất lại, thường nhỏ hơn nhiều so với cảm giác|Hỏi có biện pháp nào chặn giữa chuỗi không",
"Write out each link in the chain of consequences|Estimate how likely each link is|Multiply the probabilities, which is often far smaller than it feels|Ask whether any safeguard could stop the chain midway",
"“Cho phép nghỉ muộn 5 phút thì rồi cả công ty sẽ sụp đổ.” Mỗi mắt xích cần được chứng minh, không chỉ tưởng tượng.",
"“If we allow a 5-minute late start, the whole company will collapse.” Each link needs support, not just imagination.",
['Douglas Walton, Slippery Slope Arguments (1992)','Ali Almossawi, An Illustrated Book of Bad Arguments (2013)']);
I('auth','fallacy',2,6,'Appeal to Authority','Viện dẫn thẩm quyền',
"Khi bạn tin một điều vì “chuyên gia nói vậy”, bạn đã kiểm tra họ có chuyên môn đúng lĩnh vực và các chuyên gia khác có đồng thuận không?",
"When you believe something because “an expert said so”, did you check that they are expert in that very field and whether other experts agree?",
"Dựa vào chuyên gia không tự nó là ngụy biện. Nó chỉ trở thành ngụy biện khi người được viện dẫn không có chuyên môn liên quan, khi chuyên gia không đồng thuận, hoặc khi coi lời chuyên gia là bằng chứng đủ mà không cần lý lẽ.",
"Relying on experts is not a fallacy in itself. It becomes one when the person cited lacks relevant expertise, when experts disagree, or when the expert's word is treated as proof without reasons.",
"Hỏi: người này có chuyên môn đúng lĩnh vực này không?|Hỏi: các chuyên gia khác có đồng thuận không?|Hỏi: họ có lợi ích liên quan không?|Tìm lý lẽ và bằng chứng chứ không chỉ danh xưng",
"Ask: is this person an expert in this exact field?|Ask: do other experts agree?|Ask: do they have a conflicting interest?|Look for reasons and evidence, not just titles",
"Một diễn viên nổi tiếng khuyên dùng loại thuốc bổ. Sự nổi tiếng không phải chuyên môn y khoa.",
"A famous actor recommends a supplement. Fame is not medical expertise.",
['Douglas Walton, Appeal to Expert Opinion (1997)','Irving Copi and Carl Cohen, Introduction to Logic (various editions)']);
/* ---- mental models ---- */
I('first','model',2,10,'First Principles Thinking','Tư duy nguyên lý đầu tiên',
"Hãy chọn một việc bạn vẫn làm “vì ai cũng làm vậy”. Nếu chỉ giữ lại những sự thật không thể bác bỏ, bạn sẽ xây lại nó thế nào?",
"Choose something you do “because everyone does it”. If you kept only the facts you cannot dispute, how would you rebuild it?",
"Tư duy nguyên lý đầu tiên là tách vấn đề thành những sự thật nền tảng rồi lập luận từ đó, thay vì suy luận bằng phép loại suy (làm giống người khác). Ý tưởng bắt nguồn từ Aristotle.",
"First-principles thinking breaks a problem into foundational truths and reasons up from there, instead of reasoning by analogy (copying what others do). The idea traces back to Aristotle.",
"Viết rõ mục tiêu thật sự|Liệt kê mọi giả định bạn đang dùng|Giữ lại giả định nào có thể chứng minh, bỏ phần còn lại|Xây giải pháp mới từ phần còn lại",
"State the real goal|List every assumption you are using|Keep only what you can verify and discard the rest|Build a new solution from what remains",
"Thay vì hỏi “quán cà phê thường bán giá bao nhiêu”, hãy hỏi “nguyên liệu, nhân công, mặt bằng thật sự tốn bao nhiêu và mục tiêu của khách là gì”.",
"Instead of asking “what do cafes usually charge”, ask “what do ingredients, labor and rent actually cost, and what does the customer really want”.",
['Shane Parrish, The Great Mental Models, Volume 1 (2019)','Aristotle, Metaphysics']);
I('second','model',2,8,'Second-Order Thinking','Tư duy hệ quả bậc hai',
"Với quyết định sắp tới, kết quả bậc một là gì, và điều gì xảy ra tiếp theo sau đó, một tháng và một năm nữa?",
"For an upcoming decision, what is the first-order result, and what happens next after that, a month and a year from now?",
"Hệ quả bậc một là phản ứng tức thì. Hệ quả bậc hai là những gì xảy ra sau đó, khi người khác và hệ thống phản ứng lại. Nhiều quyết định tốt ngắn hạn lại gây hại dài hạn.",
"First-order effects are the immediate result. Second-order effects are what follows as other people and systems react. Many choices that look good in the short term cause harm in the long term.",
"Viết kết quả ngay lập tức|Tự hỏi: “và rồi sao nữa?” ít nhất hai lần|Nghĩ xem người khác sẽ phản ứng thế nào|So sánh các phương án theo cả ngắn hạn lẫn dài hạn",
"Write the immediate result|Ask “and then what?” at least twice|Consider how others will react|Compare options over both the short and the long term",
"Giảm giá mạnh tăng doanh số tuần này (bậc một), nhưng khách quen có thể chỉ chịu mua khi có giảm giá (bậc hai).",
"A deep discount lifts sales this week (first order), but regular customers may learn to buy only when there is a sale (second order).",
['Howard Marks, The Most Important Thing (2011)','Shane Parrish, The Great Mental Models, Volume 1 (2019)']);
I('invert','model',2,8,'Inversion','Tư duy đảo ngược',
"Thay vì hỏi làm sao để thành công, hãy hỏi: chắc chắn điều gì sẽ khiến mục tiêu này thất bại, và bạn có thể tránh nó thế nào?",
"Instead of asking how to succeed, ask: what would guarantee this goal fails, and how can you avoid that?",
"Đảo ngược là giải bài toán theo chiều ngược lại. Thay vì tìm cách đạt kết quả tốt, hãy tìm điều gây ra kết quả xấu rồi tránh chúng. Câu nói “hãy đảo ngược, luôn luôn đảo ngược” gắn với nhà toán học Jacobi và được Charlie Munger phổ biến.",
"Inversion means solving a problem backwards. Instead of seeking how to get a good result, find what causes a bad one and avoid it. The phrase “invert, always invert” is attributed to the mathematician Jacobi and popularized by Charlie Munger.",
"Viết mục tiêu|Viết ngược lại: làm gì để chắc chắn thất bại?|Chuyển mỗi điều đó thành một quy tắc cần tránh|Kiểm tra kế hoạch hiện tại có vi phạm quy tắc nào không",
"Write the goal|Write the reverse: what would make failure certain?|Turn each item into a rule to avoid|Check whether your current plan breaks any of them",
"Muốn học tốt tiếng Anh? Liệt kê những cách chắc chắn bỏ cuộc (học quá sức, không ôn lại, không nói) rồi tránh chúng.",
"Want to learn English well? List the surest ways to quit (overreaching, never reviewing, never speaking) and avoid them.",
['Charlie Munger, Poor Charlie\'s Almanack (2005)','Shane Parrish, The Great Mental Models, Volume 1 (2019)']);
I('occam','model',1,6,'Occam\'s Razor','Dao cạo Occam',
"Bạn đang giải thích một chuyện bằng một câu chuyện phức tạp. Có cách giải thích nào đơn giản hơn mà vẫn khớp với dữ kiện không?",
"You are explaining something with a complicated story. Is there a simpler explanation that still fits the facts?",
"Dao cạo Occam gợi ý: trong các cách giải thích cùng khớp dữ kiện, hãy ưu tiên cách cần ít giả định hơn. Đây là nguyên tắc tham khảo để chọn giả thuyết cần kiểm chứng trước, không phải bằng chứng rằng cách đơn giản luôn đúng.",
"Occam's razor suggests that among explanations that fit the facts equally well, prefer the one needing fewer assumptions. It is a rule of thumb for choosing which hypothesis to test first, not proof that the simple one is always right.",
"Liệt kê các cách giải thích khả dĩ|Đếm số giả định mỗi cách cần|Ưu tiên kiểm chứng cách ít giả định nhất|Sẵn sàng bỏ nó nếu dữ kiện mới không khớp",
"List the plausible explanations|Count the assumptions each one needs|Test the one with the fewest assumptions first|Drop it if new data does not fit",
"Tin nhắn chưa được trả lời có lẽ do người ta đang bận, trước khi nghĩ là họ giận bạn.",
"An unanswered message is more likely because the person is busy than that they are upset with you.",
['Shane Parrish, The Great Mental Models, Volume 1 (2019)','Stanford Encyclopedia of Philosophy, “Simplicity”']);
I('map','model',2,8,'The Map Is Not the Territory','Bản đồ không phải lãnh thổ',
"Mô hình, số liệu hay câu chuyện nào bạn đang dùng để hiểu một vấn đề, và nó bỏ sót điều gì của thực tế?",
"Which model, metric or story are you using to understand an issue, and what does it leave out of reality?",
"Câu của Alfred Korzybski nhắc rằng mọi mô tả, bản đồ, báo cáo hay chỉ số chỉ là sự đơn giản hóa thực tế. Khi ta nhầm mô hình với thực tế, ta dễ ra quyết định sai.",
"Alfred Korzybski's phrase reminds us that every description, map, report or metric is a simplification of reality. When we mistake the model for reality, we tend to decide poorly.",
"Gọi tên “bản đồ” bạn đang dùng|Liệt kê 3 điều nó không thể hiện|Tìm một nguồn thông tin trực tiếp từ thực tế|Cập nhật bản đồ khi thực tế khác đi",
"Name the “map” you are using|List 3 things it does not show|Find a direct source from the ground truth|Update the map when reality differs",
"Điểm số trung bình không nói hết về năng lực của một học sinh; bảng báo cáo là bản đồ, em học sinh là lãnh thổ.",
"A grade average does not capture everything about a student's ability; the report card is the map, the student is the territory.",
['Alfred Korzybski, Science and Sanity (1933)','Shane Parrish, The Great Mental Models, Volume 1 (2019)']);
/* ---- socratic ---- */
I('clarify','socratic',1,6,'Clarify the Claim','Làm rõ luận điểm',
"Hãy chọn một điều bạn hay nói hoặc nghe, như “thành công”, “tự do”, “công bằng”. Chính xác thì nó nghĩa là gì, và cho ví dụ cụ thể?",
"Pick a word you often say or hear, such as “success”, “freedom” or “fair”. What exactly does it mean, and what is a concrete example?",
"Phần lớn bất đồng bắt nguồn từ việc mỗi người hiểu một từ theo nghĩa khác nhau. Câu hỏi làm rõ như “bạn có thể nói cụ thể hơn không?” giúp tránh tranh luận ở hai tầng nghĩa khác nhau.",
"Many disagreements come from people using the same word with different meanings. Clarifying questions such as “can you be more specific?” help avoid arguing at cross purposes.",
"Chọn một khái niệm trừu tượng|Viết định nghĩa bằng lời của bạn|Đưa một ví dụ và một phản ví dụ|Hỏi lại: định nghĩa này có khớp với cách người khác dùng không?",
"Choose an abstract concept|Write a definition in your own words|Give an example and a counterexample|Ask whether this definition matches how others use it",
"Hai người tranh luận “giàu có” mà một người nghĩ là tiền, người kia nghĩ là thời gian. Làm rõ trước sẽ tiết kiệm nhiều tranh cãi.",
"Two people debate “being rich”, one thinking money, the other time. Clarifying first saves much argument.",
['Richard Paul and Linda Elder, The Thinker\'s Guide to the Art of Socratic Questioning (2006)','Plato, Euthyphro and Meno']);
I('assume','socratic',2,8,'Probe the Assumptions','Soi các giả định',
"Điều gì bạn đang mặc nhiên cho là đúng trong kế hoạch hay quan điểm hiện tại? Nếu nó sai thì chuyện gì xảy ra?",
"What are you taking for granted in your current plan or opinion? If it were false, what would happen?",
"Giả định là những điều ta tin mà không nói ra. Phơi chúng ra ánh sáng giúp ta thấy điểm yếu của lập luận trước khi thực tế chỉ ra.",
"Assumptions are things we believe without stating them. Bringing them into the open exposes weak points in our reasoning before reality does.",
"Viết kế hoạch hoặc quan điểm thành một câu|Liệt kê mọi điều “phải đúng” thì nó mới đúng|Đánh dấu giả định nào chưa kiểm chứng|Chọn cách kiểm chứng giả định rủi ro nhất",
"Write your plan or view in one sentence|List everything that “must be true” for it to hold|Mark which assumptions are unverified|Pick a way to test the riskiest one",
"Kế hoạch mở quán giả định khách sẽ đông vào giờ trưa. Hãy đứng quan sát hai tuần trước khi thuê mặt bằng.",
"A café plan assumes lunchtime crowds. Observe the spot for two weeks before signing a lease.",
['Richard Paul and Linda Elder, The Thinker\'s Guide to the Art of Socratic Questioning (2006)','Chris Argyris, “Double-Loop Learning in Organizations”, Harvard Business Review (1977)']);
I('evq','socratic',1,6,'Ask for Evidence','Hỏi bằng chứng',
"Với một điều bạn mới đọc hoặc nghe, bằng chứng là gì, từ đâu, và có thể kiểm chứng bằng cách nào?",
"For something you just read or heard, what is the evidence, where does it come from, and how could it be checked?",
"Câu hỏi “bạn biết điều đó bằng cách nào?” chuyển cuộc trò chuyện từ ý kiến sang bằng chứng. Bằng chứng tốt thường kiểm chứng được, từ nguồn rõ ràng, và có thể được người khác lặp lại.",
"The question “how do you know that?” moves a conversation from opinion to evidence. Good evidence is usually checkable, from a clear source, and repeatable by others.",
"Tách ý kiến khỏi sự kiện|Tìm nguồn gốc của thông tin|Hỏi nguồn có lợi ích liên quan không|Tìm một nguồn độc lập thứ hai",
"Separate opinion from fact|Trace the information to its origin|Ask whether the source has an interest in the claim|Find a second independent source",
"Một bài đăng nói “nghiên cứu cho thấy”. Hãy tìm nghiên cứu đó: ai thực hiện, mẫu bao nhiêu người, ai tài trợ.",
"A post says “studies show”. Find the study: who ran it, how many participants, who funded it.",
['Richard Paul and Linda Elder, The Miniature Guide to Critical Thinking (2019)','Carl Sagan, The Demon-Haunted World (1995)']);
I('steel','socratic',3,12,'Steelmanning','Phiên bản mạnh nhất của đối phương',
"Hãy chọn một quan điểm bạn không đồng ý. Phiên bản mạnh nhất, công bằng nhất của nó, như người ủng hộ thông minh nhất sẽ nói, là gì?",
"Choose a view you disagree with. What is the strongest, fairest version of it, as its smartest supporter would put it?",
"Steelmanning ngược với người rơm: bạn xây dựng phiên bản mạnh nhất của quan điểm đối lập rồi mới phản biện. Daniel Dennett trình bày các quy tắc tương tự do Anatol Rapoport đề xuất. Mục đích là hiểu, không phải đồng ý.",
"Steelmanning is the opposite of a straw man: you build the strongest version of the opposing view before responding. Daniel Dennett describes similar rules attributed to Anatol Rapoport. The purpose is understanding, not agreement.",
"Diễn đạt lại quan điểm đối lập thật rõ ràng|Nêu những điểm bạn có thể đồng ý|Nêu điều bạn học được từ nó|Chỉ sau đó mới phản biện",
"Restate the opposing view clearly|List the points you can agree with|Say what you learned from it|Only then offer your rebuttal",
"Trước khi chê một xu hướng mới, hãy viết 3 lý do mà người yêu thích nó thấy hợp lý.",
"Before criticizing a new trend, write the 3 reasons its fans find it reasonable.",
['Daniel Dennett, Intuition Pumps and Other Tools for Thinking (2013)','Jonathan Haidt, The Righteous Mind (2012)']);
I('implic','socratic',2,8,'Trace the Implications','Lần theo hệ quả',
"Nếu niềm tin hoặc quyết định của bạn là đúng, còn điều gì khác cũng phải đúng? Bạn có chấp nhận những điều đó không?",
"If your belief or decision is true, what else must also be true? Are you willing to accept those things?",
"Câu hỏi hệ quả kiểm tra tính nhất quán của quan điểm. Nếu hệ quả hợp lý dẫn đến điều bạn không thể chấp nhận, quan điểm ban đầu có thể cần chỉnh lại.",
"Questions about implications test whether a view is consistent. If its reasonable consequences lead somewhere you cannot accept, the original view may need adjusting.",
"Phát biểu quan điểm thành nguyên tắc chung|Áp dụng nguyên tắc vào 2 tình huống khác|Kiểm tra kết quả có mâu thuẫn không|Tinh chỉnh nguyên tắc nếu cần",
"State your view as a general principle|Apply the principle to 2 other situations|Check whether the results contradict each other|Refine the principle if needed",
"Nếu “không bao giờ nói dối” là nguyên tắc tuyệt đối, bạn có nói thật với người đang tìm một người vô tội để làm hại không?",
"If “never lie” is an absolute rule, would you tell the truth to someone hunting an innocent person to harm them?",
['Richard Paul and Linda Elder, The Thinker\'s Guide to the Art of Socratic Questioning (2006)','Plato, Republic Book I']);

/* ---- thought experiments ---- */
I('theseus','thought',2,10,'Ship of Theseus','Con tàu của Theseus',
"Nếu thay dần từng bộ phận của một vật cho đến khi không còn mảnh nào ban đầu, nó còn là vật cũ không? Điều này nói gì về “bản thân bạn”, vốn thay đổi tế bào, ký ức và thói quen theo thời gian?",
"If you replace the parts of an object one by one until none of the original remains, is it still the same object? What does that say about “you”, whose cells, memories and habits change over time?",
"Plutarch kể về con tàu của Theseus được sửa dần từng tấm ván. Câu hỏi là điều gì làm nên sự đồng nhất theo thời gian: vật chất, hình dạng, chức năng hay lịch sử? Triết học dùng nó để bàn về danh tính của vật và của con người.",
"Plutarch tells of Theseus' ship, repaired plank by plank. The question is what makes something the same over time: its matter, form, function or history? Philosophy uses it to discuss the identity of objects and persons.",
"Nêu quan điểm ban đầu: có hay không?|Thử một tiêu chí khác (vật chất, hình dạng, chức năng, lịch sử)|Áp dụng tiêu chí cho chính bạn hoặc một tổ chức|Ghi lại tiêu chí bạn thấy hợp lý nhất và vì sao",
"State your first answer: same or not?|Try a different criterion (matter, form, function, history)|Apply the criterion to yourself or an organization|Write the criterion you find most convincing and why",
"Một công ty thay hết nhân sự và sản phẩm sau 20 năm vẫn dùng tên cũ. Điều gì khiến nó vẫn là “cùng một công ty”?",
"A company replaces all its staff and products over 20 years but keeps its name. What makes it “the same company”?",
['Plutarch, Life of Theseus','Derek Parfit, Reasons and Persons (1984)']);
I('cave','thought',2,10,'Plato\'s Cave','Hang động của Plato',
"Những “cái bóng” nào trong đời bạn, như tin tức, mạng xã hội hay thói quen, đang được bạn xem là toàn bộ thực tế?",
"Which “shadows” in your life, such as news, social media or habits, are you treating as the whole of reality?",
"Trong Cộng hòa (Quyển VII), Plato mô tả những tù nhân chỉ thấy bóng trên tường hang và tin đó là thực tại. Câu chuyện bàn về giáo dục, nhận thức và việc khó khăn khi rời khỏi niềm tin quen thuộc.",
"In the Republic (Book VII), Plato describes prisoners who only see shadows on a cave wall and believe them to be reality. The story concerns education, perception and how hard it is to leave familiar beliefs behind.",
"Nhận ra nguồn thông tin hằng ngày của bạn|Hỏi: ai chọn hiển thị nội dung này, và vì sao?|Tìm một góc nhìn hoặc nguồn ngoài “hang” quen thuộc|Ghi điều bạn thấy khác đi",
"Identify your daily sources of information|Ask: who chooses what is shown, and why?|Find a viewpoint or source outside your familiar “cave”|Note what looks different",
"Bảng tin mạng xã hội chỉ cho bạn thấy những gì thuật toán cho là bạn thích. Thử đọc có chủ đích một nguồn bạn ít khi đọc.",
"A social feed shows what an algorithm thinks you like. Try deliberately reading one source you rarely read.",
['Plato, Republic, Book VII','Eli Pariser, The Filter Bubble (2011)']);
I('veil','thought',3,12,'Veil of Ignorance','Bức màn vô minh',
"Nếu bạn phải thiết kế một quy tắc xã hội mà không biết mình sẽ sinh ra ở vị trí nào (giàu hay nghèo, khỏe hay yếu), bạn sẽ chọn quy tắc nào?",
"If you had to design a social rule without knowing which position you would be born into (rich or poor, healthy or ill), which rule would you choose?",
"John Rawls đề xuất người thiết kế các nguyên tắc công bằng nên đứng sau “bức màn vô minh”, không biết vị trí xã hội của mình. Ý tưởng này là một cách để kiểm tra tính công bằng và vẫn được tranh luận trong triết học chính trị.",
"John Rawls proposed that those designing principles of justice should stand behind a “veil of ignorance”, not knowing their social position. It is a way to test fairness and remains debated in political philosophy.",
"Chọn một quy tắc cần thiết kế (ví dụ chia công việc nhà)|Tự đặt mình vào MỌI vị trí có thể có|Hỏi quy tắc nào bạn chấp nhận ở vị trí tệ nhất|Điều chỉnh quy tắc theo kết quả",
"Pick a rule to design (for example, sharing chores)|Place yourself in EVERY possible position|Ask which rule you could accept in the worst position|Adjust the rule accordingly",
"Khi chia việc nhà, hãy hình dung bạn là người ít kiểm soát lịch trình nhất. Cách chia nào vẫn công bằng?",
"When dividing chores, imagine you are the person with the least control over their schedule. Which split still feels fair?",
['John Rawls, A Theory of Justice (1971)','Michael Sandel, Justice: What\'s the Right Thing to Do? (2009)']);
I('machine','thought',3,12,'Experience Machine','Cỗ máy trải nghiệm',
"Nếu có cỗ máy cho bạn cuộc sống toàn niềm vui nhưng chỉ là mô phỏng, bạn có bước vào không? Điều gì ngoài cảm giác dễ chịu khiến cuộc sống có ý nghĩa?",
"If a machine could give you a life of pure pleasure that is only a simulation, would you step in? What besides pleasant feelings makes a life worthwhile?",
"Robert Nozick đưa ra thí nghiệm này để thách thức chủ nghĩa khoái lạc, cho rằng chỉ cảm giác dễ chịu mới quan trọng. Nhiều người ngần ngại bước vào, gợi ý rằng ta còn coi trọng việc thật sự làm, thật sự kết nối và thật sự là ai đó. Cách diễn giải này vẫn được bàn luận.",
"Robert Nozick offered this experiment to challenge hedonism, the view that only pleasant feelings matter. Many people hesitate to plug in, suggesting we also value actually doing, actually connecting and actually being someone. How to interpret this is still discussed.",
"Viết câu trả lời trực giác: vào hay không?|Liệt kê những điều bạn sẽ mất nếu vào|Hỏi vì sao mỗi điều đó quan trọng với bạn|Nhận ra giá trị nào bạn muốn sống theo ngoài đời thực",
"Write your gut answer: plug in or not?|List what you would lose by plugging in|Ask why each of those matters to you|Notice which values you want to live by in real life",
"Bạn chọn công việc chỉ vì thoải mái, hay vì nó có ý nghĩa với bạn? Câu hỏi này giúp làm rõ điều đó.",
"Do you choose a job only for comfort, or because it matters to you? This question helps clarify that.",
['Robert Nozick, Anarchy, State, and Utopia (1974)','Robert Nozick, The Examined Life (1989)']);
I('trolley','thought',3,12,'The Trolley Problem','Bài toán xe điện',
"Vì sao nhiều người thấy việc chuyển hướng xe điện khác với việc đẩy một người xuống đường ray, dù kết quả số người sống là như nhau? Nguyên tắc nào đứng sau trực giác của bạn?",
"Why do many people feel that diverting a trolley differs from pushing a person onto the track, even if the number saved is the same? Which principle lies behind your intuition?",
"Philippa Foot nêu bài toán và Judith Jarvis Thomson phát triển các biến thể. Nó là công cụ để khám phá các cách lập luận đạo đức như vị lợi, nghĩa vụ và học thuyết hệ quả kép, không phải hướng dẫn hành động. Đây là tình huống hoàn toàn giả định.",
"Philippa Foot posed the problem and Judith Jarvis Thomson developed its variants. It is a tool for exploring moral reasoning such as utilitarianism, duty ethics and the doctrine of double effect, not guidance for action. It is a purely hypothetical scenario.",
"Ghi lại lựa chọn trực giác ở hai phiên bản|Tìm điểm khác nhau giữa hai phiên bản|Gắn trực giác với một nguyên tắc đạo đức|Kiểm tra nguyên tắc đó có nhất quán ở các tình huống khác không",
"Record your intuitive choice in both versions|Find what differs between them|Link your intuition to a moral principle|Test whether the principle is consistent in other cases",
"Dùng như bài tập phân tích: trong chính sách y tế, ta cũng cân nhắc giữa lợi ích chung và quyền của từng người.",
"Use it as an analytical exercise: health policy also weighs collective benefit against individual rights.",
['Philippa Foot, “The Problem of Abortion and the Doctrine of the Double Effect”, Oxford Review (1967)','Judith Jarvis Thomson, “The Trolley Problem”, Yale Law Journal (1985)']);
/* ---- decisions ---- */
I('premortem','decide',2,10,'Pre-mortem','Phân tích tử thi trước',
"Hãy tưởng tượng dự án hoặc kế hoạch của bạn đã thất bại hoàn toàn một năm sau. Điều gì đã xảy ra?",
"Imagine your project or plan has failed completely a year from now. What happened?",
"Gary Klein đề xuất pre-mortem: giả định kế hoạch đã thất bại, rồi nghĩ ngược về nguyên nhân. Cách này giúp nói ra mối lo mà ta thường e ngại nêu và cải thiện kế hoạch trước khi bắt đầu.",
"Gary Klein proposed the pre-mortem: assume the plan has failed, then work backwards to the causes. It helps surface worries people hesitate to voice and improves plans before they begin.",
"Viết: “Kế hoạch đã thất bại.”|Liệt kê mọi lý do khiến nó thất bại|Chọn 3 lý do có khả năng và hậu quả lớn nhất|Thêm một hành động phòng ngừa cho mỗi lý do",
"Write: “The plan has failed.”|List every reason it could have failed|Choose the 3 most likely and most damaging reasons|Add one preventive action for each",
"Trước khi mở lớp học trực tuyến, nghĩ ra các lý do thất bại như ít người đăng ký, trùng lịch, lỗi kỹ thuật, rồi chuẩn bị đối phó.",
"Before launching an online class, imagine reasons it failed: few sign-ups, schedule clashes, technical problems, then prepare for each.",
['Gary Klein, “Performing a Project Premortem”, Harvard Business Review (2007)','Daniel Kahneman, Thinking, Fast and Slow (2011)']);
I('resulting','decide',2,8,'Resulting','Đánh giá theo kết quả (resulting)',
"Quyết định gần đây nào bạn cho là tệ chỉ vì kết quả xấu, hoặc cho là tốt chỉ vì kết quả tốt? Quá trình ra quyết định thật sự thế nào?",
"Which recent decision did you call bad only because it turned out badly, or good only because it turned out well? How was the actual decision process?",
"Annie Duke gọi “resulting” là việc đánh giá chất lượng quyết định chỉ qua kết quả. May mắn và thông tin thiếu làm kết quả khác với chất lượng quyết định. Tốt hơn là đánh giá quá trình: thông tin, giả định, các phương án.",
"Annie Duke calls “resulting” judging the quality of a decision only by its outcome. Luck and missing information make outcomes differ from decision quality. It is better to evaluate the process: information, assumptions, alternatives.",
"Mô tả quyết định và thông tin bạn có lúc đó|Nêu các phương án bạn đã xét|Tách phần do kỹ năng và phần do may rủi|Ghi một bài học về quá trình, không chỉ kết quả",
"Describe the decision and the information you had then|List the alternatives you considered|Separate what was skill from what was luck|Record one lesson about process, not just outcome",
"Một lần đầu tư nhỏ có lời không chứng minh bạn phân tích tốt; có thể do may mắn. Hãy xem lại quá trình.",
"A small investment that turned a profit does not prove good analysis; it may be luck. Review the process.",
['Annie Duke, Thinking in Bets (2018)','Howard Marks, The Most Important Thing (2011)']);
I('101010','decide',1,6,'10-10-10 Rule','Quy tắc 10-10-10',
"Quyết định này sẽ ảnh hưởng thế nào đến bạn sau 10 phút, 10 tháng và 10 năm?",
"How will this decision affect you in 10 minutes, 10 months and 10 years?",
"Suzy Welch đề xuất nhìn một quyết định ở ba khung thời gian để tách cảm xúc tức thời khỏi hệ quả dài hạn. Đây là heuristic đơn giản, hữu ích cho các lựa chọn hằng ngày.",
"Suzy Welch proposed viewing a decision across three time horizons to separate momentary emotion from long-term consequences. It is a simple heuristic useful for everyday choices.",
"Viết quyết định hoặc lựa chọn|Mô tả kết quả sau 10 phút, 10 tháng, 10 năm|Chú ý khung thời gian nào bạn đang bỏ qua|Chọn theo giá trị bạn quan tâm nhất",
"Write the decision or choice|Describe the result after 10 minutes, 10 months and 10 years|Notice which time frame you are ignoring|Choose by the values you care about most",
"Có nên gửi tin nhắn đang nóng giận? Sau 10 phút có thể nhẹ nhõm, sau 10 tháng bạn có thể hối tiếc.",
"Should you send an angry message? After 10 minutes it may feel good, after 10 months you may regret it.",
['Suzy Welch, 10-10-10: A Life-Transforming Idea (2009)','Chip Heath and Dan Heath, Decisive (2013)']);
I('doors','decide',2,8,'One-way and Two-way Doors','Cánh cửa một chiều và hai chiều',
"Quyết định này có thể đảo ngược dễ dàng (cửa hai chiều) hay khó quay lại (cửa một chiều)? Bạn đang dành thời gian suy nghĩ có tương xứng không?",
"Can this decision be reversed easily (a two-way door) or is it hard to undo (a one-way door)? Is the time you spend thinking proportional?",
"Jeff Bezos nêu ý tưởng này trong thư gửi cổ đông 2015: quyết định khó đảo ngược cần cân nhắc kỹ, còn quyết định dễ đảo ngược nên làm nhanh và học từ kết quả. Đây là heuristic từ bối cảnh doanh nghiệp.",
"Jeff Bezos described this idea in his 2015 shareholder letter: hard-to-reverse decisions deserve careful thought, while easily reversed ones should be made fast and learned from. It is a heuristic from a business context.",
"Hỏi: nếu sai, mình quay lại dễ hay khó?|Phân loại cửa một chiều hay hai chiều|Cửa hai chiều: thử nhanh, nhỏ, rồi điều chỉnh|Cửa một chiều: thu thập thêm thông tin, hỏi người có kinh nghiệm",
"Ask: if I am wrong, how easy is it to go back?|Classify it as a one-way or two-way door|Two-way: try it small and fast, then adjust|One-way: gather more information and consult experienced people",
"Thử một món ăn mới là cửa hai chiều. Ký hợp đồng thuê dài hạn gần như là cửa một chiều.",
"Trying a new dish is a two-way door. Signing a long lease is almost a one-way door.",
['Jeff Bezos, Letter to Amazon Shareholders (2015)','Chip Heath and Dan Heath, Decisive (2013)']);
I('ev','decide',3,10,'Expected Value Thinking','Tư duy giá trị kỳ vọng',
"Với một lựa chọn rủi ro, xác suất thành công và giá trị nếu thành công hoặc thất bại thật sự là bao nhiêu? Bạn đang chịu được rủi ro tối đa nào?",
"For a risky option, what are the real odds of success and the value if you succeed or fail? What is the most downside you can afford?",
"Giá trị kỳ vọng là tổng các kết quả nhân với xác suất. Nó giúp so sánh các lựa chọn không chắc chắn, nhưng cần kết hợp với khả năng chịu thiệt hại tối đa. Con người cũng thường không quyết định giống hệt công thức, như lý thuyết triển vọng mô tả.",
"Expected value is the sum of outcomes weighted by probability. It helps compare uncertain options but must be combined with how much loss you can bear. People also do not decide exactly like the formula, as prospect theory describes.",
"Liệt kê các kết quả có thể xảy ra|Ước lượng xác suất và giá trị mỗi kết quả|Nhân và cộng lại|Kiểm tra thiệt hại tối đa mình chịu được trước khi quyết định",
"List the possible outcomes|Estimate the probability and value of each|Multiply and add up|Check the maximum loss you can bear before deciding",
"Ví dụ minh họa: 20% cơ hội kiếm 100 và 80% cơ hội mất 10 có giá trị kỳ vọng 12. Con số ví dụ chỉ để học, không phải lời khuyên tài chính.",
"Illustration: a 20% chance to gain 100 and an 80% chance to lose 10 has an expected value of 12. These numbers are for learning, not financial advice.",
['Annie Duke, Thinking in Bets (2018)','Daniel Kahneman and Amos Tversky, “Prospect Theory”, Econometrica (1979)']);
/* ---- learning ---- */
I('feynman','learn',1,10,'Feynman Technique','Phương pháp Feynman',
"Bạn có giải thích được một khái niệm mới học bằng lời đơn giản cho một đứa trẻ mười tuổi không? Chỗ nào bạn bị vấp?",
"Can you explain something you just learned in plain words to a ten-year-old? Where do you stumble?",
"Phương pháp được gắn với nhà vật lý Richard Feynman: giải thích đơn giản để lộ ra chỗ mình chưa hiểu. Tên gọi là cách đặt phổ biến, không phải quy trình do Feynman tự công bố.",
"The method is associated with physicist Richard Feynman: explaining simply exposes where you do not yet understand. The name is a popular label, not a procedure Feynman himself published.",
"Chọn một khái niệm và viết tên ở đầu trang|Giải thích bằng lời đơn giản, không dùng thuật ngữ|Đánh dấu chỗ bị vấp, quay lại tài liệu|Đơn giản hóa và dùng ví dụ rồi nói lại",
"Choose a concept and write its name at the top|Explain it in simple words with no jargon|Mark where you stumble and return to the source|Simplify, add an analogy and say it again",
"Học xong khái niệm lạm phát, hãy thử kể cho người thân chưa từng học kinh tế nghe bằng chuyện giá bánh mì.",
"After learning about inflation, try telling a relative with no economics background using the price of bread.",
['Richard Feynman, Surely You\'re Joking, Mr. Feynman! (1985)','Scott Young, Ultralearning (2019)']);
I('retrieval','learn',1,8,'Retrieval Practice','Luyện truy xuất trí nhớ',
"Gấp sách lại và viết ra mọi điều bạn nhớ về chủ đề vừa học. Bạn nhớ được bao nhiêu?",
"Close the book and write down everything you remember about the topic you just studied. How much can you recall?",
"Nhớ lại thông tin từ trí nhớ (tự kiểm tra) giúp ghi nhớ lâu dài tốt hơn việc đọc lại. Cảm giác “quen quen” khi đọc lại dễ bị nhầm với việc đã hiểu.",
"Recalling information from memory (self-testing) tends to produce better long-term retention than rereading. The feeling of familiarity when rereading is easily mistaken for understanding.",
"Học một đoạn nội dung|Gấp tài liệu lại|Viết hoặc nói ra những gì nhớ được|Đối chiếu với tài liệu và ghi những chỗ thiếu",
"Study a section|Close the material|Write or say what you remember|Compare against the source and note the gaps",
"Thay vì đọc lại ghi chú, hãy tự đặt 5 câu hỏi về bài học rồi trả lời không nhìn tài liệu.",
"Instead of rereading notes, write 5 questions about the lesson and answer them without looking.",
['Peter Brown, Henry Roediger and Mark McDaniel, Make It Stick (2014)','Henry Roediger and Jeffrey Karpicke, “Test-Enhanced Learning”, Psychological Science (2006)']);
I('spaced','learn',1,6,'Spaced Repetition','Lặp lại ngắt quãng',
"Điều gì bạn muốn nhớ lâu? Bạn sẽ ôn lại nó vào những ngày nào để trí nhớ không phai?",
"What do you want to remember for the long term? On which days will you review it so it does not fade?",
"Ebbinghaus mô tả đường cong quên lãng, và các nghiên cứu sau này cho thấy ôn lại theo khoảng cách tăng dần thường hiệu quả hơn học dồn một lần. Khoảng cách tối ưu phụ thuộc vào thời gian bạn muốn nhớ.",
"Ebbinghaus described the forgetting curve, and later studies show that reviewing at increasing intervals is generally more effective than cramming. The optimal spacing depends on how long you want to remember.",
"Chọn nội dung cần nhớ|Lên lịch ôn: sau 1 ngày, 3 ngày, 1 tuần, 1 tháng|Mỗi lần ôn bằng cách tự kiểm tra|Kéo dài khoảng cách nếu nhớ tốt",
"Choose what to remember|Schedule reviews: after 1 day, 3 days, 1 week, 1 month|Review each time by self-testing|Lengthen the gap if recall is strong",
"Học 10 từ vựng mới hôm nay, ôn lại ngày mai, 3 ngày sau và 1 tuần sau thay vì học cả trong một buổi.",
"Learn 10 new words today, review tomorrow, in 3 days and in a week rather than all in one sitting.",
['Hermann Ebbinghaus, Über das Gedächtnis (1885)','Nicholas Cepeda et al., “Distributed Practice in Verbal Recall Tasks”, Psychological Bulletin (2006)']);
I('deliberate','learn',3,12,'Deliberate Practice','Luyện tập có chủ đích',
"Kỹ năng nào bạn muốn giỏi hơn, và phần cụ thể nhất bạn còn yếu mà bạn đang né tránh luyện là gì?",
"Which skill do you want to get better at, and what specific weak part are you avoiding practicing?",
"Anders Ericsson mô tả luyện tập có chủ đích: mục tiêu cụ thể, tập trung cao, phản hồi nhanh và luyện ở rìa năng lực. Quan điểm rằng chỉ luyện tập là đủ để đạt đỉnh cao vẫn có tranh luận, vì các yếu tố khác cũng đóng góp.",
"Anders Ericsson described deliberate practice: specific goals, full focus, immediate feedback and work at the edge of ability. The view that practice alone is enough for elite performance is still debated, since other factors also contribute.",
"Chọn một kỹ năng nhỏ và cụ thể|Đặt mục tiêu cho buổi luyện|Luyện tập trung, nhờ người hoặc công cụ phản hồi|Ghi lại điều cải thiện và điều cần tập tiếp",
"Choose one small, specific sub-skill|Set a goal for the session|Practice with full focus and get feedback from a person or tool|Record what improved and what to work on next",
"Thay vì “luyện nói tiếng Anh”, hãy tập riêng việc phát âm âm /θ/ trong 10 phút và ghi âm để nghe lại.",
"Instead of “practice English speaking”, drill the /θ/ sound for 10 minutes and record yourself to listen back.",
['Anders Ericsson and Robert Pool, Peak (2016)','Brooke Macnamara et al., “Deliberate Practice and Performance in Music, Games, Sports, Education, and Professions: A Meta-Analysis”, Psychological Science (2014)']);
I('growth','learn',2,8,'Growth Mindset','Tư duy phát triển',
"Lần gần nhất bạn nói “mình không giỏi cái này”, bạn có thể thêm chữ “chưa” không? Bạn sẽ làm gì khác đi?",
"The last time you said “I am not good at this”, could you add the word “yet”? What would you do differently?",
"Carol Dweck mô tả tư duy phát triển là niềm tin rằng năng lực có thể phát triển qua nỗ lực và chiến lược. Các nghiên cứu về hiệu quả của việc dạy tư duy này cho kết quả khác nhau, và hiệu ứng thường nhỏ đến trung bình.",
"Carol Dweck describes a growth mindset as the belief that abilities can develop through effort and strategy. Studies of teaching it show mixed results, with effects often small to moderate.",
"Nhận ra câu nói tiêu cực về bản thân|Viết lại thành “mình chưa làm được, mình sẽ thử cách…”|Chọn một chiến lược mới|Ghi nhận tiến bộ nhỏ",
"Notice a negative self-statement|Rewrite it as “I cannot do this yet, I will try…”|Pick a new strategy|Acknowledge small progress",
"Sau một bài kiểm tra tệ, thay vì “mình dở môn này”, hãy xem lỗi nào lặp lại và đổi cách ôn.",
"After a poor test, instead of “I am bad at this subject”, look at which mistakes repeat and change how you revise.",
['Carol Dweck, Mindset (2006)','David Yeager et al., “A national experiment reveals where a growth mindset improves achievement”, Nature (2019)']);
/* ---- evidence ---- */
I('corr','evidence',1,8,'Correlation vs Causation','Tương quan và nhân quả',
"Hai điều thường đi cùng nhau trong đời bạn, bạn đã bao giờ thử hỏi điều gì thứ ba có thể gây ra cả hai chưa?",
"Think of two things that often go together in your life. Have you asked what third thing could cause both?",
"Hai biến đổi cùng nhau chưa chắc cái này gây ra cái kia: có thể do yếu tố thứ ba, do ngẫu nhiên hoặc nhân quả ngược chiều. Để kết luận nhân quả cần thiết kế thí nghiệm hoặc phương pháp phù hợp.",
"Two things moving together does not mean one causes the other: there may be a third factor, coincidence or reverse causation. Concluding causation requires suitable experimental or analytic design.",
"Nêu mối liên hệ bạn thấy|Thử đảo chiều: B có thể gây ra A không?|Tìm yếu tố thứ ba cho cả hai|Hỏi có thí nghiệm hay bằng chứng nào kiểm tra được không",
"State the association you see|Reverse it: could B cause A?|Look for a third factor behind both|Ask what experiment or evidence could test it",
"Người uống cà phê có thể sống lâu hơn, nhưng lối sống và thu nhập cũng có thể là yếu tố chung. Cần nghiên cứu cẩn thận mới kết luận.",
"Coffee drinkers may live longer, but lifestyle and income could be common factors. Careful study is needed before concluding.",
['Judea Pearl and Dana Mackenzie, The Book of Why (2018)','Jordan Ellenberg, How Not to Be Wrong (2014)']);
I('base','evidence',3,10,'Base Rate Neglect','Bỏ qua tỷ lệ nền',
"Khi nghe một tin “chắc chắn”, bạn có tự hỏi trong 10.000 trường hợp tương tự, thật sự có bao nhiêu trường hợp là như vậy không?",
"When you hear a “sure” claim, do you ask: out of 10,000 similar cases, how many are really like that?",
"Ta thường bỏ qua tần suất nền của một sự kiện khi gặp thông tin cụ thể. Một xét nghiệm 99% chính xác cho một bệnh rất hiếm vẫn có thể cho nhiều kết quả dương tính giả. Cách dễ hiểu là dùng số tự nhiên thay vì phần trăm.",
"We often ignore an event's base rate when given specific information. A 99% accurate test for a very rare condition can still produce many false positives. Natural frequencies are easier to reason with than percentages.",
"Tìm tỷ lệ nền (có bao nhiêu trong 10.000?)|Áp dụng độ chính xác của phép kiểm tra lên số đó|Đếm kết quả đúng và sai|Tính tỷ lệ dương tính thật trong các kết quả dương",
"Find the base rate (how many in 10,000?)|Apply the test's accuracy to that population|Count the true and false results|Work out what share of positives are real",
"Ví dụ minh họa: bệnh gặp 1/10.000, xét nghiệm đúng 99%. Trong 10.000 người có khoảng 1 ca thật và khoảng 100 dương tính giả, nên dương tính chỉ nghĩa là khả năng rất thấp, vẫn cần chuyên gia đánh giá.",
"Illustration: a condition affects 1 in 10,000 and the test is 99% accurate. Among 10,000 people about 1 is truly ill and about 100 are false positives, so a positive result still means low odds, and an expert should interpret it.",
['Daniel Kahneman and Amos Tversky, “On the Psychology of Prediction”, Psychological Review (1973)','Gerd Gigerenzer, Calculated Risks (2002)']);
I('survivor','evidence',2,8,'Survivorship Bias','Thiên kiến người sống sót',
"Khi bạn học từ những người thành công, bạn có biết bao nhiêu người làm giống họ mà thất bại và không ai kể không?",
"When you learn from successful people, do you know how many did the same things and failed without anyone telling their story?",
"Chỉ nhìn những người hay vật “sống sót” qua một sàng lọc khiến ta rút ra kết luận sai. Ví dụ kinh điển là Abraham Wald trong Thế chiến II: ông đề xuất gia cố những chỗ không thấy lỗ đạn trên máy bay trở về, vì máy bay trúng đạn ở đó không trở về được.",
"Looking only at people or things that “survived” a filter leads to wrong conclusions. The classic example is Abraham Wald in WWII: he advised reinforcing the places with no bullet holes on returning planes, because planes hit there did not make it back.",
"Hỏi: ai hoặc cái gì đã bị loại khỏi mẫu?|Tìm dữ liệu về những trường hợp thất bại|So sánh người thành công và thất bại làm cùng việc|Rút kết luận thận trọng hơn",
"Ask: who or what was filtered out of the sample?|Look for data on the failures|Compare successes and failures who did the same thing|Draw more cautious conclusions",
"“Nhiều tỷ phú bỏ học đại học” bỏ qua rất nhiều người bỏ học và không thành tỷ phú.",
"“Many billionaires dropped out of college” ignores the many who dropped out and did not become billionaires.",
['Jordan Ellenberg, How Not to Be Wrong (2014)','Abraham Wald, “A Method of Estimating Plane Vulnerability Based on Damage of Survivors” (1943)']);
I('forecast','evidence',3,12,'Calibrated Forecasting','Dự đoán có hiệu chỉnh',
"Hãy đưa ra một dự đoán về tuần tới kèm xác suất, ví dụ “70% trời mưa”. Khi 10 lần bạn nói 70%, có khoảng 7 lần đúng không?",
"Make a prediction about next week with a probability, such as “70% it will rain”. Of ten times you say 70%, are about seven right?",
"Philip Tetlock và Dan Gardner nghiên cứu những người dự đoán giỏi (superforecasters) và thấy họ dùng xác suất cụ thể, cập nhật khi có thông tin mới và theo dõi độ chính xác của mình. Hiệu chỉnh nghĩa là mức tự tin khớp với tần suất đúng.",
"Philip Tetlock and Dan Gardner studied skilled forecasters (superforecasters) and found they use specific probabilities, update with new information and track their accuracy. Calibration means confidence matches how often you are right.",
"Viết dự đoán rõ ràng với ngày kiểm tra|Gán xác suất cụ thể|Cập nhật khi có thông tin mới|Ghi kết quả và xem độ hiệu chỉnh theo thời gian",
"Write a clear prediction with a resolution date|Assign a specific probability|Update when new information appears|Record outcomes and review your calibration over time",
"Dự đoán “có ít nhất 3 bạn đến buổi họp mặt, 80%” rồi ghi kết quả. Sau 20 dự đoán bạn sẽ thấy mình tự tin quá mức hay chưa đủ.",
"Predict “at least 3 friends will come, 80%” and record the result. After 20 predictions you will see whether you are over- or under-confident.",
['Philip Tetlock and Dan Gardner, Superforecasting (2015)','Nate Silver, The Signal and the Noise (2012)']);
I('factful','evidence',2,8,'Factfulness Check','Kiểm tra bản năng khoảng cách',
"Bạn có xu hướng nghĩ thế giới chia làm hai nhóm “chúng ta” và “họ”, hay “tốt” và “xấu”? Số liệu cho thấy điều gì ở giữa?",
"Do you tend to think the world splits into “us” and “them”, or “good” and “bad”? What do the numbers show in between?",
"Hans Rosling mô tả “bản năng khoảng cách”: xu hướng chia thế giới thành hai nhóm đối lập dù phần lớn con người sống ở giữa. Ông khuyến khích kiểm tra số liệu và chú ý xu hướng thay vì chỉ ảnh chụp một thời điểm.",
"Hans Rosling described the “gap instinct”: the urge to divide the world into two opposed groups although most people live in the middle. He encouraged checking data and watching trends rather than a single snapshot.",
"Nêu hai nhóm bạn đang so sánh|Tìm số liệu phân bố thật giữa hai nhóm|Xem xu hướng theo thời gian|Điều chỉnh nhận định",
"Name the two groups you are comparing|Find the real distribution between them|Look at the trend over time|Adjust your view",
"Thay vì “nước giàu và nước nghèo”, hãy xem thu nhập thực của phần lớn các nước nằm ở nhiều mức khác nhau.",
"Instead of “rich and poor countries”, look at how most countries sit across many income levels.",
['Hans Rosling, Anna Rosling Rönnlund and Ola Rosling, Factfulness (2018)','Gapminder Foundation, gapminder.org']);

var CH=[];
function C(qV,oV,qE,oE,a,xV,xE){CH.push({vi:{q:qV,o:oV,x:xV},en:{q:qE,o:oE,x:xE},a:a});}
C("“Anh ấy từng bị phạt vi phạm giao thông, nên đề xuất của anh ấy về an toàn đường bộ chắc chắn sai.” Đây là gì?",["Công kích cá nhân","Người rơm","Lưỡng nan giả","Dốc trượt"],
"“He was once fined for a traffic offence, so his road-safety proposal must be wrong.” What is this?",["Ad hominem","Straw man","False dilemma","Slippery slope"],0,
"Lập luận bác bỏ đề xuất vì lý lịch của người nói, không vì nội dung đề xuất. Đây là công kích cá nhân.","The argument rejects the proposal because of the speaker's record, not its content. This is ad hominem.");
C("“Nếu cho phép nghỉ muộn 5 phút, rồi sẽ nghỉ muộn cả giờ, rồi công ty sụp đổ.” Đây là gì?",["Viện dẫn thẩm quyền","Dốc trượt","Thiên kiến xác nhận","Hiệu ứng mỏ neo"],
"“If we allow a 5-minute late start, soon it will be an hour, then the company collapses.” What is this?",["Appeal to authority","Slippery slope","Confirmation bias","Anchoring"],1,
"Chuỗi hệ quả cực đoan được khẳng định mà không chứng minh từng mắt xích: dốc trượt.","An extreme chain of consequences is asserted without supporting each link: a slippery slope.");
C("“Hoặc bạn ủng hộ tôi hoàn toàn, hoặc bạn chống lại tôi.” Đây là gì?",["Người rơm","Chi phí chìm","Lưỡng nan giả","Phỏng đoán sẵn có"],
"“Either you support me completely or you are against me.” What is this?",["Straw man","Sunk cost","False dilemma","Availability heuristic"],2,
"Chỉ đưa ra hai lựa chọn trong khi còn nhiều vị trí khác: lưỡng nan giả.","Only two options are offered when many other positions exist: a false dilemma.");
C("A: “Nên giảm giờ làm thêm.” B: “Vậy là bạn muốn công ty không ai làm gì cả!” B đã mắc lỗi nào?",["Người rơm","Công kích cá nhân","Dunning-Kruger","Thiên kiến người sống sót"],
"A: “We should reduce overtime.” B: “So you want nobody at the company to do anything!” Which error did B make?",["Straw man","Ad hominem","Dunning-Kruger","Survivorship bias"],0,
"B bóp méo đề xuất giảm thành bỏ hoàn toàn rồi bác bỏ bản bóp méo: người rơm.","B distorts “reduce” into “abolish” and then attacks the distorted version: a straw man.");
C("Bạn đã trả tiền vé phim, thấy phim dở nhưng vẫn ngồi đến hết vì “đã trả tiền rồi”. Đây là gì?",["Hiệu ứng mỏ neo","Chi phí chìm","Tỷ lệ nền","Dốc trượt"],
"You paid for a movie ticket, find the film dull, yet stay because “I already paid”. What is this?",["Anchoring","Sunk cost","Base rate","Slippery slope"],1,
"Tiền vé đã mất dù bạn ở lại hay đi. Quyết định nên dựa vào thời gian còn lại: đây là chi phí chìm.","The ticket money is gone either way. The decision should rest on how to use the remaining time: sunk cost.");
C("Sau khi xem nhiều tin tai nạn máy bay, bạn thấy đi máy bay nguy hiểm hơn đi xe máy. Đây là gì?",["Phỏng đoán sẵn có","Lưỡng nan giả","Người rơm","Viện dẫn thẩm quyền"],
"After seeing many plane-crash reports you feel flying is more dangerous than driving. What is this?",["Availability heuristic","False dilemma","Straw man","Appeal to authority"],0,
"Ví dụ dễ nhớ ra làm bạn đánh giá quá cao khả năng xảy ra: phỏng đoán sẵn có.","Vivid, easily recalled examples inflate your sense of likelihood: the availability heuristic.");
C("Giá niêm yết 10 triệu, giảm còn 6 triệu khiến bạn thấy rất rẻ, dù giá trị thật chỉ khoảng 4 triệu. Đây là gì?",["Hiệu ứng mỏ neo","Thiên kiến xác nhận","Công kích cá nhân","Dốc trượt"],
"The list price is 10 million, now 6 million, so it feels very cheap, even though its real value is about 4 million. What is this?",["Anchoring","Confirmation bias","Ad hominem","Slippery slope"],0,
"Con số đầu tiên (10 triệu) làm mỏ neo kéo phán đoán của bạn về giá.","The first number (10 million) acts as an anchor pulling your judgment of the price.");
C("Bạn chỉ đọc những bài báo đồng tình với quan điểm sẵn có của mình. Đây là gì?",["Thiên kiến xác nhận","Chi phí chìm","Lưỡng nan giả","Hiệu ứng mỏ neo"],
"You only read articles that agree with your existing opinion. What is this?",["Confirmation bias","Sunk cost","False dilemma","Anchoring"],0,
"Chỉ tìm thông tin củng cố điều đã tin là thiên kiến xác nhận.","Seeking only information that reinforces what you already believe is confirmation bias.");
C("“Các CEO thành công đều dậy lúc 5 giờ sáng, nên dậy sớm tạo ra thành công.” Lỗi nào có khả năng nhất?",["Thiên kiến người sống sót và nhầm tương quan với nhân quả","Người rơm","Công kích cá nhân","Dốc trượt"],
"“Successful CEOs all wake at 5 a.m., so waking early creates success.” Which error is most likely?",["Survivorship bias and confusing correlation with causation","Straw man","Ad hominem","Slippery slope"],0,
"Ta chỉ nhìn người thành công, bỏ qua người dậy sớm mà không thành công, và không chứng minh nhân quả.","We only look at the successful, ignore early risers who did not succeed, and do not show causation.");
C("Một bệnh gặp 1 trên 10.000 người, xét nghiệm đúng 99%. Bạn dương tính nên tin chắc mình bị bệnh. Lỗi nào?",["Bỏ qua tỷ lệ nền","Người rơm","Dốc trượt","Công kích cá nhân"],
"A condition affects 1 in 10,000 people and the test is 99% accurate. You test positive and are sure you have it. Which error?",["Base rate neglect","Straw man","Slippery slope","Ad hominem"],0,
"Bỏ qua việc bệnh rất hiếm nên dương tính giả nhiều. Câu hỏi y tế thật cần bác sĩ đánh giá.","Ignores that the condition is rare, so false positives are many. Real medical questions need a doctor's assessment.");

var TERMS={
vi:{title:'Tuyên bố miễn trừ trách nhiệm và Điều khoản sử dụng',upd:'Cập nhật lần cuối: 15/11/2026. Phiên bản 1.0.',
intro:'Vui lòng đọc kỹ. Trang “Hôm nay nghĩ gì” (“Trang”) là một sản phẩm giải trí và học hỏi cá nhân của Alessandra Tran (“Chúng tôi”). Khi sử dụng Trang, bạn xác nhận đã đọc, hiểu và đồng ý với các điều khoản dưới đây.',
s:[
['1. Chỉ nhằm mục đích giải trí và tham khảo','Toàn bộ nội dung trên Trang, gồm câu hỏi, giải thích, ví dụ, bước suy nghĩ, trò chơi, bộ ngẫu nhiên và bộ hẹn giờ, chỉ nhằm mục đích giải trí, gợi mở và tự học. Trang không phải là khóa học, tài liệu giảng dạy chính thức, công trình nghiên cứu hay nguồn tham khảo học thuật.'],
['2. Không phải tư vấn chuyên môn','Nội dung không phải là và không thay thế tư vấn tâm lý, trị liệu, y tế, pháp lý, tài chính, đầu tư, giáo dục, nghề nghiệp hay bất kỳ tư vấn chuyên môn nào. Các ví dụ số liệu chỉ mang tính minh họa. Đừng đưa ra quyết định quan trọng chỉ dựa trên Trang; hãy hỏi chuyên gia có chứng chỉ phù hợp.'],
['3. Không cổ xúy tư tưởng, niềm tin hay quan điểm nào','Trang không cổ xúy, ủng hộ hay phản đối bất kỳ tư tưởng, tôn giáo, niềm tin, chính trị, triết lý, đảng phái, tổ chức hay cách sống nào. Các thí nghiệm tư duy, câu hỏi và quan điểm được nêu chỉ là công cụ để suy ngẫm và tranh luận lành mạnh. Việc một quan điểm xuất hiện trên Trang không có nghĩa Chúng tôi đồng ý với nó. Mọi cách hiểu và vận dụng là trách nhiệm của bạn.'],
['4. Độ chính xác của nội dung','Nội dung được tổng hợp và diễn giải rút gọn từ các sách, bài báo và tài liệu công khai, có thể thiếu sót, giản lược, lỗi thời hoặc sai. Nhiều chủ đề, như thiên kiến nhận thức hay tư duy phát triển, vẫn còn tranh luận khoa học hoặc khó lặp lại kết quả. Chúng tôi không đảm bảo nội dung đầy đủ, chính xác, cập nhật hay phù hợp cho mục đích cụ thể của bạn.'],
['5. Sách và nguồn tham khảo','Danh mục sách và bài viết chỉ để bạn đọc thêm. Việc nhắc đến một tác giả, tác phẩm hay tổ chức không có nghĩa là có quan hệ hợp tác, tài trợ hay được họ chứng thực. Tên sách, nhãn hiệu và tác quyền thuộc về chủ sở hữu. Chúng tôi diễn giải ý tưởng bằng lời của mình và không sao chép nguyên văn nội dung có bản quyền. Năm xuất bản, tên tác phẩm và chi tiết có thể khác theo ấn bản; hãy kiểm tra trực tiếp tại nguồn gốc.'],
['6. Chủ đề nhạy cảm','Một số thí nghiệm tư duy đề cập đến tình huống đạo đức khó, như hy sinh, cái chết hay bất công. Đó là tình huống giả định, không phải khuyến nghị hay hướng dẫn hành động ngoài đời thực. Nếu nội dung khiến bạn khó chịu, hãy dừng lại.'],
['7. Không phải hỗ trợ sức khỏe tinh thần','Trang không cung cấp dịch vụ hỗ trợ sức khỏe tinh thần. Nếu bạn đang gặp khủng hoảng hoặc cảm thấy không an toàn, hãy liên hệ ngay dịch vụ khẩn cấp tại nơi bạn sống (ở Việt Nam: 115 hoặc 112), người thân hoặc chuyên gia sức khỏe tâm thần.'],
['8. Bộ ngẫu nhiên','Các trò chơi như vòng quay, đua vịt, lật bài, tung xu, xúc xắc và máy xèng cho kết quả ngẫu nhiên. Kết quả không phải là dự đoán, lời khuyên, điềm báo hay hướng dẫn nào.'],
['9. Trách nhiệm của bạn','Bạn tự chịu trách nhiệm về cách bạn hiểu, áp dụng và chia sẻ nội dung của Trang, cũng như mọi quyết định và hệ quả phát sinh. Hãy dùng phán đoán riêng, kiểm chứng thông tin với nguồn gốc và tôn trọng người khác khi tranh luận.'],
['10. Độ tuổi','Trang dành cho người từ 16 tuổi trở lên. Người dưới 18 tuổi nên sử dụng với sự hướng dẫn của cha mẹ hoặc người giám hộ.'],
['11. Liên kết bên ngoài','Trang có thể chứa liên kết đến Google, Wikipedia hoặc trang web khác. Chúng tôi không kiểm soát và không chịu trách nhiệm về nội dung, chính sách, tính chính xác hay tính sẵn có của các trang này. Việc truy cập là rủi ro của bạn.'],
['12. Dữ liệu cá nhân và sổ suy nghĩ','Sổ suy nghĩ, ngôn ngữ và xác nhận của bạn được lưu trên trình duyệt của bạn (localStorage) và không được gửi đến máy chủ của Chúng tôi. Xóa dữ liệu trình duyệt sẽ làm mất các ghi chú này. Đừng nhập thông tin nhạy cảm, bí mật hoặc định danh cá nhân vào sổ. Trang có thể tải phông chữ từ Google Fonts, và nhà cung cấp đó có thể ghi nhận địa chỉ IP của bạn theo chính sách của họ.'],
['13. Không bảo đảm','Trang được cung cấp “như hiện có” và “khi sẵn có”, không kèm bất kỳ bảo đảm nào, rõ ràng hay ngụ ý, về tính chính xác, phù hợp cho mục đích cụ thể, không vi phạm quyền, hoạt động liên tục hoặc không có lỗi.'],
['14. Giới hạn trách nhiệm','Trong phạm vi tối đa pháp luật cho phép, Chúng tôi, cùng người quản lý, cộng tác viên và đối tác, không chịu trách nhiệm đối với bất kỳ thiệt hại trực tiếp, gián tiếp, ngẫu nhiên, đặc biệt hay hệ quả nào, gồm thiệt hại về tài chính, danh tiếng, tinh thần, quan hệ, cơ hội hay dữ liệu, phát sinh từ việc sử dụng hoặc không thể sử dụng Trang, hoặc từ việc tin cậy vào nội dung của Trang.'],
['15. Miễn trừ và bồi hoàn','Trong phạm vi pháp luật cho phép, bạn đồng ý miễn trừ và bồi hoàn cho Chúng tôi trước mọi khiếu nại, tổn thất và chi phí hợp lý phát sinh từ việc bạn sử dụng Trang trái với điều khoản này hoặc vi phạm quyền của bên thứ ba.'],
['16. Sở hữu trí tuệ','Cách trình bày, mã nguồn, giao diện và nội dung do Chúng tôi biên soạn thuộc quyền của Chúng tôi. Bạn được dùng cho mục đích cá nhân, phi thương mại. Không được sao chép, phân phối lại hoặc dùng cho mục đích thương mại nếu chưa có sự đồng ý bằng văn bản.'],
['17. Báo lỗi và liên hệ','Nếu bạn thấy nội dung sai, thiếu hoặc gây hiểu lầm, vui lòng liên hệ qua trang Liên hệ của alessandratran.com. Chúng tôi sẽ cố gắng xem xét và chỉnh sửa khi có thể, nhưng không cam kết thời hạn hay bắt buộc thực hiện.'],
['18. Luật áp dụng','Điều khoản này được điều chỉnh bởi pháp luật Việt Nam. Tranh chấp được giải quyết trước hết bằng thương lượng thiện chí; nếu không được, thuộc thẩm quyền của tòa án có thẩm quyền tại Thành phố Hồ Chí Minh, trừ khi pháp luật quy định khác. Không điều khoản nào loại trừ hoặc hạn chế những quyền mà pháp luật bảo vệ người tiêu dùng không cho phép loại trừ.'],
['19. Tính độc lập của các điều khoản','Nếu một điều khoản bị coi là vô hiệu hoặc không thể thi hành, các điều khoản còn lại vẫn có hiệu lực.'],
['20. Thay đổi','Chúng tôi có thể cập nhật Trang và các điều khoản bất cứ lúc nào. Việc tiếp tục sử dụng sau khi cập nhật nghĩa là bạn chấp nhận bản mới.']
],

function scoreEx(e){

  s+=e.lv<=lvl?1.5:-3*(e.lv-lvl);if(e.lv===lvl)s+=1;
  if(e.min<=max)s+=2;else s-=Math.min(6,(e.min-max));

var WC=[['#D4AF37','#16120A'],['#101014','#F4F4F6'],['#E9EAEE','#0a0a0d'],['#1B1B21','#F4F4F6'],['#F6E7A8','#16120A'],['#08080b','#F6E7A8']];
var wheel={items:[],theta:0,spinning:false},wcv=$('#wheel'),wx=wcv.getContext('2d');
function wl(x){return (x.length>15&&x.indexOf('(')>0)?x.split('(')[0].trim():x;}
function trunc(ctx,s,w){if(ctx.measureText(s).width<=w)return s;while(s.length>2&&ctx.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…';}
function drawWheel(){
  var n=wheel.items.length,W2=wcv.width,c=W2/2,R=c-6;wx.clearRect(0,0,W2,W2);if(!n)return;var a=2*Math.PI/n;
  wheel.items.forEach(function(m,i){var s=wheel.theta+i*a,col=WC[i%WC.length];
    wx.beginPath();wx.moveTo(c,c);wx.arc(c,c,R,s,s+a);wx.closePath();wx.fillStyle=col[0];wx.fill();wx.strokeStyle='rgba(0,0,0,.55)';wx.lineWidth=3;wx.stroke();
    wx.save();wx.translate(c,c);wx.rotate(s+a/2);wx.fillStyle=col[1];wx.textAlign='right';wx.textBaseline='middle';
    wx.font='700 30px "Be Vietnam Pro",system-ui,sans-serif';wx.fillText(trunc(wx,wl(m.n),R*.7),R-26,0);wx.restore();});
  var g=wx.createRadialGradient(c,c,4,c,c,70);g.addColorStop(0,'#F6E7A8');g.addColorStop(1,'#8F6B12');
  wx.beginPath();wx.arc(c,c,56,0,7);wx.fillStyle=g;wx.fill();wx.lineWidth=6;wx.strokeStyle='#0a0a0d';wx.stroke();
  wx.fillStyle='#16120A';wx.font='700 40px "Playfair Display",serif';wx.textAlign='center';wx.textBaseline='middle';wx.fillText('★',c,c+2);
}
function newWheel(){var p=pool();wheel.items=sample(p,Math.min(8,p.length));wheel.theta=rnd(628)/100;drawWheel();$('#res-wheel').innerHTML='';delete SHOWN.wheel;$('#spin').disabled=wheel.items.length<2;}
function spinWheel(){
  if(wheel.spinning||wheel.items.length<2)return;wheel.spinning=true;$('#spin').disabled=true;$('#spin').textContent=t('spinning');
  var n=wheel.items.length,a=2*Math.PI/n,win=rnd(n),target=1.5*Math.PI-(win+.5)*a+(rnd(100)/100-.5)*a*.7;
  var start=wheel.theta%(2*Math.PI),end=target-Math.floor(target/(2*Math.PI))*2*Math.PI+2*Math.PI*(5+rnd(3));if(end<start)end+=2*Math.PI;
  var dur2=reduce?1:4400,t0=performance.now();
  (function f(now){var k=Math.min(1,(now-t0)/dur2),e=1-Math.pow(1-k,3);wheel.theta=start+(end-start)*e;drawWheel();
    if(k<1)requestAnimationFrame(f);else{wheel.spinning=false;$('#spin').disabled=false;$('#spin').textContent=t('spin');showRes('wheel',wheel.items[win],'whyR','today');}})(t0);
}

    var ln=lanes[i],w=ln.clientWidth-46-12;ln.querySelector('.duck').style.transform='translateX('+(duck.pos[i]*w)+'px) scaleX(-1)';});return win;}
