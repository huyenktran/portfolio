["mys","And Then There Were None","Và rồi chẳng còn ai","Agatha Christie",1939,"Ten strangers are invited to an isolated island and begin to die one by one, following an old nursery rhyme. A masterclass in suspense and one of the best-selling mysteries ever.","Mười người xa lạ được mời đến một hòn đảo biệt lập và lần lượt thiệt mạng theo lời một bài đồng dao cũ. Bậc thầy của sự hồi hộp, thuộc hàng truyện trinh thám bán chạy nhất mọi thời đại."],

["his","The Diary of a Young Girl","Nhật ký Anne Frank","Anne Frank",1947,"The real diary of a Jewish teenager hiding from the Nazis in Amsterdam. Honest, vivid and deeply human.","Cuốn nhật ký có thật của một cô gái tuổi teen người Do Thái trốn tránh phát xít Đức ở Amsterdam. Chân thật, sống động và đầy tính người."],
["his","Steve Jobs",null,"Walter Isaacson",2011,"The authorized biography of Apple’s co-founder, based on dozens of interviews. A candid portrait of genius, perfectionism and a complicated personality.","Tiểu sử được ủy quyền của người đồng sáng lập Apple, dựa trên hàng chục cuộc phỏng vấn. Bức chân dung thẳng thắn về thiên tài, chủ nghĩa cầu toàn và một tính cách phức tạp."],
["his","Educated","Được học","Tara Westover",2018,"Tara grows up in a survivalist family in rural Idaho and first enters a classroom at seventeen. A memoir about the power of education and the cost of choosing your own path.","Tara lớn lên trong gia đình sống tự cung tự cấp ở vùng quê Idaho và lần đầu đặt chân vào lớp học năm 17 tuổi. Hồi ký về sức mạnh của giáo dục và cái giá của việc chọn con đường riêng."],
["his","Guns, Germs, and Steel","Súng, vi trùng và thép","Jared Diamond",1997,"Why did some societies come to dominate others? Diamond points to geography, farming and disease rather than innate differences. A big-picture look at human history.","Vì sao một số xã hội thống trị các xã hội khác? Diamond chỉ ra địa lý, nông nghiệp và dịch bệnh thay vì khác biệt bẩm sinh. Cái nhìn tổng quan về lịch sử loài người."],
["his","Long Walk to Freedom","Hành trình dài đến tự do","Nelson Mandela",1994,"Mandela’s autobiography, from a village childhood to 27 years in prison and the presidency of South Africa. A story of courage, patience and forgiveness.","Tự truyện của Mandela, từ tuổi thơ ở làng quê đến 27 năm tù và chức tổng thống Nam Phi. Câu chuyện về lòng dũng cảm, sự kiên nhẫn và sự tha thứ."],
["self","Atomic Habits","Atomic Habits: Thay đổi tí hon, hiệu quả bất ngờ","James Clear",2018,"A practical guide to building good habits and breaking bad ones through tiny daily improvements. Full of simple, science-backed strategies.","Cẩm nang thực tế để xây thói quen tốt và bỏ thói quen xấu qua những cải thiện nhỏ mỗi ngày. Đầy những chiến lược đơn giản, có cơ sở khoa học."],
["self","The 7 Habits of Highly Effective People","7 thói quen của người thành đạt","Stephen R. Covey",1989,"A classic framework of seven principles for personal and professional effectiveness. It focuses on character, responsibility and long-term thinking.","Khung nguyên tắc kinh điển gồm bảy thói quen giúp hiệu quả trong cá nhân và công việc. Tập trung vào phẩm chất, trách nhiệm và tư duy dài hạn."],
["self","How to Win Friends and Influence People","Đắc nhân tâm","Dale Carnegie",1936,"Timeless advice on communication, empathy and building genuine relationships. Short chapters packed with everyday examples.","Lời khuyên vượt thời gian về giao tiếp, đồng cảm và xây dựng các mối quan hệ chân thành. Các chương ngắn đầy ví dụ đời thường."],
["self","Man’s Search for Meaning","Đi tìm lẽ sống","Viktor E. Frankl",1946,"A psychiatrist reflects on surviving Nazi concentration camps and how finding purpose helps people endure suffering. A short, profound and deeply moving read.","Một bác sĩ tâm thần suy ngẫm về việc sống sót qua các trại tập trung của phát xít và cách tìm được mục đích giúp con người chịu đựng khổ đau. Ngắn gọn, sâu sắc và rất xúc động."],
["self","Deep Work",null,"Cal Newport",2016,"Argues that the ability to focus without distraction is becoming rare and valuable. Offers practical rules for training your attention.","Lập luận rằng khả năng tập trung không bị xao nhãng ngày càng hiếm và quý. Đưa ra những quy tắc thực tế để rèn sự tập trung."],
["self","The Power of Now","Sức mạnh của hiện tại","Eckhart Tolle",1997,"A spiritual guide to quieting the mind and living in the present moment. Gentle, reflective and easy to dip into.","Cẩm nang tinh thần giúp làm dịu tâm trí và sống trong khoảnh khắc hiện tại. Nhẹ nhàng, nhiều suy ngẫm và dễ đọc từng đoạn."],
["biz","Rich Dad Poor Dad","Cha giàu cha nghèo","Robert T. Kiyosaki",1997,"Contrasts the money lessons of the author’s two father figures. A popular, easy introduction to financial mindset, assets and investing.","Đối chiếu bài học về tiền bạc của hai người cha trong đời tác giả. Cuốn nhập môn dễ đọc, phổ biến về tư duy tài chính, tài sản và đầu tư."],
["biz","Thinking, Fast and Slow","Tư duy nhanh và chậm","Daniel Kahneman",2011,"A Nobel laureate explains the two systems of thought that drive our decisions and why we often misjudge. Rich with experiments and everyday examples.","Một người đoạt giải Nobel giải thích hai hệ thống tư duy chi phối quyết định của ta và vì sao ta hay đánh giá sai. Giàu thí nghiệm và ví dụ đời thường."],
["biz","The Lean Startup","Khởi nghiệp tinh gọn","Eric Ries",2011,"Introduces a method for building new products through quick experiments and customer feedback. Popular with founders and product teams.","Giới thiệu phương pháp xây dựng sản phẩm mới qua các thử nghiệm nhanh và phản hồi của khách hàng. Được giới sáng lập và đội sản phẩm ưa chuộng."],
["biz","Zero to One","Từ 0 đến 1","Peter Thiel & Blake Masters",2014,"Notes on startups and building something truly new rather than copying what already works. Provocative and full of strong opinions.","Những ghi chép về khởi nghiệp và việc tạo ra điều thật sự mới thay vì sao chép cái đã có. Gợi nhiều tranh luận và đầy quan điểm mạnh."],
["biz","The Intelligent Investor","Nhà đầu tư thông minh","Benjamin Graham",1949,"The foundational book on value investing, with lessons on risk, patience and the temperament of a sensible investor. A classic that still shapes how people think about the market.","Cuốn nền tảng về đầu tư giá trị, với bài học về rủi ro, sự kiên nhẫn và bản lĩnh của một nhà đầu tư sáng suốt. Tác phẩm kinh điển vẫn ảnh hưởng đến cách nhìn thị trường."],
["biz","Good to Great","Từ tốt đến vĩ đại","Jim Collins",2001,"Researches why some companies make a lasting leap from good to great while others do not. Packed with case studies and management ideas.","Nghiên cứu vì sao một số công ty bứt phá bền vững từ tốt lên vĩ đại còn số khác thì không. Nhiều ca nghiên cứu và ý tưởng quản trị."],
["sci","A Brief History of Time","Lược sử thời gian","Stephen Hawking",1988,"A famous physicist explains black holes, the Big Bang and the nature of time for general readers. Short, ambitious and mind-stretching.","Nhà vật lý nổi tiếng giải thích hố đen, Vụ nổ lớn và bản chất của thời gian cho bạn đọc phổ thông. Ngắn gọn, đầy tham vọng và mở rộng tầm nhìn."],
["sci","Cosmos",null,"Carl Sagan",1980,"A poetic tour of the universe, from ancient astronomy to the search for life beyond Earth. Inspired a generation of space lovers.","Chuyến du hành đầy chất thơ khắp vũ trụ, từ thiên văn cổ đại đến việc tìm kiếm sự sống ngoài Trái Đất. Truyền cảm hứng cho cả một thế hệ yêu vũ trụ."],
["sci","The Selfish Gene","Gen vị kỷ","Richard Dawkins",1976,"Presents evolution from the gene’s point of view and introduced the word “meme”. A bold, influential book on how life evolves.","Trình bày tiến hóa từ góc nhìn của gen và giới thiệu khái niệm “meme”. Cuốn sách táo bạo, có ảnh hưởng lớn về cách sự sống tiến hóa."],
["sci","The Gene: An Intimate History",null,"Siddhartha Mukherjee",2016,"Traces the history of genetics, from Mendel’s peas to modern gene editing, woven with the author’s own family story. Clear, human and thought-provoking.","Lần theo lịch sử di truyền học, từ những hạt đậu của Mendel đến chỉnh sửa gen hiện đại, đan xen câu chuyện gia đình tác giả. Rõ ràng, giàu tính người và nhiều suy ngẫm."],
["sci","Astrophysics for People in a Hurry","Vật lý thiên văn cho người vội vã","Neil deGrasse Tyson",2017,"A quick, witty tour of the biggest ideas about the universe, from the Big Bang to dark matter. Perfect for a busy reader.","Chuyến lướt nhanh, dí dỏm qua những ý tưởng lớn về vũ trụ, từ Vụ nổ lớn đến vật chất tối. Rất hợp với người đọc bận rộn."],
["sci","Life 3.0",null,"Max Tegmark",2017,"Explores how artificial intelligence could reshape work, society and even what it means to be human. Balances big possibilities with serious questions.","Khám phá việc trí tuệ nhân tạo có thể thay đổi công việc, xã hội và cả ý nghĩa của làm người. Cân bằng giữa những khả năng lớn lao và các câu hỏi nghiêm túc."],
["kid","The Little Prince","Hoàng tử bé","Antoine de Saint-Exupéry",1943,"A pilot stranded in the desert meets a small prince who has traveled from planet to planet. A gentle fable about friendship, love and seeing with the heart.","Một phi công rơi giữa sa mạc gặp chú hoàng tử bé đã du hành từ hành tinh này sang hành tinh khác. Truyện ngụ ngôn dịu dàng về tình bạn, tình yêu và việc nhìn bằng trái tim."],
["kid","Charlotte’s Web",null,"E. B. White",1952,"A clever spider named Charlotte saves her friend Wilbur the pig with words woven into her web. A warm farm tale about friendship and loss.","Chú nhện thông minh Charlotte cứu người bạn heo Wilbur bằng những dòng chữ dệt trên mạng nhện. Truyện nông trại ấm áp về tình bạn và mất mát."],
["kid","The Hunger Games","Đấu trường sinh tử","Suzanne Collins",2008,"In a dystopian nation, 16-year-old Katniss volunteers to take her sister’s place in a televised fight to the death. Fast, gripping and thought-provoking.","Ở một quốc gia phản địa đàng, Katniss 16 tuổi tình nguyện thế chỗ em gái trong cuộc chiến sinh tử được truyền hình. Nhanh, hấp dẫn và nhiều điều để suy nghĩ."],
["kid","Matilda",null,"Roald Dahl",1988,"Brilliant little Matilda loves books and discovers a special power, which she uses against her awful parents and the terrifying headmistress. Funny, clever and full of heart.","Cô bé Matilda thông minh mê sách và phát hiện mình có một năng lực đặc biệt, dùng để đối phó với bố mẹ tệ bạc và bà hiệu trưởng đáng sợ. Hài hước, thông minh và đầy tình cảm."],
["kid","The Fault in Our Stars","Khi lỗi thuộc về những vì sao","John Green",2012,"Two teenagers, Hazel and Gus, meet in a cancer support group and fall in love. Funny, honest and moving, with plenty of tissues needed.","Hai thiếu niên Hazel và Gus gặp nhau trong nhóm hỗ trợ bệnh nhân ung thư và yêu nhau. Hài hước, chân thật và cảm động, nhớ chuẩn bị khăn giấy."],
["kid","Where the Wild Things Are",null,"Maurice Sendak",1963,"Max, sent to bed without supper, sails to an island of wild creatures and becomes their king. A classic picture book about imagination and big feelings.","Max bị phạt đi ngủ không ăn tối, nhưng lại chèo thuyền đến hòn đảo của những sinh vật hoang dã và trở thành vua của chúng. Sách tranh kinh điển về trí tưởng tượng và những cảm xúc lớn."],
["phi","Meditations","Suy tưởng","Marcus Aurelius",180,"Personal notes by a Roman emperor on self-discipline, duty and facing hardship with calm. Short passages you can read anywhere.","Những ghi chép riêng của một hoàng đế La Mã về kỷ luật bản thân, bổn phận và đối diện khó khăn bằng sự bình thản. Các đoạn ngắn có thể đọc ở bất cứ đâu."],
["phi","Sophie’s World","Thế giới của Sophie","Jostein Gaarder",1991,"A teenage girl receives mysterious letters that take her through the history of philosophy. A clever novel that makes big ideas approachable.","Một cô gái tuổi teen nhận được những lá thư bí ẩn dẫn cô đi qua lịch sử triết học. Tiểu thuyết thông minh làm cho những ý tưởng lớn trở nên dễ tiếp cận."],
["phi","The Alchemist","Nhà giả kim","Paulo Coelho",1988,"Santiago, an Andalusian shepherd boy, travels toward the Egyptian pyramids in search of treasure. A simple, inspiring fable about following your dreams.","Santiago, cậu bé chăn cừu xứ Andalusia, đi về phía kim tự tháp Ai Cập để tìm kho báu. Một ngụ ngôn giản dị, truyền cảm hứng về việc theo đuổi ước mơ."],
["phi","The Myth of Sisyphus","Huyền thoại Sisyphus","Albert Camus",1942,"A philosophical essay that asks how to live in a world without clear meaning. Camus argues we must imagine Sisyphus happy.","Tiểu luận triết học đặt câu hỏi sống thế nào trong một thế giới thiếu ý nghĩa rõ ràng. Camus cho rằng ta phải tưởng tượng Sisyphus hạnh phúc."],
["phi","Quiet","Hướng nội","Susan Cain",2012,"Explores the strengths of introverts in a world that often rewards extroversion. Part research, part stories, part encouragement.","Khám phá thế mạnh của người hướng nội trong một thế giới thường đề cao sự hướng ngoại. Vừa có nghiên cứu, vừa có câu chuyện, vừa là lời động viên."],
["phi","The Courage to Be Disliked","Dám bị ghét","Ichiro Kishimi & Fumitake Koga",2013,"A conversation between a philosopher and a young man introduces Adlerian psychology and how to free yourself from other people’s expectations. Easy to read and thought-provoking.","Cuộc đối thoại giữa một triết gia và một chàng trai trẻ giới thiệu tâm lý học Adler và cách giải phóng bản thân khỏi kỳ vọng của người khác. Dễ đọc và gợi nhiều suy nghĩ."],
["vn","Dế Mèn phiêu lưu ký",null,"Tô Hoài",1941,"A young cricket leaves home to explore the world and learns about friendship, courage and humility along the way. A beloved Vietnamese children’s classic.","Chú dế Mèn rời nhà đi khám phá thế giới và học về tình bạn, lòng dũng cảm và sự khiêm tốn trên đường đi. Tác phẩm thiếu nhi kinh điển được yêu mến của Việt Nam.","Diary of a Cricket"],

["vn","Nỗi buồn chiến tranh",null,"Bảo Ninh",1990,"A former soldier, Kiên, replays memories of the Vietnam War and of lost love in fragments. A haunting, widely translated novel about the human cost of war.","Người lính Kiên nhớ lại chiến tranh và mối tình đã mất qua những mảnh ký ức đứt quãng. Tiểu thuyết ám ảnh, được dịch nhiều thứ tiếng, về cái giá con người phải trả của chiến tranh.","The Sorrow of War"],
["vn","Mắt biếc",null,"Nguyễn Nhật Ánh",1990,"Ngạn grows up in a village, quietly loving his childhood friend Hà Lan. A gentle, nostalgic story of first love and the paths life takes.","Ngạn lớn lên ở làng quê, thầm yêu cô bạn thuở nhỏ Hà Lan. Câu chuyện nhẹ nhàng, hoài niệm về mối tình đầu và những ngã rẽ cuộc đời."],
["vn","Tuổi thơ dữ dội",null,"Phùng Quán",1988,"Based on the real experiences of teenage scouts during the resistance war in Huế. A moving tale of courage, friendship and sacrifice.","Dựa trên trải nghiệm thật của những thiếu niên trinh sát trong kháng chiến ở Huế. Câu chuyện cảm động về lòng dũng cảm, tình bạn và sự hy sinh."],

({quiz:rQuiz,wheel:rWheel,duck:rDuck,draw:function(){rPick("draw",8,"🧧")},coin:rCoin,cards:function(){rPick("cards",5,"🃏")},shell:rShell,dice:rDice,lib:rLib,tbl:rTbl})[tab]();upd()}
