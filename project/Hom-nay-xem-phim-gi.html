<style>
:root{--bg:#050507;--bg2:#0d0d12;--ink:#F4F4F6;--mute:#A6A9B5;--silver:#C9CDD6;--line:rgba(201,205,214,.2);--gold:#D4AF37;--goldhi:#F6E7A8;--goldlo:#8F6B12;--f-d:'Playfair Display',Georgia,'Times New Roman',serif;--f-b:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--gg:linear-gradient(135deg,#F6E7A8 0%,#D4AF37 48%,#9A7410 100%);color-scheme:dark}
*{box-sizing:border-box}
html{background:#050507}
body{margin:0;font:400 16px/1.55 var(--f-b);color:var(--ink);background:radial-gradient(1100px 520px at 50% -8%,rgba(201,205,214,.16),transparent 62%),radial-gradient(700px 400px at 100% 30%,rgba(212,175,55,.07),transparent 60%),linear-gradient(180deg,#0a0a0e,#050507 60%);background-color:#050507;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:960px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-weight:500;font-size:14px;color:var(--silver);letter-spacing:.02em}
.back:hover{color:var(--goldhi)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#0a0a0d;margin-left:auto}
.lang button{border:0;background:transparent;min-width:52px;min-height:38px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--gg);color:#16120A}
.hero{padding:44px 0 22px;text-align:center}
.kick{font:700 12px var(--f-b);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h1{margin:0;font:800 clamp(40px,9vw,76px)/1.02 var(--f-d);letter-spacing:-.01em;text-wrap:balance;background:linear-gradient(180deg,#fff 0%,#C9CDD6 45%,#7C808C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:italic;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:60ch;margin:16px auto 0;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,#141418,#09090c);margin:22px 0 18px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;border-radius:999px;padding:11px 18px;min-height:44px;font-weight:700;font-size:14px;color:var(--silver)}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:var(--gg);color:#16120A;box-shadow:0 6px 20px rgba(212,175,55,.25)}
.panel{border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.012) 38%,rgba(0,0,0,.25)),#0c0c10;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.65)}
.fbar{margin:0 0 18px}
.lbl{font:700 11px var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#0a0a0d;color:var(--silver);border-radius:999px;padding:7px 14px;min-height:38px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--gold);color:#fff}
.chip[aria-pressed="true"]{background:var(--ink);color:#0a0a0d;border-color:var(--ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:15px;letter-spacing:.02em;text-decoration:none;background:var(--gg);color:#16120A;box-shadow:0 8px 24px rgba(212,175,55,.22),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default;transform:none;filter:none}
.btn.ghost{background:#0a0a0d;color:#fff;border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--goldhi)}
.btn.white{background:#F4F4F6;color:#0a0a0d;box-shadow:none}
.btn.sm{min-height:40px;padding:8px 18px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
h2{font:800 clamp(24px,5vw,34px)/1.12 var(--f-d);margin:0 0 6px;letter-spacing:-.005em;text-wrap:balance}
.help{color:var(--mute);margin:0 0 18px;font-size:14px}
/* quiz */
.prog{display:flex;gap:6px;margin:0 0 18px}.prog i{flex:1;height:4px;border-radius:4px;background:#25252c}.prog i.on{background:var(--gg)}
.qn{font:700 11px var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:16px}
.opt{text-align:left;border:1px solid var(--line);background:linear-gradient(160deg,#17171c,#0b0b0e);border-radius:16px;padding:16px;font-weight:500;min-height:64px;color:var(--ink)}
.opt:hover{border-color:var(--gold);transform:translateY(-1px)}
.opt b{display:block;font-size:22px;margin-bottom:4px}
/* poster + result */
.res{margin-top:26px}
.mv{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:22px;align-items:start}
.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(165deg,hsl(var(--h) 42% 30%),hsl(var(--h) 45% 9%) 70%);border:1px solid rgba(246,231,168,.45);box-shadow:0 14px 34px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:space-between;padding:12px;min-width:0}
.poster:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 48%,transparent 60%)}
.poster .ltr{font:800 clamp(64px,13vw,104px)/1 var(--f-d);background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin:auto 0}
.poster small{font:700 11px var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--goldhi);opacity:.9;text-align:center}
.poster .hole{display:flex;justify-content:space-between}.poster .hole i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.2)}
.mv h3{margin:0;font:800 clamp(24px,5vw,34px)/1.12 var(--f-d);overflow-wrap:anywhere}
.vt{color:var(--silver);font-weight:600;font-size:.62em;font-family:var(--f-b)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);color:var(--silver)}
.badge.g{background:var(--gg);color:#16120A;border-color:transparent}
.badge.w{background:#F4F4F6;color:#0a0a0d;border-color:transparent}
.why{color:var(--mute);margin:0 0 6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.alts{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.alt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.alt span{min-width:0;overflow-wrap:anywhere}
.tick{display:inline-block;width:8px}
/* wheel */
.wheel-wrap{position:relative;width:min(100%,430px);margin:6px auto 0}
.wheel-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px #0a0a0d,0 0 0 8px var(--gold),0 24px 50px rgba(0,0,0,.7)}
.ptr{position:absolute;top:-14px;left:50%;width:0;height:0;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));z-index:2}
/* duck */
.lanes{display:grid;gap:8px;margin:14px 0}
.lane{position:relative;height:50px;border-radius:12px;background:repeating-linear-gradient(90deg,#111116 0 28px,#0b0b0e 28px 56px);border:1px solid var(--line);overflow:hidden}
.lane .dn{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:500;color:var(--mute);max-width:calc(100% - 90px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.lane .duck{position:absolute;left:0;top:4px;font-size:34px;line-height:40px;width:46px;text-align:center;z-index:2;transform:scaleX(-1)}
.lane .fin{position:absolute;right:0;top:0;bottom:0;width:12px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/12px 12px}
.lane.win{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.4)}
/* cards */
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:12px;margin:10px 0}
.pc{perspective:800px;border:0;background:none;padding:0;aspect-ratio:2/3;position:relative}
.pc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.pc.open .in{transform:rotateY(180deg)}
.pc .f,.pc .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;overflow:hidden}
.pc .b{background:repeating-linear-gradient(45deg,#16130a 0 8px,#0b0a05 8px 16px);border:1px solid var(--gold);box-shadow:inset 0 0 0 5px #0a0a0d,inset 0 0 0 6px rgba(212,175,55,.6)}
.pc .b span{font:800 40px var(--f-d);background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.pc .f{transform:rotateY(180deg);background:linear-gradient(165deg,hsl(var(--h) 42% 28%),hsl(var(--h) 45% 9%));border:1px solid rgba(246,231,168,.5);gap:6px}
.pc .f b{font:800 15px/1.2 var(--f-d);overflow-wrap:anywhere}
.pc .f i{font-style:normal;font-size:12px;color:var(--goldhi)}
.pc:not(.open):hover .in{transform:translateY(-4px)}
.pc.dim{opacity:.45}
/* quick */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.qc{border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(160deg,#15151a,#0a0a0d);display:flex;flex-direction:column;gap:10px;min-width:0}
.qc h3{margin:0;font:800 20px var(--f-d)}
.coinbox{perspective:700px;display:grid;place-items:center;height:120px}
.coin{width:96px;height:96px;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.coin div{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font:800 40px var(--f-d);border:3px solid #6b4f0c}
.coin .h{background:var(--gg);color:#16120A}.coin .tl{background:linear-gradient(135deg,#fff,#9ea2ad);color:#0a0a0d;transform:rotateY(180deg);border-color:#555a66}
.cside{font-size:14px;color:var(--silver);overflow-wrap:anywhere}.cside b{color:var(--goldhi);font-family:var(--f-d);margin-right:6px}
.die{width:92px;height:92px;margin:6px auto;border-radius:20px;background:linear-gradient(145deg,#fff,#c9cdd6);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;gap:2px;box-shadow:0 8px 0 #6b6f7b,0 16px 24px rgba(0,0,0,.6)}
.die i{width:100%;height:100%;max-width:18px;max-height:18px;place-self:center;border-radius:50%}.die i.on{background:#0a0a0d}
.die.roll{animation:shk .16s linear infinite}
@keyframes shk{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-3px)}100%{transform:rotate(-7deg)}}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--silver)}
.dl li{display:flex;gap:8px;padding:4px 8px;border-radius:8px;min-width:0}.dl li b{flex:none;color:var(--gold);width:16px}.dl li span{min-width:0;overflow-wrap:anywhere}
.dl li.win{background:var(--gg);color:#16120A}.dl li.win b{color:#16120A}
.slotwin{border:2px solid var(--gold);border-radius:14px;background:#06060a;min-height:84px;display:grid;place-items:center;text-align:center;padding:10px;font:800 20px/1.2 var(--f-d);overflow-wrap:anywhere;box-shadow:inset 0 0 30px rgba(212,175,55,.15)}
/* mine */
.in{width:100%;min-height:48px;border:1px solid var(--line);background:#07070a;color:var(--ink);border-radius:14px;padding:11px 16px;font:400 16px var(--f-b)}
.in:focus{outline:none;border-color:var(--gold)}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.ml{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.ml li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 16px;background:#09090c;min-width:0}
.ml li span{min-width:0;overflow-wrap:anywhere}
.rm{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#0a0a0d;color:var(--silver);font-size:18px}.rm:hover{border-color:var(--gold);color:var(--goldhi)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--mute)}
details.ps{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.ps summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;font-size:14px}
/* library */
.lib-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,200px);gap:10px;margin-bottom:14px}
select.in{appearance:auto}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow .poster{padding:3px;border-radius:7px;aspect-ratio:2/3}.lrow .poster .ltr{font-size:24px}.lrow .poster small,.lrow .poster .hole{display:none}
.lrow h4{margin:0;font:700 15px/1.3 var(--f-b);overflow-wrap:anywhere}
.lrow p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.lrow .sc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.more{display:flex;justify-content:center;margin-top:18px}
footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;display:grid;gap:8px}
footer a{color:var(--silver)}footer a:hover{color:var(--goldhi)}
footer b{color:var(--goldhi);font-weight:500}
[hidden]{display:none!important}
@media (max-width:620px){
 .mv{grid-template-columns:minmax(0,1fr)}.mv .poster{max-width:150px}
 .lrow{grid-template-columns:40px minmax(0,1fr)}.lrow .sc{grid-column:2;justify-content:flex-start}
 .lib-ctl,.add{grid-template-columns:1fr}
 .tab{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
var GK=['action','adventure','animation','comedy','crime','drama','romance','thriller','scifi','war'];
var GN={
 action:{vi:'Hành động',en:'Action',h:8},
 adventure:{vi:'Phiêu lưu · Giả tưởng',en:'Adventure & Fantasy',h:150},
 animation:{vi:'Hoạt hình',en:'Animation',h:200},
 comedy:{vi:'Hài',en:'Comedy',h:42},
 crime:{vi:'Tội phạm',en:'Crime',h:0},
 drama:{vi:'Chính kịch',en:'Drama',h:268},
 romance:{vi:'Lãng mạn',en:'Romance',h:335},

function sortFn(k){return {im:function(a,b){return (b.im||b.rt/11.5||0)-(a.im||a.rt/11.5||0);},rt:function(a,b){return (b.rt||0)-(a.rt||0)||(b.im-a.im);},'new':function(a,b){return b.y-a.y;},old:function(a,b){return a.y-b.y;},az:function(a,b){return a.t.localeCompare(b.t);}}[k];}
function libList(){
  var q=fold($('#q').value.trim()),k=$('#sort').value||'im';
  return MOV.filter(function(m){return(gf==='all'||m.g===gf)&&(!q||fold(m.t).indexOf(q)>=0||fold(m.vi).indexOf(q)>=0);}).sort(sortFn(k));
}
function renderLib(){
  var l=libList();$('#libhelp').textContent=t('libHelp',{n:l.length});
  $('#liblist').innerHTML=l.length?l.slice(0,libN).map(function(m){
    return '<div class="lrow">'+poster(m)+'<div><h4>'+tt(m)+'</h4><p>'+esc(gname(m.g))+' · '+m.y+'</p></div><div class="sc"><span class="badge w">IMDb ★ '+(m.im?m.im.toFixed(1):'–')+'</span><span class="badge">'+(m.rt?m.rt+'%':'–')+'</span><a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+enc(m.t+' '+m.y+' official trailer')+'">'+t('trailer')+'</a></div></div>';}).join(''):'<div class="empty">'+t('noRes')+'</div>';
  $('.more').hidden=l.length<=libN;
}
$('#q').addEventListener('input',function(){libN=30;renderLib();});$('#sort').addEventListener('change',function(){libN=30;renderLib();});
$('#more').onclick=function(){libN+=30;renderLib();};

/* ---------- language ---------- */
function applyStatic(){
  $$('[data-i]').forEach(function(el){el.textContent=t(el.dataset.i);});
  $('#h1').innerHTML=L==='vi'?'Hôm nay xem <em>phim gì?</em>':'What to <em>watch</em> today?';
  $('#spin').textContent=wheel.spinning?t('spinning'):t('spin');$('#reshuffle').textContent=t('reshuffle');
  $('#go').textContent=duck.racing?t('racing'):t('go');$('#newduck').textContent=t('newduck');$('#deal').textContent=t('deal');
  $('#flip').textContent=t('flip');$('#coinNew').textContent=t('coinNew');$('#roll').textContent=t('roll');$('#diceNew').textContent=t('diceNew');$('#pull').textContent=t('pull');
  $('#minein').placeholder=t('minePh');$('#mineadd').textContent=t('add');$('#minepaste').placeholder=t('pastePh');$('#minepasteadd').textContent=t('pasteBtn');
  $('#minepick').textContent=t('minePick');$('#mineuse').textContent=t('mineUse');$('#mineclear').textContent=t('mineClear');
  $('#q').placeholder=t('search');$('#q').setAttribute('aria-label',t('search'));
  var sv=$('#sort').value||'im';$('#sort').innerHTML=['im','rt','new','old','az'].map(function(k){return '<option value="'+k+'">'+t('s_'+k)+'</option>';}).join('');$('#sort').value=sv;
  $('#yr').textContent=new Date().getFullYear();$('#srcnote').textContent=t('srcnote');
  $$('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.l===L));});
  document.documentElement.lang=L;
}
function setLang(l,fromHash){
  if(l!=='vi'&&l!=='en')return;L=l;try{localStorage.setItem('homNayXemPhim.lang',l);}catch(e){}
  if(!fromHash){try{history.replaceState(null,'','#'+l);}catch(e){location.hash=l;}}
  applyStatic();renderTabs();renderChips();
  if(qs.step>=Q.length&&qRank.length)drawQuiz();else renderQuiz();
  rerenderRes();
  if(tab==='lib')renderLib();if(tab==='mine')renderMine();
}
$$('.lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l);};});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h==='vi'||h==='en')if(h!==L)setLang(h,true);});

/* ---------- init ---------- */
(function(){
  var h=location.hash.slice(1),l='vi';
  if(h==='en'||h==='vi')l=h;else{try{var s=localStorage.getItem('homNayXemPhim.lang');if(s==='en'||s==='vi')l=s;else if((navigator.language||'').toLowerCase().indexOf('vi')!==0)l='en';}catch(e){}}
  L=l;applyStatic();renderTabs();renderChips();renderQuiz();$$('section[role=tabpanel]').forEach(function(s){s.hidden=s.id!=='p-quiz';});$('#fbar').hidden=true;
})();
})();
</script>
