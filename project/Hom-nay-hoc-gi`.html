:root{color-scheme:light;--ink:#111;--sky:#bfe3f8;--sky2:#6bb6e6;--line:#cfe5f5;--card:#ffffffd9;--star:#ffd84d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:var(--ink);font-family:Quicksand,'Noto Sans',system-ui,sans-serif;font-weight:500;line-height:1.55;background:linear-gradient(180deg,#e6f3fc,#fff 60%) fixed;padding:16px 5vw 70px}
.w{max-width:960px;margin:auto}

:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700}.top a{color:inherit;text-decoration:none}
.pill{padding:6px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line)}
.stat{display:flex;gap:8px;align-items:center}
.kick{text-align:center;margin-top:20px;font-family:'Pinyon Script',cursive;font-size:34px}
h1{font-family:'Playfair Display',serif;font-size:clamp(34px,8vw,58px);text-align:center;line-height:1.1}
.sub{text-align:center;max-width:600px;margin:10px auto 18px;opacity:.85}
.card{background:var(--card);backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 10px 34px #6bb6e633;margin-bottom:16px}
h2{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:10px}
.btn{display:inline-block;padding:11px 22px;border-radius:99px;background:var(--sky);color:var(--ink);font-size:15px;transition:.2s;box-shadow:0 5px 14px #6bb6e644}.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.45}
.btn.k{background:var(--ink);color:#fff;box-shadow:none}.btn.g{background:#fff;border:1.5px solid var(--line);box-shadow:none}
.topics{display:flex;flex-wrap:wrap;gap:8px}.topics button{padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:14px}.topics button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.games button{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:18px 12px;text-align:center;transition:.2s}.games button:hover{transform:translateY(-4px);border-color:var(--sky2);box-shadow:0 10px 24px #6bb6e633}.games span{font-size:36px;display:block}.games b{display:block;font-size:16px}.games small{display:block;opacity:.7;font-weight:500;font-size:12px}
.plan{display:grid;gap:8px;margin-top:12px}.plan div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:#fff;border:1.5px solid var(--line)}.plan div.d{background:#e3f6ea;border-color:#9bd9b4}.plan span{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;opacity:.7;padding:6px 8px;border-bottom:1.5px solid var(--line)}td{padding:8px;border-bottom:1px solid #e6f1f8;vertical-align:top}
.ov{position:fixed;inset:0;background:#0b1a2488;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.ov.open{display:flex}
.md{background:#fff;border-radius:30px;padding:22px;width:min(560px,100%);max-height:94vh;overflow:auto;border:3px solid var(--sky)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd b{font-family:'Playfair Display',serif;font-size:20px}.hd button{font-size:24px}
.meta{text-align:center;font-weight:700;margin:4px 0 10px}
.fc{display:grid;place-items:center;width:100%;min-height:200px;border-radius:26px;background:#f2f9fe;border:3px solid var(--sky2);padding:20px;text-align:center;font-family:'Playfair Display','Noto Serif',serif;font-size:clamp(22px,5vw,30px);font-weight:700;margin:10px 0;transition:.2s}.fc small{display:block;font:700 12px Quicksand;opacity:.6;margin-top:8px}
.fc.b{background:#fff;border-color:var(--ink)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.opts{display:grid;gap:8px;margin:10px 0}.opt{padding:13px 16px;border-radius:18px;background:#fff;border:2px solid var(--line);text-align:left;font-size:16px}.opt:hover{border-color:var(--sky2)}.opt.ok{background:#d9f6e5;border-color:#4bc58f}.opt.no{background:#ffe1e1;border-color:#ff8f8f}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mg button{min-height:84px;border-radius:18px;background:var(--sky);border:2px solid #fff;padding:8px;font-size:13px;line-height:1.25;color:var(--ink)}.mg button.up{background:#fff;border-color:var(--sky2)}.mg button.ok{background:#d9f6e5;border-color:#4bc58f}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:12px auto}.pad{height:110px;border-radius:24px;opacity:.55;transition:.12s;border:3px solid #fff}.pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 24px #6bb6e6}
.big{font-family:'Playfair Display',serif;font-size:clamp(34px,10vw,56px);text-align:center;margin:12px 0;letter-spacing:.1em}
input.in{width:100%;padding:12px 16px;border-radius:99px;border:2px solid var(--ink);font-size:20px;text-align:center}
.rx{height:200px;border-radius:26px;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;margin:10px 0;cursor:pointer;user-select:none}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.spc{aspect-ratio:1;border-radius:50%;background:#f2f9fe;border:3px solid var(--sky2);display:grid;grid-template-columns:repeat(3,1fr);place-items:center;padding:12px}.spc button{font-size:clamp(22px,6vw,34px);line-height:1}
.vh{min-height:26px;text-align:center;font-weight:700;margin:6px 0}
.note{font-size:12px;opacity:.7;text-align:center;margin-top:16px}
@media(max-width:600px){.mg{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
