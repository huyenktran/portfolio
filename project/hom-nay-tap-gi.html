var TERMS={
vi:{title:'Điều khoản sử dụng và Miễn trừ trách nhiệm về an toàn tập luyện',upd:'Cập nhật lần cuối: 14/11/2026 · Phiên bản 1.0',intro:'Vui lòng đọc kỹ toàn bộ văn bản này trước khi sử dụng trang. Đây là thỏa thuận có ràng buộc pháp lý, bao gồm việc bạn tự nguyện chấp nhận rủi ro và từ bỏ một số quyền khiếu nại trong phạm vi pháp luật cho phép.',
 s:[
 ['1. Chấp thuận điều khoản','Khi truy cập hoặc sử dụng trang "Hôm nay tập gì" (gọi là "Trang") do Alessandra Tran ("Chủ sở hữu") vận hành, bạn xác nhận rằng bạn đã đọc, hiểu và đồng ý bị ràng buộc bởi toàn bộ Điều khoản này. Nếu không đồng ý, vui lòng ngừng sử dụng Trang ngay lập tức.'],
 ['2. Chỉ mang tính tham khảo, không phải tư vấn y tế hay huấn luyện chuyên nghiệp','Mọi nội dung trên Trang (bài tập, hướng dẫn, thời lượng, bộ hẹn giờ, gợi ý ngẫu nhiên, kết quả hỏi đáp, danh sách dụng cụ và trang phục…) chỉ nhằm mục đích thông tin chung và được tổng hợp từ các tài liệu tham khảo công khai. Không nội dung nào là chẩn đoán, điều trị, tư vấn y khoa, vật lý trị liệu, dinh dưỡng hay huấn luyện cá nhân hóa. Việc sử dụng Trang không tạo ra quan hệ bác sĩ – bệnh nhân, huấn luyện viên – học viên hay bất kỳ quan hệ chuyên môn nào giữa bạn và Chủ sở hữu.'],
 ['3. Khám sức khỏe trước khi tập','Bạn phải hỏi ý kiến bác sĩ trước khi bắt đầu hoặc thay đổi chương trình tập, đặc biệt nếu bạn có bệnh tim mạch, huyết áp cao, tiểu đường, hen suyễn, bệnh về xương khớp, cột sống hoặc loãng xương, đang có chấn thương, đang mang thai hoặc sau sinh, sau phẫu thuật, đang dùng thuốc, lâu ngày ít vận động, hoặc không chắc về tình trạng sức khỏe của mình. Hãy ngừng tập ngay và tìm trợ giúp y tế nếu có đau ngực, khó thở bất thường, chóng mặt, choáng váng, buồn nôn, đau nhói, tê bì hoặc bất kỳ triệu chứng bất thường nào.'],
 ['4. Rủi ro vốn có và tự nguyện chấp nhận rủi ro','Tập luyện, đặc biệt là nâng tạ nặng, HIIT, boxing, các bài bật nhảy, tư thế đảo ngược hoặc đòi hỏi thăng bằng, luôn tiềm ẩn rủi ro, bao gồm nhưng không giới hạn: căng hoặc rách cơ, bong gân, trật khớp, gãy xương, chấn thương cột sống, chấn động não, rối loạn nhịp tim, ngừng tim, đột quỵ, kiệt sức, mất nước, say nóng, và rủi ro do dụng cụ hỏng, đổ, rơi hoặc đè. Trong trường hợp nghiêm trọng có thể dẫn đến thương tật vĩnh viễn hoặc tử vong. Bạn hiểu rõ và tự nguyện chấp nhận toàn bộ các rủi ro này khi tự quyết định tập luyện.'],
 ['5. Khuyến nghị mạnh mẽ về giám sát chuyên môn','Chủ sở hữu không khuyến khích bạn tự tập một mình, nhất là với các bài kỹ thuật cao hoặc tải nặng. Bạn nên tập dưới sự hướng dẫn trực tiếp của huấn luyện viên cá nhân (PT), giáo viên yoga hoặc pilates, huấn luyện viên boxing, hoặc chuyên gia vật lý trị liệu có chứng chỉ phù hợp; có người hỗ trợ (spotter) và thiết bị an toàn khi nâng tạ nặng; và không tập đối kháng khi chưa có huấn luyện viên cùng đồ bảo hộ. Hướng dẫn trực tiếp của chuyên gia luôn được ưu tiên hơn mọi nội dung trên Trang.'],
 ['6. Độ tuổi','Trang dành cho người từ đủ 18 tuổi. Người dưới 18 tuổi chỉ được sử dụng khi có cha mẹ hoặc người giám hộ đồng ý, giám sát và có huấn luyện viên đủ chuyên môn phù hợp với lứa tuổi.'],
 ['7. Nguồn tham khảo và độ chính xác','Nội dung được tổng hợp, diễn giải và rút gọn từ các tài liệu như "The Complete Yoga Poses" (PDF), "HIIT Manual" của Mladen Jovanović, khuyến nghị hoạt động thể chất của ACSM, và các nguồn công khai khác; một số phần chỉ dựa trên kiến thức phổ thông về kỹ thuật tập. Việc tham chiếu không có nghĩa là tác giả hay tổ chức nguồn xác nhận, tài trợ hoặc chịu trách nhiệm về Trang. Nội dung có thể thiếu sót, lỗi thời, bị diễn giải chưa đầy đủ hoặc không phù hợp với cơ thể và hoàn cảnh riêng của bạn. Thời lượng, số hiệp, số lần chỉ là gợi ý chung, không phải liều tập an toàn cho từng cá nhân.'],
 ['8. Liên kết và nội dung của bên thứ ba','Các liên kết đến YouTube, tài liệu PDF hoặc trang web bên ngoài chỉ nhằm tiện tra cứu. Nhiều liên kết là kết quả tìm kiếm nên nội dung hiển thị có thể thay đổi bất kỳ lúc nào. Chủ sở hữu không kiểm soát, không bảo đảm và không chịu trách nhiệm về tính chính xác, an toàn, bản quyền hay quan điểm trong các nội dung đó, và việc đưa liên kết không có nghĩa là bảo trợ hay khuyến nghị.'],
 ['9. Bộ hẹn giờ và công cụ trên Trang','Bộ hẹn giờ, âm báo, buổi tập ngẫu nhiên và các công cụ khác chỉ mang tính tiện ích. Chúng có thể sai lệch hoặc bị gián đoạn (ví dụ do trình duyệt hạn chế khi chạy nền, hết pin, tắt âm thanh hoặc lỗi kỹ thuật). Bạn không được dựa vào chúng để bảo đảm an toàn; hãy luôn lắng nghe cơ thể và tự quyết định thời điểm dừng.'],
 ['10. Dụng cụ, trang phục và môi trường tập','Bạn hoàn toàn chịu trách nhiệm kiểm tra tình trạng dụng cụ, sàn tập, không gian, nhiệt độ, nước uống, trang phục và giày dép phù hợp. Thông tin về dụng cụ và trang phục trên Trang chỉ là gợi ý chung.'],
 ['11. Không bảo đảm','Trang và toàn bộ nội dung được cung cấp "nguyên trạng" và "theo khả năng sẵn có", không kèm bất kỳ bảo đảm nào, dù rõ ràng hay ngầm định, bao gồm bảo đảm về tính chính xác, đầy đủ, phù hợp cho mục đích cụ thể, an toàn hay kết quả tập luyện.'],
 ['12. Giới hạn trách nhiệm','Trong phạm vi tối đa mà pháp luật cho phép, Chủ sở hữu, người đóng góp và các bên liên quan không chịu trách nhiệm đối với bất kỳ thương tích, bệnh tật, tử vong, tổn thất tài sản, chi phí y tế, mất thu nhập hay thiệt hại trực tiếp, gián tiếp, đặc biệt, hệ quả hoặc mang tính răn đe nào phát sinh từ hoặc liên quan đến việc sử dụng, hoặc không thể sử dụng, Trang, kể cả khi đã được thông báo trước về khả năng xảy ra thiệt hại. Nếu pháp luật buộc phải xác lập trách nhiệm, tổng mức trách nhiệm tối đa của Chủ sở hữu sẽ không vượt quá số tiền bạn đã trả để sử dụng Trang (hiện là 0 đồng).'],
 ['13. Miễn trừ và từ bỏ khiếu nại','Trong phạm vi pháp luật cho phép, bạn, thay mặt bản thân, người thừa kế, người đại diện hợp pháp và người nhận chuyển nhượng, miễn trừ và từ bỏ mọi khiếu nại, yêu cầu bồi thường và quyền khởi kiện đối với Chủ sở hữu liên quan đến thương tích hoặc thiệt hại phát sinh từ việc bạn thực hiện bất kỳ bài tập hoặc hoạt động nào được đề cập trên Trang, kể cả khi do sơ suất thông thường của Chủ sở hữu.'],
 ['14. Bồi hoàn','Bạn đồng ý bồi hoàn và giữ cho Chủ sở hữu không bị thiệt hại trước mọi khiếu nại, tổn thất và chi phí (bao gồm phí luật sư hợp lý) phát sinh từ việc bạn vi phạm Điều khoản này, sử dụng Trang sai mục đích, hoặc hướng dẫn hay chia sẻ nội dung của Trang cho người khác (kể cả người dưới 18 tuổi) để họ tập luyện.'],
 ['15. Phòng tập, huấn luyện viên và bên thứ ba','Nếu bạn tập tại phòng tập hoặc cùng huấn luyện viên, mối quan hệ đó hoàn toàn độc lập với Trang. Chủ sở hữu không chịu trách nhiệm về cơ sở vật chất, dịch vụ, chuyên môn hay hành vi của các bên đó. Hãy tuân thủ nội quy và hướng dẫn trực tiếp của họ.'],
 ['16. Dữ liệu cá nhân','Trang không thu thập thông tin sức khỏe của bạn lên máy chủ. Các lựa chọn của bạn (ngôn ngữ, buổi tập, xác nhận điều khoản) chỉ được lưu cục bộ trong trình duyệt của bạn và có thể bị xóa bất cứ lúc nào bằng cách xóa dữ liệu trình duyệt.'],
 ['17. Quyền sở hữu trí tuệ','Giao diện và cách trình bày của Trang thuộc về Chủ sở hữu. Tên gọi, tài liệu và nhãn hiệu của bên thứ ba thuộc về chủ sở hữu tương ứng. Bạn không được sao chép cho mục đích thương mại khi chưa được phép.'],
 ['18. Luật áp dụng và giải quyết tranh chấp','Điều khoản này được điều chỉnh bởi pháp luật Việt Nam. Các bên ưu tiên thương lượng thiện chí; nếu không đạt được thỏa thuận, tranh chấp thuộc thẩm quyền của Tòa án có thẩm quyền tại Thành phố Hồ Chí Minh, Việt Nam. Không quy định nào trong Điều khoản này loại trừ hoặc hạn chế các quyền của người tiêu dùng mà pháp luật không cho phép loại trừ, hay trách nhiệm không thể loại trừ theo quy định pháp luật (ví dụ do cố ý hoặc lỗi nghiêm trọng).'],
 ['19. Tính khả thi từng phần và toàn bộ thỏa thuận','Nếu một quy định bị coi là vô hiệu hoặc không thể thi hành, các quy định còn lại vẫn giữ nguyên hiệu lực. Điều khoản này là toàn bộ thỏa thuận giữa bạn và Chủ sở hữu về việc sử dụng Trang.'],
 ['20. Thay đổi điều khoản','Chủ sở hữu có thể cập nhật Điều khoản bất kỳ lúc nào; phiên bản mới có hiệu lực kể từ khi đăng tải. Việc bạn tiếp tục sử dụng Trang đồng nghĩa với việc chấp nhận phiên bản mới, và Trang có thể yêu cầu bạn xác nhận lại.'],
 ['21. Trường hợp khẩn cấp','Nếu bạn hoặc người khác bị thương nặng hoặc có triệu chứng nguy hiểm, hãy ngừng tập và gọi cấp cứu ngay: 115 tại Việt Nam (hoặc số khẩn cấp tại nơi bạn ở, ví dụ 112).'],
 ['22. Liên hệ','Mọi thắc mắc về Điều khoản này vui lòng liên hệ qua www.alessandratran.com.']],
 gateH:'Trước khi tập: Xác nhận an toàn',gateP:'Để tiếp tục, vui lòng đọc và xác nhận các điểm quan trọng sau:',
 gateL:['Nội dung chỉ để tham khảo, không phải tư vấn y tế hay huấn luyện chuyên nghiệp.','Tôi đã hoặc sẽ hỏi ý kiến bác sĩ trước khi tập, đặc biệt nếu tôi có bệnh lý, chấn thương hoặc đang mang thai.','Tôi hiểu tập luyện có rủi ro chấn thương nghiêm trọng, thậm chí tử vong, và tôi tự nguyện chấp nhận rủi ro này.','Chủ sở hữu khuyến khích tôi tập cùng huấn luyện viên hoặc PT, và không chịu trách nhiệm đối với tai nạn hay chấn thương xảy ra khi tôi tập, trong phạm vi pháp luật cho phép.'],

en:{title:'Terms of Use and Exercise Safety Disclaimer',upd:'Last updated: 14 November 2026 · Version 1.0',intro:'Please read this entire document carefully before using the site. It is a legally binding agreement that includes your voluntary assumption of risk and a waiver of certain claims to the extent permitted by law.',
 s:[
 ['1. Acceptance of terms','By accessing or using the "What to work out today" site (the "Site") operated by Alessandra Tran (the "Owner"), you confirm that you have read, understood and agree to be bound by these Terms in full. If you do not agree, stop using the Site immediately.'],
 ['2. Information only: not medical advice or professional coaching','All content on the Site (exercises, instructions, durations, timers, random suggestions, quiz results, equipment and clothing lists and so on) is for general information only and is compiled from publicly available references. Nothing on the Site is a diagnosis, treatment, medical advice, physiotherapy, nutrition advice or personalised coaching. Using the Site does not create a doctor–patient, trainer–client or any other professional relationship between you and the Owner.'],
 ['3. Medical clearance before exercising','You must consult a physician before starting or changing any exercise programme, especially if you have heart disease, high blood pressure, diabetes, asthma, bone, joint, spine or osteoporosis problems, a current injury, are pregnant or postpartum, have had surgery, take medication, have been inactive for a long time, or are unsure about your health. Stop exercising immediately and seek medical help if you experience chest pain, unusual shortness of breath, dizziness, light-headedness, nausea, sharp pain, numbness or any other abnormal symptom.'],
 ['4. Inherent risks and voluntary assumption of risk','Exercise, particularly heavy lifting, HIIT, boxing, jumping movements, inversions and balance-demanding poses, carries inherent risks including, without limitation: muscle strains and tears, sprains, dislocations, fractures, spinal injury, concussion, heart rhythm disorders, cardiac arrest, stroke, exhaustion, dehydration, heat illness, and hazards from faulty, falling, dropped or collapsing equipment. In serious cases these may result in permanent disability or death. You understand these risks and voluntarily assume all of them when you choose to exercise.'],
 ['5. Strong recommendation for qualified supervision','The Owner does not encourage you to train alone, especially with technical or heavy-load exercises. You should train under the direct guidance of a certified personal trainer (PT), yoga or Pilates teacher, boxing coach or physiotherapist; use a spotter and safety equipment for heavy lifts; and never practise partner or contact drills without a coach and protective gear. In-person professional guidance always takes priority over anything on the Site.'],
 ['6. Age','The Site is intended for people aged 18 and over. Anyone under 18 may use it only with the consent and supervision of a parent or guardian and a coach qualified for their age group.'],
 ['7. References and accuracy','Content is compiled, paraphrased and condensed from sources such as "The Complete Yoga Poses" (PDF), Mladen Jovanović\'s "HIIT Manual", ACSM physical-activity guidance and other public sources; some parts rely only on common training knowledge. Citing a source does not mean its authors or organisations endorse, sponsor or are responsible for the Site. Content may be incomplete, outdated, simplified or unsuitable for your body and circumstances. Durations, sets and reps are general suggestions, not safe doses for any individual.'],
 ['8. Third-party links and content','Links to YouTube, PDFs or other websites are provided for convenience only. Many are search links, so what appears can change at any time. The Owner does not control, guarantee or accept responsibility for the accuracy, safety, copyright or opinions of that content, and a link does not imply sponsorship or recommendation.'],
 ['9. Timers and tools','Timers, sound cues, random workouts and other tools are conveniences only. They may be inaccurate or interrupted (for example by browser throttling in the background, a flat battery, muted sound or technical faults). Do not rely on them for safety; always listen to your body and decide for yourself when to stop.'],
 ['10. Equipment, clothing and environment','You are solely responsible for checking the condition of equipment, the floor, the space, temperature, hydration, clothing and footwear. Equipment and clothing information on the Site is general guidance only.'],
 ['11. No warranties','The Site and all content are provided "as is" and "as available" without warranties of any kind, express or implied, including as to accuracy, completeness, fitness for a particular purpose, safety or training results.'],
 ['12. Limitation of liability','To the maximum extent permitted by law, the Owner, contributors and related parties are not liable for any injury, illness, death, property loss, medical expenses, loss of income or any direct, indirect, special, consequential or punitive damages arising from or related to the use of, or inability to use, the Site, even if advised of the possibility of such damages. Where liability cannot be excluded by law, the Owner\'s total maximum liability shall not exceed the amount you paid to use the Site (currently zero).'],
 ['13. Release and waiver of claims','To the extent permitted by law, you, on behalf of yourself, your heirs, legal representatives and assigns, release and waive all claims, demands and rights of action against the Owner relating to any injury or loss arising from your performing any exercise or activity mentioned on the Site, including where caused by the Owner\'s ordinary negligence.'],
 ['14. Indemnification','You agree to indemnify and hold the Owner harmless from any claims, losses and expenses (including reasonable legal fees) arising from your breach of these Terms, your misuse of the Site, or your sharing or instructing others (including anyone under 18) to exercise using content from the Site.'],
 ['15. Gyms, instructors and third parties','If you train at a gym or with an instructor, that relationship is entirely independent of the Site. The Owner is not responsible for their facilities, services, qualifications or conduct. Follow their rules and direct instructions.'],
 ['16. Personal data','The Site does not upload your health information to any server. Your choices (language, workout list, acceptance of these Terms) are stored locally in your browser only and can be deleted at any time by clearing your browser data.'],
 ['17. Intellectual property','The Site\'s design and presentation belong to the Owner. Third-party names, documents and trademarks belong to their respective owners. You may not copy the Site for commercial purposes without permission.'],
 ['18. Governing law and disputes','These Terms are governed by the laws of Vietnam. The parties will first try to resolve disputes through good-faith negotiation; failing that, disputes fall under the jurisdiction of the competent courts of Ho Chi Minh City, Vietnam. Nothing in these Terms excludes or limits any consumer right that cannot lawfully be excluded, or any liability that cannot lawfully be excluded (for example for wilful misconduct or gross negligence).'],
 ['19. Severability and entire agreement','If any provision is held invalid or unenforceable, the remaining provisions stay in effect. These Terms are the entire agreement between you and the Owner regarding use of the Site.'],
 ['20. Changes','The Owner may update these Terms at any time; the new version takes effect when posted. Continued use of the Site means you accept the new version, and the Site may ask you to confirm again.'],
 ['21. Emergencies','If you or anyone else is seriously injured or has dangerous symptoms, stop exercising and call emergency services immediately: 115 in Vietnam (or your local emergency number, for example 112).'],
 ['22. Contact','For questions about these Terms, please get in touch through www.alessandratran.com.']],

function startRace(){if(duck.racing||duck.list.length<2)return;duck.racing=true;duck.pos=duck.list.map(function(){return 0;});
  $('#res-duck').innerHTML='';$$('#lanes .lane').forEach(function(l){l.classList.remove('win');});$('#go').disabled=true;$('#go').textContent=t('racing');
  (function f(){var w=raceFrame();if(w<0){requestAnimationFrame(f);return;}duck.racing=false;$('#go').disabled=false;$('#go').textContent=t('go');
    $$('#lanes .lane')[w].classList.add('win');showRes('duck',duck.list[w],'whyR','today');})();}
$('#go').onclick=startRace;$('#newduck').onclick=function(){if(!duck.racing)newDucks();};

/* ---------- cards ---------- */
var deckList=[];
function dealCards(){var p=pool();deckList=sample(p,Math.min(5,p.length));$('#res-cards').innerHTML='';delete SHOWN.cards;
  $('#deck').innerHTML=deckList.length>=2?deckList.map(function(m,i){return '<button type="button" class="pc" data-c="'+i+'" style="--h:'+DISC[m.d].h+'" aria-label="Card '+(i+1)+'"><div class="in"><div class="b"><span>♠</span></div><div class="f"><span style="font-size:28px">'+DISC[m.d].e+'</span><b>'+esc(m.n)+'</b><i>'+esc(dn(m.d))+'</i></div></div></button>';}).join(''):'<div class="empty" style="grid-column:1/-1">'+t('noPool')+'</div>';}
$('#deck').addEventListener('click',function(e){var b=e.target.closest('.pc');if(!b||$('#deck .pc.open'))return;b.classList.add('open');$$('#deck .pc').forEach(function(x){if(x!==b)x.classList.add('dim');});
  setTimeout(function(){showRes('cards',deckList[+b.dataset.c],'whyR','today');},reduce?0:650);});
$('#deal').onclick=dealCards;

/* ---------- quick picks ---------- */
var coin={a:null,b:null,rot:0,busy:false};
function coinNew(){var p=sample(pool(),2);coin.a=p[0]||null;coin.b=p[1]||null;coin.rot=0;var c=$('#coin');c.style.transition='none';c.style.transform='rotateY(0deg)';
  $('#cA').innerHTML=coin.a?'<b>A</b>'+esc(coin.a.n):'';$('#cB').innerHTML=coin.b?'<b>B</b>'+esc(coin.b.n):'';$('#flip').disabled=!(coin.a&&coin.b);delete SHOWN.quick;$('#res-quick').innerHTML=(coin.a&&coin.b)?'':'<div class="empty">'+t('noPool')+'</div>';}
$('#flip').onclick=function(){if(coin.busy||!coin.a||!coin.b)return;coin.busy=true;var heads=Math.random()<.5;coin.rot=Math.ceil(coin.rot/360)*360+1800+(heads?0:180);
  var cur=$('#coin');cur.style.transition=reduce?'none':'transform 1.4s cubic-bezier(.2,.7,.2,1)';cur.style.transform='rotateY('+coin.rot+'deg)';
  setTimeout(function(){coin.busy=false;showRes('quick',heads?coin.a:coin.b,'whyR','coinW');},reduce?0:1450);};
$('#coinNew').onclick=coinNew;
var PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
var dice={items:[],busy:false};
function drawDie(n){var h='';for(var i=0;i<9;i++)h+='<i class="'+(PIPS[n].indexOf(i)>=0?'on':'')+'"></i>';$('#die').innerHTML=h;}
function drawDList(w){$('#dlist').innerHTML=dice.items.map(function(m,i){return '<li class="'+(w===i?'win':'')+'"><b>'+(i+1)+'</b><span>'+esc(m.n)+'</span></li>';}).join('');}
function diceNew(){dice.items=sample(pool(),6);drawDie(6);drawDList(-1);$('#roll').disabled=dice.items.length<2;}
$('#roll').onclick=function(){if(dice.busy||dice.items.length<2)return;dice.busy=true;var die=$('#die'),n=dice.items.length,ticks=0;die.classList.add('roll');drawDList(-1);
  var iv=setInterval(function(){drawDie(1+rnd(6));ticks++;if(ticks>(reduce?1:9)){clearInterval(iv);die.classList.remove('roll');var i=rnd(n);drawDie(Math.min(6,i+1));drawDList(i);dice.busy=false;showRes('quick',dice.items[i],'whyR','diceW');}},90);};
$('#diceNew').onclick=diceNew;
var slotBusy=false;
$('#pull').onclick=function(){var p=pool();if(slotBusy||p.length<2)return;slotBusy=true;$('#pull').disabled=true;var d=40,ticks=0,max=reduce?1:20,win=p[rnd(p.length)];
  (function step(){ticks++;var m=ticks>=max?win:p[rnd(p.length)];$('#slotwin').textContent=m.n;
    if(ticks<max){d*=1.12;setTimeout(step,d);}else{slotBusy=false;$('#pull').disabled=false;showRes('quick',win,'whyR','today');}})();};

/* ---------- session ---------- */
function sessMinutes(){var s=0;session.forEach(function(id){var e=byId(id);if(e)s+=e.tm.tot+(session.length>1?10:5);});return Math.max(1,Math.round(s/60));}
function renderSession(){
  $('#sesslist').innerHTML=session.length?session.map(function(id,i){var e=byId(id);return '<li><span>'+(i+1)+'. '+nm(e)+' <small style="color:var(--mute)">· '+esc(dn(e.d))+' · ≈'+dur(e)+' '+t('min')+'</small></span><span class="ctl"><button class="rm" type="button" data-up="'+i+'" aria-label="'+t('up')+'">↑</button><button class="rm" type="button" data-dn="'+i+'" aria-label="'+t('down')+'">↓</button><button class="rm" type="button" data-rm="'+i+'" aria-label="'+t('remove')+'">✕</button></span></li>';}).join(''):'<div class="empty">'+t('sessEmpty')+'</div>';
  $('#sesstot').textContent=session.length?t('sessTot',{n:session.length,m:sessMinutes()}):'';
  $('#sessgo').disabled=!session.length;$('#sessclear').hidden=!session.length;
}
$('#sesslist').addEventListener('click',function(e){var b;
  if(b=e.target.closest('[data-rm]')){session.splice(+b.dataset.rm,1);}
  else if(b=e.target.closest('[data-up]')){var i=+b.dataset.up;if(i>0){var x=session[i];session[i]=session[i-1];session[i-1]=x;}}
  else if(b=e.target.closest('[data-dn]')){var j=+b.dataset.dn;if(j<session.length-1){var y=session[j];session[j]=session[j+1];session[j+1]=y;}}
  else return;saveSess();renderSession();});
$('#sessgo').onclick=function(){if(!session.length)return;var ph=[];session.forEach(function(id,i){var e=byId(id);ph=ph.concat(phasesFor(e,true,i>0?10:5));});startTimer(ph,t('t_session'));};
function pick(ds){var p=EXS.filter(function(e){return ds.indexOf(e.d)>=0;});return p[rnd(p.length)];}
$('#sessauto').onclick=function(){
  var plan=[pick(['mobility']),pick(['hiit','cardio','boxing','kettlebell']),pick(['strength','calisthenics','kettlebell']),pick(['strength','calisthenics','pilates']),pick(['core','pilates']),pick(['yoga','mobility'])];
  var ids=[];plan.forEach(function(e){if(e&&ids.indexOf(e.id)<0)ids.push(e.id);});session=ids;saveSess();renderSession();};
var sclr=false;
$('#sessclear').onclick=function(){var b=$('#sessclear');if(!sclr){sclr=true;b.textContent=t('confirmClear');setTimeout(function(){sclr=false;b.textContent=t('sessClear');},3000);return;}sclr=false;session=[];saveSess();renderSession();b.textContent=t('sessClear');};

/* ---------- free timer ---------- */
$('#fgo').onclick=function(){
  var w=Math.max(1,Math.min(3600,+$('#fw').value||30)),r=Math.max(0,Math.min(3600,+$('#fr').value||0)),n=Math.max(1,Math.min(99,+$('#fn').value||1));
  var ph=[{t:'prep',s:5,ex:null}];for(var i=1;i<=n;i++){ph.push({t:'work',s:w,ex:null,r:i,n:n,k:'go'});if(i<n&&r>0)ph.push({t:'rest',s:r,ex:null,r:i,n:n});}
  startTimer(ph,t('free'));};
$$('[data-preset]').forEach(function(b){b.onclick=function(){var p=b.dataset.preset.split(',');$('#fw').value=p[0];$('#fr').value=p[1];$('#fn').value=p[2];};});

/* ---------- timer engine ---------- */
var TM={ph:[],i:0,left:0,end:0,run:false,iv:0,title:'',snd:true,done:false,ac:null,wl:null};
function phasesFor(e,prep,prepS){var m=e.tm,ph=[];if(prep)ph.push({t:'prep',s:prepS||5,ex:e.id});
  for(var r=1;r<=m.n;r++){ph.push({t:'work',s:m.w,ex:e.id,r:r,n:m.n,k:m.k});if(r<m.n&&m.r>0)ph.push({t:'rest',s:m.r,ex:e.id,r:r,n:m.n});}return ph;}
function beep(f,ms){if(!TM.snd)return;try{if(!TM.ac)TM.ac=new (window.AudioContext||window.webkitAudioContext)();var a=TM.ac;if(a.state==='suspended')a.resume();var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+ms/1000);}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function startTimer(ph,title){
  if(!ph.length)return;stopTick();TM.ph=ph;TM.i=0;TM.left=ph[0].s;TM.end=Date.now()+TM.left*1000;TM.run=true;TM.title=title;TM.done=false;
  $('#dock').hidden=false;document.body.classList.add('hasdock');beep(660,120);
  try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){TM.wl=l;}).catch(function(){});}catch(e){}
  drawDock();TM.iv=setInterval(tick,200);
}
function stopTick(){if(TM.iv){clearInterval(TM.iv);TM.iv=0;}}
function releaseWL(){try{if(TM.wl){TM.wl.release();TM.wl=null;}}catch(e){}}
var lastSec=-1;
function tick(){
  if(!TM.run)return;var left=Math.ceil((TM.end-Date.now())/1000);
  if(left!==lastSec){lastSec=left;if(left>0&&left<=3){beep(880,90);}}
  if(left<=0){nextPhase();return;}TM.left=left;updateDock();
}
function nextPhase(){
  if(TM.i>=TM.ph.length-1){stopTick();TM.run=false;TM.done=true;beep(523,200);setTimeout(function(){beep(659,200);},220);setTimeout(function(){beep(784,400);},440);vib([200,100,200,100,400]);releaseWL();drawDock();return;}
  TM.i++;TM.left=TM.ph[TM.i].s;TM.end=Date.now()+TM.left*1000;lastSec=-1;beep(TM.ph[TM.i].t==='work'?988:587,260);vib(TM.ph[TM.i].t==='work'?[120,60,120]:[200]);drawDock();
}
function cueFor(p){
  if(p.t==='prep')return t('cue_prep');if(p.t==='rest')return t('cue_rest');
  var e=p.ex?byId(p.ex):null;if(p.k==='reps'&&e){var r=repsOf(e);return t('cue_reps',{x:r});}return t('cue_'+(p.k||'go'));}
function phName(p){var e=p.ex?byId(p.ex):null;return e?e.n+(L==='vi'&&e.vi?' ('+e.vi+')':''):TM.title;}
function drawDock(){
  var dk=$('#dk');
  if(TM.done){dk.className='dk';dk.innerHTML='<div class="nm">'+esc(t('done'))+' 🎉</div><div class="cue">'+esc(t('doneP'))+'</div><div class="ctl"><button class="btn sm" type="button" id="dclose">'+t('closeD')+'</button></div>';return;}
  var p=TM.ph[TM.i],nx=TM.ph[TM.i+1];
  var lab=p.t==='prep'?t('prep'):p.t==='work'?t('work')+' · '+t('round',{a:p.r,b:p.n}):t('restL')+(p.n?' · '+t('round',{a:p.r,b:p.n}):'');
  var nxt='';if(nx){nxt=t('next')+': '+(nx.t==='work'?phName(nx):nx.t==='rest'?t('restL')+' '+nx.s+'s':phName(nx));}
  dk.className='dk '+p.t;
  dk.innerHTML='<div class="top2"><span class="pl" id="dpl">'+esc(lab)+'</span><span class="nx">'+esc(nxt)+'</span></div><div class="nm">'+esc(p.t==='rest'&&nx&&nx.ex?phName(nx):phName(p))+'</div><div class="cue">'+esc(cueFor(p))+'</div><div class="tm" id="dtm" aria-live="off">'+fmt(TM.left)+'</div><div class="bar"><i id="dbar"></i></div>'+
   '<div class="ctl"><button class="btn sm" type="button" id="dpause">'+(TM.run?t('pause'):t('resume'))+'</button><button class="btn sm ghost" type="button" id="dskip">'+t('skip')+'</button><button class="btn sm ghost" type="button" id="dsnd" aria-pressed="'+TM.snd+'">'+(TM.snd?'🔊':'🔈')+' '+t('snd')+'</button><button class="btn sm ghost" type="button" id="dstop">'+t('stop')+'</button></div>';
  updateDock();
}
function updateDock(){var p=TM.ph[TM.i];if(!p)return;var tm=$('#dtm');if(tm)tm.textContent=fmt(TM.left);var b=$('#dbar');if(b)b.style.width=Math.round((1-TM.left/p.s)*100)+'%';}
$('#dock').addEventListener('click',function(e){
  if(e.target.closest('#dclose')||e.target.closest('#dstop')){stopTick();TM.run=false;TM.done=false;releaseWL();$('#dock').hidden=true;document.body.classList.remove('hasdock');return;}
  if(e.target.closest('#dpause')){if(TM.run){TM.run=false;TM.left=Math.ceil((TM.end-Date.now())/1000);}else{TM.run=true;TM.end=Date.now()+TM.left*1000;}drawDock();return;}
  if(e.target.closest('#dskip')){nextPhase();return;}
  if(e.target.closest('#dsnd')){TM.snd=!TM.snd;drawDock();}
});

/* ---------- library ---------- */
function sortFn(k){return {lv:function(a,b){return a.lv-b.lv||a.n.localeCompare(b.n);},lvd:function(a,b){return b.lv-a.lv||a.n.localeCompare(b.n);},t:function(a,b){return a.tm.tot-b.tm.tot;},az:function(a,b){return a.n.localeCompare(b.n);}}[k];}
function libList(){var q=fold($('#q').value.trim()),k=$('#sort').value||'lv';
  return pool().filter(function(e){return !q||fold(e.n).indexOf(q)>=0||fold(e.vi).indexOf(q)>=0||fold(dn(e.d)).indexOf(q)>=0;}).sort(sortFn(k));}
var openLib={};
function renderLib(){
  var l=libList();$('#libhelp').textContent=t('libHelp',{n:l.length});
  $('#liblist').innerHTML=l.length?l.map(function(e){var o=!!openLib[e.id];
    return '<div class="lwrap"><div class="lrow" data-open="'+e.id+'" role="button" tabindex="0" aria-expanded="'+o+'">'+poster(e)+'<div><h4>'+nm(e)+'</h4><p>'+esc(dn(e.d))+' · '+esc(LV[e.lv][L])+'</p></div><div class="sc"><span class="badge w">≈ '+dur(e)+' '+t('min')+'</span><span class="badge">'+(o?'▲':'▼')+'</span></div></div>'+(o?'<div class="lx">'+exCard(e,'','')+'</div>':'')+'</div>';}).join(''):'<div class="empty">'+t('noRes')+'</div>';
}
$('#liblist').addEventListener('click',function(e){var r=e.target.closest('[data-open]');if(!r||e.target.closest('a,button'))return;var id=r.dataset.open;openLib[id]=!openLib[id];renderLib();});
$('#liblist').addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var r=e.target.closest('[data-open]');if(!r)return;e.preventDefault();var id=r.dataset.open;openLib[id]=!openLib[id];renderLib();});
$('#q').addEventListener('input',renderLib);$('#sort').addEventListener('change',renderLib);

/* ---------- terms + consent ---------- */
var CKEY='homNayTapGi.consent.v1';
function renderTerms(){var d=Tm[L];$('#termsh').textContent=d.title;
  $('#tbody').innerHTML='<p><em>'+esc(d.upd)+'</em></p><p>'+esc(d.intro)+'</p>'+d.s.map(function(s){return '<h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p>';}).join('');
  $('#tclose').setAttribute('aria-label',d.close);}
var lastFocus=null;
function openTerms(){lastFocus=document.activeElement;renderTerms();$('#terms').hidden=false;$('#tbody').scrollTop=0;$('#tclose').focus();}
function closeTerms(){$('#terms').hidden=true;if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}}
$('#bannerlink').onclick=openTerms;$('#footterms').onclick=openTerms;$('#gread').onclick=openTerms;$('#tclose').onclick=closeTerms;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#terms').hidden)closeTerms();});
$('#terms').addEventListener('click',function(e){if(e.target===$('#terms'))closeTerms();});
function renderGate(){var d=Tm[L];$('#gateh').textContent=d.gateH;$('#gatep').textContent=d.gateP;$('#gatel').innerHTML=d.gateL.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
  $('#gatec').textContent=d.gateC;$('#gok').textContent=d.gateB;$('#gread').textContent=d.gateR;$('#gatex').textContent=d.gateX;}
function needGate(){try{var c=JSON.parse(lsGet(CKEY)||'null');return !(c&&c.v===1);}catch(e){return true;}}
function openGate(){renderGate();$('#gate').hidden=false;$('#app').inert=true;$('#dock').inert=true;setTimeout(function(){try{$('#gchk').focus();}catch(e){}},50);}
$('#gchk').addEventListener('change',function(){$('#gok').disabled=!this.checked;});
$('#gok').onclick=function(){if(!$('#gchk').checked)return;lsSet(CKEY,JSON.stringify({v:1,t:new Date().toISOString(),l:L}));$('#gate').hidden=true;$('#app').inert=false;$('#dock').inert=false;};

/* ---------- language ---------- */
function applyStatic(){
  $$('[data-i]').forEach(function(el){el.textContent=t(el.dataset.i);});
  $('#h1').innerHTML=L==='vi'?'Hôm nay <em>tập gì?</em>':'What to <em>train</em> today?';
  $('#spin').textContent=wheel.spinning?t('spinning'):t('spin');$('#reshuffle').textContent=t('reshuffle');
  $('#go').textContent=duck.racing?t('racing'):t('go');$('#newduck').textContent=t('newduck');$('#deal').textContent=t('deal');
  $('#flip').textContent=t('flip');$('#coinNew').textContent=t('coinNew');$('#roll').textContent=t('roll');$('#diceNew').textContent=t('diceNew');$('#pull').textContent=t('pull');
  $('#sessgo').textContent='▶ '+t('sessGo');$('#sessauto').textContent=t('sessAuto');$('#sessclear').textContent=t('sessClear');$('#fgo').textContent='▶ '+t('fgo');
  $('#q').placeholder=t('search');$('#q').setAttribute('aria-label',t('search'));
  var sv=$('#sort').value||'lv';$('#sort').innerHTML=['lv','lvd','t','az'].map(function(k){return '<option value="'+k+'">'+t('s_'+k)+'</option>';}).join('');$('#sort').value=sv;
  $('#yr').textContent=new Date().getFullYear();$('#srcnote').textContent=t('srcnote');
  $('#bannertxt').textContent=Tm[L].banner;$('#bannerlink').textContent=Tm[L].bannerL;$('#footterms').textContent=Tm[L].footT;
  $$('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.l===L));});
  document.documentElement.lang=L;
}
function setLang(l,fromHash){
  if(l!=='vi'&&l!=='en')return;L=l;lsSet('homNayTapGi.lang',l);
  if(!fromHash){try{history.replaceState(null,'','#'+l);}catch(e){location.hash=l;}}
  applyStatic();renderTabs();renderChips();
  if(qs.step>=Q.length&&qRank.length)drawQuiz();else renderQuiz();
  rerenderRes();if(!$('#terms').hidden)renderTerms();if(!$('#gate').hidden)renderGate();
  if(tab==='lib')renderLib();if(tab==='session')renderSession();if(TM.ph.length&&!$('#dock').hidden)drawDock();
}
$$('.lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l);};});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if((h==='vi'||h==='en')&&h!==L)setLang(h,true);});

/* ---------- init ---------- */
(function(){
  var h=location.hash.slice(1),l='vi';
  if(h==='en'||h==='vi')l=h;else{var s=lsGet('homNayTapGi.lang');if(s==='en'||s==='vi')l=s;else if((navigator.language||'').toLowerCase().indexOf('vi')!==0)l='en';}
  L=l;applyStatic();renderTabs();renderChips();renderQuiz();
  $$('section[role=tabpanel]').forEach(function(s){s.hidden=s.id!=='p-quiz';});$('#fbar').hidden=true;
  if(needGate())openGate();
})();
})();
</script>
