<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hôm Nay Tập Gì</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Playfair+Display:wght@600;800&display=swap">
<style>

:root{--bg:#050507;--bg2:#0d0d12;--ink:#F4F4F6;--mute:#A6A9B5;--silver:#C9CDD6;--line:rgba(201,205,214,.2);--gold:#D4AF37;--goldhi:#F6E7A8;--goldlo:#8F6B12;--f-d:'Playfair Display',Georgia,'Times New Roman',serif;--f-b:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--gg:linear-gradient(135deg,#F6E7A8 0%,#D4AF37 48%,#9A7410 100%);color-scheme:dark}
*{box-sizing:border-box}
html{background:#050507}
body{margin:0;font:400 16px/1.55 var(--f-b);color:var(--ink);background:radial-gradient(1100px 520px at 50% -8%,rgba(201,205,214,.16),transparent 62%),radial-gradient(700px 400px at 100% 30%,rgba(212,175,55,.07),transparent 60%),linear-gradient(180deg,#0a0a0e,#050507 60%);background-color:#050507;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:960px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-weight:500;font-size:14px;color:var(--silver);letter-spacing:.02em}
.back:hover{color:var(--goldhi)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#0a0a0d;margin-left:auto}
.lang button{border:0;background:transparent;min-width:52px;min-height:38px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--gg);color:#16120A}
.hero{padding:44px 0 22px;text-align:center}
.kick{font:700 12px var(--f-b);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h1{margin:0;font:800 clamp(40px,9vw,76px)/1.02 var(--f-d);letter-spacing:-.01em;text-wrap:balance;background:linear-gradient(180deg,#fff 0%,#C9CDD6 45%,#7C808C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:italic;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:60ch;margin:16px auto 0;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,#141418,#09090c);margin:22px 0 18px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;border-radius:999px;padding:11px 18px;min-height:44px;font-weight:700;font-size:14px;color:var(--silver)}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:var(--gg);color:#16120A;box-shadow:0 6px 20px rgba(212,175,55,.25)}
.panel{border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.012) 38%,rgba(0,0,0,.25)),#0c0c10;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.65)}
.fbar{margin:0 0 18px}
.lbl{font:700 11px var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#0a0a0d;color:var(--silver);border-radius:999px;padding:7px 14px;min-height:38px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--gold);color:#fff}
.chip[aria-pressed="true"]{background:var(--ink);color:#0a0a0d;border-color:var(--ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:15px;letter-spacing:.02em;text-decoration:none;background:var(--gg);color:#16120A;box-shadow:0 8px 24px rgba(212,175,55,.22),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default;transform:none;filter:none}
.btn.ghost{background:#0a0a0d;color:#fff;border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--goldhi)}
.btn.white{background:#F4F4F6;color:#0a0a0d;box-shadow:none}
.btn.sm{min-height:40px;padding:8px 18px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
h2{font:800 clamp(24px,5vw,34px)/1.12 var(--f-d);margin:0 0 6px;letter-spacing:-.005em;text-wrap:balance}
.help{color:var(--mute);margin:0 0 18px;font-size:14px}
/* quiz */
.prog{display:flex;gap:6px;margin:0 0 18px}.prog i{flex:1;height:4px;border-radius:4px;background:#25252c}.prog i.on{background:var(--gg)}
.qn{font:700 11px var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:16px}
.opt{text-align:left;border:1px solid var(--line);background:linear-gradient(160deg,#17171c,#0b0b0e);border-radius:16px;padding:16px;font-weight:500;min-height:64px;color:var(--ink)}
.opt:hover{border-color:var(--gold);transform:translateY(-1px)}
.opt b{display:block;font-size:22px;margin-bottom:4px}
/* poster + result */
.res{margin-top:26px}
.mv{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:22px;align-items:start}
.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(165deg,hsl(var(--h) 42% 30%),hsl(var(--h) 45% 9%) 70%);border:1px solid rgba(246,231,168,.45);box-shadow:0 14px 34px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:space-between;padding:12px;min-width:0}
.poster:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 48%,transparent 60%)}
.poster .ltr{font:800 clamp(64px,13vw,104px)/1 var(--f-d);background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin:auto 0}
.poster small{font:700 11px var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--goldhi);opacity:.9;text-align:center}
.poster .hole{display:flex;justify-content:space-between}.poster .hole i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.2)}
.mv h3{margin:0;font:800 clamp(24px,5vw,34px)/1.12 var(--f-d);overflow-wrap:anywhere}
.vt{color:var(--silver);font-weight:600;font-size:.62em;font-family:var(--f-b)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);color:var(--silver)}
.badge.g{background:var(--gg);color:#16120A;border-color:transparent}
.badge.w{background:#F4F4F6;color:#0a0a0d;border-color:transparent}
.why{color:var(--mute);margin:0 0 6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.alts{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.alt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.alt span{min-width:0;overflow-wrap:anywhere}
.tick{display:inline-block;width:8px}
/* wheel */
.wheel-wrap{position:relative;width:min(100%,430px);margin:6px auto 0}
.wheel-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px #0a0a0d,0 0 0 8px var(--gold),0 24px 50px rgba(0,0,0,.7)}
.ptr{position:absolute;top:-14px;left:50%;width:0;height:0;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));z-index:2}
/* duck */
.lanes{display:grid;gap:8px;margin:14px 0}
.lane{position:relative;height:50px;border-radius:12px;background:repeating-linear-gradient(90deg,#111116 0 28px,#0b0b0e 28px 56px);border:1px solid var(--line);overflow:hidden}
.lane .dn{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:500;color:var(--mute);max-width:calc(100% - 90px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.lane .duck{position:absolute;left:0;top:4px;font-size:34px;line-height:40px;width:46px;text-align:center;z-index:2;transform:scaleX(-1)}
.lane .fin{position:absolute;right:0;top:0;bottom:0;width:12px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/12px 12px}
.lane.win{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.4)}
/* cards */
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:12px;margin:10px 0}
.pc{perspective:800px;border:0;background:none;padding:0;aspect-ratio:2/3;position:relative}
.pc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.pc.open .in{transform:rotateY(180deg)}
.pc .f,.pc .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;overflow:hidden}
.pc .b{background:repeating-linear-gradient(45deg,#16130a 0 8px,#0b0a05 8px 16px);border:1px solid var(--gold);box-shadow:inset 0 0 0 5px #0a0a0d,inset 0 0 0 6px rgba(212,175,55,.6)}
.pc .b span{font:800 40px var(--f-d);background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.pc .f{transform:rotateY(180deg);background:linear-gradient(165deg,hsl(var(--h) 42% 28%),hsl(var(--h) 45% 9%));border:1px solid rgba(246,231,168,.5);gap:6px}
.pc .f b{font:800 15px/1.2 var(--f-d);overflow-wrap:anywhere}
.pc .f i{font-style:normal;font-size:12px;color:var(--goldhi)}
.pc:not(.open):hover .in{transform:translateY(-4px)}
.pc.dim{opacity:.45}
/* quick */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.qc{border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(160deg,#15151a,#0a0a0d);display:flex;flex-direction:column;gap:10px;min-width:0}
.qc h3{margin:0;font:800 20px var(--f-d)}
.coinbox{perspective:700px;display:grid;place-items:center;height:120px}
.coin{width:96px;height:96px;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.coin div{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font:800 40px var(--f-d);border:3px solid #6b4f0c}
.coin .h{background:var(--gg);color:#16120A}.coin .tl{background:linear-gradient(135deg,#fff,#9ea2ad);color:#0a0a0d;transform:rotateY(180deg);border-color:#555a66}
.cside{font-size:14px;color:var(--silver);overflow-wrap:anywhere}.cside b{color:var(--goldhi);font-family:var(--f-d);margin-right:6px}
.die{width:92px;height:92px;margin:6px auto;border-radius:20px;background:linear-gradient(145deg,#fff,#c9cdd6);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;gap:2px;box-shadow:0 8px 0 #6b6f7b,0 16px 24px rgba(0,0,0,.6)}
.die i{width:100%;height:100%;max-width:18px;max-height:18px;place-self:center;border-radius:50%}.die i.on{background:#0a0a0d}
.die.roll{animation:shk .16s linear infinite}
@keyframes shk{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-3px)}100%{transform:rotate(-7deg)}}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--silver)}
.dl li{display:flex;gap:8px;padding:4px 8px;border-radius:8px;min-width:0}.dl li b{flex:none;color:var(--gold);width:16px}.dl li span{min-width:0;overflow-wrap:anywhere}
.dl li.win{background:var(--gg);color:#16120A}.dl li.win b{color:#16120A}
.slotwin{border:2px solid var(--gold);border-radius:14px;background:#06060a;min-height:84px;display:grid;place-items:center;text-align:center;padding:10px;font:800 20px/1.2 var(--f-d);overflow-wrap:anywhere;box-shadow:inset 0 0 30px rgba(212,175,55,.15)}
/* mine */
.in{width:100%;min-height:48px;border:1px solid var(--line);background:#07070a;color:var(--ink);border-radius:14px;padding:11px 16px;font:400 16px var(--f-b)}
.in:focus{outline:none;border-color:var(--gold)}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.ml{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.ml li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 16px;background:#09090c;min-width:0}
.ml li span{min-width:0;overflow-wrap:anywhere}
.rm{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#0a0a0d;color:var(--silver);font-size:18px}.rm:hover{border-color:var(--gold);color:var(--goldhi)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--mute)}
details.ps{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.ps summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;font-size:14px}
/* library */
.lib-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,200px);gap:10px;margin-bottom:14px}
select.in{appearance:auto}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow .poster{padding:3px;border-radius:7px;aspect-ratio:2/3}.lrow .poster .ltr{font-size:24px}.lrow .poster small,.lrow .poster .hole{display:none}
.lrow h4{margin:0;font:700 15px/1.3 var(--f-b);overflow-wrap:anywhere}
.lrow p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.lrow .sc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.more{display:flex;justify-content:center;margin-top:18px}
footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;display:grid;gap:8px}
footer a{color:var(--silver)}footer a:hover{color:var(--goldhi)}
footer b{color:var(--goldhi);font-weight:500}
[hidden]{display:none!important}
@media (max-width:620px){
 .mv{grid-template-columns:minmax(0,1fr)}.mv .poster{max-width:150px}
 .lrow{grid-template-columns:40px minmax(0,1fr)}.lrow .sc{grid-column:2;justify-content:flex-start}
 .lib-ctl,.add{grid-template-columns:1fr}
 .tab{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(212,175,55,.5);background:linear-gradient(90deg,rgba(212,175,55,.14),rgba(212,175,55,.04));border-radius:14px;padding:10px 14px;margin:14px 0 0;font-size:13px;color:var(--ink)}
.banner span.ic{flex:none;font-size:16px;line-height:1.4}
.linkb{border:0;background:none;padding:0;text-decoration:underline;color:var(--goldhi);font-weight:700;font-size:inherit;cursor:pointer}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.84);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.modal.top{z-index:110}
.mbox{background:linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 40%),#0c0c10;border:1px solid var(--gold);border-radius:20px;max-width:580px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.mbox.big{max-width:780px;display:flex;flex-direction:column;padding:0;overflow:hidden}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:clamp(20px,4vw,26px);margin:0}
.mbody{overflow:auto;padding:16px 24px 28px;font-size:14px;color:var(--silver)}
.mbody h3{font:700 15px var(--f-b);color:var(--goldhi);margin:20px 0 6px}
.mbody p{margin:0 0 6px}
.mbox ul.gl{padding-left:20px;margin:10px 0}.mbox ul.gl li{margin:8px 0}
.chk{display:flex;gap:12px;align-items:flex-start;margin:16px 0;cursor:pointer;font-size:14px}
.chk input{width:22px;height:22px;accent-color:#D4AF37;flex:none;margin-top:1px}
.gx{display:inline-block;margin-top:14px;font-size:13px;color:var(--mute)}
.xbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#0a0a0d;color:#fff;font-size:18px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:28px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(5,5,7,0),#050507 36%);pointer-events:none}
.dk{pointer-events:auto;max-width:640px;margin:0 auto;border:1px solid var(--gold);border-radius:22px;background:linear-gradient(160deg,#1a1a20,#09090c);padding:14px 18px;box-shadow:0 -10px 40px rgba(0,0,0,.7);display:grid;gap:8px}
.dk .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.dk .pl{font:700 12px var(--f-b);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.dk .nx{font-size:12px;color:var(--mute);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .nm{font:800 clamp(18px,4vw,22px)/1.2 var(--f-d);overflow-wrap:anywhere}
.dk .cue{font-size:13px;color:var(--silver);margin-top:-4px}
.dk .tm{font:800 clamp(52px,16vw,76px)/1 var(--f-d);font-variant-numeric:tabular-nums;text-align:center;background:linear-gradient(180deg,#fff,#C9CDD6);-webkit-background-clip:text;background-clip:text;color:transparent}
.dk.work .tm{background:var(--gg);-webkit-background-clip:text;background-clip:text}
.dk.rest .tm{background:linear-gradient(180deg,#9fb4c9,#5c6f84);-webkit-background-clip:text;background-clip:text}
.bar{height:6px;border-radius:6px;background:#25252c;overflow:hidden}.bar i{display:block;height:100%;background:var(--gg);width:0;transition:width .25s linear}
.dk .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
body.hasdock{padding-bottom:300px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;margin:10px 0;color:var(--silver)}
.steps li:before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--gg);color:#16120A;font-weight:700;display:grid;place-items:center;font-size:13px}
.kv{display:grid;gap:10px;margin:14px 0}
.kv p{margin:0;font-size:14px;color:var(--silver)}
.kv b{display:block;font:700 11px var(--f-b);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.kv .chips{gap:6px}.kv .badge{font-weight:500}
.cau{font-size:14px;color:var(--silver);margin:10px 0}.cau b{color:var(--goldhi)}

var DK=['yoga','pilates','strength','hiit','boxing','core','cardio','mobility','kettlebell','calisthenics'];
var DISC={
 yoga:{vi:'Yoga',en:'Yoga',e:'🧘',h:150,out:'yoga',ref:'https://irp.cdn-website.com/6b820530/files/uploaded/The%20Complete%20Yoga%20Poses.pdf',rn:{vi:'The Complete Yoga Poses (PDF)',en:'The Complete Yoga Poses (PDF)'},
  w:{vi:`Theo tài liệu tham khảo: thở thoải mái, không gồng. Nếu hơi thở bị đứt quãng hoặc khó thở, hãy giảm độ sâu của tư thế. Giữ mỗi tư thế khoảng 30–90 giây, dừng ở mức căng nhẹ, không đau. Thận trọng nếu bạn bị huyết áp cao, đau đầu/đau nửa đầu, hen suyễn, đang mang thai hoặc sau sinh/sau mổ (tránh tư thế đảo ngược, xoắn sâu và gập ưỡn mạnh). Tránh hot yoga khi mang thai hoặc tiền mãn kinh.`,
     en:`Per the reference: breathe comfortably and never strain. If your breath becomes choppy or restricted, ease off the pose. Hold each pose for roughly 30–90 seconds and stay at mild stretch, never pain. Take extra care with high blood pressure, headaches or migraines, asthma, pregnancy, or after childbirth or surgery (avoid inversions, deep twists and strong backbends). Avoid hot yoga during pregnancy or menopause.`}},
 pilates:{vi:'Pilates',en:'Pilates',e:'🌀',h:320,out:'pilates',ref:'https://www.pilatesmethodalliance.org',rn:{vi:'Pilates Method Alliance',en:'Pilates Method Alliance'},
  w:{vi:`Giữ lưng dưới ổn định, thở đều, không giật hay nín thở. Cẩn thận với các động tác gập cột sống nếu bạn bị loãng xương, thoát vị đĩa đệm, đau lưng, đang mang thai hoặc sau sinh. Nên học với giáo viên Pilates có chứng chỉ trước khi tự tập.`,
     en:`Keep your lower back stable, breathe steadily and never jerk or hold your breath. Be careful with spinal-flexion moves if you have osteoporosis, a disc injury, back pain, or are pregnant or postpartum. Learn with a certified Pilates instructor before practising alone.`}},
 strength:{vi:'Tạ & sức mạnh',en:'Strength training',e:'🏋️',h:15,out:'lift',ref:'https://www.nsca.com',rn:{vi:'NSCA (Hiệp hội Sức mạnh & Thể lực Mỹ)',en:'NSCA (National Strength and Conditioning Association)'},
  w:{vi:`Học kỹ thuật với tạ nhẹ hoặc tạ không trước, tăng tạ từ từ. Với các bài tạ nặng (squat, bench press, deadlift) cần người đỡ (spotter) hoặc giá an toàn có chặn tạ, và nên nhờ PT kiểm tra kỹ thuật. Không tập khi quá mệt, đau khớp hoặc khi mất kiểm soát động tác. Không nín thở quá lâu và không giật tạ.`,
     en:`Learn the movement with light weight or an empty bar first and add load gradually. For heavy lifts (squat, bench press, deadlift) use a spotter or safety bars, and have a personal trainer check your technique. Do not train when exhausted, when a joint hurts, or when you are losing control of the movement. Do not hold your breath for long and never jerk the weight.`}},
 hiit:{vi:'HIIT',en:'HIIT',e:'⚡',h:48,out:'hiit',ref:'https://www.cie-dc.com/uploads/1/3/2/9/132987652/hiit-manual_-_mladen_jovanovic_1.pdf',rn:{vi:'HIIT Manual – Mladen Jovanović (PDF)',en:'HIIT Manual by Mladen Jovanović (PDF)'},
  w:{vi:`HIIT có cường độ rất cao, tạo áp lực lớn lên tim và khớp. Cần khởi động kỹ, nghỉ đủ giữa các buổi và tăng dần: theo tài liệu tham khảo, nên thêm khối lượng (số lần, số hiệp) trước khi tăng cường độ. Cần bác sĩ đồng ý nếu bạn có bệnh tim mạch, huyết áp cao hoặc lâu ngày ít vận động. Dừng ngay khi chóng mặt, đau ngực hoặc khó thở bất thường.`,
     en:`HIIT is very high intensity and places heavy demands on your heart and joints. Warm up well, rest enough between sessions and progress gradually: the reference suggests adding volume (reps or sets) before raising intensity. Get medical clearance if you have heart disease, high blood pressure or have been inactive for a long time. Stop immediately if you feel dizzy, have chest pain or unusual shortness of breath.`}},
 boxing:{vi:'Boxing',en:'Boxing',e:'🥊',h:0,out:'box',ref:'https://en.wikipedia.org/wiki/Boxing_styles_and_technique',rn:{vi:'Boxing styles and technique (Wikipedia)',en:'Boxing styles and technique (Wikipedia)'},
  w:{vi:`Quấn băng tay và dùng găng đúng cỡ để bảo vệ cổ tay, bàn tay; giữ cổ tay thẳng khi đấm. Không tập đối kháng hay sparring khi chưa có huấn luyện viên, mũ bảo hiểm, bịt răng và đồ bảo hộ. Các cú đánh vào đầu có thể gây chấn động não. Dừng ngay nếu đau cổ tay, vai hoặc cổ.`,
     en:`Wrap your hands and use correctly sized gloves to protect your wrists and hands, and keep your wrists straight when punching. Do not spar or train with a partner without a coach, headgear, mouthguard and protective gear. Blows to the head can cause concussion. Stop immediately if you feel pain in your wrist, shoulder or neck.`}},
 core:{vi:'Cơ bụng · Core',en:'Core',e:'🎯',h:30,out:'yoga',ref:'https://acsm.org/read-research/trending-topics-resource-pages/physical-activity-guidelines',rn:{vi:'ACSM – Khuyến nghị hoạt động thể chất',en:'ACSM physical activity guidelines'},
  w:{vi:`Giữ lưng dưới không võng quá mức và thở đều. Dừng nếu đau lưng hoặc đau cổ. Người đau lưng mạn tính, thoát vị đĩa đệm, sau sinh hoặc sau phẫu thuật bụng cần hỏi ý kiến chuyên gia trước khi tập các bài cơ bụng.`,
     en:`Do not over-arch your lower back and keep breathing steadily. Stop if your back or neck hurts. If you have chronic back pain, a disc injury, are postpartum or have had abdominal surgery, ask a professional before training your abs.`}},
 cardio:{vi:'Cardio',en:'Cardio',e:'🏃',h:195,out:'run',ref:'https://acsm.org/read-research/trending-topics-resource-pages/physical-activity-guidelines',rn:{vi:'ACSM – Khuyến nghị hoạt động thể chất',en:'ACSM physical activity guidelines'},
  w:{vi:`Tăng dần thời gian và cường độ; khởi động và hạ nhiệt; uống đủ nước và tránh tập khi trời nắng nóng gắt. Khi chạy hoặc đạp xe ngoài đường, tuân thủ luật giao thông và mặc đồ dễ nhìn thấy. Ngừng ngay nếu đau ngực, chóng mặt hoặc khó thở bất thường.`,
     en:`Increase time and intensity gradually; warm up and cool down; drink enough water and avoid exercising in harsh heat. When running or cycling outdoors, follow traffic rules and wear visible clothing. Stop immediately if you have chest pain, dizziness or unusual shortness of breath.`}},
 mobility:{vi:'Giãn cơ · Linh hoạt',en:'Mobility & stretching',e:'🔄',h:100,out:'flex',ref:'https://acsm.org/read-research/trending-topics-resource-pages/physical-activity-guidelines',rn:{vi:'ACSM – Khuyến nghị hoạt động thể chất',en:'ACSM physical activity guidelines'},
  w:{vi:`Chỉ giãn đến mức căng nhẹ, không đau nhói và không nảy người. Khởi động nhẹ trước khi giãn sâu. Con lăn foam không được đè trực tiếp lên khớp hoặc lưng dưới. Dừng nếu thấy tê, râm ran hoặc đau nhói.`,
     en:`Stretch only to mild tension, never sharp pain, and do not bounce. Warm up lightly before deep stretching. Never roll directly over joints or your lower back with a foam roller. Stop if you feel numbness, tingling or sharp pain.`}},
 kettlebell:{vi:'Tạ ấm',en:'Kettlebell',e:'🔔',h:25,out:'lift',ref:'https://www.nsca.com',rn:{vi:'NSCA (Hiệp hội Sức mạnh & Thể lực Mỹ)',en:'NSCA (National Strength and Conditioning Association)'},
  w:{vi:`Bài tạ ấm có chuyển động nhanh và tải động học cao. Hãy học kiểu gập hông (hip hinge) với huấn luyện viên, chọn không gian rộng, chắc tay cầm và sàn không trơn. Không tập khi mệt. Turkish get-up cần học từng bước, bắt đầu không tải hoặc rất nhẹ.`,
     en:`Kettlebell work involves fast movement and dynamic load. Learn the hip hinge with a coach, choose an open space, keep a firm grip and a non-slip floor. Do not train when tired. Learn the Turkish get-up step by step, starting with no load or a very light weight.`}},
 calisthenics:{vi:'Calisthenics',en:'Calisthenics',e:'💪',h:215,out:'hiit',ref:'https://acsm.org/read-research/trending-topics-resource-pages/physical-activity-guidelines',rn:{vi:'ACSM – Khuyến nghị hoạt động thể chất',en:'ACSM physical activity guidelines'},
  w:{vi:`Tăng độ khó từ từ. Khởi động kỹ khớp vai, khuỷu và cổ tay; dừng nếu đau các khớp này. Tập trên mặt phẳng ổn định; ghế hoặc ghế tập dùng cho bài chống đẩy phải thật chắc.`,
     en:`Progress difficulty gradually. Warm up your shoulders, elbows and wrists well and stop if those joints hurt. Train on a stable surface; any chair or bench used for dips must be completely sturdy.`}}
};

X('downdog','yoga','Downward-Facing Dog (Adho Mukha Svanasana)','Chó cúi mặt',1,['mat'],['back','shoulders','legs','flex'],{w:30,r:10,n:3,k:'hold'},
 `Bắt đầu ở tư thế quỳ bốn điểm, tay dưới vai, gối dưới hông.|Cuộn ngón chân, ấn hai bàn tay xuống thảm và nâng hông lên cao thành hình chữ V ngược.|Kéo dài cột sống, gót chân hướng về sàn, gối chùng nhẹ nếu gân kheo căng.|Thả lỏng cổ và đầu, hít thở sâu, giữ khoảng 30 giây rồi quỳ xuống nghỉ.`,
 `Start on all fours with hands under shoulders and knees under hips.|Tuck your toes, press your palms into the mat and lift your hips high into an inverted V.|Lengthen your spine, reach your heels toward the floor and keep a soft bend in the knees if your hamstrings are tight.|Relax your neck and head, breathe deeply, hold about 30 seconds, then lower to your knees to rest.`,
 `Nếu cổ tay đau hoặc tê, hãy hạ gối, xoay bàn tay hơi hướng ra ngoài hoặc kê nêm dưới gốc bàn tay.`,`If your wrists are irritated, drop your knees, turn your hands slightly outward or support the heels of your hands with a wedge.`),
X('warrior2','yoga','Warrior II (Virabhadrasana II)','Chiến binh II',1,['mat'],['legs','shoulders','balance'],{w:30,r:5,n:2,k:'hold'},
 `Đứng dang hai chân rộng khoảng một sải chân, xoay chân trước ra ngoài 90 độ, chân sau hơi xoay vào.|Gập gối trước cho đến khi đầu gối nằm trên cổ chân, không để gối đổ vào trong.|Giang hai tay song song với sàn, vai thả lỏng, nhìn qua đầu ngón tay phía trước.|Giữ 30 giây, hít thở đều rồi đổi bên.`,
 `Stand with your feet about one leg-length apart, turn the front foot out 90 degrees and the back foot slightly in.|Bend the front knee until it is over your ankle without letting it collapse inward.|Extend both arms parallel to the floor with relaxed shoulders and gaze over your front fingertips.|Hold 30 seconds, breathing evenly, then switch sides.`,
 `Không để đầu gối trước vượt quá cổ chân và không ưỡn lưng dưới.`,`Do not let the front knee travel past the ankle and do not over-arch your lower back.`),
X('child','yoga','Child\'s Pose (Balasana)','Tư thế em bé',1,['mat'],['back','calm'],{w:45,r:5,n:2,k:'hold'},
 `Quỳ trên thảm, hai ngón chân cái chạm nhau, mở gối rộng bằng hông hoặc rộng hơn.|Ngồi hông về phía gót chân và gập người về trước.|Duỗi hai tay về phía trước hoặc để xuôi theo thân, trán chạm thảm.|Thở sâu vào lưng, mỗi nhịp thở thả lỏng thêm; giữ khoảng 45 giây.`,
 `Kneel on the mat with big toes touching and knees as wide as your hips or wider.|Sit your hips back toward your heels and fold forward.|Stretch your arms in front of you or rest them alongside your body, with your forehead on the mat.|Breathe deeply into your back, relaxing more on every exhale; hold about 45 seconds.`,
 `Nếu đầu gối đau hoặc hông không chạm gót, hãy kê gối hoặc chăn gấp giữa bắp chân và đùi.`,`If your knees hurt or your hips do not reach your heels, place a cushion or folded blanket between your calves and thighs.`),
X('catcow','yoga','Cat-Cow (Marjaryasana-Bitilasana)','Mèo – Bò',1,['mat'],['back','flex'],{w:40,r:10,n:2,k:'flow'},
 `Quỳ bốn điểm, tay dưới vai, gối dưới hông, lưng phẳng.|Hít vào: võng nhẹ lưng, bụng thả xuống, ngực và ánh nhìn hướng về trước (Bò).|Thở ra: cong lưng lên trần nhà, cằm hướng về ngực (Mèo).|Chuyển động chậm theo nhịp thở trong khoảng 40 giây.`,
 `Come to all fours with hands under shoulders, knees under hips and a flat back.|Inhale: gently arch your back, drop your belly and lift your chest and gaze (Cow).|Exhale: round your back toward the ceiling and tuck your chin toward your chest (Cat).|Move slowly with your breath for about 40 seconds.`,
 `Di chuyển nhẹ nhàng trong biên độ thoải mái, không ép cổ.`,`Move gently within a comfortable range and do not force your neck.`),
X('tree','yoga','Tree Pose (Vrikshasana)','Tư thế cây',1,['mat'],['balance','legs'],{w:30,r:5,n:2,k:'hold'},
 `Đứng thẳng, dồn trọng lượng sang một chân, mở gối chân kia ra ngoài.|Đặt bàn chân lên bắp chân hoặc đùi trong, tuyệt đối không đặt lên đầu gối.|Giữ hông thẳng ngang, siết nhẹ cơ bụng, chắp tay trước ngực hoặc giơ cao qua đầu.|Nhìn vào một điểm cố định, giữ 30 giây rồi đổi chân.`,
 `Stand tall, shift your weight onto one foot and open the other knee out to the side.|Place the sole of that foot on your calf or inner thigh, never on the knee.|Keep your hips level, engage your abs lightly and bring your hands to your chest or overhead.|Fix your eyes on one point, hold 30 seconds, then switch legs.`,
 `Không để bàn chân tì vào đầu gối của chân trụ. Đứng gần tường nếu chưa vững.`,`Never press the foot into the standing knee. Stand near a wall if you are unsteady.`),
X('cobra','yoga','Cobra (Bhujangasana)','Rắn hổ mang',1,['mat'],['back','core'],{w:20,r:10,n:3,k:'hold'},
 `Nằm sấp, hai bàn tay đặt dưới vai, khuỷu tay ép sát thân.|Ấn mu bàn chân và đùi xuống thảm, dùng lực lưng để nâng ngực lên.|Kéo vai ra xa tai, giữ cổ dài, nhìn thẳng về phía trước.|Giữ khoảng 20 giây, thở đều rồi hạ xuống chậm.`,
 `Lie face down with your hands under your shoulders and elbows hugging your body.|Press the tops of your feet and thighs into the mat and lift your chest using your back muscles.|Draw your shoulders away from your ears, keep your neck long and look straight ahead.|Hold about 20 seconds, breathing evenly, then lower slowly.`,
 `Không dồn hết sức vào tay và không bóp nghẹt lưng dưới. Không nằm sấp khi đang mang thai.`,`Do not push mainly with your arms or crunch your lower back. Do not lie on your stomach while pregnant.`),
X('triangle','yoga','Triangle (Trikonasana)','Tam giác',2,['mat','block'],['legs','flex','core'],{w:30,r:5,n:2,k:'hold'},
 `Đứng dang chân rộng, xoay chân trước ra ngoài 90 độ, chân sau hơi vào trong.|Giang hai tay ngang vai, nghiêng thân về phía chân trước, kéo dài cả hai bên sườn.|Đặt một tay lên cẳng chân hoặc gạch yoga, tay kia giơ thẳng lên trời, mở ngực.|Giữ 30 giây rồi đổi bên.`,
 `Stand with your feet wide, turn the front foot out 90 degrees and the back foot slightly in.|Extend your arms at shoulder height, reach forward and tilt your torso over the front leg, lengthening both sides.|Rest one hand on your shin or a block and reach the other arm up, opening your chest.|Hold 30 seconds, then switch sides.`,
 `Giữ chân thẳng nhưng không khóa cứng đầu gối. Chỉ xuống tới mức bạn còn giữ được ngực mở.`,`Keep your legs straight but do not lock the knees. Go only as low as you can keep your chest open.`),
X('bridge','yoga','Bridge (Setu Bandhasana)','Cây cầu',1,['mat'],['glutes','back','core'],{w:30,r:15,n:3,k:'hold'},
 `Nằm ngửa, gập gối, hai bàn chân đặt trên thảm rộng bằng hông, tay xuôi theo thân.|Ấn bàn chân xuống thảm và nâng hông lên cho đến khi vai, hông, gối thành một đường.|Siết mông, mở ngực, giữ cổ thả lỏng và đầu ở yên trên thảm.|Giữ 30 giây rồi hạ từng đốt sống xuống.`,
 `Lie on your back with knees bent, feet on the mat hip-width apart and arms alongside your body.|Press your feet down and lift your hips until shoulders, hips and knees form one line.|Squeeze your glutes, open your chest and keep your neck relaxed with your head still on the mat.|Hold 30 seconds, then lower your spine down slowly, one vertebra at a time.`,
 `Không quay đầu khi đang nâng hông để tránh áp lực lên cổ.`,`Do not turn your head while your hips are lifted, to avoid pressure on the neck.`),
X('sunsal','yoga','Sun Salutation A (Surya Namaskar A)','Chào mặt trời A',2,['mat'],['full','flex','cardio'],{w:60,r:15,n:5,k:'flow'},
 `Đứng thẳng (tư thế núi), hít vào giơ tay lên cao, thở ra gập người về trước.|Hít vào ngẩng nửa người, thở ra bước hoặc nhảy chân về sau vào tư thế plank, hạ người xuống (gối chạm thảm nếu cần).|Hít vào chuyển sang tư thế rắn hoặc chó ngẩng, thở ra đẩy hông lên thành chó cúi mặt, giữ 5 nhịp thở.|Bước chân về trước, hít vào ngẩng nửa người, thở ra gập người, rồi hít vào đứng lên giơ tay; thở ra về tư thế núi. Lặp lại 5 vòng.`,
 `Stand tall in Mountain Pose, inhale and reach your arms up, exhale and fold forward.|Inhale to lift halfway, exhale and step or jump back to plank and lower down (knees on the mat if needed).|Inhale into Cobra or Upward Dog, exhale and press your hips up into Downward Dog for five breaths.|Step forward, inhale halfway lift, exhale fold, then inhale to rise with arms overhead and exhale back to Mountain. Repeat for 5 rounds.`,
 `Người mới nên hạ gối khi xuống plank và dùng tư thế rắn thay cho chó ngẩng.`,`Beginners should lower the knees when going down from plank and use Cobra instead of Upward Dog.`),
X('savasana','yoga','Corpse Pose (Savasana)','Tư thế xác chết (thư giãn)',1,['mat'],['calm'],{w:300,r:0,n:1,k:'hold'},
 `Nằm ngửa, hai chân thả lỏng rộng bằng hông, hai tay xuôi xa thân, lòng bàn tay hướng lên.|Nhắm mắt, để hơi thở trở về nhịp tự nhiên.|Lần lượt thả lỏng từng phần cơ thể từ bàn chân lên đến mặt.|Giữ khoảng 5 phút; khi kết thúc, cử động nhẹ ngón tay, ngón chân rồi từ từ ngồi dậy.`,
 `Lie on your back with your legs relaxed hip-width apart and arms resting away from your body, palms up.|Close your eyes and let your breath return to its natural rhythm.|Release each part of the body in turn, from your feet up to your face.|Stay about 5 minutes; to finish, wiggle your fingers and toes and sit up slowly.`,
 `Đắp chăn mỏng nếu thấy lạnh; ngồi dậy từ từ để tránh chóng mặt.`,`Cover up with a light blanket if you feel cold, and sit up slowly to avoid dizziness.`),
/* PILATES */
X('hundred','pilates','The Hundred','Bài Hundred (100 nhịp)',2,['mat'],['core'],{w:60,r:30,n:2,k:'flow'},
 `Nằm ngửa, đưa hai chân lên tư thế bàn (gối gập 90 độ) hoặc duỗi chéo, nhấc đầu và vai khỏi thảm.|Duỗi thẳng hai tay cạnh thân, lòng bàn tay hướng xuống, không chạm thảm.|Đập tay nhẹ lên xuống theo nhịp: hít vào 5 nhịp, thở ra 5 nhịp.|Thực hiện 10 chu kỳ (100 nhịp). Nếu mỏi cổ hoặc võng lưng, đặt chân xuống thảm.`,
 `Lie on your back, lift your legs to tabletop (knees at 90 degrees) or extend them diagonally, and curl your head and shoulders off the mat.|Reach your arms straight alongside your body, palms down, hovering above the mat.|Pump your arms in small beats: inhale for 5 counts, exhale for 5 counts.|Complete 10 cycles (100 beats). If your neck tires or your back arches, place your feet on the floor.`,
 `Giữ lưng dưới ấn nhẹ xuống thảm và không nín thở.`,`Keep your lower back gently pressed into the mat and never hold your breath.`),
X('rollup','pilates','Roll-Up','Cuộn người lên',2,['mat'],['core','back','flex'],{w:45,r:30,n:3,k:'reps',reps:'6–8'},
 `Nằm ngửa, chân duỗi, hai tay giơ qua đầu.|Hít vào đưa tay lên trần nhà, thở ra hạ cằm về ngực và cuộn từng đốt sống rời khỏi thảm.|Vươn tay qua ngón chân, giữ bụng lõm vào.|Hít vào giữ, thở ra cuộn xuống chậm từng đốt sống. Lặp lại.`,
 `Lie on your back with your legs extended and arms overhead.|Inhale to bring your arms to the ceiling, exhale to nod your chin to your chest and peel your spine off the mat.|Reach over your toes with your abs scooped in.|Inhale to pause, exhale to roll down slowly one vertebra at a time. Repeat.`,
 `Gập gối nếu chân bật lên hoặc bạn phải dùng đà. Cẩn thận nếu bị loãng xương hoặc thoát vị đĩa đệm.`,`Bend your knees if your legs pop up or you need momentum. Take care if you have osteoporosis or a disc injury.`),
X('legcircles','pilates','Single-Leg Circles','Vòng tròn một chân',1,['mat'],['core','legs'],{w:60,r:20,n:2,k:'reps',reps:'5 mỗi chiều§5 each way'},
 `Nằm ngửa, một chân duỗi trên thảm, chân kia đưa thẳng lên trần nhà.|Giữ xương chậu và lưng dưới thật yên.|Vẽ vòng tròn nhỏ và đều bằng chân giơ lên, 5 vòng theo mỗi chiều.|Đổi chân và lặp lại.`,
 `Lie on your back with one leg extended on the mat and the other reaching to the ceiling.|Keep your pelvis and lower back completely still.|Draw small, even circles with the raised leg, 5 in each direction.|Switch legs and repeat.`,
 `Gập gối của chân giơ lên nếu gân kheo căng. Vòng tròn nhỏ nhưng kiểm soát tốt.`,`Bend the raised knee if your hamstrings are tight. Keep circles small but controlled.`),
X('slstretch','pilates','Single-Leg Stretch','Duỗi một chân',2,['mat'],['core'],{w:45,r:20,n:3,k:'reps',reps:'10–16'},
 `Nằm ngửa, nhấc đầu và vai, ôm một đầu gối về ngực, chân kia duỗi chếch lên.|Đổi chân nhịp nhàng, tay đổi theo (tay ngoài ở cổ chân, tay trong ở gối).|Giữ thân trên ổn định, bụng lõm vào, lưng dưới không rời thảm.|Hít vào hai lần, thở ra hai lần theo nhịp đổi chân.`,
 `Lie on your back, lift your head and shoulders, hug one knee to your chest and extend the other leg on a diagonal.|Switch legs smoothly, changing your hands too (outside hand at the ankle, inside hand at the knee).|Keep your upper body steady, abs scooped and your lower back down.|Inhale for two switches, exhale for two switches.`,
 `Nâng chân duỗi cao hơn nếu lưng dưới bị võng.`,`Raise the extended leg higher if your lower back starts to arch.`),
X('swimming','pilates','Swimming','Bơi (nằm sấp)',2,['mat'],['back','glutes','core'],{w:30,r:20,n:3,k:'flow'},
 `Nằm sấp, duỗi thẳng tay và chân, trán hướng xuống thảm.|Nâng nhẹ tay, ngực và chân khỏi thảm, giữ cổ dài.|Đập tay chân đối bên nhịp nhàng như đang bơi, đếm 5 nhịp hít, 5 nhịp thở.|Dừng và thả lỏng xuống thảm.`,
 `Lie face down with your arms and legs extended, forehead toward the mat.|Lift your arms, chest and legs slightly off the mat, keeping your neck long.|Flutter opposite arms and legs rhythmically as if swimming, 5 counts in and 5 counts out.|Stop and lower to the mat.`,
 `Nâng thấp hơn nếu đau lưng dưới. Không bóp cổ hay ngẩng đầu quá cao.`,`Lift less if your lower back hurts. Do not crank your neck or lift your head too high.`),
X('sidelift','pilates','Side-Lying Leg Lift','Nâng chân nằm nghiêng',1,['mat'],['glutes','legs','core'],{w:45,r:15,n:4,k:'reps',reps:'10–12'},
 `Nằm nghiêng, thân người thẳng một đường, đầu tựa tay, tay kia chống trước ngực.|Xếp hai chân chồng lên nhau, hơi đưa về phía trước.|Nâng chân trên lên ngang hông rồi hạ xuống chậm, giữ hông không xoay.|Thực hiện 10–12 lần mỗi bên (mỗi lượt đổi bên).`,
 `Lie on your side with your body in one straight line, head resting on your arm and the other hand planted in front of your chest.|Stack your legs and angle them slightly forward.|Lift the top leg to hip height and lower it slowly without rolling your hips.|Do 10–12 reps per side (switch sides each round).`,
 `Không để hông lăn ra sau; giữ eo thẳng và bụng siết nhẹ.`,`Do not let your hips roll back; keep your waist long and your abs lightly engaged.`),
/* STRENGTH */
X('deadlift','strength','Conventional Deadlift','Deadlift (kéo tạ từ sàn)',3,['barbell'],['back','glutes','legs'],{w:40,r:120,n:4,k:'reps',reps:'5'},
 `Đứng chân rộng bằng hông, thanh tạ ở trên giữa bàn chân; gập hông và gối để nắm thanh tạ ngoài hai đùi.|Căng thẳng bụng, ưỡn ngực, lưng thẳng trung tính, kéo hết độ chùng của thanh tạ.|Đẩy chân xuống sàn để đứng lên, thanh tạ sát chân; duỗi hông và gối cùng lúc.|Đứng thẳng, siết mông, rồi hạ thanh tạ có kiểm soát bằng cách đẩy hông ra sau trước, sau đó gập gối.`,
 `Stand hip-width apart with the bar over mid-foot; hinge and bend your knees to grip the bar just outside your legs.|Brace your abs, lift your chest and keep a neutral flat back, taking the slack out of the bar.|Push the floor away to stand up with the bar close to your legs, extending hips and knees together.|Stand tall and squeeze your glutes, then lower under control by pushing your hips back first and then bending the knees.`,
 `Không cong lưng, không giật thanh tạ khỏi sàn. Bắt đầu với tạ rất nhẹ và nhờ PT kiểm tra.`,`Do not round your back or jerk the bar off the floor. Start very light and have a trainer check your form.`),
X('squat','strength','Barbell Back Squat','Squat tạ đòn',3,['barbell','rack'],['legs','glutes','core'],{w:45,r:120,n:4,k:'reps',reps:'5–8'},
 `Đặt thanh tạ trên cơ thang phía trên lưng, nắm chắc, lùi ra khỏi giá, chân rộng bằng vai, mũi chân hơi mở.|Hít sâu, siết bụng, ngồi hông ra sau và xuống như ngồi ghế, gối đi theo hướng mũi chân.|Xuống đến khi đùi gần song song với sàn hoặc đến độ sâu bạn kiểm soát được.|Đẩy cả bàn chân xuống sàn để đứng lên, thở ra khi qua điểm khó nhất.`,
 `Set the bar on your upper traps, grip firmly, walk out of the rack and stand shoulder-width with toes slightly turned out.|Take a big breath, brace your abs and sit your hips back and down, keeping your knees tracking over your toes.|Descend until your thighs are about parallel to the floor, or as deep as you can control.|Drive through your whole foot to stand, exhaling past the hardest point.`,
 `Luôn đặt chặn an toàn của giá và dùng spotter khi tạ nặng. Không để gối đổ vào trong.`,`Always set the rack safety bars and use a spotter with heavy loads. Do not let your knees cave inward.`),
X('bench','strength','Barbell Bench Press','Đẩy ngực nằm với tạ đòn',3,['barbell','bench','rack'],['chest','shoulders','arms'],{w:40,r:120,n:4,k:'reps',reps:'5–8'},
 `Nằm trên ghế, hai bàn chân đặt chắc trên sàn, kéo hai bả vai về sau và xuống dưới.|Nắm thanh tạ rộng hơn vai một chút, ngón cái quấn quanh thanh (không nắm hở).|Hạ thanh tạ chậm đến giữa ngực, khuỷu tay hợp với thân khoảng 45–75 độ.|Đẩy thanh tạ lên thẳng hoặc hơi chếch về phía vai, kiểm soát cả hai chiều.`,
 `Lie on the bench with your feet planted firmly and your shoulder blades pulled back and down.|Grip the bar slightly wider than shoulder-width with your thumbs wrapped around it (no false grip).|Lower the bar slowly to mid-chest with elbows at roughly 45–75 degrees to your torso.|Press it back up in a straight or slightly angled line toward your shoulders, controlling both directions.`,
 `Không bao giờ đẩy tạ nặng một mình: cần spotter hoặc giá có chặn an toàn.`,`Never press heavy loads alone: use a spotter or safety arms.`),
X('ohp','strength','Overhead Press','Đẩy vai đứng',2,['barbell'],['shoulders','arms','core'],{w:35,r:90,n:4,k:'reps',reps:'6–8'},
 `Đứng chân rộng bằng hông, thanh tạ đặt trên xương đòn, khuỷu tay hơi ở trước thanh tạ.|Siết mông và bụng để giữ thân thẳng.|Đẩy thanh tạ lên, đưa đầu nhẹ ra sau để thanh tạ đi qua, rồi đưa đầu vào lại khi tay duỗi thẳng trên cao.|Hạ thanh tạ có kiểm soát về xương đòn.`,
 `Stand hip-width apart with the bar resting on your collarbone and elbows slightly in front of the bar.|Squeeze your glutes and abs to keep your torso rigid.|Press the bar up, moving your head back slightly to let it pass, then pushing your head through as your arms lock out overhead.|Lower the bar under control to your collarbone.`,
 `Không ưỡn lưng dưới quá mức. Dùng tạ nhẹ hơn nếu thân người bị đổ về sau.`,`Do not over-arch your lower back. Use a lighter weight if your torso leans backward.`),
X('row','strength','Bent-Over Row','Kéo tạ gập người',2,['barbell','dumbbell'],['back','arms'],{w:35,r:90,n:4,k:'reps',reps:'8–10'},
 `Đứng chân rộng bằng hông, cầm tạ, gập hông đến khoảng 45 độ, lưng thẳng và gối hơi gập.|Siết bụng, nhìn xuống sàn phía trước để giữ cổ trung tính.|Kéo tạ về phía bụng dưới, khuỷu tay sát thân, siết bả vai.|Hạ tạ có kiểm soát cho tay duỗi thẳng.`,
 `Stand hip-width apart holding the weight, hinge to about 45 degrees with a flat back and soft knees.|Brace your abs and look at the floor slightly ahead to keep your neck neutral.|Pull the weight toward your lower belly with elbows close to your body, squeezing your shoulder blades.|Lower it under control until your arms are straight.`,
 `Không giật tạ bằng cách quơ thân người. Giảm tạ nếu lưng dưới bị cong.`,`Do not swing your torso to jerk the weight. Reduce the load if your lower back rounds.`),
X('pullup','strength','Pull-Up','Hít xà đơn',3,['pullbar','band'],['back','arms'],{w:30,r:90,n:4,k:'reps',reps:'3–8'},
 `Nắm xà đơn bằng tay úp, rộng hơn vai một chút, treo thân và kéo vai xuống khỏi tai.|Siết bụng và mông, hai chân hơi gập hoặc bắt chéo.|Kéo khuỷu tay xuống và về phía hông cho đến khi cằm qua xà.|Hạ chậm trong 2–3 giây về tư thế treo. Người mới dùng dây kháng lực hỗ trợ hoặc hạ người chậm.`,
 `Grip the bar overhand slightly wider than your shoulders, hang and set your shoulders down away from your ears.|Brace your abs and glutes with your legs slightly bent or crossed.|Pull your elbows down and toward your hips until your chin clears the bar.|Lower slowly over 2–3 seconds to a hang. Beginners can use a resistance band for assistance or do slow lowering only.`,
 `Không đung đưa, giật người. Dừng nếu đau vai hoặc khuỷu.`,`Do not swing or kip. Stop if your shoulders or elbows hurt.`),
X('lunge','strength','Walking Lunge','Chùng chân bước đi',1,['dumbbell','none'],['legs','glutes'],{w:40,r:60,n:3,k:'reps',reps:'10–12 mỗi chân§10–12 per leg'},
 `Đứng thẳng, hai tay chống hông hoặc cầm tạ tay ở hai bên.|Bước một bước dài về trước, hạ hông cho đến khi gối sau gần chạm sàn.|Gối trước nằm trên cổ chân, thân người thẳng.|Đẩy qua gót chân trước, bước chân sau lên và tiếp tục chùng bên kia.`,
 `Stand tall with your hands on your hips or holding dumbbells at your sides.|Take a long step forward and lower your hips until the back knee almost touches the floor.|Keep the front knee over your ankle and your torso upright.|Push through the front heel, bring the back foot forward and lunge on the other side.`,
 `Không để gối trước đổ vào trong. Rút ngắn bước nếu thấy đau gối.`,`Do not let the front knee collapse inward. Shorten your stride if your knee hurts.`),
X('hipthrust','strength','Hip Thrust','Đẩy hông',2,['bench','barbell','dumbbell'],['glutes','legs'],{w:35,r:90,n:4,k:'reps',reps:'8–12'},
 `Ngồi trên sàn, tựa phần lưng trên vào mép ghế, đặt tạ (có đệm) ngay trên xương hông.|Bàn chân đặt chắc trên sàn rộng bằng hông, gối gập.|Đẩy hông lên cho đến khi thân người thẳng từ vai đến gối, hạ cằm nhẹ.|Siết mông 1 giây ở trên đỉnh rồi hạ xuống có kiểm soát.`,
 `Sit on the floor with your upper back against the edge of a bench and a padded weight over your hip bones.|Plant your feet hip-width apart with knees bent.|Drive your hips up until your torso is straight from shoulders to knees, chin slightly tucked.|Squeeze your glutes for a second at the top and lower under control.`,
 `Không ưỡn lưng dưới ở đỉnh; dùng ghế đã cố định chắc chắn.`,`Do not over-arch your lower back at the top; use a bench that is firmly secured.`),
/* HIIT */
X('burpee','hiit','Burpee','Burpee',2,['none'],['full','cardio'],{w:20,r:10,n:8,k:'go'},
 `Đứng thẳng, ngồi xổm và đặt tay xuống sàn trước chân.|Nhảy hoặc bước hai chân ra sau vào tư thế plank, giữ thân người thẳng.|Tùy chọn: hít đất một cái, rồi nhảy hoặc bước chân về sát tay.|Bật thẳng người lên, vỗ tay trên đầu. Làm liên tục trong 20 giây rồi nghỉ 10 giây.`,
 `Stand tall, squat down and place your hands on the floor in front of your feet.|Jump or step both feet back into a plank, keeping your body in a straight line.|Optional: do one push-up, then jump or step your feet back to your hands.|Jump up with your arms overhead. Work continuously for 20 seconds, then rest 10 seconds.`,
 `Bỏ động tác nhảy và hít đất nếu bạn mới tập. Dừng nếu đau cổ tay hoặc lưng dưới.`,`Skip the jump and the push-up if you are new. Stop if your wrists or lower back hurt.`),
X('mclimber','hiit','Mountain Climbers','Leo núi tại chỗ',1,['none','mat'],['core','cardio','shoulders'],{w:30,r:30,n:6,k:'go'},
 `Vào tư thế plank cao, tay dưới vai, thân người thẳng một đường.|Đưa một đầu gối về phía ngực, rồi nhanh chóng đổi chân.|Giữ hông thấp và bằng với vai, bụng siết.|Chạy "leo núi" liên tục 30 giây, nghỉ 30 giây.`,
 `Start in a high plank with hands under shoulders and your body in a straight line.|Drive one knee toward your chest, then switch legs quickly.|Keep your hips low and level with your shoulders and your abs tight.|"Climb" continuously for 30 seconds, then rest 30 seconds.`,
 `Chậm lại hoặc đặt tay lên ghế/bậc cao nếu cổ tay đau.`,`Slow down or put your hands on an elevated bench or step if your wrists hurt.`),
X('jumpsquat','hiit','Jump Squat','Squat bật nhảy',2,['none'],['legs','glutes','cardio'],{w:20,r:10,n:8,k:'go'},
 `Đứng chân rộng bằng vai, hạ người xuống tư thế squat.|Bật mạnh lên bằng cả hai chân, thân người thẳng, tay vung hỗ trợ.|Tiếp đất nhẹ nhàng bằng cả bàn chân, đầu gối gập để giảm chấn.|Hạ ngay vào squat tiếp theo. Làm 20 giây, nghỉ 10 giây.`,
 `Stand shoulder-width apart and lower into a squat.|Explode upward with both feet, keeping your torso tall and swinging your arms to help.|Land softly on your whole foot with bent knees to absorb the impact.|Sink straight into the next squat. Work 20 seconds, rest 10 seconds.`,
 `Chuyển sang squat thường nếu đau gối, mắt cá hoặc hông. Không tiếp đất khi gối thẳng cứng.`,`Switch to regular squats if your knees, ankles or hips hurt. Never land with locked knees.`),
X('highknees','hiit','High Knees','Chạy nâng cao gối',1,['none'],['cardio','legs'],{w:30,r:30,n:6,k:'go'},
 `Đứng thẳng, chân rộng bằng hông.|Chạy tại chỗ, nâng đầu gối cao ngang hông.|Vung tay đối bên nhịp nhàng, tiếp đất bằng nửa bàn chân trước.|Giữ thân người thẳng và bụng siết. 30 giây làm, 30 giây nghỉ.`,
 `Stand tall with your feet hip-width apart.|Run in place, driving your knees up to hip height.|Pump your arms in opposition and land on the balls of your feet.|Keep your torso upright and abs tight. 30 seconds on, 30 seconds off.`,
 `Giảm xuống chạy bước nhẹ (march) nếu đau khớp hoặc nhịp tim quá cao.`,`Drop to a marching pace if your joints hurt or your heart rate gets too high.`),
X('jacks','hiit','Jumping Jacks','Nhảy dang tay chân',1,['none'],['cardio','full'],{w:40,r:20,n:5,k:'go'},
 `Đứng thẳng, hai chân khép, tay xuôi theo thân.|Bật nhảy dang rộng hai chân, đồng thời đưa tay lên cao qua đầu.|Bật nhảy khép chân lại, tay hạ xuống.|Giữ nhịp đều trong 40 giây, nghỉ 20 giây.`,
 `Stand with your feet together and arms at your sides.|Jump your feet wide while raising your arms overhead.|Jump back to feet together as your arms come down.|Keep a steady rhythm for 40 seconds, rest 20 seconds.`,
 `Có thể bước sang hai bên (step jack) thay vì nhảy nếu khớp nhạy cảm.`,`Use step jacks instead of jumping if your joints are sensitive.`),
X('tabata','hiit','Tabata Circuit (4 moves)','Vòng Tabata 4 động tác',2,['none','mat'],['full','cardio'],{w:20,r:10,n:8,k:'go'},
 `Chọn 2 động tác đơn giản (ví dụ squat bật nhảy và leo núi), luân phiên mỗi hiệp 20 giây làm, 10 giây nghỉ.|Làm 8 hiệp liên tiếp, tổng cộng 4 phút.|Giữ kỹ thuật tốt đến hiệp cuối; giảm tốc nếu kỹ thuật xấu đi.|Nghỉ 1–2 phút, đi bộ nhẹ nhàng hạ nhiệt. Chỉ làm một vòng nếu bạn là người mới.`,
 `Pick 2 simple moves (for example jump squats and mountain climbers) and alternate them: 20 seconds work, 10 seconds rest.|Complete 8 rounds back to back, 4 minutes in total.|Keep good form to the last round; slow down if form breaks.|Rest 1–2 minutes and walk lightly to cool down. Do a single circuit only if you are new.`,
 `Tabata rất khắc nghiệt: chỉ tập khi đã khởi động kỹ và đủ thể lực nền.`,`Tabata is very demanding: only attempt it after a thorough warm-up and with a solid fitness base.`),
X('sprint','hiit','Sprint Intervals','Chạy nước rút ngắt quãng',3,['none'],['cardio','legs'],{w:30,r:60,n:8,k:'go'},
 `Khởi động 5–10 phút bằng chạy nhẹ và vài bài tăng tốc ngắn.|Chạy nhanh hết sức (cảm giác khoảng 8–9/10) trong 30 giây trên mặt phẳng, an toàn.|Đi bộ hoặc chạy rất chậm 60 giây để hồi phục (tỷ lệ làm:nghỉ khoảng 1:2).|Lặp lại 6–8 lần, sau đó đi bộ hạ nhiệt 5 phút.`,
 `Warm up for 5–10 minutes with easy jogging and a few short build-ups.|Run hard (around 8–9 out of 10 effort) for 30 seconds on a flat, safe surface.|Walk or jog very slowly for 60 seconds to recover (work:rest of about 1:2).|Repeat 6–8 times, then walk for 5 minutes to cool down.`,
 `Không chạy nước rút khi cơ còn lạnh hoặc đang đau; ưu tiên đường bằng phẳng, không trơn.`,`Do not sprint with cold or sore muscles; use a flat, non-slippery surface.`),
/* BOXING */
X('stance','boxing','Boxing Stance & Guard','Tư thế đứng và thủ thế',1,['none'],['full','balance'],{w:60,r:15,n:3,k:'flow'},
 `Đứng chân rộng bằng vai; người thuận tay phải đặt chân trái lên trước, chân sau nhấc gót.|Gối hơi chùng, trọng tâm ở giữa hai chân, người hơi nghiêng 45 độ.|Hai tay giữ cao hai bên má, khuỷu tay khép sát sườn, cằm hạ xuống.|Di chuyển bước nhỏ tiến, lùi, sang hai bên mà không bắt chéo chân.`,
 `Stand shoulder-width apart; if you are right-handed, place your left foot forward and lift the heel of your back foot.|Keep your knees soft, weight centred between both feet and your body angled about 45 degrees.|Hold your hands high beside your cheeks, elbows tucked to your ribs and chin down.|Move with small steps forward, back and side to side without crossing your feet.`,
 `Người thuận tay trái làm ngược lại. Không đứng thẳng cứng gối.`,`Left-handers reverse the stance. Do not lock your knees.`),
X('jabcross','boxing','Jab – Cross (1-2)','Đấm thẳng trái – phải (1-2)',1,['wraps','gloves','bag'],['shoulders','core','cardio'],{w:60,r:30,n:4,k:'flow'},
 `Vào thế thủ, quấn tay và đeo găng nếu có.|Jab: duỗi thẳng tay trước nhanh, xoay nắm đấm úp xuống ở cuối cú đấm, rồi thu về.|Cross: xoay gót chân sau, hông và vai, đấm thẳng tay sau, rồi thu về thế thủ.|Phối hợp 1-2 liên tục, thở ra theo mỗi cú đấm, luôn giữ tay còn lại che cằm.`,
 `Take your guard, wrapping your hands and wearing gloves if you have them.|Jab: snap the lead hand straight out, turn the fist palm-down at the end and return it quickly.|Cross: pivot your back heel, hips and shoulder and throw the rear hand straight, then return to guard.|Chain the 1-2 continuously, exhaling on each punch and keeping your free hand guarding your chin.`,
 `Không khóa khuỷu tay ở cuối cú đấm và không đấm khi cổ tay bị cong.`,`Do not lock your elbow at the end of the punch or punch with a bent wrist.`),
X('hook','boxing','Lead Hook','Móc trái',2,['wraps','gloves','bag'],['core','shoulders'],{w:60,r:30,n:4,k:'flow'},
 `Vào thế thủ, hơi hạ trọng tâm và dồn sang chân trước.|Gập khuỷu tay khoảng 90 độ, khuỷu ngang tầm nắm đấm.|Xoay gót chân trước, hông và thân người để vung nắm đấm theo đường vòng ngắn.|Thu về thế thủ ngay lập tức. Làm chậm, đúng kỹ thuật trước khi tăng tốc.`,
 `Take your guard, lower your centre slightly and load your front foot.|Bend your elbow to about 90 degrees with the elbow level with your fist.|Pivot your front heel, hips and torso to swing the fist in a short arc.|Return to guard immediately. Practise slowly with correct form before speeding up.`,
 `Không vung rộng bằng tay; sức mạnh đến từ xoay hông và thân người.`,`Do not swing wide with just your arm; the power comes from rotating your hips and torso.`),
X('uppercut','boxing','Uppercut','Móc lên (uppercut)',2,['wraps','gloves','bag'],['core','arms'],{w:60,r:30,n:4,k:'flow'},
 `Vào thế thủ, hạ nhẹ gối và vai bên đấm.|Đẩy chân và hông lên, đưa nắm đấm đi lên theo đường thẳng, lòng bàn tay hướng về người.|Đấm đến tầm cằm mục tiêu rồi thu về nhanh.|Đổi tay, giữ tay kia che mặt.`,
 `Take your guard and slightly bend your knees and drop the punching shoulder.|Drive up through your legs and hips, sending the fist upward in a straight line with your palm facing you.|Punch to chin height and bring it back quickly.|Switch hands, keeping the other hand guarding your face.`,
 `Không ngả người ra sau khi đấm; giữ cằm hạ.`,`Do not lean back as you punch; keep your chin down.`),
X('shadow','boxing','Shadow Boxing Round','Đánh bóng không đối thủ (3 phút)',1,['none'],['full','cardio'],{w:180,r:60,n:3,k:'go'},
 `Khởi động nhẹ, vào thế thủ và di chuyển quanh phòng.|Hiệp 1: tập 1-2 và né tránh nhẹ nhàng; hiệp 2: thêm móc và uppercut.|Hiệp 3: tăng nhịp, phối hợp tổ hợp 3–4 đòn, vẫn giữ kỹ thuật.|Nghỉ 1 phút giữa các hiệp, uống nước.`,
 `Warm up lightly, take your guard and move around the room.|Round 1: practise the 1-2 and light head movement; round 2: add hooks and uppercuts.|Round 3: raise the tempo and string 3–4 punch combinations while keeping your technique.|Rest 1 minute between rounds and drink water.`,
 `Tưởng tượng đối thủ để giữ tư thế phòng thủ; không đấm hết cỡ vào không khí khi khớp chưa nóng.`,`Imagine an opponent to keep your defence up; do not snap punches fully into thin air before your joints are warm.`),
X('bagcombo','boxing','Heavy Bag 1-2-3-2 Combo','Combo đấm bao cát 1-2-3-2',2,['bag','gloves','wraps'],['full','cardio','shoulders'],{w:180,r:60,n:3,k:'go'},
 `Quấn băng tay, đeo găng đúng cỡ, đứng cách bao cát một sải tay.|Tổ hợp: jab, cross, móc trái, cross (1-2-3-2); giữ tay còn lại che cằm.|Xoay hông, giữ cổ tay thẳng, thở ra mỗi lần đấm; di chuyển quanh bao.|Mỗi hiệp 3 phút, nghỉ 1 phút. Dừng nếu cổ tay đau.`,
 `Wrap your hands, put on correctly sized gloves and stand an arm's length from the bag.|Combo: jab, cross, lead hook, cross (1-2-3-2); keep your free hand guarding your chin.|Rotate your hips, keep your wrists straight, exhale with every punch and move around the bag.|Each round is 3 minutes with 1 minute rest. Stop if your wrists hurt.`,
 `Không đấm bao cát khi không đeo găng hoặc không quấn tay.`,`Never hit a heavy bag without gloves and hand wraps.`),
X('rope','boxing','Jump Rope','Nhảy dây',1,['rope'],['cardio','legs'],{w:60,r:30,n:5,k:'go'},
 `Chọn dây dài vừa tầm: giẫm lên giữa dây, tay cầm sát nách là vừa.|Đứng thẳng, khuỷu tay sát thân, quay dây bằng cổ tay, không quay bằng cả cánh tay.|Nhảy thấp, tiếp đất bằng nửa bàn chân trước, gối hơi chùng.|Giữ nhịp đều trong 60 giây, nghỉ 30 giây. Lặp lại 5 lần.`,
 `Pick the right length: stand on the middle of the rope and the handles should reach your armpits.|Stand tall with elbows close to your body and turn the rope with your wrists, not whole arms.|Jump low, landing on the balls of your feet with soft knees.|Keep a steady rhythm for 60 seconds, rest 30 seconds. Repeat 5 times.`,
 `Tập trên mặt sàn có độ đàn hồi (thảm, sàn gỗ), tránh bê tông nếu có thể.`,`Jump on a surface with some give (mat, wooden floor) and avoid concrete if possible.`),
/* CORE */
X('plank','core','Plank','Plank (chống khuỷu tay)',1,['mat'],['core','shoulders'],{w:40,r:20,n:3,k:'hold'},
 `Nằm sấp, chống hai khuỷu tay dưới vai, các ngón chân chạm sàn.|Nâng người lên, thân thành một đường thẳng từ đầu đến gót chân.|Siết bụng, mông và đùi; mắt nhìn xuống sàn.|Giữ 40 giây, thở đều rồi hạ xuống nghỉ 20 giây.`,
 `Lie face down with your forearms under your shoulders and toes on the floor.|Lift your body into one straight line from head to heels.|Brace your abs, glutes and thighs and look down at the floor.|Hold 40 seconds, breathing evenly, then lower down for a 20-second rest.`,
 `Dừng nếu lưng dưới võng xuống hoặc đau; hạ gối xuống thảm để giảm độ khó.`,`Stop if your lower back sags or hurts; lower your knees to the mat to make it easier.`),
X('deadbug','core','Dead Bug','Con bọ chết',1,['mat'],['core'],{w:40,r:20,n:3,k:'reps',reps:'8–10 mỗi bên§8–10 per side'},
 `Nằm ngửa, hai tay giơ thẳng lên trần, hai chân giơ ở tư thế bàn (gối 90 độ).|Ấn lưng dưới nhẹ xuống thảm và giữ suốt bài tập.|Thở ra, duỗi chậm tay đối diện và chân đối diện về phía sàn mà không để lưng võng.|Thu về, đổi bên. Làm chậm và có kiểm soát.`,
 `Lie on your back with arms reaching to the ceiling and legs in tabletop (knees at 90 degrees).|Press your lower back gently into the mat and keep it there throughout.|Exhale and slowly extend the opposite arm and leg toward the floor without letting your back arch.|Return and switch sides. Move slowly and with control.`,
 `Giảm biên độ nếu lưng dưới bắt đầu võng lên.`,`Reduce your range if your lower back starts to lift off the mat.`),
X('bicycle','core','Bicycle Crunch','Gập bụng đạp xe',1,['mat'],['core'],{w:40,r:20,n:3,k:'flow'},
 `Nằm ngửa, hai tay đặt nhẹ sau đầu, khuỷu mở rộng.|Nâng vai và chân khỏi sàn, gối gập 90 độ.|Xoay thân đưa khuỷu về phía gối đối diện, đồng thời duỗi chân kia.|Đổi bên chậm rãi, kiểm soát, không kéo cổ bằng tay.`,
 `Lie on your back with your hands lightly behind your head and elbows wide.|Lift your shoulders and legs off the floor with knees bent to 90 degrees.|Rotate your torso to bring one elbow toward the opposite knee while extending the other leg.|Switch sides slowly and with control, without pulling on your neck.`,
 `Không kéo cổ; ưu tiên xoay từ thân người, không phải nhanh.`,`Do not pull on your neck; rotate from the torso and prioritise control over speed.`),
X('hollow','core','Hollow Hold','Giữ tư thế thuyền rỗng',3,['mat'],['core'],{w:25,r:20,n:3,k:'hold'},
 `Nằm ngửa, hai tay giơ qua đầu, hai chân duỗi thẳng.|Ấn chặt lưng dưới xuống thảm, nhấc vai và chân khỏi sàn.|Thân hình thành đường cong hình quả chuối nông, giữ bụng siết.|Giữ 25 giây; gập gối hoặc hạ tay xuống thân nếu khó.`,
 `Lie on your back with arms overhead and legs straight.|Press your lower back firmly into the mat and lift your shoulders and legs off the floor.|Your body forms a shallow banana shape with your abs tight.|Hold 25 seconds; bend your knees or bring your arms down to your sides to make it easier.`,
 `Hạ chân cao hơn nếu lưng dưới không còn ép được xuống thảm.`,`Keep your legs higher if you can no longer keep your lower back pressed down.`),
/* CARDIO */
X('run','cardio','Run-Walk Intervals','Chạy nhẹ xen kẽ đi bộ',1,['none'],['cardio','legs'],{w:60,r:60,n:10,k:'go'},
 `Đi bộ nhanh 5 phút để khởi động.|Chạy chậm ở nhịp vẫn nói chuyện được trong 60 giây.|Đi bộ 60 giây để hồi phục và lặp lại 10 lần.|Kết thúc bằng 5 phút đi bộ và giãn cơ nhẹ nhàng.`,
 `Warm up with 5 minutes of brisk walking.|Jog at a pace where you can still talk for 60 seconds.|Walk for 60 seconds to recover and repeat 10 times.|Finish with 5 minutes of walking and gentle stretching.`,
 `Tăng dần: mỗi tuần chỉ tăng thời gian chạy một chút. Chọn giày phù hợp để tránh chấn thương ống đồng.`,`Progress slowly: add only a little running time each week. Wear proper shoes to avoid shin problems.`),
X('cycle','cardio','Cycling Intervals','Đạp xe ngắt quãng',2,['bike'],['cardio','legs'],{w:60,r:60,n:8,k:'go'},
 `Chỉnh yên sao cho gối hơi gập nhẹ ở điểm thấp nhất của vòng đạp.|Đạp nhẹ 5 phút để khởi động.|Đạp nhanh và nặng hơn 60 giây, sau đó đạp nhẹ 60 giây; lặp lại 8 lần.|Đạp nhẹ 5 phút để hạ nhiệt.`,
 `Set the saddle so your knee has a slight bend at the bottom of the pedal stroke.|Pedal easily for 5 minutes to warm up.|Ride hard for 60 seconds, then easy for 60 seconds; repeat 8 times.|Pedal easily for 5 minutes to cool down.`,
 `Đạp xe ngoài đường: đội mũ bảo hiểm, đèn và tuân thủ luật giao thông.`,`When riding outdoors wear a helmet, use lights and follow traffic rules.`),
X('walk','cardio','Brisk Walk','Đi bộ nhanh',1,['none'],['cardio','legs'],{w:600,r:60,n:3,k:'go'},
 `Mang giày êm và đi ở tốc độ nói chuyện được nhưng không hát được.|Đứng thẳng, nhìn về phía trước, vung tay tự nhiên.|Đi 10 phút, nghỉ 1 phút uống nước; lặp lại 3 lần.|Giãn nhẹ bắp chân và đùi ở cuối buổi.`,
 `Wear comfortable shoes and walk at a pace where you can talk but not sing.|Stand tall, look ahead and swing your arms naturally.|Walk 10 minutes, rest 1 minute and drink water; repeat 3 times.|Stretch your calves and thighs lightly at the end.`,
 `Tránh đi bộ nhanh giữa trưa nắng nóng; mang đủ nước.`,`Avoid brisk walks in midday heat and carry enough water.`),
/* MOBILITY */
X('hipflexor','mobility','Kneeling Hip Flexor Stretch','Giãn cơ gập hông kiểu quỳ',1,['mat'],['flex','legs'],{w:30,r:5,n:4,k:'hold'},
 `Quỳ một gối trên thảm, chân kia bước ra trước, gối trước trên cổ chân.|Đẩy nhẹ xương chậu về trước (cuộn xương cụt xuống) và siết mông bên chân quỳ.|Giơ tay cùng bên với chân quỳ lên cao để tăng độ giãn.|Giữ 30 giây rồi đổi bên; làm 2 lần mỗi bên.`,
 `Kneel on one knee on a mat with the other foot forward and the front knee over the ankle.|Gently tuck your pelvis forward (tailbone down) and squeeze the glute on the kneeling side.|Raise the arm on the kneeling side overhead to deepen the stretch.|Hold 30 seconds then switch; do 2 rounds per side.`,
 `Không ưỡn lưng dưới; kê chăn dưới gối nếu thấy đau.`,`Do not arch your lower back; place a folded blanket under the knee if it hurts.`),
X('hamstring','mobility','Standing Hamstring Stretch','Giãn gân kheo đứng',1,['none'],['flex','legs'],{w:30,r:5,n:4,k:'hold'},
 `Đứng thẳng, đặt gót một chân lên bậc thấp hoặc sàn phía trước, mũi chân hướng lên.|Giữ lưng thẳng, gập hông về trước cho đến khi cảm thấy căng sau đùi.|Hít thở đều, không nảy người.|Giữ 30 giây rồi đổi chân; làm 2 lần mỗi bên.`,
 `Stand tall and place one heel on a low step or the floor in front of you with the toes up.|Keep your back straight and hinge forward at the hips until you feel a stretch behind the thigh.|Breathe steadily without bouncing.|Hold 30 seconds, then switch legs; do 2 rounds per side.`,
 `Không cong lưng để chạm ngón chân; chỉ đi tới mức căng nhẹ.`,`Do not round your back to reach your toes; go only to mild tension.`),
X('wgs','mobility',"World's Greatest Stretch",'Bài giãn toàn thân "tuyệt vời nhất"',2,['mat'],['flex','legs','back'],{w:60,r:10,n:3,k:'flow'},
 `Từ tư thế plank, bước một chân ra ngoài bàn tay cùng bên.|Hạ khuỷu tay gần cùng bên xuống sát bàn chân nếu có thể.|Xoay thân, đưa tay trong lên trời và nhìn theo bàn tay.|Hạ tay, duỗi thẳng chân trước để giãn gân kheo; đổi bên.`,
 `From a plank, step one foot outside the hand on the same side.|Lower the same-side elbow toward the foot if possible.|Rotate your torso, reach the inside arm to the sky and follow it with your eyes.|Lower the hand, straighten the front leg to stretch the hamstring, then switch sides.`,
 `Dùng gạch yoga dưới tay nếu không chạm được sàn.`,`Use a yoga block under your hand if you cannot reach the floor.`),
X('foamroll','mobility','Foam Rolling (Quads & Upper Back)','Lăn foam roller (đùi trước và lưng trên)',1,['foam','mat'],['flex','back','legs'],{w:60,r:15,n:4,k:'flow'},
 `Đặt con lăn dưới đùi trước (nằm sấp) hoặc dưới lưng trên (nằm ngửa, tay ôm đầu).|Lăn chậm, mỗi đoạn 2–3 giây; dừng 20–30 giây ở điểm đau căng.|Thở sâu để cơ thư giãn; chuyển sang vùng khác sau 60 giây.|Uống nước sau khi lăn.`,
 `Place the roller under your quads (lying face down) or your upper back (lying face up with hands behind your head).|Roll slowly, 2–3 seconds per section; pause 20–30 seconds on tender spots.|Breathe deeply so the muscle relaxes; move to a new area after 60 seconds.|Drink water afterwards.`,
 `Không lăn trực tiếp lên khớp, xương hoặc lưng dưới; dừng nếu đau nhói.`,`Do not roll directly over joints, bone or your lower back; stop if you feel sharp pain.`),
X('shoulderband','mobility','Band Shoulder Dislocates','Xoay vai với dây kháng lực',1,['band'],['shoulders','flex'],{w:40,r:15,n:3,k:'reps',reps:'10'},
 `Đứng thẳng, cầm dây kháng lực hoặc gậy bằng hai tay, nắm rộng hơn vai.|Giữ tay thẳng, từ từ đưa dây từ trước đùi lên cao qua đầu.|Tiếp tục đưa ra sau lưng nếu thoải mái; sau đó quay lại theo đường cũ.|Nếu bị kẹt vai, nắm rộng hơn. Làm 10 lần chậm.`,
 `Stand tall holding a resistance band or stick with both hands, wider than shoulder-width.|Keeping your arms straight, slowly raise the band from in front of your thighs up and overhead.|Continue behind your back if comfortable, then return along the same path.|If your shoulders pinch, widen your grip. Do 10 slow reps.`,
 `Không ép nếu vai bị kẹt hoặc đau; đây chỉ là bài di động khớp, không phải bài tăng sức mạnh.`,`Do not force it if your shoulders pinch or hurt; this is a mobility drill, not a strength exercise.`),
/* KETTLEBELL */
X('kbswing','kettlebell','Kettlebell Swing','Vung tạ ấm',2,['kettlebell'],['glutes','back','cardio'],{w:30,r:30,n:6,k:'reps',reps:'15'},
 `Đứng chân rộng hơn vai một chút, tạ ấm ở trước chân; gập hông (không phải squat) để nắm quai tạ bằng hai tay.|Hất tạ ra sau giữa hai chân như đang giao bóng, lưng thẳng.|Bật hông về trước mạnh để tạ bay lên ngang ngực; tay chỉ là sợi dây.|Để tạ rơi tự nhiên, gập hông ra sau và lặp lại liên tục.`,
 `Stand slightly wider than your shoulders with the kettlebell in front of you; hinge at the hips (not a squat) to grab the handle with both hands.|Hike the bell back between your legs like a football snap, back flat.|Snap your hips forward powerfully so the bell floats to chest height; your arms are just ropes.|Let it fall naturally, hinge back and repeat continuously.`,
 `Không nâng tạ bằng tay hay lưng. Dùng tạ nhẹ để học kỹ thuật và nên có HLV.`,`Do not lift the bell with your arms or back. Learn with a light weight and ideally a coach.`),
X('goblet','kettlebell','Goblet Squat','Squat ôm tạ',1,['kettlebell','dumbbell'],['legs','glutes','core'],{w:40,r:60,n:3,k:'reps',reps:'10–12'},
 `Cầm tạ ấm hoặc tạ tay trước ngực bằng hai tay, khuỷu tay chúc xuống.|Đứng chân rộng hơn vai một chút, mũi chân hơi mở ra.|Hạ hông xuống giữa hai chân, khuỷu tay đi vào trong khoảng giữa hai gối, ngực mở.|Đẩy cả bàn chân xuống sàn để đứng lên.`,
 `Hold a kettlebell or dumbbell at your chest with both hands and elbows pointing down.|Stand slightly wider than shoulder-width with toes turned slightly out.|Sit your hips down between your legs so your elbows travel between your knees, keeping your chest open.|Drive through your whole foot to stand up.`,
 `Giữ gót chân trên sàn và ngực cao; dừng nếu đau gối.`,`Keep your heels down and chest tall; stop if your knees hurt.`),
X('tgu','kettlebell','Turkish Get-Up','Turkish get-up',3,['kettlebell','mat'],['full','core','shoulders'],{w:90,r:60,n:3,k:'reps',reps:'1–2 mỗi bên§1–2 per side'},
 `Nằm ngửa, nắm tạ bằng một tay duỗi thẳng lên trần, cùng bên gập gối, chân kia duỗi.|Chống khuỷu tay rồi bàn tay đối diện để ngồi dậy, mắt luôn nhìn tạ.|Nâng hông, đưa chân duỗi ra sau để quỳ, rồi đứng thẳng lên.|Đảo ngược từng bước một cách chậm rãi để nằm xuống. Học không tải hoặc dùng một vật nhẹ.`,
 `Lie on your back holding the bell straight up with one arm, the same-side knee bent and the other leg straight.|Prop up on your elbow and then your opposite hand to sit up, keeping your eyes on the bell.|Lift your hips, sweep the straight leg back to a kneeling position, then stand up.|Reverse each step slowly to lie back down. Learn it with no weight or a light object.`,
 `Bài rất phức tạp: nên học với HLV. Không tập khi mệt.`,`A complex movement: learn it with a coach. Do not train it when tired.`),
/* CALISTHENICS */
X('pushup','calisthenics','Push-Up','Hít đất',1,['none'],['chest','arms','core'],{w:40,r:60,n:3,k:'reps',reps:'8–12'},
 `Vào tư thế plank cao, hai tay đặt rộng hơn vai một chút, thân người thẳng.|Hạ ngực gần sàn, khuỷu tay hợp với thân khoảng 45 độ.|Đẩy người lên, giữ bụng và mông siết.|Người mới: quỳ gối hoặc chống tay lên mặt phẳng cao.`,
 `Start in a high plank with hands slightly wider than your shoulders and your body straight.|Lower your chest close to the floor with elbows at about 45 degrees to your torso.|Press back up, keeping your abs and glutes tight.|Beginners: drop to your knees or place your hands on an elevated surface.`,
 `Không để hông võng hoặc nhô lên; dừng nếu đau cổ tay hoặc vai.`,`Do not let your hips sag or pike; stop if your wrists or shoulders hurt.`),
X('bodysquat','calisthenics','Bodyweight Squat','Squat tay không',1,['none'],['legs','glutes'],{w:40,r:45,n:3,k:'reps',reps:'12–15'},
 `Đứng chân rộng bằng vai, mũi chân hơi mở, tay đưa ra trước hoặc chắp trước ngực.|Ngồi hông ra sau và xuống như đang ngồi vào ghế.|Giữ ngực cao, gối đi theo hướng mũi chân.|Xuống đến mức thoải mái rồi đẩy bàn chân xuống sàn để đứng lên.`,
 `Stand shoulder-width apart with toes slightly out and arms in front of you or clasped at your chest.|Sit your hips back and down as if sitting into a chair.|Keep your chest tall and your knees tracking over your toes.|Go as deep as is comfortable, then push through your feet to stand.`,
 `Không để gót chân nhấc lên hoặc gối đổ vào trong.`,`Do not let your heels lift or your knees cave inward.`),
X('dips','calisthenics','Bench Dip','Chống đẩy ghế',1,['chair'],['arms','chest','shoulders'],{w:30,r:60,n:3,k:'reps',reps:'8–12'},
 `Ngồi mép ghế chắc, hai tay nắm mép ghế cạnh hông, trượt mông ra khỏi ghế.|Duỗi chân ra trước (chân gập để dễ hơn), vai kéo xuống xa tai.|Gập khuỷu tay đến khoảng 90 độ, hạ người thẳng xuống, lưng sát ghế.|Đẩy lên bằng tay đến khi khuỷu gần duỗi thẳng.`,
 `Sit on the edge of a sturdy bench, hands gripping the edge by your hips, and slide your hips off the bench.|Extend your legs forward (bend them to make it easier) and draw your shoulders down away from your ears.|Bend your elbows to about 90 degrees, lowering straight down with your back close to the bench.|Press up with your arms until your elbows are almost straight.`,
 `Không hạ quá sâu; bỏ bài này nếu vai bị đau hoặc không ổn định.`,`Do not drop too low; skip this exercise if your shoulders are painful or unstable.`)
];
