<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nice to Matcha 🍵 Đặt matcha online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@500;700&family=Quicksand:wght@500;700&display=swap">
<style>
:root{--bg:#f6f3e4;--ink:#22301a;--card:#fffdf4;--g:#7f9f47;--g2:#dfe8bd;--deep:#2c4021;--pink:#f5c9d6;--line:#d9dfbd;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162010;--ink:#eef3dc;--card:#1f2c17;--g:#a4c566;--g2:#2c3e20;--deep:#c9dd95;--pink:#6b3a4a;--line:#38482a;--on:#162010;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#162010;--ink:#eef3dc;--card:#1f2c17;--g:#a4c566;--g2:#2c3e20;--deep:#c9dd95;--pink:#6b3a4a;--line:#38482a;--on:#162010;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;font-weight:500;line-height:1.5;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button{font:700 15px Quicksand,sans-serif;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.shell{max-width:1040px;margin:auto;padding:0 5vw}
header{padding:26px 0 6px;text-align:center}
.logo{font-family:'Pinyon Script',cursive;font-size:clamp(52px,10vw,84px);color:var(--deep);line-height:1}
.tag{font-family:'Playfair Display',serif;font-style:italic;opacity:.8}
.steps{display:flex;justify-content:center;gap:6px;margin:16px 0 26px;flex-wrap:wrap;font-size:13px}
.steps span{padding:5px 13px;border-radius:99px;border:1.5px solid var(--line);opacity:.65}
.steps span.on{background:var(--g);border-color:var(--g);color:var(--on);opacity:1}
.steps span.ok{opacity:1;background:var(--g2)}
.cols{display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:start}
h2{font-family:'Playfair Display',serif;font-size:26px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.item .cup{height:108px;border-radius:18px;background:var(--g2);display:grid;place-items:center;font-size:54px}
.item h3{font-family:'Playfair Display',serif;font-size:18px;margin-top:6px}
.item p{font-size:13px;opacity:.75;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;color:var(--deep);font-size:18px}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--g);color:var(--on);font-size:22px;line-height:1}
.add:hover{transform:scale(1.1) rotate(8deg)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:18px;position:sticky;top:12px}
.panel h3,.box h3{font-family:'Playfair Display',serif;margin-bottom:8px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line small{display:block;opacity:.7}
.qty{display:flex;align-items:center;gap:6px;white-space:nowrap}.qty button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--g);background:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.seg button,.pill{padding:10px;border-radius:16px;border:1.5px solid var(--line);background:none}
.seg button.on,.pill.on{background:var(--g2);border-color:var(--g)}
.sum{display:flex;justify-content:space-between;padding:3px 0}.sum.t{font-weight:700;font-size:18px;color:var(--deep);padding-top:8px}
.btn{display:block;width:100%;padding:14px;border-radius:99px;border:0;background:var(--deep);color:var(--bg);margin-top:12px;font-size:16px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.pink{background:var(--pink);color:var(--ink)}.btn.ghost{background:none;border:1.5px solid var(--deep);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:center;padding:12px 5vw calc(12px + env(safe-area-inset-bottom,0px));background:var(--deep);color:var(--bg);z-index:5}
.bar button{padding:10px 20px;border-radius:99px;border:0;background:var(--pink);color:#22301a}
.ov{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h4{margin:14px 0 6px;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{font-size:13px;padding:7px 13px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:20px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px Quicksand,sans-serif}
.err{color:#c2415b;font-size:13px;margin-top:4px;min-height:18px}
.qrbox{text-align:center}.qrbox img{width:min(300px,80%);border-radius:20px;border:6px solid #fff;background:#fff}
.big{font-family:'Playfair Display',serif;font-size:38px;color:var(--deep)}
.code{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--g2);font-weight:700;letter-spacing:.08em}
.thx{text-align:center}.thx .logo{font-size:clamp(46px,9vw,70px)}
.thx img{width:min(300px,78%);border-radius:24px;box-shadow:0 10px 30px #2c402133;margin:14px 0 4px}
.cupanim{font-size:60px;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
@media(max-width:820px){.cols{grid-template-columns:1fr}.panel{position:static}.bar.show{display:flex}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">
<header><div class="logo">Nice to Matcha</div><div class="tag">matcha handmade, giá bạn bè 🍵</div>
<div class="steps" id="steps"></div></header>
<main id="app"></main>
</div>
<div class="bar" id="bar"></div>
<div id="ov" class="ov" hidden></div>

var TOPS=[["Trân châu matcha",5000],["Kem cheese",8000],["Thêm 1 shot matcha",10000],["Sữa oat",7000]],SUG=[0,30,50,70,100],ICE=["Không đá","Ít đá","Vừa","Nhiều đá"];
var $=function(s){return document.querySelector(s)},uid=0;
var S={cart:[],method:"pickup",info:{},code:"",paid:false};
try{var sv=JSON.parse(sessionStorage.getItem("ntm")||"null");if(sv)S=sv}catch(e){}
function save(){try{sessionStorage.setItem("ntm",JSON.stringify(S))}catch(e){}}
function $d(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")+"đ"}
function sub(){return S.cart.reduce(function(a,c){return a+c.unit*c.qty},0)}
function ship(){return S.method==="delivery"&&sub()<SHOP.freeShip?SHOP.ship:0}
function total(){return sub()+ship()}
function cup(c,e){if(!c)return e;var i=++uid;return'<svg width="70" height="100" viewBox="0 0 80 110" aria-hidden="true"><defs><clipPath id="c'+i+'"><path d="M12 22h56l-6 80a6 6 0 0 1-6 5H24a6 6 0 0 1-6-5z"/></clipPath></defs><g clip-path="url(#c'+i+')">'+c.map(function(x,k){return'<rect x="0" y="'+(22+k*22)+'" width="80" height="23" fill="'+x+'"/>'}).join("")+'<rect x="22" y="40" width="16" height="16" rx="4" fill="#fff" opacity=".35"/><rect x="42" y="64" width="16" height="16" rx="4" fill="#fff" opacity=".3"/></g><rect x="8" y="14" width="64" height="10" rx="5" fill="#fff" stroke="#cfd6b0"/><rect x="44" y="0" width="6" height="40" rx="3" fill="#f5a9c0"/></svg>'}
function steps(n){var L=["Chọn món","Nhận hàng","Thanh toán","Hoàn tất"];$("#steps").innerHTML=L.map(function(x,i){return'<span class="'+(i===n?"on":i<n?"ok":"")+'">'+(i+1)+". "+x+'</span>'}).join("")}
function line(c,ed){return'<div class="line"><div><b>'+c.name+'</b><small>'+c.desc+'</small></div><div style="text-align:right">'+(ed?'<div class="qty"><button aria-label="Giảm" data-d="-1" data-k="'+c.id+'">−</button>'+c.qty+'<button aria-label="Tăng" data-d="1" data-k="'+c.id+'">+</button></div>':"x"+c.qty)+'<div>'+$d(c.unit*c.qty)+'</div></div></div>'}
function sumBox(ed){return(S.cart.length?S.cart.map(function(c){return line(c,ed)}).join(""):'<p style="opacity:.7;padding:10px 0">Giỏ hàng đang trống. Chọn món bên trái nhé 🍵</p>')+'<div class="sum" style="margin-top:8px"><span>Tạm tính</span><span>'+$d(sub())+'</span></div><div class="sum"><span>Phí giao hàng</span><span>'+(S.method==="pickup"?"Không có":ship()?$d(ship()):"Miễn phí")+'</span></div><div class="sum t"><span>Tổng</span><span>'+$d(total())+'</span></div>'}
function bindQty(){document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){var c=S.cart.find(function(x){return x.id==b.dataset.k});c.qty+=+b.dataset.d;if(c.qty<1)S.cart.splice(S.cart.indexOf(c),1);save();route()}})}
/* ---------- MENU ---------- */
function pMenu(){steps(0);
$("#app").innerHTML='<div class="cols"><div><h2>🍵 Menu</h2><div class="grid">'+MENU.map(function(d){return'<button class="item" data-m="'+d[0]+'"><div class="cup">'+cup(d[4],d[5])+'</div><h3>'+d[1]+'</h3><p>'+d[2]+'</p><div class="row"><span class="price">'+$d(d[3])+'</span><span class="add" aria-hidden="true" style="display:grid;place-items:center">+</span></div></button>'}).join("")+'</div><p style="margin-top:16px;font-size:13px;opacity:.7">📍 '+SHOP.addr+' · 🕗 '+SHOP.hours+'</p></div>'+
'<aside class="panel" id="cart"><h3>🛍️ Giỏ hàng của bạn</h3>'+sumBox(true)+'<div class="seg"><button data-me="pickup" class="'+(S.method==="pickup"?"on":"")+'">🏪 Đến lấy tại quán</button><button data-me="delivery" class="'+(S.method==="delivery"?"on":"")+'">🛵 Giao hàng</button></div><p style="font-size:12px;opacity:.7">Giao hàng miễn phí từ '+$d(SHOP.freeShip)+'</p><button class="btn" id="next" '+(S.cart.length?"":"disabled")+'>Tiếp tục điền thông tin</button></aside></div>';
document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){sheet(MENU.find(function(d){return d[0]===b.dataset.m}))}});
document.querySelectorAll("[data-me]").forEach(function(b){b.onclick=function(){S.method=b.dataset.me;save();route()}});
$("#next").onclick=function(){location.hash="info"};bindQty();
var n=S.cart.reduce(function(a,c){return a+c.qty},0),bar=$("#bar");bar.className="bar"+(n?" show":"");bar.innerHTML='<span>'+n+' món · <b>'+$d(total())+'</b></span><button id="go">Xem giỏ hàng</button>';$("#go").onclick=function(){$("#cart").scrollIntoView({behavior:"smooth"})}}
function sheet(d){var drink=!!d[4],o={size:"M",sug:70,ice:2,tops:[],qty:1,note:""},ov=$("#ov");
function price(){return d[3]+(o.size==="L"?7000:0)+o.tops.reduce(function(a,i){return a+TOPS[i][1]},0)}
function pills(a,k,fmt){return'<div class="pills">'+a.map(function(x,i){return'<button class="pill'+(o[k]===x||o[k]===i?" on":"")+'" data-k="'+k+'" data-v="'+i+'">'+fmt(x,i)+'</button>'}).join("")+'</div>'}
function draw(){ov.innerHTML='<div class="sheet" role="dialog" aria-label="'+d[1]+'"><div class="row"><h2 style="margin:0">'+d[1]+'</h2><button id="x" aria-label="Đóng" style="border:0;background:none;font-size:26px">✕</button></div><p style="opacity:.75">'+d[2]+'</p>'+
(drink?'<h4>🥤 Size</h4><div class="pills">'+["M","L"].map(function(s){return'<button class="pill'+(o.size===s?" on":"")+'" data-z="'+s+'">'+s+(s==="L"?" (+7k)":" (mặc định)")+'</button>'}).join("")+'</div><h4>🍬 Mức đường</h4><div class="pills">'+SUG.map(function(s,i){return'<button class="pill'+(o.sug===s?" on":"")+'" data-s="'+s+'">'+s+'%</button>'}).join("")+'</div><h4>🧊 Mức đá</h4><div class="pills">'+ICE.map(function(s,i){return'<button class="pill'+(o.ice===i?" on":"")+'" data-i="'+i+'">'+s+'</button>'}).join("")+'</div><h4>✨ Topping</h4><div class="pills">'+TOPS.map(function(s,i){return'<button class="pill'+(o.tops.indexOf(i)>-1?" on":"")+'" data-t="'+i+'">'+s[0]+' +'+s[1]/1000+'k</button>'}).join("")+'</div>':"")+
'<label for="nt">📝 Ghi chú</label><input id="nt" value="'+o.note+'" placeholder="Ví dụ: ít sữa, thêm ống hút giấy"><div class="row" style="margin-top:14px"><div class="qty"><button data-q="-1" aria-label="Giảm">−</button><b>'+o.qty+'</b><button data-q="1" aria-label="Tăng">+</button></div><b class="price">'+$d(price()*o.qty)+'</b></div><button class="btn" id="ok">Thêm vào giỏ hàng</button></div>';
var q=function(s,f){ov.querySelectorAll(s).forEach(f)};
q("[data-z]",function(b){b.onclick=function(){o.size=b.dataset.z;keep()}});q("[data-s]",function(b){b.onclick=function(){o.sug=+b.dataset.s;keep()}});q("[data-i]",function(b){b.onclick=function(){o.ice=+b.dataset.i;keep()}});
q("[data-t]",function(b){b.onclick=function(){var i=+b.dataset.t,p=o.tops.indexOf(i);p>-1?o.tops.splice(p,1):o.tops.push(i);keep()}});q("[data-q]",function(b){b.onclick=function(){o.qty=Math.max(1,o.qty+ +b.dataset.q);keep()}});
$("#x").onclick=close;ov.onclick=function(e){if(e.target===ov)close()};
$("#ok").onclick=function(){o.note=$("#nt").value;var desc=drink?"Size "+o.size+" · "+o.sug+"% đường · "+ICE[o.ice]+(o.tops.length?" · "+o.tops.map(function(i){return TOPS[i][0]}).join(", "):""):"",full=desc+(o.note?(desc?" · ":"")+"Ghi chú: "+o.note:"");S.cart.push({id:Date.now()+""+S.cart.length,name:d[1],desc:full,unit:price(),qty:o.qty});save();close();route()}}
function keep(){o.note=$("#nt")?$("#nt").value:o.note;draw();var n=$("#nt");if(n)n.value=o.note}
function close(){ov.hidden=true;ov.innerHTML=""}
ov.hidden=false;draw()}
/* ---------- THÔNG TIN ---------- */
function pInfo(){if(!S.cart.length)return void(location.hash="menu");steps(1);$("#bar").className="bar";var dl=S.method==="delivery",i=S.info;
$("#app").innerHTML='<div class="cols"><div class="box"><h3>'+(dl?"🛵 Thông tin giao hàng":"🏪 Thông tin nhận tại quán")+'</h3>'+
'<label for="f1">Họ và tên</label><input id="f1" autocomplete="name" value="'+(i.name||"")+'"><label for="f2">Số điện thoại</label><input id="f2" type="tel" autocomplete="tel" value="'+(i.phone||"")+'">'+
(dl?'<label for="f3">Địa chỉ giao hàng</label><input id="f3" autocomplete="street-address" placeholder="Số nhà, tên đường, phường, quận" value="'+(i.addr||"")+'">':'<label for="f3">Thời gian đến lấy</label><select id="f3">'+["Càng sớm càng tốt","Sau 15 phút","Sau 30 phút","Sau 1 giờ"].map(function(x){return'<option'+(i.addr===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select><p style="font-size:13px;margin-top:6px;opacity:.75">📍 '+SHOP.addr+'</p>')+
'<label for="f4">Ghi chú cho quán</label><textarea id="f4" rows="2">'+(i.note||"")+'</textarea><div class="err" id="er" role="alert"></div><button class="btn" id="nx">Tiếp tục thanh toán</button><button class="btn ghost" id="bk">Quay lại chọn món</button></div>'+
'<aside class="panel"><h3>🧾 Đơn hàng</h3>'+sumBox(false)+'</aside></div>';
$("#bk").onclick=function(){location.hash="menu"};
$("#nx").onclick=function(){var n=$("#f1").value.trim(),p=$("#f2").value.replace(/[\s.]/g,""),a=$("#f3").value.trim(),e="";if(!n)e="Vui lòng nhập họ tên.";else if(!/^(0|\+84)\d{9}$/.test(p))e="Số điện thoại chưa đúng (ví dụ 0901234567).";else if(dl&&a.length<8)e="Vui lòng nhập địa chỉ đầy đủ.";
$("#er").textContent=e;if(e)return;S.info={name:n,phone:p,addr:a,note:$("#f4").value.trim()};if(!S.code)S.code="NTM"+Math.floor(1000+Math.random()*9000);save();location.hash="pay"}}
/* ---------- THANH TOÁN ---------- */
function pPay(){if(!S.info.name)return void(location.hash="info");steps(2);
$("#app").innerHTML='<div class="cols"><div class="box qrbox"><h3>💳 Thanh toán</h3><p>Quét mã QR bằng Zalo, sau đó chuyển khoản đúng số tiền và nội dung bên dưới.</p><img src="'+QR+'" alt="Mã QR Zalo của quán"><div class="big" style="margin-top:12px">'+$d(total())+'</div><p>Nội dung chuyển khoản</p><span class="code" id="cd">'+S.code+'</span><br><button class="btn pink" id="cp" style="max-width:260px;margin:12px auto 0">📋 Sao chép nội dung</button><button class="btn" id="paid" style="max-width:360px;margin:12px auto 0">Mình đã thanh toán ✓</button><button class="btn ghost" id="bk" style="max-width:360px;margin:12px auto 0">Quay lại</button></div><aside class="panel"><h3>🧾 Đơn '+S.code+'</h3>'+sumBox(false)+'<p style="font-size:13px;margin-top:10px">'+(S.method==="delivery"?"🛵 Giao tới: "+S.info.addr:"🏪 Lấy tại quán: "+S.info.addr)+'<br>👤 '+S.info.name+' · '+S.info.phone+'</p></aside></div>';
$("#bk").onclick=function(){location.hash="info"};$("#cp").onclick=function(){cpy(S.code,this)};$("#paid").onclick=function(){S.paid=true;save();location.hash="thanks"}}
function cpy(t,b){var o=b.textContent;try{navigator.clipboard.writeText(t).then(function(){b.textContent="Đã sao chép ✓";setTimeout(function(){b.textContent=o},1800)})}catch(e){}}
function order(){return SHOP.name+" - Đơn "+S.code+"\n"+S.cart.map(function(c){return"- "+c.qty+"x "+c.name+(c.desc?" ("+c.desc+")":"")}).join("\n")+"\n"+(S.method==="delivery"?"Giao hàng tới: "+S.info.addr:"Đến lấy tại quán: "+S.info.addr)+"\nKhách: "+S.info.name+" - "+S.info.phone+(S.info.note?"\nGhi chú: "+S.info.note:"")+"\nTổng: "+$d(total())}
/* ---------- CẢM ƠN ---------- */
function pThanks(){if(!S.paid)return void(location.hash="pay");steps(3);
$("#app").innerHTML='<div class="box thx"><div class="cupanim">🍵</div><div class="logo">Cảm ơn bạn!</div><p>Đơn <b>'+S.code+'</b> của '+S.info.name+' đã được ghi nhận.<br>'+(S.method==="delivery"?"Quán sẽ giao tới bạn trong khoảng 30 đến 45 phút.":"Quán sẽ chuẩn bị sẵn để bạn đến lấy. 🏪")+'</p><p style="margin-top:10px"><b>Bước cuối:</b> sao chép đơn hàng và nhắn cho quán qua Zalo để quán xác nhận thanh toán nhé 💚</p><img src="'+CARD+'" alt="Mã QR Zalo của quán Nice to Matcha"><br>'+(SHOP.zalo?'<a class="btn" style="max-width:340px;margin:12px auto 0" target="_blank" rel="noopener" href="'+SHOP.zalo+'">💬 Nhắn Zalo cho quán</a>':'<p style="font-size:13px;opacity:.75">Mở Zalo, bấm quét QR rồi quét mã trên để nhắn cho quán.</p>')+'<button class="btn pink" id="co" style="max-width:340px;margin:12px auto 0">📋 Sao chép đơn hàng để gửi Zalo</button><button class="btn ghost" id="nw" style="max-width:340px;margin:12px auto 0">Đặt thêm đơn mới</button></div>';
$("#co").onclick=function(){cpy(order(),this)};$("#nw").onclick=function(){S={cart:[],method:"pickup",info:{},code:"",paid:false};save();location.hash="menu"}}
function route(){var h=location.hash.slice(1)||"menu";$("#bar").className="bar";({menu:pMenu,info:pInfo,pay:pPay,thanks:pThanks}[h]||pMenu)();if(h!=="menu")window.scrollTo(0,0)}
window.onhashchange=route;route();
</script>
</body>
