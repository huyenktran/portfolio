<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Xíu Xiu Gang · Học tiếng Anh qua truyện cho bé 📚</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#fffaf0;--sky:#cfeeff;--sun:#ffd84d;--pink:#ff7eb6;--mint:#aef0cf;--ink:#2a2540;--blue:#3b9cff;--card:#fff;--line:#ffe3a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;font-weight:500;line-height:1.6;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{font-weight:700;cursor:pointer;color:inherit;border:0;background:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.w{max-width:1160px;margin:auto;padding:0 5vw}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fffaf0ee;backdrop-filter:blur(10px);border-bottom:3px dotted var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.logo{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;display:flex;align-items:center;gap:8px;line-height:1.1}.logo i{font-style:normal;font-size:32px}
.logo small{display:block;font:700 10px Quicksand;letter-spacing:.14em;color:var(--pink)}
.nav{display:flex;gap:18px;font-weight:700;font-size:14px}.nav a:hover{color:var(--pink)}
.btn{display:inline-block;padding:12px 24px;border-radius:99px;background:var(--pink);color:#fff;font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;box-shadow:0 5px 0 #d94b8b;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d94b8b}
.btn.y{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #d6a900}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d72cc}.btn.o{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d9d3e8;border:2px solid #d9d3e8}
.hero{background:linear-gradient(180deg,var(--sky),var(--bg));padding:56px 0 50px;position:relative;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center}
.hero h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(36px,6.4vw,66px);line-height:1.05}.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{margin:14px 0 22px;max-width:480px;font-size:17px}
.hero .art svg{width:100%;border-radius:36px;box-shadow:0 12px 0 #bfe3f7;border:6px solid #fff}
.fl{position:absolute;font-size:38px;animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px) rotate(10deg)}}
h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(26px,4vw,38px);text-align:center;margin:60px 0 6px}
.sub{text-align:center;opacity:.8;margin-bottom:22px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lv button{border-radius:30px;padding:22px 12px;text-align:center;border:3px solid #fff;box-shadow:0 6px 0 #0000001a;transition:.2s;font-family:Fredoka,sans-serif;font-size:18px}.lv button:hover{transform:translateY(-4px) rotate(-1.5deg)}.lv button.on{outline:4px solid var(--ink)}.lv span{display:block;font-size:44px}.lv small{display:block;font:700 12px Quicksand;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:18px}
.st{background:var(--card);border:3px solid var(--line);border-radius:28px;overflow:hidden;text-align:left;transition:.2s;display:flex;flex-direction:column}.st:hover{transform:translateY(-4px) rotate(.8deg);box-shadow:0 12px 0 #ffe3a366}
.st svg{display:block;width:100%}.st div{padding:12px 14px 16px}.st h3{font-family:Fredoka,sans-serif;font-weight:500;font-size:19px;line-height:1.25}.st small{opacity:.7}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--mint);margin-right:4px}
.feat,.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat div,.plans div{background:#fff;border:3px solid var(--line);border-radius:30px;padding:24px 18px;text-align:center}.feat span{font-size:44px;display:block}.feat b,.plans b{font-family:Fredoka,sans-serif;font-size:20px}
.plans div{display:flex;flex-direction:column;gap:6px}.plans ul{list-style:none;padding:0;font-size:14px;flex:1}.plans li{margin:3px 0}.plans .btn{margin-top:10px}.plans .hot{border-color:var(--pink);background:#fff1f7}
details{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:10px}summary{font-weight:700;cursor:pointer}
.cta{margin-top:60px;background:var(--blue);color:#fff;border-radius:40px;padding:44px 20px;text-align:center}.cta h2{margin:0 0 6px;color:#fff}
footer{margin-top:60px;background:var(--ink);color:#fff;padding:36px 0 30px;font-size:14px}footer a{text-decoration:underline}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--line);padding:10px 5vw calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}.bar span{font-weight:700;font-size:14px}
.ov{position:fixed;inset:0;background:#2a254099;z-index:60;display:none;align-items:center;justify-content:center;padding:14px}.ov.open{display:flex}
.md{background:var(--bg);border-radius:32px;padding:22px;width:min(520px,100%);max-height:94vh;overflow:auto;border:4px solid #fff}
.rd{width:min(640px,100%)}.rd .sc svg{width:100%;border-radius:24px;display:block;border:4px solid #fff;box-shadow:0 6px 0 #0000001a}
.en{font-family:Fredoka,sans-serif;font-size:clamp(22px,4.6vw,30px);line-height:1.4;margin:14px 0 6px;font-weight:500}.vi{color:#6d6788;font-size:15px;min-height:24px}
.vw{background:#fff2b3;border-radius:8px;padding:0 5px;border:0;font:inherit;cursor:pointer;border-bottom:3px solid var(--sun)}
.vh{min-height:30px;font-weight:700;color:var(--pink);margin:4px 0}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.ctl .btn{padding:9px 18px;font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:10px;height:10px;border-radius:50%;background:#e5deef}.dots i.on{background:var(--pink)}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:18px;background:#fff;border:3px solid var(--line);margin:8px 0;font-size:16px}.opt.ok{background:var(--mint);border-color:#4bc58f}.opt.no{background:#ffd9d9;border-color:#ff8f8f}
.f label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}.f input,.f select,.f textarea{width:100%;padding:11px 14px;border-radius:16px;border:3px solid var(--line);background:#fff}
.err{color:#d6336c;font-size:13px;min-height:18px}
.sw{display:flex;gap:4px;background:#fff;border:3px solid var(--line);border-radius:99px;padding:3px}.sw button{padding:5px 12px;border-radius:99px;font-size:13px}.sw button.on{background:var(--ink);color:#fff}.py{font-size:17px;color:#d94b8b;font-weight:700;margin:0 0 6px}body.zh .en,body.zh .fc,body.zh .big,body.zh .vw,body.zh .opt,body.zh .gb button,body.zh .st h3{font-family:Fredoka,"Noto Sans SC",sans-serif}
.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}.cats button{padding:7px 16px;border-radius:99px;border:3px solid var(--line);background:#fff;font-size:13px}.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.gm button{border-radius:30px;padding:22px 12px;text-align:center;border:3px solid #fff;box-shadow:0 6px 0 #0000001a;font-family:Fredoka,sans-serif;font-size:19px;transition:.2s}.gm button:hover{transform:translateY(-4px) rotate(1.5deg)}.gm span{display:block;font-size:44px}.gm small{display:block;font:700 12px Quicksand;opacity:.75}
.fc{display:block;width:100%;min-height:190px;border-radius:30px;background:#fff;border:4px solid var(--sun);font-family:Fredoka,sans-serif;font-size:clamp(30px,8vw,44px);padding:20px;box-shadow:0 8px 0 #ffe3a3;margin:14px 0}.fc small{display:block;font:700 13px Quicksand;opacity:.6}
.gb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.gb button{padding:18px 6px;border-radius:20px;background:#fff;border:3px solid var(--line);font-family:Fredoka;font-size:20px;min-height:64px}.gb button.mt{background:var(--mint)}.gb button.sel{background:#fff2b3;border-color:var(--sun)}.gb button.ok{background:var(--mint);border-color:#4bc58f}.gb button.no{background:#ffd9d9;border-color:#ff8f8f}
.big{font-family:Fredoka;font-size:clamp(28px,7vw,40px);text-align:center;margin:12px 0}.tm{font-family:Fredoka;font-size:30px;text-align:center;color:var(--pink)}
@media(max-width:780px){.hero .w,.feat,.plans{grid-template-columns:1fr}.lv{grid-template-columns:1fr 1fr}.nav{display:none}.hd .btn{padding:9px 16px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
.subj{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.subj button{padding:8px 16px;border-radius:99px;border:3px solid var(--line);background:#fff;font-size:14px}.subj button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:780px){.hd{flex-wrap:wrap}.sw{order:3}}
</style>
</head>

{t:"The Hungry Cat",v:"Chú mèo đói bụng",lv:"g12",tp:"Động vật",w:{hungry:"đói",kitchen:"nhà bếp",jump:"nhảy",purr:"kêu gừ gừ"},q:["Where does Milo look for food?",["In the garden","In the kitchen","At school"],1],p:[["Milo the cat is hungry. He looks in the kitchen.","Mèo Milo đang đói. Cậu ấy tìm trong nhà bếp.","day",[["🐱",110,150,64],["🍳",230,150,46]]],["He sees a fish on the table. He jumps up!","Cậu thấy một con cá trên bàn. Cậu nhảy lên!","day",[["🐟",220,120,40],["🐱",120,140,60],["✨",170,90,26]]],["Mom says, “No, Milo!” She gives him cat food instead.","Mẹ nói: “Không được, Milo!” Mẹ cho cậu thức ăn cho mèo.","day",[["👩",90,150,62],["🥣",190,170,40],["🐱",250,150,54]]],["Milo eats and purrs. Now he is not hungry.","Milo ăn và kêu gừ gừ. Giờ cậu không còn đói.","sunset",[["😻",150,150,70],["💗",230,100,30]]]]},
{t:"Rainy Day",v:"Ngày mưa",lv:"g12",tp:"Thời tiết",w:{rainy:"có mưa",boots:"đôi ủng",puddle:"vũng nước",laugh:"cười"},q:["What does Lily jump in?",["A puddle","A pool","A box"],0],p:[["It is a rainy day. Lily cannot play outside.","Hôm nay trời mưa. Lily không thể chơi ngoài trời.","rain",[["🏠",150,140,80],["☔",250,150,40]]],["She puts on her boots and jumps in a puddle.","Bé đi ủng và nhảy vào vũng nước.","rain",[["👧",140,150,64],["🥾",190,170,28],["💧",230,170,34]]],["Splash! Lily laughs. Rain is fun!","Tõm! Lily cười. Mưa thật vui!","rain",[["😆",150,150,70],["🌈",240,90,50]]]]},
{t:"The Water Cycle Adventure",v:"Chuyến phiêu lưu của giọt nước",lv:"g34",tp:"Khoa học",w:{evaporate:"bốc hơi",vapor:"hơi nước",condense:"ngưng tụ",precipitation:"mưa, tuyết rơi",collect:"tập trung"},q:["What happens when the sun heats the water?",["It evaporates","It freezes","It disappears forever"],0],p:[["Drip the water drop lives in a warm river. When the sun heats the water, Drip evaporates and rises into the air as vapor.","Giọt nước Drip sống trong dòng sông ấm. Khi mặt trời làm nóng nước, Drip bốc hơi và bay lên không trung thành hơi nước.","day",[["🌊",100,170,56],["☀️",250,60,40],["💧",190,100,40]]],["High in the sky, it is cold. Drip and his friends condense and form a big, fluffy cloud.","Trên cao rất lạnh. Drip và các bạn ngưng tụ lại thành một đám mây to và xốp.","day",[["☁️",160,110,90],["💧",100,150,30],["💧",220,150,30]]],["When the cloud becomes heavy, precipitation begins. Drip falls as rain onto the mountains.","Khi đám mây nặng, mưa bắt đầu rơi. Drip rơi xuống núi dưới dạng mưa.","rain",[["⛰️",110,160,70],["🌧️",220,100,60]]],["Streams collect the rain and carry it back to the river. The water cycle starts again!","Các dòng suối gom nước mưa và đưa về sông. Vòng tuần hoàn nước bắt đầu lại!","garden",[["🏞️",160,150,80],["🔄",250,90,34]]]]},
{t:"Pizza Fractions",v:"Phân số qua chiếc bánh pizza",lv:"g34",tp:"Toán",w:{fraction:"phân số",equal:"bằng nhau",whole:"nguyên vẹn",half:"một nửa",quarter:"một phần tư"},q:["How many slices were left?",["Two","Four","Six"],0],p:[["Tom and his sister ordered one whole pizza. It was cut into eight equal slices.","Tom và em gái gọi một chiếc pizza nguyên vẹn. Nó được cắt thành tám miếng bằng nhau.","day",[["🍕",160,150,80],["👦",80,160,46],["👧",250,160,46]]],["Tom ate two slices. That is two eighths, or one quarter of the pizza.","Tom ăn hai miếng. Đó là hai phần tám, tức một phần tư chiếc pizza.","day",[["😋",110,150,56],["🍕",210,150,56],["2️⃣",250,90,30]]],["His sister ate half of the pizza, which is four slices. How many slices were left?","Em gái ăn một nửa chiếc pizza, tức bốn miếng. Còn lại bao nhiêu miếng?","day",[["👧",110,150,56],["🍕",210,150,50],["❓",260,90,34]]],["Two slices were left. Fractions help us share food fairly!","Còn lại hai miếng. Phân số giúp ta chia thức ăn công bằng!","sunset",[["🍕",150,150,60],["🍕",220,160,46],["🤝",190,90,34]]]]},
{t:"The Rhythm Club",v:"Câu lạc bộ nhịp điệu",lv:"g34",tp:"Âm nhạc",w:{rhythm:"nhịp điệu",instrument:"nhạc cụ",beat:"nhịp",melody:"giai điệu",practice:"luyện tập"},q:["What does Lina do?",["Plays the piano","Keeps the beat on the drum","Sings a song"],1],p:[["Every Friday, the Rhythm Club meets in the music room. Each student chooses a different instrument.","Thứ Sáu hằng tuần, Câu lạc bộ Nhịp điệu họp ở phòng nhạc. Mỗi bạn chọn một nhạc cụ khác nhau.","class",[["🥁",90,150,50],["🎸",160,150,50],["🎹",230,150,50]]],["Lina taps the drum to keep the beat. Max plays a cheerful melody on the piano.","Lina gõ trống giữ nhịp. Max chơi một giai điệu vui tươi trên đàn piano.","class",[["👧",100,150,56],["🥁",150,160,44],["🎹",230,150,50],["🎵",200,90,30]]],["At first, the sounds do not match. After a month of practice, they create beautiful music together.","Ban đầu âm thanh chưa hòa hợp. Sau một tháng luyện tập, các bạn tạo nên bản nhạc tuyệt vời cùng nhau.","sunset",[["🎶",160,100,56],["👧",100,160,46],["👦",220,160,46]]]]},
{t:"The Mystery of x",v:"Bí ẩn của chữ x",lv:"g57",tp:"Algebra",w:{variable:"biến số",equation:"phương trình",expression:"biểu thức",solve:"giải",balance:"cân bằng"},q:["What is the value of x?",["7","8","15"],1],p:[["Maya found a strange note in her math book: “x + 7 = 15.” In algebra, the letter x is a variable that stands for an unknown number.","Maya tìm thấy một mẩu giấy lạ trong sách toán: “x + 7 = 15.” Trong đại số, chữ x là một biến số đại diện cho số chưa biết.","class",[["📒",110,150,60],["🧮",210,150,56],["❓",260,80,34]]],["Her teacher explained that an equation is like a balanced scale. Whatever you do to one side, you must do to the other side.","Cô giáo giải thích phương trình giống như chiếc cân thăng bằng. Làm gì ở một bên thì phải làm điều đó ở bên kia.","class",[["⚖️",160,150,80],["👩‍🏫",250,160,50]]],["Maya subtracted 7 from both sides, so x = 8. She solved the mystery and checked it: 8 + 7 really equals 15!","Maya trừ 7 ở cả hai vế nên x = 8. Bé giải được bí ẩn và kiểm tra lại: 8 + 7 đúng bằng 15!","day",[["✏️",110,150,50],["8️⃣",190,150,56],["✅",250,100,40]]],["Soon she tried harder expressions, such as 3x − 2 = 10. Algebra felt like detective work, and Maya loved it.","Chẳng bao lâu bé thử những biểu thức khó hơn, như 3x − 2 = 10. Đại số giống như công việc của thám tử, và Maya rất thích.","lab",[["🕵️",130,150,64],["📐",220,150,50],["💡",250,80,34]]]]},
{t:"Gravity on the Playground",v:"Trọng lực ở sân chơi",lv:"g57",tp:"Vật lý",w:{gravity:"trọng lực",force:"lực",energy:"năng lượng",speed:"tốc độ",friction:"lực ma sát"},q:["What slowed Leo down on the rough ground?",["Gravity","Friction","Light"],1],p:[["At recess, Leo climbed to the top of the slide. Gravity is a force that pulls everything toward the center of the Earth.","Giờ ra chơi, Leo leo lên đỉnh cầu trượt. Trọng lực là lực kéo mọi vật về phía tâm Trái Đất.","day",[["🛝",170,150,84],["👦",90,150,50],["⬇️",250,100,34]]],["As Leo slid down, his potential energy changed into kinetic energy, the energy of motion, and his speed increased.","Khi Leo trượt xuống, thế năng của cậu chuyển thành động năng, tức năng lượng chuyển động, và tốc độ tăng lên.","day",[["🛝",150,150,70],["🧒",210,150,50],["💨",100,120,36]]],["The metal slide was smooth, so there was little friction. On the rough ground, friction slowed him down and finally stopped him.","Cầu trượt kim loại trơn nên ma sát rất nhỏ. Trên mặt đất gồ ghề, lực ma sát làm cậu chậm lại và dừng hẳn.","day",[["🧒",120,150,52],["🪨",200,170,40],["🛑",250,100,40]]],["Leo realized that physics was everywhere on the playground. Every swing, jump and slide followed the laws of nature.","Leo nhận ra vật lý có ở khắp sân chơi. Mỗi cú đu, nhảy và trượt đều theo quy luật tự nhiên.","sunset",[["🤸",110,150,56],["🎠",200,150,56],["🔬",260,90,34]]]]},
{t:"The Class Election",v:"Cuộc bầu cử của lớp",lv:"g57",tp:"Chính trị",w:{election:"cuộc bầu cử",candidate:"ứng viên",vote:"bỏ phiếu",citizen:"công dân",democracy:"nền dân chủ"},q:["How did the students vote?",["Out loud","In secret","By shouting"],1],p:[["Our class held an election to choose a new representative. Three candidates shared their ideas about improving the school library and the playground.","Lớp mình tổ chức bầu cử để chọn một đại diện mới. Ba ứng viên chia sẻ ý tưởng về việc cải thiện thư viện và sân chơi của trường.","class",[["🗳️",150,150,70],["🧑‍🎤",90,160,44],["🧑‍💼",230,160,44]]],["Every student had the right to vote in secret. Nobody could force us to choose a particular candidate.","Mỗi học sinh đều có quyền bỏ phiếu kín. Không ai có thể ép chúng mình chọn một ứng viên nhất định.","class",[["🤫",120,150,56],["🗳️",200,150,60],["📝",260,90,34]]],["After the votes were counted, Nora won by a small margin, but the other candidates congratulated her warmly.","Sau khi kiểm phiếu, Nora thắng với cách biệt nhỏ, nhưng các ứng viên khác vẫn nhiệt tình chúc mừng bạn.","day",[["🏆",160,140,70],["👏",90,165,40],["👏",240,165,40]]],["Our teacher said that responsible citizens take part in decisions. That is the heart of democracy, even in a classroom.","Cô giáo nói công dân có trách nhiệm tham gia vào các quyết định. Đó là cốt lõi của nền dân chủ, ngay cả trong lớp học.","sunset",[["🏛️",160,150,70],["🤝",100,160,40],["💛",240,110,34]]]]},
{t:"The Great Lunch Survey",v:"Cuộc khảo sát bữa trưa",lv:"g57",tp:"Nghiên cứu",w:{research:"nghiên cứu",hypothesis:"giả thuyết",survey:"khảo sát",data:"dữ liệu",conclusion:"kết luận"},q:["Was Ben’s hypothesis correct?",["Yes, noodles won","No, rice won","Nobody answered"],1],p:[["Ben wanted to do research about his school’s lunch. His hypothesis was that most students prefer noodles to rice.","Ben muốn nghiên cứu về bữa trưa ở trường. Giả thuyết của cậu là đa số học sinh thích mì hơn cơm.","class",[["🍜",110,150,56],["🍚",210,150,56],["🤔",260,90,36]]],["He designed a short survey and asked one hundred students from different grades the same question. A fair sample gives reliable results.","Cậu thiết kế một bản khảo sát ngắn và hỏi một trăm học sinh ở nhiều khối cùng một câu hỏi. Mẫu công bằng cho kết quả đáng tin cậy.","class",[["📋",120,150,56],["🧑‍🎓",200,155,44],["🧑‍🎓",250,155,44]]],["When he analyzed the data, rice won with fifty-eight votes. His hypothesis was wrong, but the evidence was clear.","Khi phân tích dữ liệu, cơm thắng với năm mươi tám phiếu. Giả thuyết sai nhưng bằng chứng rất rõ ràng.","lab",[["📊",150,150,70],["🍚",240,150,46]]],["In his conclusion, Ben wrote that good scientists accept the facts, even when the results surprise them.","Trong phần kết luận, Ben viết rằng nhà khoa học giỏi chấp nhận sự thật, kể cả khi kết quả làm họ bất ngờ.","day",[["🧑‍🔬",130,150,60],["📝",210,150,50],["⭐",250,90,34]]]]},
{t:"Photosynthesis: The Plant Kitchen",v:"Quang hợp: bếp của cây xanh",lv:"g57",tp:"Khoa học",w:{photosynthesis:"quang hợp",chlorophyll:"chất diệp lục",absorb:"hấp thụ",glucose:"đường glucose",oxygen:"khí oxi"},q:["Which gas do plants release?",["Oxygen","Smoke","Steam"],0],p:[["Plants are like tiny kitchens. They make their own food through a process called photosynthesis.","Cây xanh giống những căn bếp nhỏ. Chúng tự tạo thức ăn qua quá trình gọi là quang hợp.","garden",[["🌿",160,150,80],["☀️",250,60,40]]],["Green leaves contain chlorophyll, a substance that absorbs sunlight. The roots also absorb water from the soil.","Lá xanh chứa chất diệp lục, một chất hấp thụ ánh sáng mặt trời. Rễ cũng hút nước từ đất.","garden",[["🍃",120,140,56],["💧",200,170,34],["🌱",240,160,46]]],["Using sunlight, water and carbon dioxide, the plant produces glucose for energy. It also releases oxygen, the gas we breathe.","Dùng ánh sáng, nước và khí cacbonic, cây tạo ra đường glucose để lấy năng lượng. Cây còn thải ra khí oxi mà ta hít thở.","day",[["🌳",150,150,80],["💨",230,110,40],["🫁",250,165,34]]],["Without photosynthesis, there would be no food and no fresh air on Earth. That is why we must protect forests.","Không có quang hợp, Trái Đất sẽ không có thức ăn và không khí trong lành. Vì vậy ta phải bảo vệ rừng.","day",[["🌍",160,140,70],["🌲",90,160,44],["🌲",240,160,44]]]]},
{t:"The Young Orchestra",v:"Dàn nhạc nhí",lv:"g57",tp:"Âm nhạc",w:{orchestra:"dàn nhạc giao hưởng",conductor:"nhạc trưởng",composer:"nhà soạn nhạc",harmony:"sự hòa âm",audience:"khán giả"},q:["Who guides the musicians?",["The composer","The conductor","The audience"],1],p:[["The school orchestra has forty members who play strings, woodwinds, brass and percussion. Their conductor guides every musician with a small baton.","Dàn nhạc của trường có bốn mươi thành viên chơi nhạc cụ dây, hơi gỗ, hơi đồng và gõ. Nhạc trưởng dẫn dắt từng nghệ sĩ bằng chiếc đũa nhỏ.","class",[["🎻",90,150,48],["🎺",150,150,48],["🥁",210,150,48],["🧑‍🎤",260,155,40]]],["Today they are performing a piece by a famous composer. Each section plays a different part, and together they create harmony.","Hôm nay họ biểu diễn một tác phẩm của nhà soạn nhạc nổi tiếng. Mỗi nhóm chơi một phần khác nhau, và cùng nhau tạo nên sự hòa âm.","night",[["🎼",160,100,50],["🎻",100,160,50],["🎷",220,160,50]]],["When the final note faded, the audience stood up and applauded for several minutes. The musicians smiled with pride.","Khi nốt nhạc cuối tắt dần, khán giả đứng dậy vỗ tay vài phút. Các nghệ sĩ mỉm cười tự hào.","sunset",[["👏",90,160,44],["🎭",160,140,64],["👏",230,160,44]]]]}];

zs(0,"小鸭游泳","Xiǎo yā yóuyǒng · Chú vịt nhỏ","pk","Động vật",{"小鸭":"xiǎo yā|vịt con","池塘":"chítáng|cái ao","游泳":"yóuyǒng|bơi","开心":"kāixīn|vui"},["小鸭在池塘里做什么？",["睡觉 (shuìjiào)","游泳 (yóuyǒng)","跑步 (pǎobù)"],1],[["这是小鸭。小鸭很小。","Zhè shì xiǎo yā. Xiǎo yā hěn xiǎo.","Đây là vịt con. Vịt con rất nhỏ."],["小鸭看见一个池塘。扑通！小鸭游泳。","Xiǎo yā kànjiàn yí gè chítáng. Pūtōng! Xiǎo yā yóuyǒng.","Vịt con thấy một cái ao. Tũm! Vịt con bơi."],["小鸭说：“嘎嘎！”小鸭很开心。","Xiǎo yā shuō: “Gāgā!” Xiǎo yā hěn kāixīn.","Vịt con kêu “Quạc quạc!” Vịt con rất vui."]]),
zs(1,"红苹果","Hóng píngguǒ · Quả táo đỏ","pk","Đồ ăn",{"苹果":"píngguǒ|quả táo","红色":"hóngsè|màu đỏ","洗":"xǐ|rửa","甜":"tián|ngọt"},["苹果是什么颜色？",["红色 (hóngsè)","蓝色 (lánsè)","绿色 (lǜsè)"],0],[["我有一个苹果。它是红色的。","Wǒ yǒu yí gè píngguǒ. Tā shì hóngsè de.","Em có một quả táo. Nó màu đỏ."],["我洗苹果。洗啊洗啊洗！","Wǒ xǐ píngguǒ. Xǐ a xǐ a xǐ!","Em rửa quả táo. Rửa, rửa, rửa!"],["真好吃！我吃苹果。它很甜。","Zhēn hǎochī! Wǒ chī píngguǒ. Tā hěn tián.","Ngon quá! Em ăn táo. Nó rất ngọt."]]),
zs(2,"饿了的小猫","È le de xiǎomāo · Chú mèo đói bụng","g12","Động vật",{"饿":"è|đói","厨房":"chúfáng|nhà bếp","跳":"tiào|nhảy","猫粮":"māoliáng|thức ăn cho mèo"},["咪咪去哪里找吃的？",["厨房 (chúfáng)","花园 (huāyuán)","学校 (xuéxiào)"],0],[["小猫咪咪饿了。它去厨房找吃的。","Xiǎomāo Mīmī è le. Tā qù chúfáng zhǎo chī de.","Mèo Mimi đói rồi. Nó vào nhà bếp tìm đồ ăn."],["它看见桌子上有一条鱼，就跳了上去！","Tā kànjiàn zhuōzi shàng yǒu yì tiáo yú, jiù tiào le shàngqù!","Nó thấy trên bàn có một con cá nên nhảy lên!"],["妈妈说：“不行，咪咪！”她给它猫粮。","Māma shuō: “Bù xíng, Mīmī!” Tā gěi tā māoliáng.","Mẹ nói: “Không được, Mimi!” Mẹ cho nó thức ăn cho mèo."],["咪咪吃完了，高兴地叫起来。现在它不饿了。","Mīmī chī wán le, gāoxìng de jiào qǐlái. Xiànzài tā bú è le.","Mimi ăn xong, vui vẻ kêu lên. Giờ nó không đói nữa."]]),
zs(3,"下雨天","Xià yǔ tiān · Ngày mưa","g12","Thời tiết",{"下雨":"xià yǔ|trời mưa","雨靴":"yǔxuē|ủng đi mưa","水坑":"shuǐkēng|vũng nước","大笑":"dà xiào|cười lớn"},["莉莉跳进了什么？",["水坑 (shuǐkēng)","游泳池 (yóuyǒngchí)","盒子 (hézi)"],0],[["今天下雨了。莉莉不能去外面玩。","Jīntiān xià yǔ le. Lìlì bù néng qù wàimiàn wán.","Hôm nay trời mưa. Lili không thể ra ngoài chơi."],["她穿上雨靴，跳进水坑里。","Tā chuān shàng yǔxuē, tiào jìn shuǐkēng lǐ.","Bé đi ủng và nhảy vào vũng nước."],["哗啦！莉莉哈哈大笑。下雨真好玩！","Huālā! Lìlì hāhā dà xiào. Xià yǔ zhēn hǎowán!","Tõm! Lili cười ha ha. Mưa thật vui!"]]),
zs(4,"水的旅行","Shuǐ de lǚxíng · Hành trình của giọt nước","g34","Khoa học",{"蒸发":"zhēngfā|bốc hơi","水蒸气":"shuǐzhēngqì|hơi nước","凝结":"níngjié|ngưng tụ","降雨":"jiàngyǔ|mưa rơi","汇集":"huìjí|tụ lại"},["太阳一晒，小水滴会怎么样？",["蒸发 (zhēngfā)","结冰 (jiébīng)","消失 (xiāoshī)"],0],[["小水滴住在温暖的河里。太阳一晒，它就蒸发，变成水蒸气飞到空中。","Xiǎo shuǐdī zhù zài wēnnuǎn de hé lǐ. Tàiyáng yí shài, tā jiù zhēngfā, biànchéng shuǐzhēngqì fēi dào kōngzhōng.","Giọt nước nhỏ sống trong dòng sông ấm. Mặt trời chiếu nóng, nó bốc hơi, biến thành hơi nước bay lên không trung."],["天空很冷，小水滴和朋友们凝结成一朵大大的白云。","Tiānkōng hěn lěng, xiǎo shuǐdī hé péngyoumen níngjié chéng yì duǒ dàdà de báiyún.","Trên trời rất lạnh, giọt nước và các bạn ngưng tụ thành một đám mây trắng to."],["云变重了，就开始降雨。小水滴落在山上。","Yún biàn zhòng le, jiù kāishǐ jiàngyǔ. Xiǎo shuǐdī luò zài shān shàng.","Mây nặng dần thì bắt đầu mưa. Giọt nước rơi xuống núi."],["小溪把雨水汇集起来，又流回河里。水的旅行重新开始了！","Xiǎoxī bǎ yǔshuǐ huìjí qǐlái, yòu liú huí hé lǐ. Shuǐ de lǚxíng chóngxīn kāishǐ le!","Suối gom nước mưa lại rồi chảy về sông. Hành trình của nước lại bắt đầu!"]]),
zs(5,"披萨分数","Pīsà fēnshù · Phân số qua chiếc pizza","g34","Toán",{"分数":"fēnshù|phân số","完整":"wánzhěng|nguyên vẹn","一样大":"yíyàng dà|bằng nhau","一半":"yí bàn|một nửa","公平":"gōngpíng|công bằng"},["还剩几块？",["两块 (liǎng kuài)","四块 (sì kuài)","六块 (liù kuài)"],0],[["汤姆和妹妹点了一个完整的披萨，被切成八块一样大的小块。","Tāngmǔ hé mèimei diǎn le yí gè wánzhěng de pīsà, bèi qiē chéng bā kuài yíyàng dà de xiǎo kuài.","Tom và em gái gọi một chiếc pizza nguyên vẹn, được cắt thành tám miếng bằng nhau."],["汤姆吃了两块，也就是八分之二，等于四分之一。","Tāngmǔ chī le liǎng kuài, yě jiù shì bā fēn zhī èr, děngyú sì fēn zhī yī.","Tom ăn hai miếng, tức hai phần tám, bằng một phần tư."],["妹妹吃了一半，也就是四块。还剩下几块呢？","Mèimei chī le yí bàn, yě jiù shì sì kuài. Hái shèng xià jǐ kuài ne?","Em gái ăn một nửa, tức bốn miếng. Còn lại mấy miếng?"],["还剩两块。分数能帮我们公平地分享食物！","Hái shèng liǎng kuài. Fēnshù néng bāng wǒmen gōngpíng de fēnxiǎng shíwù!","Còn hai miếng. Phân số giúp ta chia thức ăn công bằng!"]]),
zs(6,"节奏俱乐部","Jiézòu jùlèbù · Câu lạc bộ nhịp điệu","g34","Âm nhạc",{"节奏":"jiézòu|nhịp điệu","乐器":"yuèqì|nhạc cụ","节拍":"jiépāi|nhịp","旋律":"xuánlǜ|giai điệu","练习":"liànxí|luyện tập"},["琳娜做什么？",["弹钢琴 (tán gāngqín)","敲鼓打节拍 (qiāo gǔ dǎ jiépāi)","唱歌 (chànggē)"],1],[["每个星期五，节奏俱乐部都在音乐教室聚会。每个同学选一件不同的乐器。","Měi gè xīngqīwǔ, jiézòu jùlèbù dōu zài yīnyuè jiàoshì jùhuì. Měi gè tóngxué xuǎn yí jiàn bùtóng de yuèqì.","Thứ Sáu hằng tuần, Câu lạc bộ nhịp điệu họp ở phòng nhạc. Mỗi bạn chọn một nhạc cụ khác nhau."],["琳娜敲鼓打节拍，马克用钢琴弹出一段欢快的旋律。","Línnà qiāo gǔ dǎ jiépāi, Mǎkè yòng gāngqín tán chū yí duàn huānkuài de xuánlǜ.","Lina gõ trống giữ nhịp, Mark chơi một giai điệu vui tươi trên piano."],["一开始，声音不太协调。练习了一个月后，他们一起奏出了美妙的音乐。","Yì kāishǐ, shēngyīn bú tài xiétiáo. Liànxí le yí gè yuè hòu, tāmen yìqǐ zòu chū le měimiào de yīnyuè.","Ban đầu âm thanh chưa hòa hợp. Sau một tháng luyện tập, các bạn cùng tạo ra bản nhạc tuyệt vời."]]),
zs(7,"x 的秘密","x de mìmì · Bí ẩn của chữ x","g57","Algebra",{"变量":"biànliàng|biến số","方程":"fāngchéng|phương trình","算式":"suànshì|biểu thức","平衡":"pínghéng|cân bằng","代数":"dàishù|đại số"},["x 等于多少？",["7","8","15"],1],[["玛雅在数学书里发现了一张奇怪的纸条：“x + 7 = 15”。在代数里，字母 x 是一个变量，代表一个未知的数。","Mǎyǎ zài shùxué shū lǐ fāxiàn le yì zhāng qíguài de zhǐtiáo: “x + 7 = 15”. Zài dàishù lǐ, zìmǔ x shì yí gè biànliàng, dàibiǎo yí gè wèizhī de shù.","Maya thấy một mẩu giấy lạ trong sách toán: “x + 7 = 15”. Trong đại số, chữ x là biến số, đại diện cho một số chưa biết."],["老师解释说，方程就像一架平衡的天平：对一边做什么，就必须对另一边做同样的事。","Lǎoshī jiěshì shuō, fāngchéng jiù xiàng yí jià pínghéng de tiānpíng: duì yì biān zuò shénme, jiù bìxū duì lìng yì biān zuò tóngyàng de shì.","Cô giáo giải thích phương trình như chiếc cân thăng bằng: làm gì ở một bên thì phải làm điều tương tự ở bên kia."],["玛雅在两边都减去 7，得到 x = 8。她解开了谜题，还检验了一下：8 + 7 确实等于 15！","Mǎyǎ zài liǎng biān dōu jiǎn qù 7, dédào x = 8. Tā jiěkāi le mítí, hái jiǎnyàn le yíxià: 8 + 7 quèshí děngyú 15!","Maya trừ 7 ở cả hai vế, được x = 8. Bé giải được bí ẩn và thử lại: 8 + 7 đúng bằng 15!"],["不久，她尝试更难的算式，比如 3x − 2 = 10。代数就像侦探工作，玛雅爱上了它。","Bùjiǔ, tā chángshì gèng nán de suànshì, bǐrú 3x − 2 = 10. Dàishù jiù xiàng zhēntàn gōngzuò, Mǎyǎ àishàng le tā.","Chẳng bao lâu, bé thử những biểu thức khó hơn như 3x − 2 = 10. Đại số giống việc của thám tử, và Maya đã yêu nó."]]),
zs(8,"操场上的重力","Cāochǎng shàng de zhònglì · Trọng lực ở sân chơi","g57","Vật lý",{"重力":"zhònglì|trọng lực","摩擦力":"mócālì|lực ma sát","能量":"néngliàng|năng lượng","速度":"sùdù|tốc độ","物理":"wùlǐ|vật lý"},["在粗糙的地面上，什么让利奥慢下来？",["重力 (zhònglì)","摩擦力 (mócālì)","光 (guāng)"],1],[["课间休息时，利奥爬到了滑梯的顶端。重力是一种把所有物体拉向地心的力。","Kèjiān xiūxi shí, Lì’ào pá dào le huátī de dǐngduān. Zhònglì shì yì zhǒng bǎ suǒyǒu wùtǐ lā xiàng dìxīn de lì.","Giờ ra chơi, Leo leo lên đỉnh cầu trượt. Trọng lực là lực kéo mọi vật về phía tâm Trái Đất."],["利奥滑下来时，重力势能变成了动能，也就是运动的能量，所以他的速度越来越快。","Lì’ào huá xiàlái shí, zhònglì shìnéng biànchéng le dòngnéng, yě jiù shì yùndòng de néngliàng, suǒyǐ tā de sùdù yuè lái yuè kuài.","Khi Leo trượt xuống, thế năng biến thành động năng, tức năng lượng chuyển động, nên tốc độ càng lúc càng nhanh."],["金属滑梯很光滑，摩擦力很小。到了粗糙的地面上，摩擦力让他慢下来，最后停住了。","Jīnshǔ huátī hěn guānghuá, mócālì hěn xiǎo. Dào le cūcāo de dìmiàn shàng, mócālì ràng tā màn xiàlái, zuìhòu tíng zhù le.","Cầu trượt kim loại trơn nên ma sát nhỏ. Trên mặt đất gồ ghề, lực ma sát làm cậu chậm lại rồi dừng hẳn."],["利奥发现，操场上到处都是物理。每一次荡秋千、跳跃和滑行，都遵循着自然的规律。","Lì’ào fāxiàn, cāochǎng shàng dàochù dōu shì wùlǐ. Měi yí cì dàng qiūqiān, tiàoyuè hé huáxíng, dōu zūnxún zhe zìrán de guīlǜ.","Leo nhận ra vật lý có ở khắp sân chơi. Mỗi lần đu, nhảy hay trượt đều theo quy luật tự nhiên."]]),
zs(9,"班级选举","Bānjí xuǎnjǔ · Cuộc bầu cử của lớp","g57","Chính trị",{"选举":"xuǎnjǔ|cuộc bầu cử","候选人":"hòuxuǎnrén|ứng viên","投票":"tóupiào|bỏ phiếu","公民":"gōngmín|công dân","民主":"mínzhǔ|dân chủ"},["同学们怎么投票？",["大声说出来 (dàshēng shuō chūlái)","秘密投票 (mìmì tóupiào)","喊叫 (hǎnjiào)"],1],[["我们班举行选举，选一位新的班级代表。三位候选人介绍了改善学校图书馆和操场的想法。","Wǒmen bān jǔxíng xuǎnjǔ, xuǎn yí wèi xīn de bānjí dàibiǎo. Sān wèi hòuxuǎnrén jièshào le gǎishàn xuéxiào túshūguǎn hé cāochǎng de xiǎngfǎ.","Lớp mình tổ chức bầu cử chọn đại diện mới. Ba ứng viên trình bày ý tưởng cải thiện thư viện và sân chơi."],["每个同学都有权利秘密投票。没有人能强迫我们选某一位候选人。","Měi gè tóngxué dōu yǒu quánlì mìmì tóupiào. Méiyǒu rén néng qiǎngpò wǒmen xuǎn mǒu yí wèi hòuxuǎnrén.","Mỗi bạn đều có quyền bỏ phiếu kín. Không ai được ép ta chọn một ứng viên nhất định."],["计票后，诺拉以微弱的优势获胜，其他候选人也热情地向她祝贺。","Jìpiào hòu, Nuòlā yǐ wēiruò de yōushì huòshèng, qítā hòuxuǎnrén yě rèqíng de xiàng tā zhùhè.","Kiểm phiếu xong, Nora thắng với cách biệt nhỏ, các ứng viên khác nhiệt tình chúc mừng bạn."],["老师说，负责任的公民要参与决策，这就是民主的核心，哪怕在教室里也一样。","Lǎoshī shuō, fù zérèn de gōngmín yào cānyù juécè, zhè jiù shì mínzhǔ de héxīn, nǎpà zài jiàoshì lǐ yě yíyàng.","Cô giáo nói công dân có trách nhiệm cần tham gia quyết định. Đó là cốt lõi của dân chủ, dù chỉ trong lớp học."]]),
zs(10,"午餐调查","Wǔcān diàochá · Cuộc khảo sát bữa trưa","g57","Nghiên cứu",{"研究":"yánjiū|nghiên cứu","假设":"jiǎshè|giả thuyết","问卷":"wènjuàn|bảng khảo sát","数据":"shùjù|dữ liệu","结论":"jiélùn|kết luận"},["本的假设正确吗？",["正确，面条赢了 (zhèngquè, miàntiáo yíng le)","不正确，米饭赢了 (bú zhèngquè, mǐfàn yíng le)","没人回答 (méi rén huídá)"],1],[["本想研究学校的午餐。他的假设是：大多数同学喜欢面条胜过米饭。","Běn xiǎng yánjiū xuéxiào de wǔcān. Tā de jiǎshè shì: dàduōshù tóngxué xǐhuan miàntiáo shèng guò mǐfàn.","Ben muốn nghiên cứu bữa trưa ở trường. Giả thuyết của cậu: đa số bạn thích mì hơn cơm."],["他设计了一份简短的问卷，向不同年级的一百名同学提出同样的问题。公平的样本才能得到可靠的结果。","Tā shèjì le yí fèn jiǎnduǎn de wènjuàn, xiàng bùtóng niánjí de yì bǎi míng tóngxué tíchū tóngyàng de wèntí. Gōngpíng de yàngběn cái néng dédào kěkào de jiéguǒ.","Cậu thiết kế bảng khảo sát ngắn, hỏi một trăm bạn ở các khối cùng một câu hỏi. Mẫu công bằng mới cho kết quả đáng tin."],["分析数据后发现，米饭以五十八票获胜。他的假设错了，但证据很清楚。","Fēnxī shùjù hòu fāxiàn, mǐfàn yǐ wǔshíbā piào huòshèng. Tā de jiǎshè cuò le, dàn zhèngjù hěn qīngchu.","Phân tích dữ liệu thấy cơm thắng với 58 phiếu. Giả thuyết sai nhưng bằng chứng rất rõ."],["在结论里，本写道：好的科学家会接受事实，即使结果让他们感到意外。","Zài jiélùn lǐ, Běn xiě dào: hǎo de kēxuéjiā huì jiēshòu shìshí, jíshǐ jiéguǒ ràng tāmen gǎndào yìwài.","Trong phần kết luận, Ben viết: nhà khoa học giỏi chấp nhận sự thật, dù kết quả làm họ bất ngờ."]]),
zs(11,"光合作用","Guānghé zuòyòng · Quang hợp: bếp của cây","g57","Khoa học",{"光合作用":"guānghé zuòyòng|quang hợp","叶绿素":"yèlǜsù|diệp lục","吸收":"xīshōu|hấp thụ","葡萄糖":"pútáotáng|đường glucose","氧气":"yǎngqì|khí oxi"},["植物释放什么气体？",["氧气 (yǎngqì)","烟 (yān)","蒸汽 (zhēngqì)"],0],[["植物就像小小的厨房，它们通过光合作用自己制造食物。","Zhíwù jiù xiàng xiǎoxiǎo de chúfáng, tāmen tōngguò guānghé zuòyòng zìjǐ zhìzào shíwù.","Cây giống những căn bếp nhỏ, tự tạo thức ăn qua quá trình quang hợp."],["绿叶里含有叶绿素，它能吸收阳光。根也会从土壤里吸收水分。","Lǜyè lǐ hányǒu yèlǜsù, tā néng xīshōu yángguāng. Gēn yě huì cóng tǔrǎng lǐ xīshōu shuǐfèn.","Lá xanh chứa diệp lục, hấp thụ ánh sáng mặt trời. Rễ cũng hút nước từ đất."],["植物利用阳光、水和二氧化碳制造葡萄糖来获得能量，同时释放出我们呼吸需要的氧气。","Zhíwù lìyòng yángguāng, shuǐ hé èryǎnghuàtàn zhìzào pútáotáng lái huòdé néngliàng, tóngshí shìfàng chū wǒmen hūxī xūyào de yǎngqì.","Cây dùng ánh sáng, nước và khí cacbonic tạo ra glucose lấy năng lượng, đồng thời thải khí oxi mà ta hít thở."],["如果没有光合作用，地球上就没有食物，也没有新鲜空气。所以我们要保护森林。","Rúguǒ méiyǒu guānghé zuòyòng, dìqiú shàng jiù méiyǒu shíwù, yě méiyǒu xīnxiān kōngqì. Suǒyǐ wǒmen yào bǎohù sēnlín.","Không có quang hợp, Trái Đất sẽ không có thức ăn và không khí trong lành. Vì vậy ta phải bảo vệ rừng."]]),
zs(12,"少年交响乐团","Shàonián jiāoxiǎng yuètuán · Dàn nhạc nhí","g57","Âm nhạc",{"交响乐团":"jiāoxiǎng yuètuán|dàn nhạc giao hưởng","指挥":"zhǐhuī|nhạc trưởng","作曲家":"zuòqǔjiā|nhà soạn nhạc","和声":"héshēng|hòa âm","观众":"guānzhòng|khán giả"},["谁引导乐手？",["作曲家 (zuòqǔjiā)","指挥 (zhǐhuī)","观众 (guānzhòng)"],1],[["学校的交响乐团有四十名成员，演奏弦乐、木管、铜管和打击乐器。指挥用一根小小的指挥棒引导每一位乐手。","Xuéxiào de jiāoxiǎng yuètuán yǒu sìshí míng chéngyuán, yǎnzòu xiányuè, mùguǎn, tóngguǎn hé dǎjī yuèqì. Zhǐhuī yòng yì gēn xiǎoxiǎo de zhǐhuībàng yǐndǎo měi yí wèi yuèshǒu.","Dàn nhạc giao hưởng của trường có bốn mươi thành viên chơi đàn dây, kèn gỗ, kèn đồng và nhạc cụ gõ. Nhạc trưởng dùng chiếc đũa nhỏ dẫn dắt từng nghệ sĩ."],["今天他们演奏一位著名作曲家的作品。每个声部演奏不同的部分，合在一起就形成了和声。","Jīntiān tāmen yǎnzòu yí wèi zhùmíng zuòqǔjiā de zuòpǐn. Měi gè shēngbù yǎnzòu bùtóng de bùfen, hé zài yìqǐ jiù xíngchéng le héshēng.","Hôm nay họ biểu diễn tác phẩm của một nhà soạn nhạc nổi tiếng. Mỗi bè chơi một phần khác nhau, hợp lại tạo thành hòa âm."],["最后一个音符消失时，观众站起来鼓掌了好几分钟。乐手们骄傲地笑了。","Zuìhòu yí gè yīnfú xiāoshī shí, guānzhòng zhàn qǐlái gǔzhǎng le hǎo jǐ fēnzhōng. Yuèshǒumen jiāo’ào de xiào le.","Khi nốt nhạc cuối tan biến, khán giả đứng dậy vỗ tay mấy phút. Các nghệ sĩ mỉm cười tự hào."]])];
