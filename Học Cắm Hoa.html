<style>
:root{--bg:#F6EFE3;--bg2:#FBF7EF;--paper:#FFFDF8;--ink:#3A322A;--mute:#8A7D6C;--gold:#B08D57;--goldd:#8E6F3E;--goldl:#E6D5B2;--sage:#6F8466;--sagel:#DCE5D6;--blush:#EBCFC7;--line:rgba(142,111,62,.22);--shadow:0 18px 40px -22px rgba(90,70,40,.45);color-scheme:light}

html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;background-image:radial-gradient(1100px 520px at 85% -10%,rgba(255,255,255,.9),transparent 60%),radial-gradient(900px 600px at -10% 20%,rgba(235,207,199,.35),transparent 60%),radial-gradient(800px 600px at 110% 80%,rgba(220,229,214,.5),transparent 60%);background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:18px 0 56px}
h1,h2,h3,h4{font-family:'Cormorant Garamond','Playfair Display',Georgia,serif;font-weight:600;margin:0;text-wrap:balance}
a{color:var(--goldd)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--goldd);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{text-decoration:underline}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(255,253,248,.8)}
.lang button{border:0;background:transparent;color:var(--mute);font:500 12px 'Be Vietnam Pro',sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer;letter-spacing:.08em}
.lang button[aria-pressed=true]{background:var(--ink);color:#FBF6EE}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;margin:26px 0 8px}
.kick{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:var(--goldd);margin:0 0 12px}
.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.04;font-weight:500}
.hero h1 em{color:var(--goldd);font-style:italic}
.sub{color:var(--mute);max-width:46ch;margin:14px 0 20px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#FBF6EE;font:500 14px 'Be Vietnam Pro',sans-serif;padding:11px 22px;border-radius:999px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.gold{background:linear-gradient(135deg,#C9A872,#A7824B);border-color:#A7824B;color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:7px 15px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.art{display:flex;justify-content:center}
.art svg{width:min(100%,380px);height:auto;filter:drop-shadow(0 26px 24px rgba(120,95,55,.25))}
.prog{margin:20px 0 6px;display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px}
.prog .bar{flex:1;height:6px;border-radius:99px;background:rgba(142,111,62,.15);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));width:0;transition:width .4s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.85);margin:14px 0 20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--mute);font:500 13.5px 'Be Vietnam Pro',sans-serif;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--ink);color:#FBF6EE}
.panel{background:rgba(255,253,248,.88);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,34px);box-shadow:var(--shadow)}
.panel h2{font-size:clamp(28px,4vw,38px);font-weight:500}
.help{color:var(--mute);margin:6px 0 18px;max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.card .em{font-size:26px}
.card h3{font-size:22px;margin:6px 0 4px}
.card p{margin:0;color:var(--mute);font-size:14px}
.sec{margin-top:26px}
.sec>h3{font-size:26px;margin-bottom:10px}
ol.st{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
ol.st li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
ol.st li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--goldd);font:600 15px 'Cormorant Garamond',serif;display:grid;place-items:center;margin-top:1px}
ol.st li>span,ol.st li>label{min-width:0;flex:1}
.lesson{background:var(--paper);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.lh{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;color:inherit;font:inherit}
.lh .no{flex:0 0 38px;height:38px;border-radius:50%;background:var(--sagel);color:var(--sage);display:grid;place-items:center;font:600 20px 'Cormorant Garamond',serif}
.lesson.done .lh .no{background:var(--sage);color:#fff}
.lh h3{font-size:23px;line-height:1.2}
.lh small{color:var(--mute)}
.lh .ch{margin-left:auto;color:var(--mute)}
.lb{padding:4px 18px 20px;border-top:1px solid var(--line)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--goldd);margin-right:6px;background:var(--bg2)}
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:22px;margin-top:14px}
.cols>div{min-width:0}
.lbl{letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--goldd);margin:0 0 8px}
.mat{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mat label,ol.st label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
input[type=checkbox]{accent-color:var(--sage);width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.checked{color:var(--mute);text-decoration:line-through}
.tip{margin-top:14px;padding:12px 16px;border-left:3px solid var(--gold);background:rgba(176,141,87,.1);border-radius:0 12px 12px 0}
.warn{margin-top:14px;padding:12px 16px;border:1px solid var(--blush);background:rgba(235,207,199,.28);border-radius:12px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px 'Be Vietnam Pro',sans-serif;padding:7px 15px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#FBF6EE;border-color:var(--ink)}
.in{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;padding:10px 14px;border-radius:12px}
.fl{display:flex;gap:14px;align-items:flex-start}
.fl svg{flex:0 0 64px;width:64px;height:64px}
.fl>div{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.swatches{display:flex;gap:8px;margin:10px 0}
.swatches i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
table.t{width:100%;border-collapse:collapse;margin:12px 0}
table.t td,table.t th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-weight:500;color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tw{overflow-x:auto}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;padding:13px 16px;border-radius:14px;cursor:pointer;text-align:left}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.right{border-color:var(--sage);background:rgba(111,132,102,.14)}
.opt.wrong{border-color:#C0705F;background:rgba(192,112,95,.12)}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}
.scorebig{font:600 46px 'Cormorant Garamond',serif;text-align:center;margin:10px 0}
details.fx{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px 18px;margin-bottom:10px}
details.fx summary{cursor:pointer;padding:12px 0;font:600 21px 'Cormorant Garamond',serif;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fx summary::-webkit-details-marker{display:none}
details.fx summary::after{content:'+';color:var(--goldd)}
details.fx[open] summary::after{content:'–'}
details.fx p{margin:0 0 14px;color:var(--mute)}
footer{margin-top:30px;text-align:center;color:var(--mute);font-size:12.5px;display:grid;gap:8px}
footer .linkb,.linkb{background:none;border:0;color:var(--goldd);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.safebar{margin:16px 0 0;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,253,248,.7);font-size:13px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(58,50,42,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--paper);border-radius:22px;max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:26px}
.xbtn{border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--ink)}
.mbody{padding:16px 22px 22px;overflow:auto}
.mbody h3{font-size:20px;margin:16px 0 4px}
.mbody p{margin:0;color:var(--mute)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.art{order:-1}.art svg{width:min(70%,280px)}.cols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
function b(v,e){return{vi:v,en:e};}
var TOOLS=[
{e:'✂️',n:b('Kéo cắm hoa','Floral shears'),d:b('Cắt cành mềm và thân hoa. Luôn giữ lưỡi sắc và sạch để vết cắt không dập.','Cuts soft stems cleanly. Keep blades sharp and clean so the cut does not crush the stem.')},
{e:'🔪',n:b('Dao cắt hoa','Florist knife'),d:b('Cắt góc nghiêng, tỉa thân dày. Dùng cẩn thận, cắt hướng ra xa người.','Makes angled cuts and trims thick stems. Use carefully and cut away from your body.')},
{e:'🌿',n:b('Kéo cắt cành cứng','Pruning snips'),d:b('Dành cho cành gỗ như khuynh diệp hoặc cành khô.','For woody stems such as eucalyptus branches.')},
{e:'🧤',n:b('Dụng cụ gỡ gai, găng tay','Thorn stripper and gloves'),d:b('Gỡ gai và lá dưới thấp, bảo vệ tay khi xử lý hoa hồng.','Strips thorns and lower leaves and protects your hands when handling roses.')},
{e:'🎀',n:b('Dây thun, dây đay, băng keo hoa','Rubber bands, raffia, floral tape'),d:b('Cố định điểm buộc của bó hoa và quấn thân cành.','Secures the binding point of a bouquet and wraps stems.')},
{e:'🧱',n:b('Xốp cắm hoa hoặc lưới thép','Floral foam or chicken wire'),d:b('Giữ cành đứng trong hộp hoa và bình rộng. Lưới thép hoặc đế kiếm sơn là lựa chọn thay cho xốp.','Holds stems in boxes and wide vessels. Chicken wire or a kenzan pin frog is an alternative to foam.')},
{e:'🏺',n:b('Bình, lọ, hộp hoa','Vases and boxes'),d:b('Chọn bình sạch, cao bằng khoảng một phần hai đến một phần ba chiều cao tổng thể.','Choose a clean vase, about one half to one third of the total height.')},
{e:'📜',n:b('Giấy gói, lưới voan, ruy băng','Wrapping paper, tulle, ribbon'),d:b('Tạo lớp bọc và điểm nhấn. Ruy băng satin màu champagne cho vẻ sang trọng.','Creates the wrap and finishing touch. Champagne satin ribbon gives a luxurious look.')},
{e:'🪣',n:b('Xô nước và dưỡng chất hoa','Bucket and flower food'),d:b('Ngâm hoa trước khi cắm. Dưỡng chất giúp hoa lâu tàn hơn khi pha đúng theo hướng dẫn trên bao bì.','Condition flowers before arranging. Flower food helps them last longer when mixed as the packaging directs.')}
];
var COND=[
b('Rửa sạch xô và bình bằng nước xà phòng. Vi khuẩn là nguyên nhân chính khiến hoa nhanh héo.','Wash buckets and vases with soapy water. Bacteria are a main cause of fast-wilting flowers.'),
b('Mở gói hoa và kiểm tra. Bỏ cánh ngoài bị dập nếu cần.','Unwrap and inspect. Remove bruised outer petals if needed.'),
b('Tuốt hết lá nằm dưới mực nước và gỡ gai nếu cần.','Strip every leaf that would sit below the waterline and remove thorns if needed.'),
b('Cắt chéo khoảng 45 độ, bớt chừng 2 đến 3 cm bằng dụng cụ sắc và sạch.','Cut at about 45 degrees, trimming 2 to 3 cm with a sharp, clean tool.'),
b('Cắm ngay vào nước sạch (hơi ấm) có pha dưỡng chất hoa theo hướng dẫn.','Place straight into clean, lukewarm water mixed with flower food as directed.'),
b('Để hoa nghỉ 2 đến 4 giờ ở nơi mát, tránh nắng, gió và xa trái cây chín.','Let the flowers rest for 2 to 4 hours somewhere cool, away from sun, drafts and ripe fruit.')
];
var PRIN=[
{e:'🌹',n:b('Hoa chính, hoa phụ, lá','Focal, filler, greenery'),d:b('Mỗi bó có ba vai: hoa chính thu hút ánh nhìn, hoa phụ (như baby) làm mềm và lấp khoảng trống, lá tạo khung và chiều sâu.','Every piece has three roles: focal flowers draw the eye, fillers (such as baby\'s breath) soften and fill gaps, greenery frames and adds depth.')},
{e:'3️⃣',n:b('Số lẻ','Odd numbers'),d:b('Nhóm 3, 5, 7 hoặc 9 bông thường trông tự nhiên hơn số chẵn. Đây là gợi ý thẩm mỹ, không phải luật cứng.','Groups of 3, 5, 7 or 9 usually look more natural than even numbers. This is a style guideline, not a hard rule.')},
{e:'📏',n:b('Tỉ lệ chiều cao','Height proportion'),d:b('Với bình, tổng chiều cao thường khoảng 1,5 đến 2 lần chiều cao bình để nhìn cân đối.','For a vase, the overall height is often about 1.5 to 2 times the vase height for a balanced look.')},
{e:'🎨',n:b('Quy tắc màu 60-30-10','The 60-30-10 colour rule'),d:b('Một màu chủ đạo khoảng 60 phần trăm, màu phụ 30 phần trăm, màu nhấn 10 phần trăm. Trắng kem, champagne và xanh lá là bộ phối kinh điển cho hoa cưới.','One dominant colour at about 60 percent, a secondary at 30 and an accent at 10. Ivory, champagne and green is a classic wedding palette.')},
{e:'🪶',n:b('Kết cấu tương phản','Contrasting texture'),d:b('Kết hợp bề mặt mịn (hồng), mảnh nhẹ (baby) và lá (khuynh diệp) để bó hoa có chiều sâu.','Mix smooth (roses), airy (baby\'s breath) and leafy (eucalyptus) textures to add depth.')},
{e:'⚖️',n:b('Cân bằng và điểm nhìn','Balance and focal point'),d:b('Đặt hoa lớn nhất ở gần trung tâm hoặc thấp hơn, hoa nhỏ và lá ra ngoài. Xoay bình và nhìn từ mọi phía.','Place the largest blooms near the centre or lower, smaller flowers and leaves outward. Turn the piece and check every side.')},
{e:'🌀',n:b('Kỹ thuật xoắn ốc','Spiral technique'),d:b('Mỗi cành được thêm nghiêng cùng một hướng và xoay bó trong tay, tạo bó tròn đầy, thân cành xếp xoắn đẹp bên dưới.','Add each stem at the same angle while rotating the bunch in your hand, giving a full dome with an attractive spiral of stems below.')},
{e:'🍃',n:b('Khoảng thở','Negative space'),d:b('Chừa khoảng trống có chủ ý, như trong ikebana, để từng bông hoa được nhìn thấy rõ.','Leave deliberate space, as in ikebana, so each bloom can be seen clearly.')}
];
var LESS=[
{id:'spiral',lv:1,min:40,n:b('Hand-tied Spiral Bouquet','Bó hoa cầm tay xoắn ốc'),
 d:b('Bài nền tảng: học cách cầm, thêm cành và buộc để có bó hoa tròn đầy.','The foundation lesson: learn to hold, add stems and bind for a full, round bouquet.'),
 m:[b('15 đến 20 cành hoa chính (hồng, cẩm chướng...)','15 to 20 focal stems (roses, carnations...)'),b('2 bó hoa phụ','2 bunches of filler'),b('6 cành lá','6 stems of greenery'),b('Dây thun hoặc dây đay','Rubber band or raffia'),b('Kéo cắm hoa','Floral shears')],
 s:[b('Xử lý hoa theo bước chuẩn bị ở tab Bắt đầu và tuốt lá ở khoảng 15 cm cuối cành.','Condition the flowers as in the Start tab and strip leaves from the lower 15 cm of each stem.'),
    b('Cầm một cành hoa chính ở giữa, ngón cái và ngón trỏ giữ điểm buộc cách đầu hoa khoảng một phần ba cành.','Hold one focal stem in the middle, thumb and finger gripping the binding point about a third down from the bloom.'),
    b('Thêm cành tiếp theo nghiêng chéo cùng một hướng, đặt đầu hoa cao thấp xen kẽ.','Add the next stem on a diagonal in the same direction, staggering the bloom heights.'),
    b('Xoay bó một phần tư vòng sau mỗi lần thêm cành. Xen kẽ hoa phụ và lá.','Turn the bunch a quarter turn after each stem. Alternate filler and greenery.'),

vi:{title:'Lưu ý an toàn và Điều khoản sử dụng',upd:'Cập nhật lần cuối: 16/11/2026. Phiên bản 1.0.',
intro:'Trang “Học cắm hoa” (“Trang”) là sản phẩm hướng dẫn và giải trí của Alessandra Tran (“Chúng tôi”). Khi sử dụng Trang, bạn đồng ý với các điều khoản dưới đây.',
s:[
['1. Mục đích','Nội dung chỉ mang tính hướng dẫn chung và tham khảo sở thích. Đây không phải khóa học chuyên nghiệp, chứng chỉ hay tư vấn chuyên môn.'],
['2. An toàn khi dùng dụng cụ','Kéo, dao, dây thép và ghim rất sắc. Hãy dùng đúng cách, cắt ra xa người, đeo găng khi gỡ gai, để xa tầm tay trẻ em và luôn cẩn thận. Bạn tự chịu trách nhiệm về sự an toàn của mình và người xung quanh.'],
['3. Dị ứng, phấn hoa và độc tính','Một số hoa và lá có thể gây dị ứng, kích ứng da hoặc độc với người, trẻ em và thú cưng (ví dụ hoa ly rất độc với mèo). Hãy kiểm tra từng loại hoa, giữ ngoài tầm với của trẻ nhỏ và thú cưng, và hỏi bác sĩ hoặc bác sĩ thú y khi cần. Thông tin trên Trang không thay thế tư vấn y tế hay thú y.'],
['4. Xốp cắm hoa, nến và đồ dùng khác','Xốp cắm hoa có thể tạo bụi khi cắt khô, nên đeo khẩu trang và xử lý rác đúng cách. Nến phải đặt xa hoa khô, giấy và vật dễ cháy, và không để không người trông. Bạn tự chịu rủi ro khi dùng các vật dụng này.'],
['5. Độ chính xác','Thông tin về hoa, độ bền và cách chăm sóc là gợi ý chung, có thể khác nhau theo vùng, mùa vụ, nhà cung cấp và điều kiện bảo quản. Chúng tôi không đảm bảo hoa sẽ bền hoặc đạt kết quả như mô tả.'],
['6. Không bảo đảm','Trang được cung cấp “như hiện có”, không có bảo đảm nào, rõ ràng hay ngụ ý.'],
['7. Giới hạn trách nhiệm','Trong phạm vi pháp luật cho phép, Chúng tôi không chịu trách nhiệm đối với thương tích, thiệt hại tài sản, chi phí mua hoa, vật liệu, thiệt hại gián tiếp hay hệ quả nào phát sinh từ việc làm theo nội dung Trang.'],
['8. Liên kết bên ngoài','Trang có thể liên kết tới YouTube, Google hoặc trang khác. Chúng tôi không kiểm soát và không chịu trách nhiệm về nội dung của họ. Liên kết video là kết quả tìm kiếm, không phải video cụ thể.'],
['9. Dữ liệu cá nhân','Ngôn ngữ và tiến độ học của bạn lưu trên trình duyệt của bạn (localStorage), không gửi đến máy chủ của Chúng tôi. Trang có thể tải phông chữ từ Google Fonts.'],
['10. Sở hữu trí tuệ','Mã nguồn, giao diện và nội dung do Chúng tôi biên soạn thuộc quyền của Chúng tôi. Bạn được dùng cho mục đích cá nhân, phi thương mại.'],
['11. Luật áp dụng và liên hệ','Điều khoản này theo pháp luật Việt Nam, không loại trừ các quyền mà pháp luật bảo vệ người tiêu dùng không cho phép loại trừ. Nếu thấy nội dung sai, xin liên hệ qua trang Liên hệ của alessandratran.com.']
],close:'Đóng',footT:'Lưu ý an toàn và Điều khoản',safe:'An toàn: dụng cụ sắc, dị ứng, độc tính với trẻ em và thú cưng, nến. Xem Lưu ý an toàn.'},
en:{title:'Safety Notes and Terms of Use',upd:'Last updated: 16 November 2026. Version 1.0.',
intro:'The “Learn Flower Arranging” page (the “Site”) is an instructional and entertainment project by Alessandra Tran (“We”). By using the Site you agree to the terms below.',
s:[
['1. Purpose','Content is general guidance and a reflection of personal taste. It is not a professional course, certification or professional advice.'],

  for(i=0;i<10;i++){var ang=(-170+i*20)*Math.PI/180,x=180+Math.cos(ang)*118,y=150+Math.sin(ang)*98;o+='<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="9" ry="22" fill="#A9BBA2" transform="rotate('+(i*20-80)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"/>';}
  for(i=0;i<150;i++){var ag=r()*Math.PI*2,rad=Math.sqrt(r())*118;o+='<circle cx="'+(180+Math.cos(ag)*rad*1.05).toFixed(1)+'" cy="'+(150+Math.sin(ag)*rad*.9).toFixed(1)+'" r="'+(1.8+r()*2).toFixed(1)+'" fill="#fff" stroke="#EDE3D0" stroke-width=".6"/>';}
  var pos=[[180,150],[140,120],[220,120],[110,160],[250,160],[150,190],[210,190],[180,105],[132,205],[228,205],[85,125],[275,125],[180,235]];
  pos.forEach(function(p,n){var rr=n<7?27:21;o+='<g transform="translate('+p[0]+' '+p[1]+')"><circle r="'+rr+'" fill="#FFFDF8" stroke="#E0D2B8" stroke-width="1.5"/><circle r="'+(rr*.7)+'" fill="none" stroke="#E6D8BF" stroke-width="1.5"/><circle r="'+(rr*.4)+'" fill="none" stroke="#E0D2B8" stroke-width="1.5"/><path d="M-'+(rr*.15)+' -'+(rr*.15)+' q'+(rr*.3)+' -'+(rr*.2)+' '+(rr*.3)+' '+(rr*.3)+'" fill="none" stroke="#D5C4A3" stroke-width="1.5"/></g>';});
  o+='<path d="M150 250 L180 330 L210 250 Z" fill="#EFE3CC"/><path d="M180 262 C120 275 100 320 120 346 C150 330 168 300 180 270 Z M180 262 C240 275 260 320 240 346 C210 330 192 300 180 270 Z" fill="#E6D5B2" stroke="#B08D57" stroke-width="2"/><circle cx="180" cy="266" r="9" fill="#B08D57"/>';
  return '<svg viewBox="0 0 360 360" role="img" aria-label="">'+o+'</svg>';
}

/* ---------- render ---------- */
var TABS=['start','prin','less','flow','rec','quiz','fix'];
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(k){return '<button class="tab" type="button" role="tab" data-tab="'+k+'" aria-selected="'+(k===tab)+'">'+t('t_'+k)+'</button>';}).join('');}
function doneCount(){var n=0;LESS.forEach(function(l){if(ST.done[l.id])n++;});return n;}
function renderProg(){var a=doneCount(),b=LESS.length;$('#progt').textContent=t('prog',{a:a,b:b});$('#progb').style.width=Math.round(a/b*100)+'%';}
function view(){
  var h='';
  if(tab==='start'){
    h='<h2>'+t('startH')+'</h2><p class="help">'+t('startP')+'</p><div class="sec" style="margin-top:6px"><h3>'+t('tools')+'</h3><div class="grid">'+TOOLS.map(function(x){return '<div class="card"><div class="em">'+x.e+'</div><h3>'+esc(V(x.n))+'</h3><p>'+esc(V(x.d))+'</p></div>';}).join('')+'</div></div>'+
      '<div class="sec"><h3>'+t('cond')+'</h3><ol class="st">'+COND.map(function(x){return '<li><span>'+esc(V(x))+'</span></li>';}).join('')+'</ol></div>';
  }else if(tab==='prin'){
    h='<h2>'+t('prinH')+'</h2><p class="help">'+t('prinP')+'</p><div class="grid">'+PRIN.map(function(x){return '<div class="card"><div class="em">'+x.e+'</div><h3>'+esc(V(x.n))+'</h3><p>'+esc(V(x.d))+'</p></div>';}).join('')+'</div>';
  }else if(tab==='less'){
    h='<h2>'+t('lessH')+'</h2><p class="help">'+t('lessP')+'</p>'+LESS.map(function(l,i){var o=openL===l.id,d=!!ST.done[l.id],sd=ST.steps[l.id]||{};
      var body='';if(o){body='<div class="lb"><p style="margin:14px 0 0;color:var(--mute)">'+esc(V(l.d))+'</p><div class="cols"><div><p class="lbl">'+t('mat')+'</p><ul class="mat">'+l.m.map(function(m){return '<li><label><span>'+esc(V(m))+'</span></label></li>';}).join('')+'</ul></div><div><p class="lbl">'+t('steps')+'</p><ol class="st">'+l.s.map(function(s,k){var c=!!sd[k];return '<li><label><input type="checkbox" data-step="'+l.id+':'+k+'"'+(c?' checked':'')+'><span class="'+(c?'checked':'')+'">'+esc(V(s))+'</span></label></li>';}).join('')+'</ol></div></div>'+
        '<div class="tip"><b>'+t('tip')+':</b> '+esc(V(l.t))+'</div><div class="warn">'+esc(t('safeL'))+'</div>'+
        '<div class="row"><button class="btn gold sm" type="button" data-done="'+l.id+'">'+(d?t('undone'):'✓ '+t('markDone'))+'</button><a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(l.q)+'">▶ '+t('video')+'</a></div></div>';}
      return '<div class="lesson'+(d?' done':'')+'"><button class="lh" type="button" data-open="'+l.id+'" aria-expanded="'+o+'"><span class="no">'+(d?'✓':(i+1))+'</span><span><h3>'+nm(l)+'</h3><small>'+t('lv')+': '+t('lvn')[l.lv]+' · ≈ '+l.min+' '+t('min')+'</small></span><span class="ch">'+(o?'▲':'▼')+'</span></button>'+body+'</div>';}).join('');
  }else if(tab==='flow'){
    var list=FLW.filter(function(f){return(flt==='all'||f.role===flt)&&(!q||fold(f.n.en+' '+f.n.vi).indexOf(fold(q))>=0);});
    h='<h2>'+t('flowH')+'</h2><p class="help">'+t('flowP')+'</p><div class="chips">'+['all','focal','filler','green'].map(function(k){return '<button class="chip" type="button" data-flt="'+k+'" aria-pressed="'+(flt===k)+'">'+t(k)+'</button>';}).join('')+'</div><input class="in" id="fq" type="search" placeholder="'+esc(t('search'))+'" value="'+esc(q)+'" style="margin-bottom:16px" aria-label="'+esc(t('search'))+'">'+
      (list.length?'<div class="grid">'+list.map(function(f){return '<div class="card"><div class="fl">'+bloom(f.c)+'<div><h3>'+nm(f)+'</h3><div class="meta"><span class="badge">'+esc(t('role')[f.role])+'</span><span class="badge">'+esc(t('life',{x:f.life}))+'</span></div></div></div><p style="margin-top:10px"><b style="color:var(--ink)">'+esc(V(f.t))+'</b></p><p style="margin-top:6px">'+esc(V(f.care))+'</p></div>';}).join('')+'</div>':'<p class="help">'+t('noRes')+'</p>');
  }else if(tab==='rec'){
    var oc=OCC.filter(function(x){return x.id===rec.o;})[0],vr=oc.v[rec.v%oc.v.length],sz=SIZES.filter(function(x){return x.id===rec.s;})[0];
    function fn(id){return FLW.filter(function(f){return f.id===id;})[0];}
    var ff=fn(vr.f),fi=fn(vr.fi),fg=fn(vr.g);
    h='<h2>'+t('recH')+'</h2><p class="help">'+t('recP')+'</p><p class="lbl">'+t('occ')+'</p><div class="chips">'+OCC.map(function(x){return '<button class="chip" type="button" data-occ="'+x.id+'" aria-pressed="'+(rec.o===x.id)+'">'+x.e+' '+esc(V(x.n))+'</button>';}).join('')+'</div><p class="lbl">'+t('size')+'</p><div class="chips">'+SIZES.map(function(x){return '<button class="chip" type="button" data-size="'+x.id+'" aria-pressed="'+(rec.s===x.id)+'">'+esc(V(x.n))+' · '+esc(V(x.dim))+'</button>';}).join('')+'</div>'+
      '<div class="card" style="margin-top:8px"><p class="lbl">'+t('recipe')+'</p><h3 style="font-size:28px">'+esc(V(vr.n))+'</h3><p class="lbl" style="margin-top:12px">'+t('pal')+'</p><div class="swatches">'+vr.p.map(function(c){return '<i style="background:'+c+'" title="'+c+'"></i>';}).join('')+'</div><p class="lbl">'+t('count')+'</p><div class="tw"><table class="t"><tr><th></th><th>'+t('count')+'</th></tr>'+
      '<tr><td>'+t('focalL')+': '+nm(ff)+'</td><td>'+sz.f+' '+t('stems')+'</td></tr><tr><td>'+t('fillerL')+': '+nm(fi)+'</td><td>'+sz.fi+' '+t('bunches')+'</td></tr><tr><td>'+t('greenL')+': '+nm(fg)+'</td><td>'+sz.g+' '+t('stems')+'</td></tr></table></div>'+
      '<p class="lbl">'+t('wrapL')+'</p><p>'+esc(V(vr.x))+'</p><div class="row"><button class="btn sm" type="button" id="recnext">'+t('another')+'</button><button class="btn ghost sm" type="button" data-goless="'+(rec.o==='wedding'?'wrapped':'spiral')+'">'+t('seeLesson')+'</button></div></div>';
  }else if(tab==='quiz'){
    h='<h2>'+t('quizH')+'</h2><p class="help">'+t('quizP')+'</p>';
    if(!qz.started)h+='<div class="row"><button class="btn gold" type="button" id="qgo">'+t('qStart')+'</button></div>';
    else if(qz.i>=QZ.length)h+='<div class="scorebig">'+t('qScore',{a:qz.score,b:QZ.length})+'</div><div class="row" style="justify-content:center"><button class="btn gold" type="button" id="qgo">'+t('qAgain')+'</button></div>';
    else{var c=QZ[qz.i];h+='<p class="lbl">'+t('qOf',{a:qz.i+1,b:QZ.length})+'</p><h3 style="font-size:26px">'+esc(V(c.q))+'</h3><div class="opts">'+c.o.map(function(o,i){var cl='opt';if(qz.sel!==null){if(i===c.a)cl+=' right';else if(i===qz.sel)cl+=' wrong';}return '<button class="'+cl+'" type="button" data-q="'+i+'"'+(qz.sel!==null?' disabled':'')+'>'+esc(V(o))+'</button>';}).join('')+'</div>';
      if(qz.sel!==null)h+='<div class="fb" aria-live="polite"><b>'+(qz.sel===c.a?t('qOk'):t('qNo'))+'</b><p style="margin:6px 0 0">'+esc(V(c.x))+'</p></div><div class="row"><button class="btn sm" type="button" id="qnext">'+(qz.i>=QZ.length-1?t('qDone'):t('qNext'))+'</button></div>';}
  }else{
    h='<h2>'+t('fixH')+'</h2><p class="help">'+t('fixP')+'</p>'+FIX.map(function(f){return '<details class="fx"><summary>'+esc(V(f.n))+'</summary><p>'+esc(V(f.d))+'</p></details>';}).join('');
  }
  $('#panel').innerHTML=h;
}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;renderTabs();view();});
$('#panel').addEventListener('click',function(e){var b;
  if(b=e.target.closest('[data-open]')){openL=openL===b.dataset.open?'':b.dataset.open;view();return;}
  if(b=e.target.closest('[data-done]')){var id=b.dataset.done;if(ST.done[id])delete ST.done[id];else ST.done[id]=true;saveST();renderProg();view();return;}
  if(b=e.target.closest('[data-flt]')){flt=b.dataset.flt;view();return;}
  if(b=e.target.closest('[data-occ]')){rec.o=b.dataset.occ;rec.v=0;view();return;}
  if(b=e.target.closest('[data-size]')){rec.s=b.dataset.size;view();return;}
  if(e.target.closest('#recnext')){rec.v++;view();return;}
  if(b=e.target.closest('[data-goless]')){tab='less';openL=b.dataset.goless;renderTabs();view();return;}
  if(e.target.closest('#qgo')){qz={started:true,i:0,sel:null,score:0};view();return;}
  if(b=e.target.closest('[data-q]')){if(qz.sel===null){qz.sel=+b.dataset.q;if(qz.sel===QZ[qz.i].a)qz.score++;view();}return;}
  if(e.target.closest('#qnext')){qz.i++;qz.sel=null;view();}
});
$('#panel').addEventListener('change',function(e){var c=e.target.closest('[data-step]');if(!c)return;var p=c.dataset.step.split(':');ST.steps[p[0]]=ST.steps[p[0]]||{};if(c.checked)ST.steps[p[0]][p[1]]=true;else delete ST.steps[p[0]][p[1]];saveST();c.nextElementSibling.className=c.checked?'checked':'';});
$('#panel').addEventListener('input',function(e){if(e.target.id==='fq'){q=e.target.value;var pos=e.target.selectionStart;view();var n=$('#fq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}}});

/* terms */
function renderTerms(){var d=Tm[L];$('#termsh').textContent=d.title;$('#tbody').innerHTML='<p><em>'+esc(d.upd)+'</em></p><p style="margin-top:8px">'+esc(d.intro)+'</p>'+d.s.map(function(s){return '<h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p>';}).join('');$('#tclose').setAttribute('aria-label',d.close);}
var lastF=null;
function openTerms(){lastF=document.activeElement;renderTerms();$('#terms').hidden=false;$('#tclose').focus();}
function closeTerms(){$('#terms').hidden=true;if(lastF&&lastF.focus)try{lastF.focus();}catch(e){}}
$('#safelink').onclick=openTerms;$('#footterms').onclick=openTerms;$('#tclose').onclick=closeTerms;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#terms').hidden)closeTerms();});
$('#terms').addEventListener('click',function(e){if(e.target===$('#terms'))closeTerms();});

/* language */
function applyStatic(){
  $$('[data-i]').forEach(function(el){el.textContent=t(el.dataset.i);});
  $('#h1').innerHTML=L==='vi'?'Học <em>cắm hoa</em> sang trọng':'Learn the art of <em>flower arranging</em>';
  $('#ctastart').textContent=t('cta1');$('#ctawed').textContent=t('cta2');
  $('#safetxt').textContent=Tm[L].safe;$('#safelink').textContent=Tm[L].footT;$('#footterms').textContent=Tm[L].footT;
  $('#srcnote').textContent=t('srcnote');$('#yr').textContent=new Date().getFullYear();
  $$('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.l===L));});
  document.documentElement.lang=L;
}
function setLang(l,fromHash){
  if(l!=='vi'&&l!=='en')return;L=l;lsSet('hocCamHoa.lang',l);
  if(!fromHash){try{history.replaceState(null,'','#'+l);}catch(e){location.hash=l;}}
  applyStatic();renderTabs();renderProg();view();if(!$('#terms').hidden)renderTerms();
}
$$('.lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l);};});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if((h==='vi'||h==='en')&&h!==L)setLang(h,true);});
$('#ctastart').onclick=function(){tab='less';openL='spiral';renderTabs();view();$('#tabs').scrollIntoView({behavior:'smooth',block:'start'});};
$('#ctawed').onclick=function(){tab='rec';rec.o='wedding';rec.v=0;renderTabs();view();$('#tabs').scrollIntoView({behavior:'smooth',block:'start'});};
(function(){var h=location.hash.slice(1),l='vi';if(h==='en'||h==='vi')l=h;else{var s=lsGet('hocCamHoa.lang');if(s==='en'||s==='vi')l=s;else if((navigator.language||'').toLowerCase().indexOf('vi')!==0)l='en';}
  L=l;$('#art').innerHTML=heroSvg();applyStatic();renderTabs();renderProg();view();})();
})();
</script>

</body></html>
