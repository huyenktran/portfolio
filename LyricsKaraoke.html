<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyrics Karaoke 🎤</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@500;700&family=Quicksand:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--ink:#111;--card:#ffffffd9;--line:#cfe5f5;--sky:#bfe3f8;--sky2:#6bb6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:var(--ink);font-family:Quicksand,'Noto Sans',system-ui,sans-serif;font-weight:500;line-height:1.55;background:linear-gradient(180deg,#e6f3fc,#fff 65%) fixed;padding:18px 5vw 60px}
.wrap{max-width:860px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}.top a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;font-weight:700}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#lg{padding:6px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line)}
.kick{text-align:center;margin-top:24px;font-family:'Pinyon Script',cursive;font-size:34px}
h1{font-family:'Playfair Display',serif;font-size:clamp(34px,8vw,58px);text-align:center;line-height:1.1}
.sub{text-align:center;max-width:580px;margin:10px auto 22px;opacity:.85}
.card{background:var(--card);backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 10px 34px #6bb6e633;margin-bottom:16px}
h2{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:8px}
.sbar{display:flex;gap:8px}.sbar input{flex:1;min-width:0;padding:14px 20px;border-radius:99px;border:2px solid var(--ink);background:#fff;font-size:17px}
.btn{display:inline-block;padding:11px 22px;border-radius:99px;background:var(--sky);color:var(--ink);text-decoration:none;font-size:15px;transition:.2s;box-shadow:0 5px 14px #6bb6e644}.btn:hover{transform:translateY(-2px)}
.btn.k{background:var(--ink);color:#fff;box-shadow:none}.btn.g{background:#fff;border:1.5px solid var(--line);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips button{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13px}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.src a{display:block;padding:16px;border-radius:22px;background:#fff;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);transition:.2s}.src a:hover{transform:translateY(-3px);border-color:var(--sky2);box-shadow:0 8px 22px #6bb6e633}.src b{font-size:17px;display:block}.src small{opacity:.75;display:block;margin-top:2px}.src span{font-size:30px}
.hint{font-size:13px;opacity:.75;margin-top:8px}
.lead{margin-bottom:10px;opacity:.85}
textarea{width:100%;min-height:120px;border-radius:18px;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font-size:15px;resize:vertical}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.ctl label{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}.ctl input[type=range]{accent-color:var(--ink)}
.kst{background:#fff;border:2px solid var(--ink);border-radius:26px;padding:26px 16px;text-align:center;min-height:240px;display:grid;align-content:center;gap:12px}
.kst .l{opacity:.35;transition:.3s}.kst .c{background:var(--sky);border-radius:18px;padding:10px 14px;font-family:'Playfair Display','Noto Serif',serif;font-weight:700;line-height:1.3}
.kst:fullscreen{border-radius:0;border:0}
.note{font-size:12px;opacity:.7;text-align:center;margin-top:18px;max-width:640px;margin-inline:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a id="back" href="https://alessandratran.com/"></a><button id="lg" type="button"></button></div>
<div class="kick" id="kick"></div>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>

<section class="card"><h2 id="s1"></h2>
<form class="sbar" id="sf"><input id="q" type="search" autocomplete="off" aria-label="Search"><button class="btn k" id="go"></button></form>
<div class="chips" id="dia"></div>
<p class="hint" id="tip"></p>
<div class="src" id="src"></div></section>

<section class="card"><h2 id="s2"></h2><div class="chips" id="sug"></div></section>

<section class="card"><h2 id="s3"></h2><p class="lead" id="kd"></p>
<textarea id="lyr" aria-label="Lyrics"></textarea>
<div class="ctl"><button class="btn k" id="play"></button><button class="btn g" id="prev">⏮</button><button class="btn g" id="next">⏭</button><button class="btn g" id="fs"></button>
<label><span id="lsp"></span><input type="range" id="sp" min="1" max="10" value="3"></label><label><span id="lsz"></span><input type="range" id="sz" min="20" max="64" value="36"></label></div>
<div class="kst" id="kst"></div></section>
<p class="note" id="note"></p>
</div>
<script>
var T={
en:{lg:"🌐 Tiếng Việt",ti:"Lyrics Karaoke 🎤",back:"← alessandratran.com",kick:"sing along ✨",h1:"Lyrics Karaoke 🎤",sub:"Find the lyrics of any song in English or Vietnamese in one click, then sing along with our karaoke screen.",
s1:"🔍 Search a song",ph:"Song, artist or a line you remember…",go:"Search",tipE:"Type in English or Vietnamese. Pick a source below to open the results in a new tab.",tipV:"Tip: many sites match Vietnamese titles better with or without accents, so try both.",d0:"With accents",d1:"Without accents",
sources:[["azl","🔤","AZLyrics","A large archive of English lyrics"],["lf","🎼","LyricFind","Licensed lyrics provider"],["gn","💡","Genius","Lyrics with annotations"],["gg","🌐","Google","Search the whole web for lyrics, great for Vietnamese songs"],["yt","📺","YouTube karaoke","Find karaoke and instrumental versions"],["sp","🎧","Spotify","Listen, and see lyrics in the app where available"]],
s2:"🎶 Ideas to try",s3:"🎤 Karaoke screen",kd:"Paste the lyrics you want to sing (from a source you are allowed to use). They stay on your device and are never uploaded or saved.",
lyrPh:"Paste lyrics here, one line per row…",play:"▶ Start",pause:"⏸ Pause",fs:"⛶ Full screen",sp:"Speed: {n}s per line",sz:"Text size",empty:"Paste lyrics above, then press Start 🎵",done:"🎉 The end! Press Start to sing again.",
note:"This page does not host, copy or store any song lyrics. Search results open on third-party sites; lyrics belong to their authors and rights holders. AZLyrics, LyricFind, Genius, Google, YouTube and Spotify are trademarks of their owners.",kw:"lyrics"},
vi:{lg:"🌐 English",ti:"Lyrics Karaoke 🎤",back:"← alessandratran.com",kick:"hát theo lời ✨",h1:"Tìm lời bài hát và hát karaoke 🎤",sub:"Tìm lời bài hát tiếng Anh hoặc tiếng Việt chỉ với một cú bấm, rồi hát theo trên màn hình karaoke của trang.",
s1:"🔍 Tìm bài hát",ph:"Tên bài hát, ca sĩ hoặc một câu bạn nhớ…",go:"Tìm",tipE:"Gõ tiếng Anh hoặc tiếng Việt đều được. Chọn một nguồn bên dưới để mở kết quả ở tab mới.",tipV:"Mẹo: nhiều trang tìm tên tiếng Việt tốt hơn khi gõ có dấu hoặc không dấu, bạn thử cả hai nhé.",d0:"Có dấu",d1:"Không dấu",
sources:[["azl","🔤","AZLyrics","Kho lời bài hát tiếng Anh lớn"],["lf","🎼","LyricFind","Nhà cung cấp lời bài hát có bản quyền"],["gn","💡","Genius","Lời bài hát kèm chú giải"],["gg","🌐","Google","Tìm lời bài hát trên toàn web, hợp với nhạc Việt"],["yt","📺","YouTube karaoke","Tìm bản karaoke và bản beat"],["sp","🎧","Spotify","Nghe nhạc và xem lời trong ứng dụng nếu có"]],
s2:"🎶 Gợi ý để thử",s3:"🎤 Màn hình karaoke",kd:"Dán lời bài hát bạn muốn hát (lấy từ nguồn bạn được phép sử dụng). Lời chỉ nằm trên máy của bạn, không được tải lên hay lưu lại.",
lyrPh:"Dán lời bài hát vào đây, mỗi câu một dòng…",play:"▶ Bắt đầu",pause:"⏸ Tạm dừng",fs:"⛶ Toàn màn hình",sp:"Tốc độ: {n} giây mỗi câu",sz:"Cỡ chữ",empty:"Dán lời bài hát ở trên rồi bấm Bắt đầu 🎵",done:"🎉 Hết bài rồi! Bấm Bắt đầu để hát lại.",
note:"Trang này không lưu trữ, sao chép hay đăng tải lời bài hát. Kết quả tìm kiếm mở ở các trang bên thứ ba; lời bài hát thuộc về tác giả và chủ sở hữu bản quyền. AZLyrics, LyricFind, Genius, Google, YouTube và Spotify là thương hiệu của chủ sở hữu tương ứng.",kw:"lời bài hát"}};
var SUG={en:["Shape of You Ed Sheeran","Someone Like You Adele","Yellow Coldplay","Let It Be The Beatles","Perfect Ed Sheeran","Hello Adele"],vi:["Lạc trôi Sơn Tùng M-TP","Nơi này có anh Sơn Tùng M-TP","See Tình Hoàng Thùy Linh","Có chàng trai viết lên cây Phan Mạnh Quỳnh","Em của ngày hôm qua Sơn Tùng M-TP","Hãy trao cho anh Sơn Tùng M-TP"]};
var L="en",dia=0,K={lines:[],i:-1,on:false,iv:null};
var $=function(s){return document.querySelector(s)},t=function(k,r){var v=T[L][k];if(r)for(var x in r)v=v.split("{"+x+"}").join(r[x]);return v};
function strip(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D")}
function hasVi(s){return strip(s)!==s}
function qv(){var q=$("#q").value.trim();return dia===1?strip(q):q}
function url(k,q){var e=encodeURIComponent(q),k2=encodeURIComponent(q+" "+t("kw"));
return{azl:"https://search.azlyrics.com/search.php?q="+e,lf:"https://lyrics.lyricfind.com/search?q="+e,gn:"https://genius.com/search?q="+e,gg:"https://www.google.com/search?q="+k2,yt:"https://www.youtube.com/results?search_query="+encodeURIComponent(q+" karaoke"),sp:"https://open.spotify.com/search/"+e}[k]}
function render(){var q=qv();
$("#src").innerHTML=T[L].sources.map(function(s){return'<a href="'+(q?url(s[0],q):"#")+'" target="_blank" rel="noopener" data-s="'+s[0]+'"><span>'+s[1]+'</span><b>'+s[2]+'</b><small>'+s[3]+'</small></a>'}).join("");
var v=hasVi($("#q").value);$("#dia").innerHTML=v?'<button class="'+(dia===0?"on":"")+'" data-d="0">'+t("d0")+'</button><button class="'+(dia===1?"on":"")+'" data-d="1">'+t("d1")+'</button>':"";
$("#tip").textContent=t("tipE")+(v||L==="vi"?" "+t("tipV"):"");
$("#sug").innerHTML=SUG[L].map(function(s){return'<button data-sg="'+s+'">'+s+'</button>'}).join("");
document.querySelectorAll("#src a").forEach(function(a){a.onclick=function(e){if(!$("#q").value.trim()){e.preventDefault();$("#q").focus()}}})}
/* karaoke */
function krR(){var n=K.lines.length,i=K.i,st=$("#kst");$("#play").textContent=K.on?t("pause"):t("play");
if(!n){st.innerHTML='<div class="l">'+t("empty")+'</div>';return}
if(i>=n){st.innerHTML='<div class="c">'+t("done")+'</div>';return}
var f=+$("#sz").value,h="",j;for(j=Math.max(0,i-1);j<=Math.min(n-1,i+2);j++){h+='<div class="'+(j===i?"c":"l")+'" style="font-size:'+(j===i?f:Math.round(f*.62))+'px">'+esc(K.lines[j])+'</div>'}
st.innerHTML=i<0?'<div class="l">'+t("empty")+'</div>'+h:h}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function stop(){K.on=false;clearInterval(K.iv)}
function step(d){K.i=Math.max(0,Math.min(K.lines.length,K.i+d));if(K.i>=K.lines.length)stop();krR()}
function start(){if(!K.lines.length)return;if(K.on){stop();krR();return}if(K.i<0||K.i>=K.lines.length)K.i=0;K.on=true;krR();K.iv=setInterval(function(){step(1)},+$("#sp").value*1000)}
function lang(l){L=l;document.documentElement.lang=l;document.title=t("ti");$("#back").textContent=t("back");$("#kick").textContent=t("kick");$("#h1").textContent=t("h1");$("#sub").textContent=t("sub");$("#s1").textContent=t("s1");$("#q").placeholder=t("ph");$("#go").textContent=t("go");$("#s2").textContent=t("s2");$("#s3").textContent=t("s3");$("#kd").textContent=t("kd");$("#lyr").placeholder=t("lyrPh");$("#fs").textContent=t("fs");$("#lsz").textContent=t("sz");$("#lsp").textContent=t("sp",{n:$("#sp").value});$("#lg").textContent=t("lg");$("#note").textContent=t("note");render();krR()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-d],[data-sg]");if(!b)return;if(b.dataset.d){dia=+b.dataset.d;render()}else{$("#q").value=b.dataset.sg;dia=0;render();$("#q").focus()}});
$("#q").oninput=function(){if(!hasVi(this.value))dia=0;render()};
$("#sf").onsubmit=function(e){e.preventDefault();var q=qv();if(!q)return;window.open(url("gg",q),"_blank","noopener")};
$("#lyr").oninput=function(){stop();K.lines=this.value.split("\n").map(function(s){return s.trim()}).filter(Boolean);K.i=-1;krR()};
$("#play").onclick=start;$("#prev").onclick=function(){step(-1)};$("#next").onclick=function(){step(1)};
$("#sp").oninput=function(){$("#lsp").textContent=t("sp",{n:this.value});if(K.on){clearInterval(K.iv);K.iv=setInterval(function(){step(1)},+this.value*1000)}};
$("#sz").oninput=krR;
$("#fs").onclick=function(){var s=$("#kst");try{s.requestFullscreen&&s.requestFullscreen()}catch(e){}};
$("#lg").onclick=function(){var n=L==="en"?"vi":"en";lang(n);try{localStorage.setItem("lang-lyr",n)}catch(e){}};
var s0="en";try{s0=localStorage.getItem("lang-lyr")||"en"}catch(e){}if(location.hash==="#vi")s0="vi";else if(location.hash==="#en")s0="en";
lang(s0==="vi"?"vi":"en");
</script>
</body>
</html>
