function rDuck(){var s=S.duck||(S.duck=getSet(6));
$("#stage").innerHTML=s.map(function(it){return'<div class="lane"><span class="ln">'+it.e+" "+nm(it)+'</span><div class="track"><i class="dk">🦆</i></div></div>'}).join("")+'<button class="btn" id="go">'+t("race")+'</button>'+ns();
$("#go").onclick=function(){var go=this;go.disabled=true,d=s.map(function(){return 3+Math.random()*3.5}),ks=document.querySelectorAll(".dk");
ks.forEach(function(k){k.style.transition="none";k.style.transform="none"});void document.body.offsetWidth;
ks.forEach(function(k,i){k.style.transition="transform "+d[i]+"s ease-in-out";k.style.transform="translateX("+(k.parentNode.clientWidth-36)+"px)"});
setTimeout(function(){go.disabled=false;res(s[d.indexOf(Math.min.apply(0,d))])},Math.max.apply(0,d)*1000+400)};bindNs()}
function rPick(k,n,back){var s=S[k]||(S[k]=getSet(n));
$("#stage").innerHTML='<h3>'+t("pick")+'</h3><div class="cards">'+s.map(function(it,i){return'<button class="pc" data-i="'+i+'"><span class="bk">'+back+'</span><span class="fr">'+it.e+'<small>'+nm(it)+'</small></span></button>'}).join("")+'</div>'+ns();
document.querySelectorAll(".pc").forEach(function(b){b.onclick=function(){if(document.querySelector(".pc.open"))return;b.classList.add("open");document.querySelectorAll(".pc:not(.open)").forEach(function(x){x.classList.add("dim")});setTimeout(function(){res(s[+b.dataset.i])},800)}});bindNs()}
function rCoin(){var s=S.coin||(S.coin=getSet(2));
$("#stage").innerHTML='<div class="coin" id="cn"><span>👑</span><span>🌸</span></div><p>'+t("heads")+': <b>'+s[0].e+" "+nm(s[0])+'</b><br>'+t("tails")+': <b>'+s[1].e+" "+nm(s[1])+'</b></p><button class="btn" id="go">'+t("flip")+'</button>'+ns();
var cn=$("#cn");cn.style.transform="rotateY("+turns+"deg)";
$("#go").onclick=function(){var go=this,tl=Math.random()<.5;go.disabled=true;turns=Math.ceil(turns/360)*360+1440+(tl?180:0);cn.style.transform="rotateY("+turns+"deg)";setTimeout(function(){go.disabled=false;res(s[tl?1:0])},2100)};bindNs()}
function rShell(){var s=S.shell||(S.shell=getSet(3)),pos=[0,1,2],busy=false;
$("#stage").innerHTML='<h3>'+t("cup")+'</h3><div class="cups">'+s.map(function(it,i){return'<button class="cup" data-i="'+i+'" style="left:'+i*110+'px">🥤</button>'}).join("")+'</div><button class="btn" id="go">'+t("shuf")+'</button>'+ns();
var cs=document.querySelectorAll(".cup");
$("#go").onclick=function(){if(busy)return;busy=true;var k=0,iv=setInterval(function(){var a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3,x=pos[a];pos[a]=pos[b];pos[b]=x;cs.forEach(function(c,i){c.style.left=pos[i]*110+"px"});if(++k>8){clearInterval(iv);busy=false}},420)};
cs.forEach(function(c){c.onclick=function(){if(busy)return;c.classList.add("up");setTimeout(function(){res(s[+c.dataset.i])},700)}});bindNs()}
function rDice(){var s=S.dice||(S.dice=getSet(6)),F="⚀⚁⚂⚃⚄⚅";
$("#stage").innerHTML='<div class="die" id="dd">🎲</div><div class="chips">'+s.map(function(it,i){return'<span style="background:'+col(i)+'">'+F[i]+" "+it.e+" "+nm(it)+'</span>'}).join("")+'</div><button class="btn" id="go">'+t("roll")+'</button>'+ns();
$("#go").onclick=function(){var go=this,k=0;go.disabled=true;var iv=setInterval(function(){$("#dd").textContent=F[Math.floor(Math.random()*6)];if(++k>14){clearInterval(iv);var r=Math.floor(Math.random()*6);$("#dd").textContent=F[r];go.disabled=false;setTimeout(function(){res(s[r])},400)}},90)};bindNs()}
function render(){setTabs();({quiz:rQuiz,wheel:rWheel,duck:rDuck,draw:function(){rPick("draw",8,"🧧")},coin:rCoin,cards:function(){rPick("cards",5,"🃏")},shell:rShell,dice:rDice})[tab]();upd()}
function upd(){var c=custom();$("#used").textContent=c?t("u1").replace("{n}",Math.min(c.length,30)):t("u0").replace("{n}",ITEMS.length)}
function lang(l){L=l;document.documentElement.lang=l;$("#kick").textContent=t("kick");$("#h1").textContent=t("h1");$("#sub").textContent=t("sub");$("#oh").textContent=t("oh");$("#mine").placeholder=t("ph");$("#foot").textContent=t("foot");$("#lg").textContent=l==="en"?"🌐 Tiếng Việt":"🌐 English";document.title=l==="en"?"Where to go today? 🧭 · Hôm nay đi đâu?":"Hôm nay đi đâu? 🧭 · Where to go today?";if(!$("#res").hidden)$("#res").hidden=true;render()}
$("#lg").onclick=function(){var n=L==="en"?"vi":"en";lang(n);try{localStorage.setItem("lang",n)}catch(e){}};
$("#mine").oninput=function(){S={};if(tab!=="quiz"){$("#res").hidden=true;render()}else upd()};
var s0="en";try{s0=localStorage.getItem("lang")||"en"}catch(e){}
lang(s0==="vi"?"vi":"en");
</script>
</body>
</html>
