<script>
var GR=[["inc","Thu nhập","var(--c-inc)","#0f4c5c"],["fix","Chi phí cố định","var(--c-fix)","#4a90b8"],["inv","Đầu tư","var(--c-inv)","#9b8fe0"],["sav","Tiết kiệm","var(--c-sav)","#5fc9bd"],["free","Chi tiêu tự do","var(--c-free)","#f2a7c3"]];
var SUG={inc:["Lương net","Thu nhập khác","Thưởng"],fix:["Thuê nhà / trả góp nhà","Chăm sóc con / thú cưng","Điện nước, internet","Bảo hiểm","Đi lại, xăng xe","Trả nợ","Đi chợ, ăn uống","Quần áo","Điện thoại","Y tế","Dọn dẹp nhà","Dịch vụ đăng ký"],inv:["Hưu trí sau thuế","Cổ phiếu, quỹ","Đầu tư khác"],sav:["Du lịch","Quà tặng","Quỹ khẩn cấp","Tiết kiệm khác"],free:["Ăn ngoài, cà phê, bạn bè, gia đình"]};
var UNITS={"k":{s:"nghìn ₫",n:"Nghìn đồng (k₫)"},"d":{s:"₫",n:"Đồng (₫)"},"tr":{s:"triệu ₫",n:"Triệu đồng"},"usd":{s:"$",n:"Đô la ($)",p:1},"eur":{s:"€",n:"Euro (€)",p:1}};
var PLANS={csp:{n:"Conscious Spending Plan (cố định 55 · đầu tư 10 · tiết kiệm 10 · tự do 25)",fix:55,inv:10,sav:10,free:25},r5030:{n:"50/30/20 (cố định 50 · tiết kiệm và đầu tư 20 · tự do 30)",fix:50,inv:10,sav:10,free:30},custom:{n:"Tự đặt tỷ lệ",fix:55,inv:10,sav:10,free:25}};
var KEY="finance-studio-v1";
var DB={months:{},unit:"k",plan:"csp",cp:{fix:55,inv:10,sav:10,free:25},sel:"all"};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv&&sv.months)DB=Object.assign(DB,sv)}catch(e){}
var tab="dash",CH={},PRE=[],$=function(s){return document.querySelector(s)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function mon(n){var u=UNITS[DB.unit],t=(Math.round(n*10)/10).toLocaleString("vi-VN");return u.p?u.s+t:t+" "+u.s}
function pc(x){return(Math.round(x*1000)/10).toLocaleString("vi-VN")+"%"}
function sum(a){return(a||[]).reduce(function(s,x){return s+(+x.v||0)},0)}
function keys(){return Object.keys(DB.months).sort()}
function sel(){return DB.sel==="all"||!DB.months[DB.sel]?keys():[DB.sel]}
function ymL(k){var p=k.split("-");return"Tháng "+(+p[1])+"/"+p[0]}
function blank(){return{inc:[],fix:[],inv:[],sav:[],free:[],nw:{assets:0,inv:0,sav:0,debt:0}}}
function calc(m){var inc=sum(m.inc),fix=sum(m.fix),inv=sum(m.inv),sav=sum(m.sav),fre=sum(m.free);return{inc:inc,fix:fix,inv:inv,sav:sav,free:fre,out:fix+fre,saved:inv+sav,left:inc-fix-inv-sav-fre,rate:inc?(inv+sav)/inc:0}}
function agg(ks){var m=blank();ks.forEach(function(k){GR.forEach(function(g){(DB.months[k][g[0]]||[]).forEach(function(i){m[g[0]].push(i)})})});return m}
function nwOf(m){var n=m.nw||{};return(+n.assets||0)+(+n.inv||0)+(+n.sav||0)-(+n.debt||0)}
function cats(m){var o={};GR.slice(1).forEach(function(g){(m[g[0]]||[]).forEach(function(i){var k=g[0]+"|"+i.n;o[k]=(o[k]||0)+(+i.v||0)})});return Object.keys(o).map(function(k){var p=k.split("|");return{g:p[0],n:p.slice(1).join("|"),v:o[k]}}).filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v})}
function gcol(g){return GR.filter(function(x){return x[0]===g})[0][3]}
function gname(g){return GR.filter(function(x){return x[0]===g})[0][1]}
function plan(){return DB.plan==="custom"?DB.cp:PLANS[DB.plan]}
/* ---------- NHẬP FILE ---------- */
function num(x){if(typeof x==="number")return isFinite(x)?x:NaN;if(x==null)return NaN;var s=String(x).trim().replace(/[₫$€\s]/g,"");if(!s||/%$/.test(s)||/#/.test(s))return NaN;
if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))return parseFloat(s.replace(/,/g,""));if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))return parseFloat(s.replace(/\./g,"").replace(",","."));
if(/^-?\d+,\d{1,2}$/.test(s))return parseFloat(s.replace(",","."));s=s.replace(/,/g,"");return/^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN}
function csv(text,d){var rows=[],r=[],c="",q=false,i,ch;if(!d)d=(text.split("\n")[0].split("\t").length>2)?"\t":",";text=text.replace(/^\uFEFF/,"");
for(i=0;i<text.length;i++){ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}
if(c!==""||r.length){r.push(c);rows.push(r)}return rows}
function normYm(s){s=String(s||"");var m=s.match(/(20\d{2})\D{1,3}(\d{1,2})(?!\d)/);if(m&&+m[2]>=1&&+m[2]<=12)return m[1]+"-"+("0"+m[2]).slice(-2);m=s.match(/(?:^|\D)(\d{1,2})\D{1,3}(20\d{2})/);if(m&&+m[1]>=1&&+m[1]<=12)return m[2]+"-"+("0"+m[1]).slice(-2);return""}
function curYm(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)}
var TY={income:"inc","thu nhập":"inc","thu nhap":"inc",fixed:"fix","cố định":"fix","co dinh":"fix","chi phí cố định":"fix",investment:"inv",investments:"inv","đầu tư":"inv","dau tu":"inv",saving:"sav",savings:"sav","tiết kiệm":"sav","tiet kiem":"sav","guilt-free":"free","guilt free":"free",free:"free","tự do":"free","tu do":"free","chi tiêu tự do":"free"};
function tidy(rows,hdr,hint){var H=rows[hdr].map(function(x){return String(x).toLowerCase().trim()}),im=H.findIndex(function(x){return/month|tháng|thang/.test(x)}),it=H.findIndex(function(x){return/type|loại|loai|nhóm|nhom/.test(x)}),ic=H.findIndex(function(x){return/categ|danh mục|danh muc|hạng mục|khoản|khoan|item/.test(x)}),ia=H.findIndex(function(x){return/amount|số tiền|so tien|giá trị|gia tri/.test(x)});var out={};
for(var i=hdr+1;i<rows.length;i++){var r=rows[i],ym=normYm(r[im])||hint||curYm(),g=TY[String(r[it]||"").toLowerCase().trim()],v=num(r[ia]);if(!g||isNaN(v)||v===0)continue;(out[ym]=out[ym]||blank())[g].push({n:String(r[ic]||gname(g)).trim(),v:v})}
return Object.keys(out).map(function(k){return{ym:k,data:out[k],src:"bảng Tháng / Loại / Danh mục / Số tiền"}})}
var HDR={"INCOME":"inc","FIXED COSTS":"fix","INVESTMENTS":"inv","SAVINGS":"sav","GUILT-FREE SPENDING":"free","NETWORTH":"nw"};
function template(rows,ym,savBal){var m=blank(),sec=null,seen=false,gross=null,sb=0;
for(var i=0;i<rows.length;i++){var r=rows[i],a=String(r[0]==null?"":r[0]).trim(),v=num(r[1]);
if(/^CHI TIÊU TRONG THÁNG/i.test(a))break;
if(HDR[a]){sec=HDR[a];seen=true;continue}
if(!a||!sec)continue;var la=a.toLowerCase();
if(sec==="nw"){if(la==="assets")m.nw.assets=isNaN(v)?0:v;else if(la==="investments")m.nw.inv=isNaN(v)?0:v;else if(la==="savings")m.nw.sav=isNaN(v)?0:v;else if(la==="debt")m.nw.debt=isNaN(v)?0:v;continue}
if(la==="total"||isNaN(v))continue;
if(sec==="inc"){if(la==="net monthly"||la==="other")m.inc.push({n:la==="other"?"Thu nhập khác":"Lương net",v:v});else if(la==="gross monthly")gross=v;continue}
if(v<=0)continue;if(sec==="sav"&&savBal){sb+=v;continue}
m[sec].push({n:a,v:v})}
if(sb)m.nw.sav=Math.max(m.nw.sav,sb);
if(!m.inc.length&&gross)m.inc.push({n:"Thu nhập gộp",v:gross});
return seen?[{ym:ym,data:m,src:"mẫu ngân sách (NETWORTH, INCOME, FIXED COSTS, ...)"}]:[]}
function ingest(rows,hint,savBal){var hdr=-1;for(var i=0;i<Math.min(rows.length,6);i++){var H=rows[i].map(function(x){return String(x).toLowerCase()}).join("|");if(/month|tháng/.test(H)&&/amount|số tiền|giá trị/.test(H)){hdr=i;break}}
return hdr>=0?tidy(rows,hdr,normYm(hint)):template(rows,normYm(hint)||curYm(),savBal)}
function addPre(list,name){list.forEach(function(x){x.id=PRE.length;x.file=name;x.on=true;PRE.push(x)})}
function readText(text,name,savBal){var rows=csv(text);var l=ingest(rows,name,savBal);addPre(l,name);return l.length}
function readFile(f,savBal){var name=f.name,ext=name.split(".").pop().toLowerCase(),rd=new FileReader();
rd.onload=function(){var n=0;try{if(ext==="xlsx"||ext==="xls"||ext==="xlsm"){if(typeof XLSX==="undefined"){msg("Chưa tải được thư viện đọc Excel. Bạn thử xuất file ra CSV rồi tải lên nhé.");return}var wb=XLSX.read(rd.result,{type:"array"});wb.SheetNames.forEach(function(sn){var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});var l=ingest(rows,sn+" "+name,savBal);addPre(l,name+" · "+sn);n+=l.length})}
else n=readText(new TextDecoder("utf-8").decode(rd.result),name,savBal)}catch(e){msg("Không đọc được file: "+e.message);return}
msg(n?"Đã nhận diện "+n+" tháng dữ liệu. Kiểm tra bên dưới rồi bấm “Thêm vào dữ liệu”.":"Không nhận diện được cấu trúc. Hãy dùng file mẫu (nút bên dưới) hoặc bảng Tháng / Loại / Danh mục / Số tiền.");renderImp()};rd.readAsArrayBuffer(f)}
function msg(t){var e=$("#imsg");if(e)e.textContent=t}
/* ---------- DỮ LIỆU MẪU ---------- */
function demo(){var r=7,rnd=function(){r=(r*9301+49297)%233280;return r/233280},out={};
for(var i=0;i<6;i++){var ym="2026-"+("0"+(5+i)).slice(-2),m=blank(),j=function(b,p){return Math.round(b*(1+(rnd()-.5)*p)/10)*10};
m.inc=[{n:"Lương net",v:25000},{n:"Thu nhập khác",v:j(1500,1.2)}];
m.fix=[{n:"Thuê nhà / trả góp nhà",v:6500},{n:"Điện nước, internet",v:j(900,.3)},{n:"Đi lại, xăng xe",v:j(800,.3)},{n:"Đi chợ, ăn uống",v:j(3600,.2)},{n:"Bảo hiểm",v:800},{n:"Điện thoại",v:300},{n:"Trả nợ",v:i<4?1500:0}].filter(function(x){return x.v>0});
m.inv=[{n:"Cổ phiếu, quỹ",v:2000+i*250}];m.sav=[{n:"Quỹ khẩn cấp",v:2000},{n:"Du lịch",v:j(700,.8)}];m.free=[{n:"Ăn ngoài, cà phê, bạn bè, gia đình",v:j(4800,.4)}];

["📈","Tỷ lệ tiết kiệm (savings rate)","Phần trăm thu nhập bạn tiết kiệm và đầu tư. Từ 20% trở lên được xem là tốt, 10% là điểm khởi đầu hợp lý.",has?"Của bạn: <b>"+pc(c.rate)+"</b>"+st("Mục tiêu 20%+",c.rate>=.2):""],
["🛟","Quỹ khẩn cấp (emergency fund)","Số tiền đủ trang trải 3 đến 6 tháng chi tiêu, để phòng mất việc hoặc ốm đau. Thu nhập không ổn định nên giữ 6 đến 12 tháng.",has&&q.em?"Của bạn: <b>"+(Math.round(q.em*10)/10)+" tháng</b>"+st("Mục tiêu 3 đến 6 tháng",q.em>=3):""],
["🎈","Chi tiêu tự do không áy náy (guilt-free spending)","Phần còn lại sau khi đã lo chi phí cố định, tiết kiệm và đầu tư. Bạn được tiêu thoải mái cho cà phê, bạn bè, sở thích mà không phải tự trách.",has?"Của bạn: <b>"+pc(c.free/c.inc)+"</b>":""],
["⚖️","Nợ trên thu nhập (DTI)","Tổng tiền trả nợ hằng tháng chia thu nhập. Mức dưới khoảng 36% thường được xem là an toàn.",has?"Của bạn: <b>"+pc(q.dti)+"</b>"+st("Dưới 36%",q.dti<.36):""]];
$("#v-learn").innerHTML='<div class="cs">'+cards.map(function(x){return'<div class="card"><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[2]+'</p>'+(x[3]?'<div class="m">'+x[3]+'</div>':"")+'</div>'}).join("")+
'<div class="card"><h3>✨ Lãi kép (compound interest)</h3><p>Lãi sinh thêm lãi. Càng bắt đầu sớm, thời gian càng làm việc cho bạn.</p><div class="m"><label>Số tiền gửi mỗi tháng</label><input type="number" id="cc-m" value="2000"><label>Lãi suất mỗi năm (%)</label><input type="number" id="cc-r" value="8"><label>Số năm</label><input type="number" id="cc-y" value="10"><div id="cc-o" style="margin-top:6px"></div></div></div>'+
'<div class="card"><h3>🎯 Quỹ mục tiêu (sinking fund)</h3><p>Chia nhỏ một khoản chi lớn (du lịch, cưới, mua nhà) thành phần góp mỗi tháng.</p><div class="m"><label>Số tiền mục tiêu</label><input type="number" id="sf-t" value="60000"><label>Số tháng còn lại</label><input type="number" id="sf-m" value="12"><div id="sf-o" style="margin-top:6px"></div></div></div>'+
'<div class="card"><h3>🔢 Quy tắc 72</h3><p>Lấy 72 chia cho lãi suất mỗi năm để ước lượng số năm tiền nhân đôi.</p><div class="m"><label>Lãi suất mỗi năm (%)</label><input type="number" id="r7" value="8"><div id="r7-o" style="margin-top:6px"></div></div></div></div>';
function up(){var m=+$("#cc-m").value||0,r=(+$("#cc-r").value||0)/1200,y=+$("#cc-y").value||0,n=y*12,fv=r?m*((Math.pow(1+r,n)-1)/r):m*n;$("#cc-o").innerHTML="Sau "+y+" năm: <b>"+esc(mon(fv))+"</b><br><small>Bạn góp "+esc(mon(m*n))+", lãi sinh ra "+esc(mon(fv-m*n))+"</small>";var t=+$("#sf-t").value||0,mm=+$("#sf-m").value||1;$("#sf-o").innerHTML="Mỗi tháng cần dành: <b>"+esc(mon(t/mm))+"</b>";var r7=+$("#r7").value||0;$("#r7-o").innerHTML=r7?"Khoảng <b>"+(Math.round(72/r7*10)/10)+" năm</b> để nhân đôi":""}
["cc-m","cc-r","cc-y","sf-t","sf-m","r7"].forEach(function(i){$("#"+i).oninput=up});up()}
/* ---------- CÀI ĐẶT ---------- */
function renderSet(){var P=DB.plan;$("#v-set").innerHTML='<div class="card" style="margin-bottom:14px"><h3>🎯 Kế hoạch chi tiêu để so sánh</h3><select id="pl" style="padding:10px 14px;border-radius:14px;border:1px solid #d4e6ea;width:100%;background:#fff">'+Object.keys(PLANS).map(function(k){return'<option value="'+k+'"'+(P===k?" selected":"")+'>'+esc(PLANS[k].n)+'</option>'}).join("")+'</select>'+(P==="custom"?'<div class="nwg" style="margin-top:10px">'+[["fix","Cố định %"],["inv","Đầu tư %"],["sav","Tiết kiệm %"],["free","Chi tiêu tự do %"]].map(function(x){return'<div><label>'+x[1]+'</label><input type="number" data-cp="'+x[0]+'" value="'+DB.cp[x[0]]+'"></div>'}).join("")+'</div>':"")+'<p style="font-size:13px;color:var(--mut);margin-top:8px">Tỷ lệ tính trên thu nhập, dùng để so sánh với số liệu thực tế ở Dashboard.</p></div>'+
'<div class="card"><h3>🗂️ Dữ liệu</h3><div class="ctl"><button class="btn g" data-a="demo">✨ Nạp dữ liệu mẫu</button><button class="btn g" data-a="expcsv">⬇️ Xuất CSV</button><button class="btn g" data-a="expjson">⬇️ Sao lưu JSON</button><button class="btn g" data-a="impjson">⬆️ Khôi phục JSON</button><button class="btn g" data-a="reset" style="color:#b52c57">🗑️ Xóa toàn bộ</button></div><input type="file" id="jf" accept=".json" hidden><p style="font-size:13px;color:var(--mut);margin-top:8px">Dữ liệu chỉ lưu trong trình duyệt này. Hãy sao lưu thường xuyên, vì xóa dữ liệu trình duyệt sẽ làm mất số liệu.</p></div>';
$("#pl").onchange=function(){DB.plan=this.value;save();renderSet()};document.querySelectorAll("[data-cp]").forEach(function(i){i.oninput=function(){DB.cp[i.dataset.cp]=+i.value||0;save()}});
$("#jf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(o.months){DB=Object.assign(DB,o);save();init();go("dash")}}catch(e){alert("File JSON không hợp lệ")}};r.readAsText(f)}}
/* ---------- ĐIỀU HƯỚNG ---------- */
var TABS=[["dash","📊","Dashboard","Tổng quan tài chính"],["enter","✏️","Nhập liệu","Nhập số liệu từng tháng"],["imp","📂","Nhập từ file","Tải Excel, CSV, Google Sheets"],["learn","📚","Khái niệm","Kiến thức tài chính cần biết"],["set","⚙️","Cài đặt","Kế hoạch, dữ liệu"]];
function go(t){tab=t;TABS.forEach(function(x){$("#v-"+x[0]).hidden=x[0]!==t});$("#nav").innerHTML=TABS.map(function(x){return'<button class="'+(x[0]===t?"on":"")+'" data-a="go" data-v="'+x[0]+'">'+x[1]+" "+x[2]+'</button>'}).join("");$("#ttl").textContent=TABS.filter(function(x){return x[0]===t})[0][3];$("#msel").parentNode.style.display=t==="dash"||t==="enter"||t==="learn"?"flex":"none";
({dash:renderDash,enter:renderEnter,imp:renderImp,learn:renderLearn,set:renderSet})[t]()}
function init(){var ks=keys();if(DB.sel!=="all"&&!DB.months[DB.sel])DB.sel=ks.length?ks[ks.length-1]:"all";
$("#msel").innerHTML='<option value="all">Tất cả các tháng</option>'+ks.map(function(k){return'<option value="'+k+'"'+(DB.sel===k?" selected":"")+'>'+ymL(k)+'</option>'}).join("");$("#msel").value=DB.sel;
$("#usel").innerHTML=Object.keys(UNITS).map(function(k){return'<option value="'+k+'"'+(DB.unit===k?" selected":"")+'>'+UNITS[k].n+'</option>'}).join("")}
$("#msel").onchange=function(){DB.sel=this.value;save();go(tab)};$("#usel").onchange=function(){DB.unit=this.value;save();go(tab)};
document.addEventListener("input",function(e){var t=e.target,g=t.dataset;if(g.f){var it=DB.months[DB.sel][g.g][+g.i];it[g.f]=g.f==="v"?(+t.value||0):t.value;save();var m=DB.months[DB.sel];$("#t-"+g.g).textContent=mon(sum(m[g.g]));$("#mt").textContent="Còn lại: "+mon(calc(m).left)}else if(g.nw){DB.months[DB.sel].nw[g.nw]=+t.value||0;save();$("#t-nw").textContent="Net worth: "+mon(nwOf(DB.months[DB.sel]))}});
document.addEventListener("change",function(e){var g=e.target.dataset;if(g.pre!=null){var p=PRE[+g.pre];if(g.pf==="on")p.on=e.target.checked;else p.ym=e.target.value||p.ym}});
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v,g=b.dataset.g,i=+b.dataset.i;
if(a==="go")go(v);else if(a==="pick")$("#fi").click();
else if(a==="parse"){var t=$("#paste").value;if(!t.trim()){msg("Hãy dán dữ liệu vào ô trước.");return}var n=readText(t,"Dữ liệu dán",sm());msg(n?"Đã nhận diện "+n+" tháng dữ liệu.":"Không nhận diện được cấu trúc.");renderImp()}
else if(a==="tpl")tpl();else if(a==="clrpre"){PRE=[];renderImp()}
else if(a==="apply"){var n=0;PRE.forEach(function(p){if(!p.on)return;var cur=DB.months[p.ym]||(DB.months[p.ym]=blank());GR.forEach(function(x){if(p.data[x[0]].length)cur[x[0]]=p.data[x[0]]});var nw=p.data.nw;if(nw&&(nw.assets||nw.inv||nw.sav||nw.debt))cur.nw=nw;n++});PRE=[];save();init();DB.sel="all";$("#msel").value="all";go("dash");alert("Đã thêm "+n+" tháng dữ liệu.")}
else if(a==="addm"){var ym=$("#nm").value;if(!ym)return;if(!DB.months[ym]){var m=blank(),ks=keys();if($("#cp").checked&&ks.length){var l=DB.months[ks[ks.length-1]];GR.forEach(function(x){m[x[0]]=l[x[0]].map(function(it){return{n:it.n,v:it.v}})});m.nw=Object.assign({},l.nw)}DB.months[ym]=m}DB.sel=ym;save();init();renderEnter()}
else if(a==="addr"){DB.months[DB.sel][g].push({n:"",v:0});save();renderEnter()}else if(a==="del"){DB.months[DB.sel][g].splice(i,1);save();renderEnter()}
else if(a==="delm"){if(confirm("Xóa dữ liệu "+ymL(DB.sel)+"?")){delete DB.months[DB.sel];DB.sel="all";save();init();go("dash")}}
else if(a==="demo"){var d=demo();Object.keys(d).forEach(function(k){DB.months[k]=d[k]});DB.sel="all";save();init();go("dash")}
else if(a==="expcsv")exportCsv();else if(a==="expjson")dl("finance-studio-backup.json",JSON.stringify(DB),"application/json");else if(a==="impjson")$("#jf").click();
else if(a==="reset"){if(confirm("Xóa toàn bộ dữ liệu trong trình duyệt này?")){DB.months={};DB.sel="all";save();init();go("dash")}}});
init();go("dash");
</script>
</body>
</html>
